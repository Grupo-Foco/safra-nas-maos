/* ═══════════════════════════════════════════════════
   BAIXA DA CARGA
   A carga sai da fazenda com o peso da balança. Só vira
   produtividade quando volta o romaneio do armazém, com
   os descontos reais de umidade, impureza e avariados.
   ═══════════════════════════════════════════════════ */
const BASE_PADRAO = { umidade:14, impureza:1, avariados:6 };
function kBases(f){ return "faz_"+f+"_bases"; }
function basesDe(f){ return Store.get(kBases(f), BASE_PADRAO); }

/* Desconto: o kg vale o que veio no romaneio. A fórmula só
   sugere quando o campo está vazio — cada armazém tem sua regra. */
function sugerirDesc(tipo, liq, pct, bases){
  const p = Number(pct)||0;
  if(tipo==="umidade"){
    const b = Number(bases.umidade);
    return p > b ? Math.round(liq * ((p-b)/(100-p))) : 0;
  }
  const b = Number(tipo==="impureza" ? bases.impureza : bases.avariados);
  return p > b ? Math.round(liq * (p-b)/100) : 0;
}

function calcBaixa(b){
  const liq   = Number(b.liquido)||0;
  const dUmid = Math.max(0, Number(b.desc_umidade)||0);
  const dImp  = Math.max(0, Number(b.desc_impureza)||0);
  const dAvar = Math.max(0, Number(b.desc_avariados)||0);
  const final = Math.max(0, liq - dUmid - dImp - dAvar);
  return { desc_umidade:dUmid, desc_impureza:dImp, desc_avariados:dAvar,
           desc_total:dUmid+dImp+dAvar, peso_final:final, sacas_final:final/SACA_KG };
}

function cargaBaixada(c){ return !!(c.baixa && c.baixa.data); }
function sacasValidas(c){ return cargaBaixada(c) ? c.baixa.sacas_final : 0; }

function darBaixa(f, id, dados){
  const l = cargasDe(f), i = l.findIndex(x=>x.id===id);
  if(i<0) return null;
  const calc = calcBaixa(dados);
  l[i].baixa = Object.assign({}, dados, calc);
  l[i].status = "baixada";
  Store.set(kCargas(f), l);
  Sync.push("cargas","upsert",l[i]);
  return l[i];
}
function desfazerBaixa(f, id){
  const l = cargasDe(f), i = l.findIndex(x=>x.id===id);
  if(i<0) return;
  delete l[i].baixa; l[i].status = "transito";
  Store.set(kCargas(f), l);
  Sync.push("cargas","upsert",l[i]);
}

/* Descontos acumulados da safra, por tipo e por destino */
function resumoDescontos(f){
  const l = cargasDe(f).filter(cargaBaixada);
  const tot = { umidade:0, impureza:0, avariados:0, total:0,
                bruto:0, final:0, cargas:l.length };
  const porDestino = {};
  l.forEach(c=>{
    const b=c.baixa;
    tot.umidade   += b.desc_umidade;
    tot.impureza  += b.desc_impureza;
    tot.avariados += b.desc_avariados;
    tot.total     += b.desc_total;
    tot.bruto     += Number(b.liquido)||0;
    tot.final     += b.peso_final;
    const d=c.destino||"—";
    if(!porDestino[d]) porDestino[d]={destino:d,cargas:0,bruto:0,umidade:0,impureza:0,avariados:0,total:0,final:0};
    const p=porDestino[d];
    p.cargas++; p.bruto+=Number(b.liquido)||0;
    p.umidade+=b.desc_umidade; p.impureza+=b.desc_impureza;
    p.avariados+=b.desc_avariados; p.total+=b.desc_total; p.final+=b.peso_final;
  });
  tot.pct = tot.bruto>0 ? tot.total/tot.bruto*100 : 0;
  return { tot, porDestino:Object.values(porDestino).sort((a,b)=>b.total-a.total) };
}

/* Produtividade: rateia as sacas de cada carga entre os talhões dela */
function produtividade(f){
  const tals = talhoesDe(f);
  const cap  = siloCap(f);
  const mapa = {};
  tals.forEach(t => mapa[t.id] = {
    id:t.id, nome:t.nome, hectares:t.hectares,
    sacas:0, cargas:0, silos:Number(t.silo)||0
  });

  // Só entra na produtividade a carga já baixada no armazém.
  cargasDe(f).filter(cargaBaixada).forEach(c=>{
    const itens = (c.talhoes||[]).filter(i=>mapa[i.talhao_id]);
    if(!itens.length) return;
    const somaKg = itens.reduce((s,i)=>s+(Number(i.kg)||0),0);
    const sc = c.baixa.sacas_final;
    itens.forEach(i=>{
      const frac = somaKg>0 ? (Number(i.kg)||0)/somaKg : 1/itens.length;
      mapa[i.talhao_id].sacas  += sc * frac;
      mapa[i.talhao_id].cargas += 1;
    });
  });

  const linhas = Object.values(mapa).map(t=>{
    const scSilo = t.silos * cap;
    const total  = t.sacas + scSilo;
    return Object.assign(t,{ sc_silo:scSilo, total_sc:total,
      sc_ha: t.hectares>0 ? total/t.hectares : 0,
      colhido: t.cargas>0 || t.silos>0 });
  });
  linhas.sort((a,b)=>b.sc_ha-a.sc_ha || a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));

  const colhidos = linhas.filter(l=>l.colhido);
  const haColh = colhidos.reduce((s,l)=>s+l.hectares,0);
  const scTot  = linhas.reduce((s,l)=>s+l.total_sc,0);
  const haTot  = linhas.reduce((s,l)=>s+l.hectares,0);
  return { linhas, colhidos,
    sacasArmazem: linhas.reduce((s,l)=>s+l.sacas,0),
    sacasSilo: linhas.reduce((s,l)=>s+l.sc_silo,0),
    totalSacas: scTot, haColhida: haColh, haTotal: haTot,
    prodColhida: haColh>0 ? scTot/haColh : 0,
    prodFazenda: haTot>0 ? scTot/haTot : 0 };
}

function definirSilo(f, talhaoId, qtd){
  const l = talhoesDe(f), t = l.find(x=>x.id===talhaoId);
  if(!t) return;
  t.silo = Number(qtd)||0;
  Store.set(chaveTal(f), l);
  Sync.push("talhoes","upsert",t);
}


/* ═══════════════════════════════════════════════════
   PLUVIOMETRIA — dias x pontos de medição
   Cada ponto é um pluviômetro. Pode cobrir um talhão
   ou um grupo deles ("Pivôs", "T1 T2").
   ═══════════════════════════════════════════════════ */
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
               "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function kChuva(f){ return "faz_"+f+"_chuva"; }
function chuvaDe(f){ return Store.get(kChuva(f), {}); }
/* A qual safra ("AAAA/AAAA+1") pertence um dia de chuva (out→set). */
function safraDaDataChuva(dia){
  const p=String(dia).match(/^(\d{4})-(\d{2})/); if(!p) return null;
  const y=+p[1], m=+p[2];
  return (m>=10) ? y+"/"+(y+1) : (y-1)+"/"+y;
}
/* Safras que já têm chuva lançada, mais recente primeiro. */
function safrasComChuva(f){
  const set=new Set();
  Object.keys(chuvaDe(f)).forEach(dia=>{ const s=safraDaDataChuva(dia); if(s) set.add(s); });
  return [...set].sort().reverse();
}

/* A chuva é medida por talhão — os mesmos do cadastro da fazenda. */
function pontosDe(f){
  return talhoesDe(f).slice()
    .sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
}

/* A safra vai de outubro do 1º ano a setembro do 2º */
function mesesDaSafra(safra){
  const a = parseInt(String(safra).slice(0,4),10);
  const out = [];
  for(let m=9;m<12;m++) out.push({ano:a, mes:m});
  for(let m=0;m<9;m++) out.push({ano:a+1, mes:m});
  return out;
}
function diasNoMes(ano,mes){ return new Date(ano,mes+1,0).getDate(); }
function chaveDia(ano,mes,dia){
  return ano+"-"+String(mes+1).padStart(2,"0")+"-"+String(dia).padStart(2,"0");
}

/* Dias com chuva na safra, em ordem — é assim que a fazenda registra:
   só entra a linha do dia que choveu. */
function diasDeChuva(f, safra){
  const meses = mesesDaSafra(safra), todo = chuvaDe(f);
  const ini = chaveDia(meses[0].ano, meses[0].mes, 1);
  const ult = meses[meses.length-1];
  const fim = chaveDia(ult.ano, ult.mes, diasNoMes(ult.ano,ult.mes));
  return Object.keys(todo).filter(k=>k>=ini && k<=fim).sort();
}
const MES_ABREV = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function diaCurto(k){
  const p = String(k).split("-");
  return p[2]+"/"+MES_ABREV[parseInt(p[1],10)-1];
}

function lerChuva(f,dia,pontoId){
  const d = chuvaDe(f)[dia];
  return d && d[pontoId] != null ? Number(d[pontoId]) : null;
}
function gravarChuva(f,dia,pontoId,mm){
  const todo = chuvaDe(f);
  const v = (mm===""||mm==null) ? null : Number(String(mm).replace(",","."));
  if(!todo[dia]) todo[dia] = {};
  if(v==null || isNaN(v) || v<0) delete todo[dia][pontoId];
  else todo[dia][pontoId] = v;
  if(!Object.keys(todo[dia]).length) delete todo[dia];
  Store.set(kChuva(f), todo);
  Sync.push("chuva","upsert",{fazenda_id:f, dia:dia, ponto_id:pontoId, mm:v});
}

/* Totais do mês: por ponto, por dia e geral */
function resumoMes(f, ano, mes){
  const pts = pontosDe(f), nd = diasNoMes(ano,mes), todo = chuvaDe(f);
  const porPonto = {}, porDia = {};
  let geral = 0, diasComChuva = 0;
  pts.forEach(p=>porPonto[p.id]=0);
  for(let d=1; d<=nd; d++){
    const k = chaveDia(ano,mes,d), reg = todo[k] || {};
    let soma = 0, n = 0;
    pts.forEach(p=>{
      const v = reg[p.id];
      if(v!=null){ soma += v; n++; porPonto[p.id] += v; }
    });
    porDia[d] = { soma, n, media: n ? soma/n : 0 };
    if(n) diasComChuva++;
    geral += soma;
  }
  const medias = pts.map(p=>porPonto[p.id]);
  return { porPonto, porDia, geral, diasComChuva, nd,
           mediaPontos: medias.length ? medias.reduce((a,b)=>a+b,0)/medias.length : 0 };
}

function acumuladoSafra(f, safra){
  const pts = pontosDe(f);
  const por = {}; pts.forEach(p=>por[p.id]=0);
  let total = 0;
  mesesDaSafra(safra).forEach(({ano,mes})=>{
    const r = resumoMes(f,ano,mes);
    pts.forEach(p=>por[p.id]+=r.porPonto[p.id]||0);
    total += r.geral;
  });
  return { porPonto:por, total,
           media: pts.length ? total/pts.length : 0 };
}


/* ═══════════════════════════════════════════════════
   OPERAÇÕES NO TALHÃO
   Uma aplicação = data + área + tipo + a calda de
   produtos. Quantidade = dose × hectares.
   ═══════════════════════════════════════════════════ */
const TIPOS_OP = ["Pulverização terrestre","Pulverização aérea","Semeadura","Adubação"];

function kProd(f){ return "faz_"+f+"_produtos"; }
function kApl(f){ return "faz_"+f+"_aplicacoes"; }
function produtosDe(f){ return Store.get(kProd(f), []); }
function aplicacoesDe(f){ return Store.get(kApl(f), []); }
function acharProduto(f,id){ return produtosDe(f).find(p=>p.id===id)||null; }

function salvarProduto(f, d, id){
  const l = produtosDe(f);
  if(id){
    const p = l.find(x=>x.id===id); if(!p) return null;
    Object.assign(p,{nome:d.nome.trim(), unidade:d.unidade, preco:Number(d.preco)||0});
    Store.set(kProd(f),l); Sync.push("produtos","upsert",p); return p;
  }
  const novo = { id:"pr_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, nome:d.nome.trim(), unidade:d.unidade||"L", preco:Number(d.preco)||0 };
  l.push(novo); Store.set(kProd(f),l); Sync.push("produtos","upsert",novo);
  return novo;
}
function apagarProduto(f,id){
  Store.set(kProd(f), produtosDe(f).filter(p=>p.id!==id));
  Sync.push("produtos","delete",{id});
}

/* Linhas da aplicação: uma por produto, como no relatório */
function linhasAplicacao(f, a){
  const ha = Number(a.hectares)||0;
  return (a.itens||[]).map(i=>{
    const p = acharProduto(f, i.produto_id);
    const dose = Number(i.dose)||0;
    const qtd  = dose * ha;
    const preco = p ? Number(p.preco)||0 : 0;
    return { produto: p?p.nome:"(removido)", unidade: p?p.unidade:"L",
             dose, hectares:ha, qtd, preco, valor: qtd*preco, semPreco: preco<=0 };
  });
}
function custoAplicacao(f,a){
  return linhasAplicacao(f,a).reduce((s,l)=>s+l.valor,0);
}

function salvarAplicacao(f, d, id){
  const l = aplicacoesDe(f);
  const dados = { data:d.data, tipo:d.tipo, talhoes:d.talhoes||[],
                  hectares:Number(d.hectares)||0, obs:(d.obs||"").trim(),
                  itens:(d.itens||[]).filter(i=>i.produto_id && Number(i.dose)>0) };
  if(id){
    const i = l.findIndex(x=>x.id===id); if(i<0) return null;
    l[i] = Object.assign({}, l[i], dados);
    Store.set(kApl(f),l); Sync.push("aplicacoes","upsert",l[i]); return l[i];
  }
  const nova = Object.assign({ id:"ap_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, criado_em:new Date().toISOString() }, dados);
  l.push(nova); Store.set(kApl(f),l); Sync.push("aplicacoes","upsert",nova);
  return nova;
}
function apagarAplicacao(f,id){
  Store.set(kApl(f), aplicacoesDe(f).filter(a=>a.id!==id));
  Sync.push("aplicacoes","delete",{id});
}

/* Resumo: custo total, por tipo, por produto e por talhão */
function resumoOperacoes(f, tipo){
  let aps = aplicacoesDe(f);
  if(tipo) aps = aps.filter(a=>a.tipo===tipo);
  const porProduto = {}, porTipo = {}, porTalhao = {};
  let total = 0, haAplicada = 0, semPreco = 0;

  aps.forEach(a=>{
    const custo = custoAplicacao(f,a);
    total += custo;
    haAplicada += Number(a.hectares)||0;
    porTipo[a.tipo] = (porTipo[a.tipo]||0) + custo;
    linhasAplicacao(f,a).forEach(l=>{
      if(l.semPreco) semPreco++;
      if(!porProduto[l.produto]) porProduto[l.produto]={nome:l.produto,unidade:l.unidade,qtd:0,valor:0,aplic:0};
      const p=porProduto[l.produto];
      p.qtd+=l.qtd; p.valor+=l.valor; p.aplic++;
    });
    const n = (a.talhoes||[]).length || 1;
    (a.talhoes||[]).forEach(tid=>{
      if(!porTalhao[tid]) porTalhao[tid]={talhao_id:tid,valor:0,aplic:0};
      porTalhao[tid].valor += custo/n;
      porTalhao[tid].aplic++;
    });
  });

  return { aplicacoes:aps, total, haAplicada, semPreco,
    custoHa: haAplicada>0 ? total/haAplicada : 0,
    porProduto: Object.values(porProduto).sort((a,b)=>b.valor-a.valor),
    porTipo, porTalhao };
}

const moeda = v => "R$ " + Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});


/* ═══════════════════════════════════════════════════
   DADOS DA LAVOURA — plantio por talhão
   Variedade, sementes por metro e janela de plantio.
   ═══════════════════════════════════════════════════ */
function kLavoura(f){ return "faz_"+f+"_lavoura"; }
function lavouraDe(f){ return Store.get(kLavoura(f), {}); }

function plantioDe(f, talId){
  const l = lavouraDe(f)[talId];
  return l || { variedade:"", area:null, sementes:"", inicio:"", fim:"" };
}
function salvarPlantio(f, talId, campo, valor){
  const todo = lavouraDe(f);
  if(!todo[talId]) todo[talId] = { variedade:"", area:null, sementes:"", inicio:"", fim:"" };
  todo[talId][campo] = valor;
  const p = todo[talId];
  const vazio = !p.variedade && p.area==null && !p.sementes && !p.inicio && !p.fim;
  if(vazio) delete todo[talId];
  Store.set(kLavoura(f), todo);
  Sync.push("lavoura","upsert",{fazenda_id:f, talhao_id:talId, ...todo[talId]});
}

function resumoLavoura(f){
  const tals = talhoesDe(f).slice()
    .sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
  const linhas = tals.map(t=>{
    const p = plantioDe(f,t.id);
    const area = p.area!=null && p.area!=="" ? Number(p.area) : t.hectares;
    const plantado = !!(p.variedade || p.inicio);
    let dias = null;
    if(p.inicio && p.fim){
      const d = (new Date(p.fim+"T12:00:00") - new Date(p.inicio+"T12:00:00"))/86400000;
      if(!isNaN(d) && d>=0) dias = Math.round(d)+1;
    }
    return { id:t.id, nome:t.nome, hectares:t.hectares, area,
             variedade:p.variedade||"", sementes:p.sementes||"",
             inicio:p.inicio||"", fim:p.fim||"", dias, plantado };
  });
  const plantadas = linhas.filter(l=>l.plantado);
  const vars = {};
  plantadas.forEach(l=>{
    const v = l.variedade.trim() || "—";
    vars[v] = (vars[v]||0) + l.area;
  });
  const datas = plantadas.map(l=>l.inicio).filter(Boolean).sort();
  const fins  = plantadas.map(l=>l.fim).filter(Boolean).sort();
  return { linhas, plantadas,
    areaPlantada: plantadas.reduce((s,l)=>s+l.area,0),
    areaTotal: linhas.reduce((s,l)=>s+l.area,0),
    variedades: Object.entries(vars).map(([nome,area])=>({nome,area}))
                  .sort((a,b)=>b.area-a.area),
    inicio: datas[0]||"", fim: fins[fins.length-1]||"" };
}


/* ═══════════════════════════════════════════════════
   ESTOQUE
   Entrada pela nota de compra, saída pelo que foi
   aplicado no talhão. O saldo é a diferença.
   ═══════════════════════════════════════════════════ */
function kEntradas(f){ return "faz_"+f+"_entradas"; }
function entradasDe(f){ return Store.get(kEntradas(f), []); }
/* Pedidos de compra: o que foi comprado, quanto já chegou, quanto falta. */
function kPedidos(f){ return "faz_"+f+"_pedidos"; }
function pedidosDe(f){ return Store.get(kPedidos(f), []); }
function salvarPedidos(f,l){ Store.set(kPedidos(f), l); }

function salvarEntrada(f, d, id){
  const l = entradasDe(f);
  const dados = { data:d.data, produto_id:d.produto_id,
                  qtd:Number(d.qtd)||0, preco:Number(d.preco)||0,
                  nota:(d.nota||"").trim(), fornecedor:(d.fornecedor||"").trim(),
                  obs:(d.obs||"").trim() };
  if(id){
    const i=l.findIndex(x=>x.id===id); if(i<0) return null;
    l[i]=Object.assign({},l[i],dados);
    Store.set(kEntradas(f),l); Sync.push("entradas","upsert",l[i]); return l[i];
  }
  const nova=Object.assign({id:"en_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, criado_em:new Date().toISOString()}, dados);
  l.push(nova); Store.set(kEntradas(f),l); Sync.push("entradas","upsert",nova);
  return nova;
}
function apagarEntrada(f,id){
  Store.set(kEntradas(f), entradasDe(f).filter(e=>e.id!==id));
  Sync.push("entradas","delete",{id});
}

/* Quanto saiu de cada produto nas aplicações */
function consumoProduto(f, prodId){
  let qtd = 0;
  aplicacoesDe(f).forEach(a=>{
    const ha = Number(a.hectares)||0;
    (a.itens||[]).forEach(i=>{
      if(i.produto_id===prodId) qtd += (Number(i.dose)||0) * ha;
    });
  });
  return qtd;
}

/* Saldo por produto: entrou, saiu, sobrou — e o custo médio */
function estoqueDe(f){
  const prods = produtosDe(f);
  const ents  = entradasDe(f);
  const linhas = prods.map(p=>{
    const es = ents.filter(e=>e.produto_id===p.id);
    const entrou = es.reduce((s,e)=>s+e.qtd,0);
    const gasto  = es.reduce((s,e)=>s+e.qtd*e.preco,0);
    const saiu   = consumoProduto(f,p.id);
    const saldo  = entrou - saiu;
    const medio  = entrou>0 ? gasto/entrou : Number(p.preco)||0;
    return { id:p.id, nome:p.nome, unidade:p.unidade, preco:Number(p.preco)||0,
             entrou, saiu, saldo, gasto, medio,
             valorSaldo: saldo>0 ? saldo*medio : 0,
             compras: es.length,
             negativo: saldo < -0.001, semEntrada: entrou<=0 && saiu>0 };
  });
  linhas.sort((a,b)=>b.valorSaldo-a.valorSaldo || a.nome.localeCompare(b.nome,"pt-BR"));
  return { linhas,
    totalComprado: linhas.reduce((s,l)=>s+l.gasto,0),
    totalAplicado: linhas.reduce((s,l)=>s+l.saiu*l.medio,0),
    valorEstoque:  linhas.reduce((s,l)=>s+l.valorSaldo,0),
    alertas: linhas.filter(l=>l.negativo||l.semEntrada).length };
}


/* ═══════════════════════════════════════════════════

const TEMPO_API = "https://api.open-meteo.com/v1/forecast";
const GEO_API   = "https://geocoding-api.open-meteo.com/v1/search";

/* Códigos WMO traduzidos */
const WMO = {

  3:["Nublado","☁️"], 45:["Névoa","🌫️"], 48:["Névoa com geada","🌫️"],

function descTempo(cod){ return WMO[cod] || ["—","🌡️"]; }

function kTempo(f){ return "faz_"+f+"_tempo"; }
function tempoCache(f){ return Store.get(kTempo(f), null); }

async function buscarTempo(f){

/* ═══════════════════════════════════════════════════
   COTAÇÃO DO DÓLAR
   Comercial: AwesomeAPI (aberta, 100 mil consultas/mês).
   Oficial: PTAX do Banco Central (aberta, sem chave).
   A última consulta fica guardada para abrir sem sinal.
   ═══════════════════════════════════════════════════ */
const API_USD  = "https://economia.awesomeapi.com.br/json/daily/USD-BRL/";
const API_PTAX = "https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/"+
                 "CotacaoDolarPeriodo(dataInicial=@di,dataFinalCotacao=@df)";

function kDolar(){ return "cotacao_usd"; }
function dolarCache(){ return Store.get(kDolar(), null); }

function ddmmaaaaUS(d){
  return String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0")+"-"+d.getFullYear();
}

async function buscarDolar(dias){
  const n = dias || 30;
  const r = await fetch(API_USD + n);
  if(!r.ok) throw new Error("falha");
  const bruto = await r.json();
  if(!Array.isArray(bruto) || !bruto.length) throw new Error("vazio");
  const serie = bruto.map(x=>({
    ts: Number(x.timestamp)*1000,
    venda: Number(x.bid), compra: Number(x.ask),
    alta: Number(x.high), baixa: Number(x.low),
    var_abs: Number(x.varBid), var_pct: Number(x.pctChange)
  })).sort((a,b)=>a.ts-b.ts);

  let ptax = null;
  try{
    const hoje=new Date(), ini=new Date(hoje.getTime()-12*86400000);
    const u = API_PTAX+"?@di='"+ddmmaaaaUS(ini)+"'&@df='"+ddmmaaaaUS(hoje)+
              "'&$orderby=dataHoraCotacao%20desc&$top=1&$format=json";
    const rp = await fetch(u);
    if(rp.ok){
      const dp = await rp.json();
      const v = dp && dp.value && dp.value[0];
      if(v) ptax = { compra:Number(v.cotacaoCompra), venda:Number(v.cotacaoVenda),
                     data:String(v.dataHoraCotacao||"").slice(0,10) };
    }
  }catch(e){ /* PTAX é complemento: se falhar, segue com o comercial */ }

  const pacote = { buscado_em:new Date().toISOString(), serie, ptax };
  Store.set(kDolar(), pacote);
  return pacote;
}

/* Estatísticas da série para o painel */
function resumoDolar(p){
  if(!p || !p.serie || !p.serie.length) return null;
  const s = p.serie, ult = s[s.length-1], pri = s[0];
  const vals = s.map(x=>x.venda);
  const max = Math.max(...vals), min = Math.min(...vals);
  const media = vals.reduce((a,b)=>a+b,0)/vals.length;
  const varPeriodo = pri.venda>0 ? (ult.venda-pri.venda)/pri.venda*100 : 0;
  return { atual:ult, primeiro:pri, max, min, media, varPeriodo, dias:s.length };
}

/* Mini gráfico em SVG, sem biblioteca */
function sparkDolar(serie, larg, alt){
  const W=larg||640, H=alt||120, P=6;
  const v=serie.map(x=>x.venda);
  const mx=Math.max(...v), mn=Math.min(...v), amp=(mx-mn)||1;
  const px=i=>P+(i/(v.length-1||1))*(W-2*P);
  const py=x=>P+(1-(x-mn)/amp)*(H-2*P);
  const linha=v.map((x,i)=>(i?"L":"M")+px(i).toFixed(1)+","+py(x).toFixed(1)).join(" ");
  const area=linha+" L"+px(v.length-1).toFixed(1)+","+(H-P)+" L"+px(0).toFixed(1)+","+(H-P)+" Z";
  const sobe=v[v.length-1]>=v[0];
  const cor=sobe?"var(--leaf-dk)":"var(--red)";
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+area+'" fill="'+cor+'" opacity=".10"/>'+
    '<path d="'+linha+'" fill="none" stroke="'+cor+'" stroke-width="2" '+
      'stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+px(v.length-1).toFixed(1)+'" cy="'+py(v[v.length-1]).toFixed(1)+
      '" r="3.5" fill="'+cor+'"/></svg>';
}


/* ═══════════════════════════════════════════════════
   IMPORTAR XML DA NOTA FISCAL
   Lê o XML da NF-e e traz fornecedor, número da nota
   e os itens com quantidade e preço.
   ═══════════════════════════════════════════════════ */
const UNID_NFE = { LT:"L", L:"L", LTS:"L", LITRO:"L", LI:"L",
  KG:"kg", QG:"kg", KGS:"kg", TON:"kg", T:"kg",
  UN:"un", UND:"un", PC:"un", PCT:"un", CX:"un", FR:"un", GL:"un", BD:"un", BB:"un",
  SC:"sc", SACA:"sc", SAC:"sc" };

function normUnid(u){
  const k = String(u||"").trim().toUpperCase().replace(/[^A-Z]/g,"");
  return UNID_NFE[k] || "un";
}

function lerXmlNfe(texto){
  const doc = new DOMParser().parseFromString(texto, "application/xml");
  if(doc.querySelector("parsererror")) throw new Error("XML inválido");
  const t = (no, tag) => {
    const e = no && no.getElementsByTagName(tag)[0];
    return e ? e.textContent.trim() : "";
  };
  const inf = doc.getElementsByTagName("infNFe")[0];
  if(!inf) throw new Error("Não parece um XML de NF-e");

  const emit = inf.getElementsByTagName("emit")[0];
  const ide  = inf.getElementsByTagName("ide")[0];
  const dh   = t(ide,"dhEmi") || t(ide,"dEmi");

  const itens = [...inf.getElementsByTagName("det")].map(det=>{
    const p = det.getElementsByTagName("prod")[0];
    if(!p) return null;
    const qtd   = parseFloat(t(p,"qCom"))   || 0;
    const preco = parseFloat(t(p,"vUnCom")) || 0;
    return { nome: t(p,"xProd"), codigo: t(p,"cProd"),
             unidade: normUnid(t(p,"uCom")), qtd, preco,
             total: parseFloat(t(p,"vProd")) || qtd*preco, usar:true };
  }).filter(Boolean).filter(i=>i.nome && i.qtd>0);

  return { fornecedor: t(emit,"xNome"), cnpj: t(emit,"CNPJ"),
           nota: t(ide,"nNF"), data: dh ? dh.slice(0,10) : "",
           itens };
}

/* Casa o item da nota com um produto já cadastrado */
function acharSemelhante(f, nome){
  const limpa = s => String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const alvo = limpa(nome);
  if(!alvo) return null;
  const prods = produtosDe(f);
  let exato = prods.find(p=>limpa(p.nome) === alvo);
  if(exato) return exato;
  const tokens = alvo.split(" ").filter(w=>w.length>2);
  if(!tokens.length) return null;
  return prods.find(p=>{
    const n = limpa(p.nome);
    return tokens.some(w=>n.includes(w) && w.length>3);
  }) || null;
}

   DOCUMENTOS
   Os dados ficam no armazenamento comum; o arquivo em
   si vai para o IndexedDB, que aguenta bem mais que os
   5 MB do localStorage e funciona sem internet.
   ═══════════════════════════════════════════════════ */
const TIPOS_DOC = ["Contrato de venda","Contrato de compra","Prestação de serviço",

function kDocs(f){ return "faz_"+f+"_docs"; }

function abrirBanco(){
  return new Promise((ok,err)=>{
    if(!("indexedDB" in window)) return err(new Error("sem IndexedDB"));
    const r = indexedDB.open("safra-arquivos", 1);
    r.onupgradeneeded = ()=>{
      if(!r.result.objectStoreNames.contains("arquivos"))
        r.result.createObjectStore("arquivos", {keyPath:"id"});
    };
    r.onsuccess = ()=>ok(r.result);
    r.onerror   = ()=>err(r.error);
  });
}
function guardarArquivo(id, blob){
  return abrirBanco().then(db=>new Promise((ok,err)=>{
    const t = db.transaction("arquivos","readwrite");
    t.objectStore("arquivos").put({id, blob});
    t.oncomplete = ()=>ok(true);
    t.onerror    = ()=>err(t.error);
  }));
}
function pegarArquivo(id){
  return abrirBanco().then(db=>new Promise((ok,err)=>{
    const r = db.transaction("arquivos","readonly").objectStore("arquivos").get(id);
    r.onsuccess = ()=>ok(r.result ? r.result.blob : null);
    r.onerror   = ()=>err(r.error);
  }));
}
function removerArquivo(id){
  return abrirBanco().then(db=>new Promise(ok=>{
    const t = db.transaction("arquivos","readwrite");
    t.objectStore("arquivos").delete(id);
    t.oncomplete = ()=>ok(true);
    t.onerror    = ()=>ok(false);
  })).catch(()=>false);
}

                  arquivo:d.arquivo||null, tamanho:d.tamanho||0,
                  arquivo_path:d.arquivo_path||null };
  if(id){
    const i=l.findIndex(x=>x.id===id); if(i<0) return null;
    l[i]=Object.assign({},l[i],dados);
    Store.set(kDocs(f),l); Sync.push("documentos","upsert",l[i]); return l[i];
  }

    fazenda_id:f, criado_em:new Date().toISOString()}, dados);

function tamanhoLegivel(b){
  if(!b) return "—";
  if(b < 1024) return b+" B";
  if(b < 1048576) return (b/1024).toFixed(0)+" KB";
  return (b/1048576).toFixed(1)+" MB";
}
function diasAte(iso){
  if(!iso) return null;
  const d=(new Date(iso+"T12:00:00") - new Date())/86400000;

}

const PERFIS = {
  administrador: { nome:"Administrador", papel:"admin", modulos:null,
                   desc:"Gerencia a equipe e vê todos os módulos" },
  geral:         { nome:"Geral",         papel:"operador", modulos:null,
                   desc:"Vê e edita todos os módulos" },
  producao:      { nome:"Produção",      papel:"operador",
                   modulos:["colheita","talhoes","lavoura","operacoes","estoque","safras"],
                   desc:"Módulos de produção (colheita, lavoura, operações, estoque…)" },
  operador:      { nome:"Operador",      papel:"operador",
                   modulos:["colheita","chuva"],
                   desc:"Lançamentos de campo (colheita e pluviometria)" },
  leitura:       { nome:"Só leitura",    papel:"leitura",  modulos:null,
                   desc:"Vê tudo, não edita" }
};
function mesmoConjunto(a,b){
  const A=(a&&a.length)?a.slice().sort():null, B=(b&&b.length)?b.slice().sort():null;
  if(!A && !B) return true;
  if(!A || !B || A.length!==B.length) return false;
  return A.every((x,i)=>x===B[i]);
}
function perfilDe(papel, modulos){
  for(const k in PERFIS){ const p=PERFIS[k];
    if(p.papel===papel && mesmoConjunto(p.modulos, modulos)) return k; }
  return null; // personalizado
}
function resumoModulos(modulos){

function importarTudo(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{
    const arq=inp.files && inp.files[0]; if(!arq) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const p=JSON.parse(String(fr.result));
        if(!p || !p.dados || p.app!=="safra-nas-maos")
          throw new Error("Não é um arquivo de cópia do Safra");
        const qtd=Object.keys(p.dados).length;
        if(!confirm("Restaurar a cópia de "+(p.gerado_em||"").slice(0,10)+"?\n\n"+
          p.fazendas+" fazenda(s) · "+qtd+" registros.\n"+
          "O que está neste aparelho será substituído.")) return;
        Object.entries(p.dados).forEach(([k,v])=>{ if(v!==null) Store.set(k,v); });
        toast("Cópia restaurada");
        setTimeout(()=>location.reload(), 800);
      }catch(e){ alert(e.message||"Arquivo inválido"); }
    };
    fr.readAsText(arq);
  };
  inp.click();
}

/* Traduz o que o servidor devolveu para algo acionável */
function explicaErro(m){
  const s = String(m||"");
  if(/does not exist|42P01|Could not find the table|schema cache/i.test(s))
    return "As tabelas ainda não existem no Supabase — rode o supabase-schema.sql.";
  if(/row-level security|violates row-level|42501/i.test(s))
    return "O banco recusou a gravação (permissão). Confira se o schema foi aplicado inteiro.";
  if(/JWT|token|401|Unauthorized/i.test(s))
    return "Sua sessão expirou. Saia e entre de novo.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(s))
    return "Não consegui falar com o servidor.";
  if(/foreign key|23503/i.test(s))
    return "A fazenda ainda não chegou na nuvem. Tente de novo em instantes.";
  return s;
}

async function tentarSync(){
  if(!navigator.onLine){ toast("Sem internet agora"); return; }
  toast("Enviando…");
  await Sync.rodar();
  const n = Sync.pending();
  toast(n ? n+" ainda pendente(s)" : "Tudo sincronizado");
  render();
}

async function modalDiagnostico(){
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal modal-lg">'+
    '<h2>Diagnóstico da nuvem</h2>'+
    '<p class="sub">Testando cada parte da ligação com o Supabase.</p>'+
    '<div id="dg-res"><p class="vazio">Testando…</p></div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="fecharModal()">Fechar</button>'+
      '<button class="btn-save" onclick="modalDiagnostico()">Testar de novo</button></div>'+
  '</div></div>';

  const passos = [];
  const anota = (nome, ok, detalhe) => passos.push({nome, ok, detalhe:detalhe||""});

  anota("Endereço e chave preenchidos", SUPABASE.ligado(), SUPABASE.url||"vazio");
  anota("Conectado à internet", navigator.onLine);
  anota("Sessão aberta", Auth.logado(), Auth.usuario()?Auth.usuario().email:"sem sessão");

  try{
    await api("safra_fazendas?select=id&limit=1");
    anota("Tabela safra_fazendas", true);
  }catch(e){ anota("Tabela safra_fazendas", false, explicaErro(e.message)); }

  try{
    await api("safra_estado?select=chave&limit=1");
    anota("Tabela safra_estado", true);
  }catch(e){ anota("Tabela safra_estado", false, explicaErro(e.message)); }

  try{
    const m = await api("safra_membros?select=fazenda_id,papel");
    anota("Suas fazendas na nuvem", true, (m||[]).length+" vínculo(s)");
  }catch(e){ anota("Suas fazendas na nuvem", false, explicaErro(e.message)); }

  const f = fazendas()[0];
  if(f){
    try{
      const corpo = { id:f.id, nome:f.nome, safra:f.safra||null };
      try{
        await api("safra_fazendas", { method:"POST", prefer:"return=minimal", body:corpo });
      }catch(e){
        if(/duplicate|already exists|conflict|23505|409/i.test(String(e && e.message || e)))
          await api("safra_fazendas?id=eq."+encodeURIComponent(f.id),
            { method:"PATCH", prefer:"return=minimal", body:corpo });
        else throw e;
      }
      anota("Gravar uma fazenda", true);
    }catch(e){ anota("Gravar uma fazenda", false, explicaErro(e.message)); }

    try{
      await api("safra_estado", { method:"POST",
        prefer:"resolution=merge-duplicates,return=minimal",
        body:{ fazenda_id:f.id, chave:"teste", dados:{ok:true} } });
      anota("Gravar um bloco", true);
      try{ await api("safra_estado?fazenda_id=eq."+encodeURIComponent(f.id)+"&chave=eq.teste",
        {method:"DELETE", prefer:"return=minimal"}); }catch(e){}
    }catch(e){ anota("Gravar um bloco", false, explicaErro(e.message)); }
  }

  const falhou = passos.find(p=>!p.ok);
  document.getElementById("dg-res").innerHTML =
    '<div class="dg">'+passos.map(p=>
      '<div class="dg-l '+(p.ok?"ok":"nao")+'"><span>'+(p.ok?"✓":"✕")+'</span>'+
      '<b>'+esc(p.nome)+'</b>'+(p.detalhe?'<u>'+esc(p.detalhe)+'</u>':'')+'</div>').join("")+'</div>'+
    (falhou ? '<p class="resumo-obs"><b>Travou em:</b> '+esc(falhou.nome)+'. '+esc(falhou.detalhe)+'</p>'
            : '<p class="resumo-obs">Tudo respondeu. Toque em <b>Tentar agora</b> no aviso amarelo.</p>');
}

async function enviarLogin(){
  const email=(document.getElementById("lg-email").value||"").trim();
  const senha=document.getElementById("lg-senha").value||"";
  const err=document.getElementById("lg-erro");
  const btn=document.getElementById("lg-btn");
  err.textContent="";
  if(!email || !email.includes("@")){ err.textContent="Informe um e-mail válido"; return; }
  if(senha.length<6){ err.textContent="A senha precisa de pelo menos 6 caracteres"; return; }
  if(!navigator.onLine){ err.textContent="Sem internet. Conecte para entrar na conta."; return; }
  btn.disabled=true; btn.textContent="Aguarde…";
  try{
    if(_modoLogin==="criar"){
      const d = await Auth.criar(email,senha);
      if(!Auth.logado()){
        err.innerHTML='Conta criada. <b>Confirme o e-mail</b> e volte para entrar.';
        _modoLogin="entrar"; btn.disabled=false; render(); return;
      }
    }else{
      await Auth.entrar(email,senha);
    }
    Store.set("ult_email", email);
    Store.set("perfil", { nome: email.split("@")[0] });
    try{ await api("rpc/safra_aceitar_convites", {method:"POST", body:{}}); }catch(e){}
    toast("Bem-vindo");
    await primeiraSincronizacao();
    await Acesso.carregar();
    render();
  }catch(e){
    const m=String(e.message||"");
    err.textContent =
        /Invalid login/i.test(m) ? "E-mail ou senha não conferem"
      : /already registered|already been registered/i.test(m) ? "Esse e-mail já tem conta. Use Entrar."
      : /signups? (are |is )?disabled|signups? not allowed|not allowed for this instance/i.test(m) ? "O cadastro de novos usuários está desligado no servidor. O administrador precisa ligar isso no Supabase (Authentication → permitir cadastro)."
      : /Email not confirmed/i.test(m) ? "Confirme o e-mail que você recebeu e tente de novo."
      : /rate limit|too many/i.test(m) ? "Muitas tentativas. Espere um minuto."
      : /relation .* does not exist/i.test(m) ? "O banco ainda não foi preparado. Rode o schema no Supabase."
      : /Failed to fetch|NetworkError|Load failed/i.test(m) ? "Não consegui falar com o servidor. Confira a internet."
      : m;
    btn.disabled=false;
    btn.textContent=(_modoLogin==="entrar"?"Entrar":"Criar conta");
  }
}

/* Na primeira entrada, manda o que já existe no aparelho */
async function primeiraSincronizacao(){
  try{
    if(fazendas().length){
      const sujos=new Set(Sync.sujos());
      sujos.add("fazendas");
      fazendas().forEach(f=>BLOCOS.forEach(b=>{
        const k="faz_"+f.id+"_"+b;
        if(Store.get(k,null)!==null) sujos.add(k);
      }));
      Store.set("sync_sujo",[...sujos]);
    }
    await Sync.rodar();
  }catch(e){}
}

async function carregarAcessos(){
  const box=document.getElementById("ac-lista"); if(!box) return;
  const geridas=fazendasGeridas(); const idsGer=new Set(geridas.map(f=>f.id));
  const nomeFaz={}; geridas.forEach(f=>nomeFaz[f.id]=f.nome);
  try{
    const m=await api("safra_membros?select=fazenda_id,email,papel,user_id,modulos");
    const c=await api("safra_convites?select=id,fazenda_id,email,papel,modulos");
    _acessosData={ membros:(m||[]).filter(x=>idsGer.has(x.fazenda_id)),
                   convites:(c||[]).filter(x=>idsGer.has(x.fazenda_id)) };
    const pessoas={};
    _acessosData.membros.forEach(x=>{ const e=(x.email||"").toLowerCase(); (pessoas[e]=pessoas[e]||{email:x.email,itens:[]}).itens.push(Object.assign({},x,{conv:false})); });
    _acessosData.convites.forEach(x=>{ const e=(x.email||"").toLowerCase(); (pessoas[e]=pessoas[e]||{email:x.email,itens:[]}).itens.push(Object.assign({},x,{conv:true})); });
    const eu=Auth.usuario();
    let h='<div class="lista-cam">';
    Object.values(pessoas).sort((a,b)=>String(a.email).localeCompare(String(b.email))).forEach(p=>{
      const souEu=eu && p.itens.some(i=>i.user_id===eu.id);
      const resumo=p.itens.map(i=>esc(nomeFaz[i.fazenda_id]||"?")+(i.conv?" (convite)":"")).join(", ");
      h+='<div class="eq-row"><div class="who"><b>'+esc(p.email||"—")+(souEu?" · você":"")+'</b>'+
         '<small>'+esc(p.itens.length+" fazenda(s): "+resumo)+'</small></div>'+
         '<button class="mini" onclick="modalConvidarPessoa(\''+esc((p.email||"").replace(/\x27/g,"\\\x27"))+'\')">Editar</button></div>';
    });
    h+='</div>';
    box.innerHTML=Object.keys(pessoas).length? h : '<p class="vazio">Ainda só você. Convide alguém no botão abaixo.</p>';
  }catch(e){ box.innerHTML='<p class="vazio">Não consegui carregar agora.</p>'; }
}

function _acPerfilMudou(){
  const k=(document.getElementById("ac-perfil")||{}).value, p=PERFIS[k];
  const grid=document.getElementById("ac-mods"), nota=document.getElementById("ac-nota");
  if(p && grid){ const todos=!p.modulos||!p.modulos.length;
    grid.querySelectorAll("input").forEach(i=>{ i.checked = todos || p.modulos.indexOf(i.getAttribute("data-mid"))>=0; }); }
  const tudo = p && (p.papel==="admin");
  if(grid){ grid.style.opacity=tudo?.45:1; grid.querySelectorAll("input").forEach(i=>i.disabled=!!tudo); }
  if(nota) nota.textContent = tudo? "Administrador vê todos os módulos e gerencia a equipe." :
    (p&&p.papel==="leitura"? "Só leitura: vê os módulos marcados, sem editar." : "");
}
async function salvarAcessoPessoa(){
  const email=(document.getElementById("ac-email").value||"").trim().toLowerCase();
  if(!email||!email.includes("@")){ toast("Informe um e-mail válido"); return; }
  const perfil=PERFIS[document.getElementById("ac-perfil").value]||PERFIS.geral;
  const papel=perfil.papel;
  const fids=[...document.querySelectorAll("[data-fid]")].filter(i=>i.checked).map(i=>i.getAttribute("data-fid"));
  if(!fids.length){ toast("Escolha ao menos uma fazenda"); return; }
  let modulos=null;
  if(papel!=="admin"){
    const ids=[...document.querySelectorAll("#ac-mods input")].filter(i=>i.checked).map(i=>i.getAttribute("data-mid"));
    if(!ids.length){ toast("Marque ao menos um módulo"); return; }
    modulos = ids.length>=todosModulos().length ? null : ids;
  }
  const eu=Auth.usuario();
  const escolhidas=new Set(fids);
  const geridas=fazendasGeridas();
  try{
    for(const fid of fids){
      const membro=_acessosData.membros.find(x=>(x.email||"").toLowerCase()===email && x.fazenda_id===fid);
      if(membro){
        await api("safra_membros?fazenda_id=eq."+encodeURIComponent(fid)+"&user_id=eq."+encodeURIComponent(membro.user_id),
          {method:"PATCH", prefer:"return=minimal", body:{papel:papel, modulos:modulos}});
      }else{
        await api("safra_convites", {method:"POST", prefer:"resolution=merge-duplicates,return=minimal",
          body:{fazenda_id:fid, email:email, papel:papel, modulos:modulos}});
      }
    }
    for(const f of geridas){
      if(escolhidas.has(f.id)) continue;
      const membro=_acessosData.membros.find(x=>(x.email||"").toLowerCase()===email && x.fazenda_id===f.id);
      if(membro && !(eu&&membro.user_id===eu.id))
        await api("safra_membros?fazenda_id=eq."+encodeURIComponent(f.id)+"&user_id=eq."+encodeURIComponent(membro.user_id), {method:"DELETE", prefer:"return=minimal"});
      const conv=_acessosData.convites.find(x=>(x.email||"").toLowerCase()===email && x.fazenda_id===f.id);
      if(conv) await api("safra_convites?id=eq."+conv.id, {method:"DELETE", prefer:"return=minimal"});
    }
    toast("Acessos salvos. Quem foi convidado precisa entrar no app e criar a conta com o mesmo e-mail.");
    const meu=Auth.usuario();
    if(meu && itensSaoMeus(email,meu)) await Acesso.carregar();
    modalAcessos();
  }catch(e){ toast(/permiss|42501/i.test(String(e.message||e))?"Sem permissão para alguma fazenda":"Não consegui salvar tudo"); }
}
function itensSaoMeus(email, eu){
  return _acessosData.membros.some(x=>x.user_id===eu.id && (x.email||"").toLowerCase()===email);
}

async function carregarEquipe(){
  const f=acharFazenda(App.fazendaId);
  const box=document.getElementById("eq-lista"); if(!box) return;
  try{
    const m = await api("safra_membros?fazenda_id=eq."+encodeURIComponent(f.id)+"&select=email,papel,user_id,modulos");
    const c = await api("safra_convites?fazenda_id=eq."+encodeURIComponent(f.id)+"&select=id,email,papel,modulos");
    _equipe = { membros:(m||[]), convites:(c||[]) };
    const eu = Auth.usuario();
    const podeGerir = ehGestor(f.id), souDono = ehDono(f.id);
    let h='<div class="lista-cam">';
    _equipe.membros.forEach(x=>{
      const souEu = eu && x.user_id===eu.id;
      const alvoDono = x.papel==="dono";
      const podeEditar = podeGerir && (!alvoDono || souDono);
      const kperfil = perfilDe(x.papel, x.modulos);
      const rotulo = alvoDono ? "Dono" : (kperfil ? PERFIS[kperfil].nome : "Personalizado");
      const verTudo = alvoDono || x.papel==="admin";
      const modsTxt = verTudo ? "todos os módulos" : resumoModulos(x.modulos);
      h+='<div class="eq-row"><div class="who"><b>'+esc(x.email||"—")+(souEu?" · você":"")+'</b>'+
         '<small>'+esc(rotulo)+' — '+esc(modsTxt)+'</small></div>'+
         (podeEditar? '<button class="mini" onclick="abrirEditarAcesso(\''+esc(x.user_id)+'\')">Acesso</button>' : '')+
         (podeGerir && !souEu && !alvoDono? '<button class="mini" onclick="removerMembro(\''+esc(x.user_id)+'\',\''+esc((x.email||"").replace(/'/g,"\\'"))+'\')">Remover</button>' : '')+
       '</div>';
    });
    _equipe.convites.forEach(x=>{
      h+='<div class="eq-row"><div class="who"><b>'+esc(x.email)+'</b>'+
         '<small><span class="eq-pill">convidado</span> '+esc(resumoModulos(x.modulos))+'</small></div>'+
         '<button class="mini" onclick="cancelarConvite(\''+x.id+'\')">Cancelar</button></div>';
    });
    h+='</div>';
    box.innerHTML = (_equipe.membros.length||_equipe.convites.length)? h : '<p class="vazio">Só você por enquanto.</p>';
  }catch(e){ box.innerHTML='<p class="vazio">Não consegui carregar agora.</p>'; }
}

async function convidar(){
  const f=acharFazenda(App.fazendaId);
  const email=(document.getElementById("eq-email").value||"").trim();
  if(!email || !email.includes("@")){ toast("Informe um e-mail válido"); return; }
  const p=PERFIS[document.getElementById("eq-perfil").value]||PERFIS.geral;
  try{
    await api("safra_convites", { method:"POST",
      prefer:"resolution=merge-duplicates,return=minimal",
      body:{ fazenda_id:f.id, email:email.toLowerCase(), papel:p.papel, modulos:p.modulos } });
    document.getElementById("eq-email").value="";
    toast("Convite salvo. Peça para a pessoa ENTRAR no app e criar a conta com esse e-mail — o acesso libera sozinho.");
    carregarEquipe();
  }catch(e){ toast(/permiss|42501/i.test(String(e.message||e))?"Sem permissão para convidar":"Não consegui convidar agora"); }
}

async function cancelarConvite(id){
  try{ await api("safra_convites?id=eq."+id, {method:"DELETE", prefer:"return=minimal"});
    toast("Convite cancelado"); carregarEquipe(); }
  catch(e){ toast("Não consegui cancelar"); }
}

async function removerMembro(uid, email){
  const f=acharFazenda(App.fazendaId);
  if(!confirm("Remover "+(email||"esta pessoa")+" da fazenda?\n\nEla perde o acesso, mas os dados ficam.")) return;
  try{
    await api("safra_membros?fazenda_id=eq."+encodeURIComponent(f.id)+"&user_id=eq."+encodeURIComponent(uid),
      {method:"DELETE", prefer:"return=minimal"});
    toast("Acesso removido"); carregarEquipe();
  }catch(e){ toast(/permiss|42501/i.test(String(e.message||e))?"Sem permissão":"Não consegui remover"); }
}

/* editor de acesso de UMA pessoa */
function abrirEditarAcesso(uid){
  const f=acharFazenda(App.fazendaId);
  const x=(_equipe.membros||[]).find(m=>m.user_id===uid); if(!x) return;
  _editAcesso={ user_id:uid, email:x.email, papel:x.papel, modulos:x.modulos||null };
  const souDono=ehDono(f.id);
  const perfilAtual = perfilDe(x.papel, x.modulos) || "";
  const papeis=[["operador","Operador · lança e edita"],["leitura","Leitura · só consulta"],["admin","Administrador · gerencia"]];
  if(souDono) papeis.push(["dono","Dono"]);
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal modal-lg">'+
    '<h2>Acesso de '+esc(x.email||"—")+'</h2>'+
    '<p class="sub">Escolha um perfil pronto ou ajuste módulo a módulo.</p>'+
    '<div class="frm">'+
      '<div><label for="ea-perfil">Perfil</label><select id="ea-perfil" onchange="aplicarPerfilEditor(this.value)">'+
        '<option value="">Personalizado</option>'+opcoesPerfil(perfilAtual)+'</select></div>'+
      '<div><label for="ea-papel">Permissão</label><select id="ea-papel" onchange="_edPapelMudou()">'+
        papeis.map(p=>'<option value="'+p[0]+'"'+(p[0]===x.papel?" selected":"")+'>'+esc(p[1])+'</option>').join("")+
      '</select></div>'+
    '</div>'+
    '<label class="lbl" style="margin-top:14px">Módulos que aparecem</label>'+
    '<div class="acc-grid" id="ea-mods">'+
      todosModulos().map(m=>{
        const on = !x.modulos || !x.modulos.length || x.modulos.indexOf(m.id)>=0;
        return '<label class="acc-chk"><input type="checkbox" data-mid="'+m.id+'"'+(on?" checked":"")+'> '+esc(m.nome)+'</label>';
      }).join("")+
    '</div>'+
    '<span class="nota-pad" id="ea-nota"></span>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="modalEquipe()">Voltar</button>'+
      '<button class="btn-save" onclick="salvarAcesso()">Salvar</button></div>'+
  '</div></div>';
  _edPapelMudou();
}
function _edPapelMudou(){
  const p=(document.getElementById("ea-papel")||{}).value;
  const grid=document.getElementById("ea-mods"), nota=document.getElementById("ea-nota");
  const tudo = (p==="admin"||p==="dono");
  if(grid){ grid.style.opacity = tudo? .45 : 1;
    grid.querySelectorAll("input").forEach(i=>i.disabled=tudo); }
  if(nota) nota.textContent = tudo ? "Admin e dono veem todos os módulos." :
    (p==="leitura" ? "Leitura: vê os módulos marcados, mas não edita." : "");
}
function aplicarPerfilEditor(k){
  if(!k) return;
  const p=PERFIS[k]; if(!p) return;
  const selP=document.getElementById("ea-papel"); if(selP) selP.value=p.papel;
  const grid=document.getElementById("ea-mods");
  if(grid){ const todos=!p.modulos || !p.modulos.length;
    grid.querySelectorAll("input").forEach(i=>{
      i.checked = todos || p.modulos.indexOf(i.getAttribute("data-mid"))>=0; }); }
  _edPapelMudou();
}
async function salvarAcesso(){
  const f=acharFazenda(App.fazendaId); if(!_editAcesso) return;
  const papel=document.getElementById("ea-papel").value;
  let modulos=null;
  if(papel!=="admin" && papel!=="dono"){
    const ids=[...document.querySelectorAll("#ea-mods input")].filter(i=>i.checked).map(i=>i.getAttribute("data-mid"));
    if(!ids.length){ toast("Marque ao menos um módulo"); return; }
    modulos = ids.length>=todosModulos().length ? null : ids;   // todos marcados => sem restrição
  }
  try{
    await api("safra_membros?fazenda_id=eq."+encodeURIComponent(f.id)+"&user_id=eq."+encodeURIComponent(_editAcesso.user_id),
      { method:"PATCH", prefer:"return=minimal", body:{ papel:papel, modulos:modulos } });
    toast("Acesso salvo");
    const eu=Auth.usuario();
    if(eu && eu.id===_editAcesso.user_id) await Acesso.carregar();  // mudei o meu próprio acesso
    modalEquipe();
  }catch(e){ toast(/permiss|42501/i.test(String(e.message||e))?"Sem permissão para esta mudança":"Não consegui salvar"); }
}

/* ── Excluir fazenda (dono, digitando o nome) ─ */
function modalExcluirFazenda(fid){
  const f=acharFazenda(fid); if(!f) return;
  if(!ehDono(fid)){ toast("Só o dono pode excluir a fazenda"); return; }
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Excluir fazenda</h2>'+
    '<p class="sub">Isto apaga <b>'+esc(f.nome)+'</b> e todos os seus dados, no aparelho e na nuvem. Não dá para desfazer.</p>'+
    '<div class="frm"><div><label for="ex-nome">Digite o nome exato da fazenda para confirmar</label>'+
      '<input id="ex-nome" placeholder="'+esc(f.nome)+'" autocomplete="off" oninput="_exCheca(\''+esc(fid)+'\')"></div></div>'+
    (!navigator.onLine? '<span class="nota-pad" style="color:var(--red)">Sem internet: conecte para excluir também na nuvem.</span>' : '')+
    '<div class="modal-acts"><button class="btn-cancel" onclick="modalEquipe()">Voltar</button>'+
      '<button class="btn-save" id="ex-btn" style="background:var(--red);color:#fff" disabled onclick="confirmarExcluirFazenda(\''+esc(fid)+'\')">Excluir</button></div>'+
  '</div></div>';
}
function _exCheca(fid){
  const f=acharFazenda(fid), inp=document.getElementById("ex-nome"), btn=document.getElementById("ex-btn");
  if(!f||!inp||!btn) return;
  btn.disabled = !(inp.value.trim()===f.nome.trim() && navigator.onLine);
}
async function confirmarExcluirFazenda(fid){
  const f=acharFazenda(fid); if(!f) return;
  if(!ehDono(fid)){ toast("Só o dono pode excluir a fazenda"); return; }
  const inp=document.getElementById("ex-nome");
  if(!inp || inp.value.trim()!==f.nome.trim()){ toast("O nome não confere"); return; }
  const btn=document.getElementById("ex-btn"); if(btn){ btn.disabled=true; btn.textContent="Excluindo…"; }
  try{
    await removerFazenda(fid);
    fecharModal(); toast("Fazenda excluída"); irPara("fazendas");
  }catch(e){ toast("Não consegui excluir agora"); if(btn){ btn.disabled=false; btn.textContent="Excluir"; } }
}

function render(){
  if(SUPABASE.ligado() && !Auth.logado()){
    document.getElementById("root").innerHTML = telaLogin();
    return;
  }
  let h = topbar();
  if(App.tela==="fazendas")      h += telaFazendas();
  else if(App.tela==="fazenda")  h += telaFazenda();
  else if(App.tela==="modulo" && !podeModulo(App.fazendaId, App.moduloId)){ App.tela="fazenda"; h += telaFazenda(); }
  else if(App.tela==="modulo")   h += (App.moduloId==="talhoes" ? telaTalhoes() : App.moduloId==="colheita" ? telaColheita() : App.moduloId==="chuva" ? telaChuva() : App.moduloId==="operacoes" ? telaOperacoes() : App.moduloId==="lavoura" ? telaLavoura() : App.moduloId==="estoque" ? telaEstoque() : App.moduloId==="ndvi" ? telaMapa() : App.moduloId==="tempo" ? telaTempo() : App.moduloId==="cotacoes" ? telaCotacoes() : App.moduloId==="documentos" ? telaDocumentos() : App.moduloId==="visitas" ? telaVisitas() : App.moduloId==="contratos" ? telaContratos() : App.moduloId==="safras" ? telaHistorico() : App.moduloId==="diesel" ? telaDiesel() : App.moduloId==="maquinario" ? telaMaquinario() : telaModulo());
  else if(App.tela==="panorama") h += telaPanorama();
  document.getElementById("root").innerHTML = h;
  Sync.render();
  if(typeof restaurarFocoMM === "function") restaurarFocoMM();
}

/* ═══════════════════════════════════════════════════
   TELA — Dados da fazenda (talhões)
   ═══════════════════════════════════════════════════ */
let _buscaTal = "";

function telaTalhoes(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }

  const todos = talhoesDe(f.id);
  const b = _buscaTal.trim().toLowerCase();
  const lista = b ? todos.filter(t=>t.nome.toLowerCase().includes(b)) : todos;
  lista.sort((a,z)=>a.nome.localeCompare(z.nome,"pt-BR",{numeric:true}));

  const totHa = todos.reduce((s,t)=>s+t.hectares,0);
  const totAb = todos.reduce((s,t)=>s+(t.abertura||0),0);
  const nAb   = todos.filter(t=>(t.abertura||0)>0).length;

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
         '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
         '<div class="farm-head-mid"><h1>Dados da fazenda</h1>'+
         '<p>Talhões, áreas e tipo de área · safra '+esc(f.safra)+'</p></div></div>';

  // Indicadores
  h += '<div class="kpis">'+
    kpi("Talhões", todos.length, "") +
    kpi("Área total", totHa.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}), "ha") +
    kpi("Área nova", totAb>0 ? totAb.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "—", totAb>0?"ha · "+nAb+" talhões":"") +
  '</div>';

  // Ações
  h += '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalTalhao()">+ Novo talhão</button>'+
    (todos.length ? botaoExportar([{rotulo:"Planilha",fn:"exportarTalhoes('csv')"},{rotulo:"Imagem",fn:"exportarTalhoes('png')"},{rotulo:"PDF",fn:"exportarTalhoes('pdf')"}]) : '')+
    (todos.length ? '<input class="busca" placeholder="Buscar talhão…" value="'+esc(_buscaTal)+'" '+
       'oninput="clearTimeout(window._bt);window._bt=setTimeout(()=>{_buscaTal=this.value;render();},250)">' : '')+
  '</div>';

  if(!todos.length){
    const seed = seedParaFazenda(f.nome);
    const totSeed = seed ? seed.talhoes.reduce((s,r)=>s+(r[1]||0),0) : 0;
    h += '<div class="empty"><strong>Nenhum talhão cadastrado</strong>'+
         'Cadastre os talhões com nome e área. Eles são a base para colheita, operações, chuva e NDVI.'+
         (seed
           ? '<div style="margin-top:16px"><button class="btn-act primary" onclick="carregarSeed()">'+
             'Carregar os '+seed.talhoes.length+' talhões da '+esc(seed.rotulo)+
             ' ('+totSeed.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+' ha)</button></div>' : '')+
         '</div>';
  }else if(!lista.length){
    h += '<div class="empty"><strong>Nada encontrado</strong>Nenhum talhão com “'+esc(_buscaTal)+'”.</div>';
  }else{
    h += '<div class="tal-list">';
    lista.forEach(t=>{
      const pct = totHa>0 ? (t.hectares/totHa*100) : 0;
      h += '<div class="tal'+(t.finalizado?' fin':'')+'">'+
        '<div class="tal-bar"><i style="width:'+Math.max(2,Math.min(100,pct*3)).toFixed(1)+'%"></i></div>'+
        '<div class="tal-nome">'+esc(t.nome)+
          (t.finalizado?'<span class="pill fin">finalizado</span>':'')+

function salvarTalhao(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const nome = document.getElementById("t-nome").value.trim();
  const ha   = parseFloat(String(document.getElementById("t-ha").value).replace(",","."))||0;
  const ab   = parseFloat(String(document.getElementById("t-ab").value).replace(",","."))||0;
  if(!nome){ toast("Informe o nome do talhão"); return; }
  if(ha<=0){ toast("Informe a área em hectares"); return; }
  if(ab>ha){ toast("A área nova não pode ser maior que a área do talhão"); return; }

  const jaExiste = talhoesDe(f.id).some(t =>
    t.id!==id && t.nome.toLowerCase()===nome.toLowerCase());
  if(jaExiste){ toast("Já existe um talhão com esse nome"); return; }

  if(id) editarTalhao(f.id,id,{nome,hectares:ha,abertura:ab});
  else   novoTalhao(f.id,{nome,hectares:ha,abertura:ab});
  fecharModal(); toast(id?"Talhão atualizado":"Talhão cadastrado"); render();
}

function removerTalhao(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const t = talhoesDe(f.id).find(x=>x.id===id); if(!t) return;
  if(!confirm('Remover o talhão "'+t.nome+'"?')) return;
  apagarTalhao(f.id,id); toast("Talhão removido"); render();
}

function exportarTalhoes(fmt){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const l = talhoesDe(f.id).slice()
    .sort((a,z)=>a.nome.localeCompare(z.nome,"pt-BR",{numeric:true}));
  const linhas = [["Talhão","Área/ha","Área nova/ha"]]
    .concat(l.map(t=>[t.nome, vBR(t.hectares), vBR(t.abertura||0)]));
  exportarTabela(fmt, "Talhões · "+f.nome, linhas,
    "talhoes-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

/* Umidade da fazenda ao lado da do armazém — o comparativo que interessa */
function umidCompara(c){
  const uf = Number(c.umidade)||0;
  if(!cargaBaixada(c)) return uf ? nf(uf,1)+"%" : "—";
  const ua = Number(c.baixa.umidade)||0;
  const d  = ua - uf;
  const cor = Math.abs(d) >= 1.5 ? " alerta" : "";
  return (uf?nf(uf,1):"—")+" <u class="+JSON.stringify("cmp"+cor)+">"+
         (d>0?"+":"")+nf(d,1)+"</u> "+nf(ua,1)+"%";
}

let _mesIdx = null;      // posição dentro da safra

function telaChuva(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const safra = _chuvaSafra || f.safra;
  const meses = mesesDaSafra(safra);
  if(_mesIdx==null){
    const hoje=new Date(), i=meses.findIndex(m=>m.ano===hoje.getFullYear()&&m.mes===hoje.getMonth());
    _mesIdx = i>=0 ? i : 0;
  }
  _mesIdx = Math.max(0, Math.min(meses.length-1, _mesIdx));
  const {ano,mes} = meses[_mesIdx];
  const pts = pontosDe(f.id);
  const r = resumoMes(f.id,ano,mes);
  const ac = acumuladoSafra(f.id,safra);
  const safrasVer = [...new Set([f.safra, ...safrasComChuva(f.id)])].sort().reverse();

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
       '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
       '<div class="farm-head-mid"><h1>Pluviometria</h1>'+
       '<p>Chuva por dia e ponto de medição</p></div>'+
       '<div class="ch-head-acts">'+

        meses.map((m,i)=>'<option value="'+i+'" '+(i===_mesIdx?'selected':'')+'>'+
          MESES[m.mes]+' '+m.ano+'</option>').join("")+
      '</select>'+
      '<button class="mn-b" onclick="_mesIdx++;render()" '+(_mesIdx===meses.length-1?'disabled':'')+'>›</button>'
      : '')+
    '<div class="mn-modo">'+
      '<button class="'+(_modoChuva==="dia"?"on":"")+'" onclick="_modoChuva=\'dia\';render()">Por dia</button>'+
      '<button class="'+(_modoChuva==="planilha"?"on":"")+'" onclick="_modoChuva=\'planilha\';render()">Planilha</button>'+
    '</div>'+
    botaoExportar([{rotulo:"Planilha",fn:"exportarChuva()"},{rotulo:"Imagem",fn:"exportarChuvaImg('png')"},{rotulo:"PDF",fn:"exportarChuvaImg('pdf')"}])+
  '</div>';

  h += _modoChuva==="dia" ? chuvaPorDia(f,ano,mes,pts,r) : chuvaPlanilha(f,ano,mes,pts,r);

  // Acumulado por ponto
  h += '<div class="resumo"><div class="resumo-t">Acumulado da safra por talhão</div>'+
    '<div class="acum">'+ pts.map(p=>
      '<div class="ac"><span>'+esc(p.nome)+'</span><b>'+nf(ac.porPonto[p.id]||0,0)+' <i>mm</i></b></div>'
    ).join("")+'</div>'+
    '<p class="resumo-obs">Total lançado na safra: '+nf(ac.total,0)+' mm somando todos os pontos. '+
    'A média entre os '+pts.length+' pontos é '+nf(ac.media,0)+' mm.</p></div>';

  const comp = safrasVer.map(s=>{const a=acumuladoSafra(f.id,s); return {safra:s, media:a.media, total:a.total};})
                        .filter(x=>x.total>0);
  if(comp.length>1){
    h+='<div class="resumo"><div class="resumo-t">Comparativo entre safras</div>'+
      '<table class="arm-grid"><thead><tr><th>Safra</th><th>Média (mm)</th><th>Total lançado (mm)</th></tr></thead><tbody>'+
      comp.map(x=>'<tr'+(x.safra===safra?' class="arm-tot"':'')+'><td>'+esc(x.safra)+
        '</td><td>'+nf(x.media,0)+'</td><td>'+nf(x.total,0)+'</td></tr>').join("")+
      '</tbody></table><p class="resumo-obs">Suba os anos anteriores em “Importar” para o comparativo ficar completo.</p></div>';
  }

  return h+'</div>';
}

      '<div><label for="ch-file">Arquivo (CSV ou Excel)</label>'+

function lerArquivoChuva(input){ return lerArquivoNoCampo(input, "ch-imp"); }
function _parseDataChuva(s){
  s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let y=m[3]; if(y.length===2) y="20"+y; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  if(/^\d{4,6}$/.test(s)){ const n=+s;         // número de série do Excel (dias desde 30/12/1899)
    if(n>=20000 && n<=60000){ const d=new Date(Date.UTC(1899,11,30)+n*86400000);
      return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); } }
  return null;
}
function _normNome(s){ return String(s).toLowerCase().trim().replace(/\s+/g," ")
  .normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function importarChuva(){
  const f=acharFazenda(App.fazendaId); if(!f||!ehGestor(f.id)) return;
  const txt=(document.getElementById("ch-imp").value||"").trim();
  if(!txt){ toast("Cole a planilha primeiro"); return; }
  const linhas=txt.split(/\r?\n/).map(l=>l.split(/\t|;/));
  let hi=linhas.findIndex(r=>r.some(c=>/^data$/i.test(String(c).trim())));
  if(hi<0){ toast("Não achei o cabeçalho (precisa de uma coluna \"Data\")"); return; }
  const header=linhas[hi].map(c=>String(c).trim());
  const idxData=header.findIndex(c=>/^data$/i.test(c));
  const mapaPt={}; pontosDe(f.id).forEach(p=>mapaPt[_normNome(p.nome)]=p.id);
  const colPonto=header.map((c,i)=> i===idxData ? null : (mapaPt[_normNome(c)]||null));
  const naoCasou=header.filter((c,i)=>i!==idxData && c && !colPonto[i]);
  const todo=chuvaDe(f.id);
  let cells=0, dias=0;
  linhas.forEach((r,i)=>{
    if(i===hi) return;
    const dia=_parseDataChuva(r[idxData]||""); if(!dia) return;
    let algum=false;
    colPonto.forEach((pid,ci)=>{ if(!pid) return;
      const raw=String(r[ci]==null?"":r[ci]).trim(); if(raw==="") return;
      const v=Number(raw.replace(",",".")); if(isNaN(v)||v<0) return;
      if(!todo[dia]) todo[dia]={};
      todo[dia][pid]=v; cells++; algum=true;
    });
    if(algum) dias++;
  });
  if(!cells){ toast("Nada reconhecido — confira as datas e os nomes das colunas"); return; }
  Store.set(kChuva(f.id), todo);
  if(typeof Sync!=="undefined" && Sync.marcar) Sync.marcar(kChuva(f.id));
  fecharModal();
  toast(cells+" medições em "+dias+" dias importadas"+(naoCasou.length?" · ignoradas: "+naoCasou.join(", "):""));
  render();
}

/* Modo celular: escolhe o dia, digita ponto a ponto */
function chuvaPorDia(f,ano,mes,pts,r){
  const nd = diasNoMes(ano,mes);
  const hoje = new Date();
  let dia = (hoje.getFullYear()===ano && hoje.getMonth()===mes) ? hoje.getDate() : 1;
  if(window._diaSel && window._diaSel.ano===ano && window._diaSel.mes===mes) dia = window._diaSel.dia;

  let h = '<div class="dias">';
  for(let d=1; d<=nd; d++){
    const info = r.porDia[d];
    const cls = d===dia ? " sel" : (info.n ? " tem" : "");
    h += '<button class="dq'+cls+'" onclick="selDia('+ano+','+mes+','+d+')">'+
         '<i>'+d+'</i>'+(info.n?'<u>'+nf(info.media,0)+'</u>':'')+'</button>';
  }
  h += '</div>';

  const k = chaveDia(ano,mes,dia);
  const lanc = pts.filter(p=>lerChuva(f.id,k,p.id)!=null).length;
  h += '<div class="lanc"><div class="lanc-h">'+
    '<h3>'+dia+' de '+MESES[mes]+'</h3>'+
    '<span>'+(r.porDia[dia].n ? nf(r.porDia[dia].media,1)+' mm de média em '+lanc+' talhões'
                              : "sem registro")+'</span></div>';

  h += '<div class="lanc-tudo">'+
    '<input id="mm-tudo" type="number" inputmode="decimal" step="0.5" min="0" placeholder="mm">'+
    '<button class="btn-act" onclick="chuvaEmTodos(\''+k+'\')">Aplicar em todos</button>'+
    (lanc?'<button class="btn-act" onclick="limparDia(\''+k+'\')">Limpar o dia</button>':'')+
    '<span class="dica">Choveu parelho na fazenda? Preencha uma vez só e ajuste as exceções.</span>'+
  '</div>';

  pts.forEach(p=>{
    const v = lerChuva(f.id,k,p.id);
    h += '<div class="lp"><label for="mm-'+p.id+'">'+esc(p.nome)+'</label>'+
      '<div class="lp-in"><input id="mm-'+p.id+'" type="number" inputmode="decimal" step="0.5" min="0" '+
      'value="'+(v==null?"":v)+'" placeholder="0" data-mm="1" '+
      'onkeydown="proxCampoMM(event,this)" '+
      'onchange="gravarChuva(\''+f.id+'\',\''+k+'\',\''+p.id+'\',this.value);render()"><span>mm</span></div></div>';
  });
  return h+'</div>';
}

/* Modo planilha: a safra inteira, só os dias que choveram —
   igual ao controle da fazenda. */
function chuvaPlanilha(f,ano,mes,pts,r){
  const dias = diasDeChuva(f.id, f.safra);
  if(!dias.length)
    return '<div class="empty"><strong>Nenhuma chuva lançada nesta safra</strong>'+
      'Use o modo <b>Por dia</b> para registrar. Aqui aparecem só os dias que choveram.</div>';

  const tot = {}; pts.forEach(p=>tot[p.id]=0);
  let geral = 0;

  let h = '<div class="tbl grade"><table><thead><tr>'+
    '<th class="fix">'+esc(String(f.safra).replace("/","/"))+'</th>'+
    pts.map(p=>'<th class="num">'+esc(p.nome)+'</th>').join("")+
    '<th class="num tot">Total</th></tr></thead><tbody>';

  dias.forEach(k=>{
    let soma=0, n=0;
    const cels = pts.map(p=>{
      const v = lerChuva(f.id,k,p.id);
      if(v!=null){ soma+=v; n++; tot[p.id]+=v; }
      return '<td class="num"><input class="gr" type="number" inputmode="decimal" step="0.5" min="0" '+
        'value="'+(v==null?"":v)+'" '+
        'onchange="gravarChuva(\''+f.id+'\',\''+k+'\',\''+p.id+'\',this.value);render()"></td>';
    }).join("");
    geral += soma;
    h += '<tr class="molhado"><td class="fix mono dia">'+diaCurto(k)+'</td>'+cels+
         '<td class="num mono tot">'+nf(soma,1)+'</td></tr>';
  });

  h += '</tbody><tfoot><tr><td class="fix">Total</td>'+
    pts.map(p=>'<td class="num mono">'+nf(tot[p.id],1)+'</td>').join("")+
    '<td class="num mono tot">'+nf(geral,1)+'</td></tr>'+
    '<tr class="med"><td class="fix">Média</td>'+
    pts.map(()=>'<td class="num mono">'+nf(geral/pts.length,1)+'</td>').join("")+
    '<td class="num mono tot">'+nf(geral/pts.length,1)+'</td></tr></tfoot></table></div>'+
    '<p class="ver">'+dias.length+' dias com chuva na safra</p>';
  return h;
}

  const f=acharFazenda(App.fazendaId); if(!f) return;

/* Enter salva e pula para o talhão seguinte — lançar 36 talhões
   sem tirar a mão do teclado. Shift+Enter volta. */
function proxCampoMM(ev, el){
  if(ev.key !== "Enter") return;
  ev.preventDefault();
  const campos = [...document.querySelectorAll('input[data-mm]')];
  const i = campos.indexOf(el);
  const alvo = campos[i + (ev.shiftKey ? -1 : 1)];
  el.dispatchEvent(new Event("change"));
  window._focoMM = alvo ? alvo.id : null;
}
/* Depois do render, devolve o cursor para onde estava */
function restaurarFocoMM(){
  if(!window._focoMM) return;
  const el = document.getElementById(window._focoMM);
  window._focoMM = null;
  if(el){ el.focus(); el.select && el.select(); }
}

function selDia(ano,mes,dia){ window._diaSel={ano,mes,dia}; render(); }

/* ── Pontos de medição ───────────────────── */

function exportarChuva(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const pts=pontosDe(f.id), dias=diasDeChuva(f.id,f.safra);
  if(!dias.length){ toast("Nenhuma chuva lançada ainda"); return; }
  const tot={}; pts.forEach(p=>tot[p.id]=0);
  const linhas=[["CONTROLE DE CHUVA - SAFRA "+f.safra+" - "+f.nome.toUpperCase()]];
  linhas.push(["Dia"].concat(pts.map(p=>p.nome)).concat(["Total"]));
  let geral=0;
  dias.forEach(k=>{
    let soma=0;
    const cel=pts.map(p=>{
      const v=lerChuva(f.id,k,p.id);
      if(v!=null){ soma+=v; tot[p.id]+=v; }
      return v==null?"":vBR(v);
    });
    geral+=soma;
    linhas.push([diaCurto(k)].concat(cel).concat([vBR(soma)]));
  });
  linhas.push(["Total"].concat(pts.map(p=>vBR(tot[p.id]))).concat([vBR(geral)]));
  linhas.push(["Média"].concat(pts.map(()=>vBR((geral/pts.length).toFixed(1))))
                       .concat([vBR((geral/pts.length).toFixed(1))]));
  baixarCSV(linhas,"chuvas-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

/* ── Relatório: igual ao da fazenda ──────── */
function abaRelatorio(f,R){
  const tals = talhoesDe(f.id);
  const nomeT = a => (a.talhoes||[]).map(id=>{
    const t=tals.find(x=>x.id===id); return t?t.nome:"—"; }).join(", ") || "—";

  let h = '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalAplicacao()">+ Nova aplicação</button>'+
    (R.aplicacoes.length?botaoExportar([{rotulo:"Planilha",fn:"exportarOperacoes('csv')"},{rotulo:"Imagem",fn:"exportarOperacoes('png')"},{rotulo:"PDF",fn:"exportarOperacoes('pdf')"}]):'')+
    '<select class="sel-f" onchange="_fTipo=this.value;render()">'+
      '<option value="">Todos os tipos</option>'+
      TIPOS_OP.map(t=>'<option '+(_fTipo===t?'selected':'')+'>'+esc(t)+'</option>').join("")+
    '</select></div>';

  if(!produtosDe(f.id).length)
    return h+'<div class="empty"><strong>Cadastre os produtos primeiro</strong>'+
      'Defesivos, adubos e sementes com o preço por litro ou quilo.'+
      '<div style="margin-top:16px"><button class="btn-act primary" '+
      'onclick="_abaOp=\'produtos\';render();setTimeout(modalProduto,80)">Cadastrar produto</button></div></div>';

  if(!R.aplicacoes.length)
    return h+'<div class="empty"><strong>Nenhuma aplicação lançada</strong>'+
      'Cada passada de pulverizador vira uma aplicação, com a calda de produtos e a área tratada.</div>';

  const aps = R.aplicacoes.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  let h2 = '<div class="tbl"><table><thead><tr>'+
    '<th>Data</th><th>Talhão</th><th>Produto</th><th class="num">Dose</th>'+
    '<th class="num">Hectares</th><th class="num">Qtd</th>'+
    '<th class="num hide-sm">Valor un.</th><th class="num">Valor total</th><th></th>'+
    '</tr></thead><tbody>';
  let total = 0;
  aps.forEach(a=>{
    const ls = linhasAplicacao(f.id,a);
    const custo = ls.reduce((s,l)=>s+l.valor,0);
    total += custo;
    if(!ls.length){
      h2 += '<tr class="ap-ini"><td class="mono">'+dataBR(a.data)+'</td>'+
        '<td class="forte">'+esc(nomeT(a))+'</td><td colspan="6" class="vaz">sem produto na calda</td>'+
        '<td class="acoes"><button onclick="modalAplicacao(\''+a.id+'\')">Editar</button>'+

   ═══════════════════════════════════════════════════ */
let _abaEst = "saldo";

function telaEstoque(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const E = estoqueDe(f.id);
  const peds = pedidosDe(f.id);
  const temProd = produtosDe(f.id).length>0;

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
    '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
    '<div class="farm-head-mid"><h1>Estoque</h1>'+
    '<p>Pedido → entrada → aplicação no talhão · safra '+esc(f.safra)+'</p></div></div>';

  const valorPedido = peds.reduce((s,p)=>s+(p.qtd||0)*(p.valor||0),0);       // total encomendado
  const valorEntregue = peds.reduce((s,p)=>s+(p.entregue||0)*(p.valor||0),0); // o que já chegou
  const emEstoque = Math.max(0, valorEntregue - E.totalAplicado);             // baixa conforme aplica
  h += '<div class="kpis kpis-4">'+
    kpi("Comprado", moeda(E.totalComprado+valorPedido).replace("R$ ",""), "R$")+
    kpi("Entregue", moeda(valorEntregue).replace("R$ ",""), "R$")+
    kpi("Em estoque", moeda(emEstoque).replace("R$ ",""), "R$")+
    kpi("Pedidos abertos", peds.filter(p=>(p.qtd-(p.entregue||0))>0.001).length, "a receber")+
  '</div>';

  h += '<div class="abas">'+
    abaEst("pedidos","Pedidos", peds.length)+
    abaEst("saldo","Saldo", E.linhas.filter(l=>l.entrou>0||l.saiu>0).length)+
    abaEst("entradas","Recebimentos", entradasDe(f.id).length)+
  '</div>';

  if(_abaEst==="pedidos") h += abaPedidos(f, peds);
  else if(_abaEst==="entradas") h += (temProd? abaEntradas(f) : estoqueVazio());
  else h += (temProd? abaSaldo(f,E) : estoqueVazio());
  return h+'</div>';
}
function estoqueVazio(){
  return '<div class="empty"><strong>Cadastre os produtos primeiro</strong>'+
    'O saldo e os recebimentos vêm dos produtos usados em Operações no talhão.'+
    '<div style="margin-top:16px"><button class="btn-act primary" '+
    'onclick="irPara(\'modulo\',{moduloId:\'operacoes\'})">Ir para Operações</button></div></div>';
}
/* Aba Pedidos: cadastro de compras, com entregue e faltam */
function abaPedidos(f, peds){
  let h='<div class="acts"><button class="btn-act primary" onclick="modalPedido()">+ Novo pedido</button></div>';
  if(!peds.length) return h+'<p class="vazio">Nenhum pedido ainda. Cadastre o que foi comprado — quando chegar na fazenda, registre a entrega.</p>';
  const grupos={};
  peds.forEach(p=>{ const k=_normNome(p.produto); (grupos[k]=grupos[k]||{nome:p.produto, itens:[]}).itens.push(p); });
  h+='<table class="arm-grid"><thead><tr><th>Produto</th><th>Em nome de</th><th>Pedido</th><th>Entregue</th><th>Faltam</th><th>Valor</th><th></th></tr></thead><tbody>';
  let gP=0,gE=0,gV=0;
  Object.keys(grupos).sort().forEach(k=>{
    const g=grupos[k]; let sP=0,sE=0,sV=0;
    g.itens.forEach(p=>{
      const ent=p.entregue||0, falta=p.qtd-ent, val=p.qtd*(p.valor||0);
      sP+=p.qtd; sE+=ent; sV+=val;
      h+='<tr><td>'+esc(p.produto)+(p.unidade?' <small style="color:var(--muted)">('+esc(p.unidade)+')</small>':'')+
         (p.anexo_path?' <a href="#" onclick="verAnexoPedido(\''+p.id+'\');return false" title="Ver comprovante/nota" style="text-decoration:none">📎</a>':'')+'</td>'+
         '<td>'+esc(p.responsavel||"—")+'</td>'+
         '<td>'+nf(p.qtd,0)+'</td><td>'+(((p.entregas&&p.entregas.length)||(p.entregue||0)>0)?'<a href="#" onclick="modalEntregas(\''+p.id+'\');return false" style="text-decoration:none;border-bottom:1px dotted var(--muted)">'+nf(ent,0)+'</a>':nf(ent,0))+'</td>'+
         '<td'+(falta>0.001?' style="color:var(--red);font-weight:800"':'')+'>'+nf(falta,0)+'</td>'+
         '<td>'+(p.valor?moeda(val):"—")+'</td>'+
         '<td style="white-space:nowrap;text-align:right"><button class="mini" onclick="modalEntregaPedido(\''+p.id+'\')">+ Entrega</button> '+
         '<button class="mini" onclick="modalPedido(\''+p.id+'\')">Editar</button> '+
         '<button class="mini" onclick="removerPedido(\''+p.id+'\')">✕</button></td></tr>';
    });
    if(g.itens.length>1)
      h+='<tr class="arm-sub"><td>'+esc(g.nome)+' — total</td><td></td><td>'+nf(sP,0)+'</td><td>'+nf(sE,0)+'</td><td>'+nf(sP-sE,0)+'</td><td>'+moeda(sV)+'</td><td></td></tr>';
    gP+=sP; gE+=sE; gV+=sV;
  });
  h+='<tr class="arm-tot"><td>Total geral</td><td></td><td>'+nf(gP,0)+'</td><td>'+nf(gE,0)+'</td><td>'+nf(gP-gE,0)+'</td><td>'+moeda(gV)+'</td><td></td></tr>';
  return h+'</tbody></table>';
}

    '</div>'+

  setTimeout(()=>{const e=document.getElementById("pd-prod"); if(e) e.focus();},60);
