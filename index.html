        '<button type="button" class="btn-mini" onclick="addItemApl()">+ outro produto</button></div>'+
      '<div id="ap-calc" class="calc"></div>'+
      '<div><label for="ap-obs">Observação</label>'+
        '<input id="ap-obs" value="'+esc(a?a.obs:"")+'" placeholder="Borda, reaplicação, condição do tempo…"></div>'+
    '</div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="gravarAplicacao('+(a?"'"+a.id+"'":"null")+')">Salvar aplicação</button>'+
    '</div></div></div>';
  desenharItensApl(); recalcApl();
}

function desenharItensApl(){
  const f=acharFazenda(App.fazendaId);
  const prods = produtosDe(f.id).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  document.getElementById("ap-itens").innerHTML = _itensApl.map((it,i)=>
    '<div class="item item-p">'+
      '<select onchange="_itensApl['+i+'].produto_id=this.value;recalcApl()">'+
        '<option value="">— produto —</option>'+
        prods.map(p=>'<option value="'+p.id+'" '+(it.produto_id===p.id?"selected":"")+'>'+
          esc(p.nome)+(p.preco>0?" · "+moeda(p.preco)+"/"+esc(p.unidade):" · sem preço")+'</option>').join("")+
      '</select>'+
      '<input type="number" step="0.001" inputmode="decimal" placeholder="dose" value="'+(it.dose||"")+'" '+
        'oninput="_itensApl['+i+'].dose=this.value;recalcApl()">'+
      (_itensApl.length>1?'<button type="button" onclick="remItemApl('+i+')">✕</button>':'<span></span>')+
    '</div>').join("");
}
function addItemApl(){ _itensApl.push({produto_id:"",dose:""}); desenharItensApl(); recalcApl(); }
function remItemApl(i){ _itensApl.splice(i,1); desenharItensApl(); recalcApl(); }

function sugerirArea(){
  const f=acharFazenda(App.fazendaId);
  const el=document.getElementById("ap-ha"); if(!el||el.value) return;
  const ids=[...document.querySelectorAll('.tsel input:checked')].map(x=>x.value);
  const soma=talhoesDe(f.id).filter(t=>ids.includes(t.id)).reduce((s,t)=>s+t.hectares,0);
  if(soma>0){ el.value=soma.toFixed(2); recalcApl(); }
}

function recalcApl(){
  const f=acharFazenda(App.fazendaId);
  const ha=parseFloat(String((document.getElementById("ap-ha")||{}).value||"").replace(",","."))||0;
  let total=0, n=0, sem=0;
  _itensApl.forEach(it=>{
    const p=acharProduto(f.id,it.produto_id); if(!p) return;
    const dose=parseFloat(String(it.dose).replace(",","."))||0;
    if(dose<=0) return;
    n++;
    if((Number(p.preco)||0)<=0){ sem++; return; }
    total += dose*ha*Number(p.preco);
  });
  const box=document.getElementById("ap-calc"); if(!box) return;
  box.innerHTML =
    '<span><i>Produtos</i><b>'+n+'</b></span>'+
    '<span><i>Área</i><b>'+nf(ha,2)+' ha</b></span>'+
    '<span><i>Custo por hectare</i><b>'+(ha>0?moeda(total/ha):"—")+'</b></span>'+
    '<span><i>Custo da aplicação</i><b class="ok">'+moeda(total)+'</b></span>'+
    (sem?'<span class="nota">'+sem+' produto(s) sem preço — não entram no custo.</span>':'');
}

function gravarAplicacao(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const ha=parseFloat(String(document.getElementById("ap-ha").value).replace(",","."))||0;
  if(ha<=0){ toast("Informe a área tratada"); return; }
  const ids=[...document.querySelectorAll('.tsel input:checked')].map(x=>x.value);
  if(!ids.length){ toast("Escolha ao menos um talhão"); return; }
  const itens=_itensApl.filter(i=>i.produto_id && parseFloat(String(i.dose).replace(",","."))>0)
    .map(i=>({produto_id:i.produto_id, dose:parseFloat(String(i.dose).replace(",","."))}));
  if(!itens.length){ toast("Informe ao menos um produto com dose"); return; }
  salvarAplicacao(f.id,{ data:document.getElementById("ap-data").value||new Date().toISOString().slice(0,10),
    tipo:document.getElementById("ap-tipo").value, talhoes:ids, hectares:ha,
    obs:document.getElementById("ap-obs").value, itens }, id);
  fecharModal(); toast(id?"Aplicação atualizada":"Aplicação lançada"); render();
}

function removerAplicacao(id){
  const f=acharFazenda(App.fazendaId);
  const a=aplicacoesDe(f.id).find(x=>x.id===id); if(!a) return;
  if(!confirm("Remover a aplicação de "+dataBR(a.data)+"?")) return;
  apagarAplicacao(f.id,id); toast("Aplicação removida"); render();
}

/* ── Modal: produto ──────────────────────── */
function modalProduto(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const p = id ? produtosDe(f.id).find(x=>x.id===id) : null;
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>'+(p?"Editar produto":"Novo produto")+'</h2>'+
    '<p class="sub">O preço é usado para calcular o custo de cada aplicação.</p>'+
    '<div class="frm">'+
      '<div><label for="pd-nome">Nome</label>'+
        '<input id="pd-nome" value="'+esc(p?p.nome:"")+'" placeholder="Engeo Pleno, Ochima, Adjust…"></div>'+
      '<div class="g2">'+
        '<div><label for="pd-un">Unidade</label><select id="pd-un">'+
          ["L","kg","un","sc"].map(u=>'<option '+(p&&p.unidade===u?"selected":"")+'>'+u+'</option>').join("")+
        '</select></div>'+
        '<div><label for="pd-preco">Preço por unidade (R$)</label>'+
          '<input id="pd-preco" type="number" step="0.01" inputmode="decimal" value="'+(p&&p.preco?p.preco:"")+'" placeholder="0,00"></div>'+
      '</div></div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="gravarProduto('+(p?"'"+p.id+"'":"null")+')">Salvar</button>'+
    '</div></div></div>';
  setTimeout(()=>{const e=document.getElementById("pd-nome"); if(e) e.focus();},60);
}
function gravarProduto(id){
  const f=acharFazenda(App.fazendaId);
  const nome=document.getElementById("pd-nome").value.trim();
  if(!nome){ toast("Informe o nome do produto"); return; }
  const dup=produtosDe(f.id).some(p=>p.id!==id && p.nome.toLowerCase()===nome.toLowerCase());
  if(dup){ toast("Já existe um produto com esse nome"); return; }
  salvarProduto(f.id,{ nome, unidade:document.getElementById("pd-un").value,
    preco:parseFloat(String(document.getElementById("pd-preco").value).replace(",","."))||0 }, id);
  fecharModal(); toast(id?"Produto atualizado":"Produto cadastrado"); render();
}
function removerProduto(id){
  const f=acharFazenda(App.fazendaId);
  const p=produtosDe(f.id).find(x=>x.id===id); if(!p) return;
  const uso=aplicacoesDe(f.id).filter(a=>(a.itens||[]).some(i=>i.produto_id===id)).length;
  if(uso && !confirm('"'+p.nome+'" está em '+uso+' aplicação(ões).\nRemover mesmo assim?')) return;
  apagarProduto(f.id,id); toast("Produto removido"); render();
}

function exportarOperacoes(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const R=resumoOperacoes(f.id,_fTipo), tals=talhoesDe(f.id);
  if(!R.aplicacoes.length){ toast("Nenhuma aplicação para exportar"); return; }
  const nomeT=a=>(a.talhoes||[]).map(id=>{const t=tals.find(x=>x.id===id);return t?t.nome:"";}).join(", ");
  const linhas=[[(_fTipo||"Operações")+" · "+f.nome+" · safra "+f.safra]];
  linhas.push(["Data","Talhão","Tipo","Produto","Dose","Hectares","Qtd","Unidade","Valor unitário","Valor total","Obs"]);
  let total=0;
  R.aplicacoes.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")).forEach(a=>{
    linhasAplicacao(f.id,a).forEach(l=>{
      total+=l.valor;
      linhas.push([dataBR(a.data), nomeT(a), a.tipo, l.produto, vBR(l.dose),
        vBR(l.hectares), vBR(l.qtd.toFixed(2)), l.unidade,
        l.semPreco?"":vBR(l.preco.toFixed(2)), l.semPreco?"":vBR(l.valor.toFixed(2)), a.obs||""]);
    });
  });
  linhas.push([]);
  linhas.push(["Total geral","","","","","","","","",vBR(total.toFixed(2))]);
  baixarCSV(linhas,"operacoes-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

/* ── Planilhas ───────────────────────────── */
function baixarCSV(linhas, nome){
  const csv="\ufeff"+linhas.map(r=>r.map(v=>{
    const s=String(v==null?"":v);
    return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download=nome+".csv"; a.click(); URL.revokeObjectURL(a.href);
  toast("Planilha baixada");
}
const vBR = v => String(v==null?"":v).replace(".",",");

function exportarCargas(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const tals=talhoesDe(f.id);
  const nome=id=>{const t=tals.find(x=>x.id===id); return t?t.nome:"";};
  const l=[["Codigo","Data","Romaneio","Destino","Motorista","Placa","Bruto_kg","Tara_kg",
            "Liquido_kg","Umidade_fazenda_pc","Sacas_estimadas","Situacao","Data_baixa",
            "Umidade_armazem_pc","Sacas_confirmadas","Talhoes","Obs"]];
  cargasDe(f.id).slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")).forEach(c=>{
    const ok=cargaBaixada(c);
    l.push([c.codigo, dataBR(c.data), c.romaneio, c.destino, c.motorista, c.placa,
      vBR(c.peso_bruto), vBR(c.tara), vBR(c.liquido), vBR(c.umidade),
      vBR(Number(c.sacas||0).toFixed(2)), ok?"Baixada":"A caminho",
      ok?dataBR(c.baixa.data):"", ok?vBR(c.baixa.umidade):"",
      ok?vBR(c.baixa.sacas_final.toFixed(2)):"",
      (c.talhoes||[]).map(i=>nome(i.talhao_id)).join(" + "), c.obs]);
  });
  baixarCSV(l,"cargas-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

function exportarProdutividade(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const p=produtividade(f.id);
  const l=[["Talhao","Area_ha","Sacas_armazem","Silos","Sacas_silo","Total_sacas","sc_ha","Cargas"]];
  p.linhas.forEach(t=>l.push([t.nome, vBR(t.hectares.toFixed(2)), vBR(t.sacas.toFixed(2)),
    vBR(t.silos), vBR(t.sc_silo.toFixed(2)), vBR(t.total_sc.toFixed(2)),
    vBR(t.sc_ha.toFixed(2)), t.cargas]));
  l.push([]);
  l.push(["Area colhida", vBR(p.haColhida.toFixed(2))]);
  l.push(["Total colhido", vBR(p.totalSacas.toFixed(2))]);
  l.push(["Produtividade area colhida", vBR(p.prodColhida.toFixed(2))]);
  l.push(["Produtividade fazenda", vBR(p.prodFazenda.toFixed(2))]);
  baixarCSV(l,"produtividade-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

function semearPrimeiraVez(){
  if(Store.get("seed_feito", false)) return;
  Store.set("seed_feito", true);
  if(fazendas().length) return;
  const d = SEED_SANTA_ANGELINA;
  const f = criarFazenda({ nome:d.nome, produtor:d.produtor,
                           municipio:d.municipio, uf:d.uf });
  aplicarSeedSA(f.id);
  Store.set(kArmaz(f.id), SEED_ARMAZENS.slice());
  Store.set(kCam(f.id), SEED_CAMINHOES.map((r,i)=>({
    id:"cm_"+i, fazenda_id:f.id, placa:r[0], motorista:r[1] })));
}

render();
if(SUPABASE.ligado() && Auth.logado()) Sync.rodar();
setInterval(()=>{ if(navigator.onLine && Auth.logado()) Sync.rodar(); }, 60000);
window.addEventListener("online", ()=>{ Sync.rodar(); render(); });
window.addEventListener("offline", ()=>{ render(); });
/* Atualização automática: o navegador nunca serve o sw.js do
   cache, procura versão nova ao abrir e a cada minuto, e recarrega
   sozinho quando a nova assume. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let _recarregando = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(_recarregando) return;
    _recarregando = true;
    location.reload();
  });
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg=>{
    reg.update();
    setInterval(()=>reg.update(), 60000);
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "visible") reg.update();
    });
    reg.addEventListener("updatefound", ()=>{
      const nova = reg.installing;
      if(!nova) return;
      nova.addEventListener("statechange", ()=>{
        if(nova.state === "installed" && navigator.serviceWorker.controller)
          toast("Atualizando para a versão nova…");
      });
    });
  }).catch(()=>{});
}
