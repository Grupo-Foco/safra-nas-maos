<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Safra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#22392B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<title>Safra nas Mãos · FOCO Agropecuária</title>
<style>
:root{
  /* Identidade Grupo Foco — alinhada ao Gestão Financeira */
  --green:#22392B;        /* verde-floresta: barra, títulos */
  --green-mid:#394D41;    /* verde médio: botões sobre o escuro */
  --green-lt:#4F6B57;
  --gold:#C3A95A;         /* ouro: ação principal, estado ativo */
  --gold-dk:#A98F42;
  --gold-soft:#FDF3D1;
  --leaf:#7FA646;
  --leaf-dk:#4E8530;
  --leaf-soft:#EDF2E2;

  --bg:#F4F0E9;
  --card:#FAFAF7;
  --line:#E4DDCE;
  --line-soft:#EEEBE4;
  --text:#2C3A30;
  --muted:#7A8279;
  --red:#D65745;  --red-soft:#FAEDEA;
  --amber:#9A7226; --amber-soft:#FDF3D1;
  --blue:#4A7093; --blue-soft:#E9F0F5;
  --r:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg{display:block}

/* ── Barra superior ──────────────────────── */
.topbar{
  background:var(--green);color:#E8EDE6;
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px}
.brand .badge{
  background:#fff;border-radius:9px;padding:4px;width:36px;height:36px;flex:none;
  display:grid;place-items:center
}
.brand .badge svg{width:28px;height:28px}
.brand-txt{line-height:1.15}
.brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.02em;color:var(--gold)}
.brand-txt span{display:block;font-size:10px;letter-spacing:.13em;font-weight:600;color:#93A392}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.sync-chip{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:7px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  background:var(--green-mid);color:#C9D4C7
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#7CC46A}
.sync-chip.off{background:#4A4030;color:var(--gold)}
.sync-chip.off .sync-dot{background:var(--gold)}
.btn-ghost{
  background:var(--green-mid);border:1px solid rgba(255,255,255,.14);color:#DCE4DA;
  padding:6px 13px;border-radius:7px;font-family:var(--mono);font-size:12px;font-weight:600
}
.btn-ghost:hover{background:var(--green-lt);color:#fff}
.user-nome{font-family:var(--mono);font-size:12.5px;color:#B9C6B8}

/* ── Avisos ──────────────────────────────── */
.banner{padding:11px 16px;font-size:14px;text-align:center}
.banner.err{background:var(--red-soft);color:var(--red);border-bottom:1px solid #F0D6D0}
.banner.warn{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid #EFE0B8}

.wrap{max-width:900px;margin:0 auto;padding:22px 16px 44px}
.wrap-wide{max-width:1100px}

/* ── Tela de fazendas ────────────────────── */
.lbl{display:block;color:var(--green);font-size:12px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.field-lg{
  width:100%;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--r);background:#fff;font-size:16px;color:var(--text)
}
.field-lg::placeholder{color:#A8A99C}
.field-lg:focus{border-color:var(--gold);outline:none}
.btn-primary{
  width:100%;background:var(--gold);color:#3A3117;border:none;
  padding:15px;border-radius:var(--r);font-size:16px;font-weight:800;
  letter-spacing:.02em;margin-top:12px
}
.btn-primary:hover{background:var(--gold-dk);color:#2C2611}

.panorama{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-top:18px;
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--leaf);
  border-radius:var(--r);padding:15px 17px;color:var(--muted);font-size:13.5px;line-height:1.5
}
.panorama b{font-size:15px;display:block;margin-bottom:3px;color:var(--green)}
.panorama:hover{border-color:var(--gold);border-left-color:var(--leaf)}
.panorama svg{width:22px;height:22px;flex:none;margin-top:2px;color:var(--leaf-dk)}

.farm-card{
  display:flex;align-items:center;gap:12px;width:100%;
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);
  border-radius:var(--r);padding:15px 17px;margin-top:11px
}
.farm-card:hover{border-color:var(--gold);border-left-color:var(--gold);
  box-shadow:0 1px 8px rgba(34,57,43,.08)}
.farm-card h3{color:var(--green);font-size:17px;font-weight:800;margin-bottom:3px}
.farm-card p{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.farm-card .chev{margin-left:auto;color:var(--gold);font-size:24px;font-weight:700;cursor:pointer}
.farm-card .del{margin-left:8px;background:none;border:none;color:#CFCABD;font-size:17px;padding:4px 6px}
.farm-card .del:hover{color:var(--red)}

.empty{
  text-align:center;padding:38px 22px;color:var(--muted);
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r);margin-top:18px
}
.empty strong{display:block;color:var(--green);font-size:16px;font-weight:800;margin-bottom:7px}
.ver{text-align:center;color:#AFAA9D;font-size:11.5px;font-family:var(--mono);margin-top:30px}

/* ── Cabeçalho da fazenda ────────────────── */
.farm-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;padding:20px 0 22px}
.btn-back{
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:9px 14px;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--green)
}
.btn-back:hover{border-color:var(--gold);background:#fff}
.farm-head-mid h1{color:var(--green);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.farm-head-mid p{color:var(--muted);font-size:13px;font-family:var(--mono);margin-top:5px}
.safra-box{margin-left:auto;text-align:right}
.safra-box label{display:block;color:var(--muted);font-size:10.5px;font-family:var(--mono);
  font-weight:700;letter-spacing:.1em;margin-bottom:3px}
.safra-box select{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:7px 11px;font-size:17px;font-weight:800;color:var(--green);font-family:var(--mono)
}
.safra-box select:focus{border-color:var(--gold);outline:none}

/* ── Destaques ───────────────────────────── */
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.hero{text-align:left;border-radius:13px;padding:21px;background:var(--card);
  border:1px solid var(--line);border-top:4px solid}
.hero .ic{display:block;margin-bottom:12px}
.hero .ic svg{width:28px;height:28px}
.hero h2{font-size:19px;font-weight:800;color:var(--green);margin-bottom:5px;letter-spacing:-.01em}
.hero p{font-size:13px;line-height:1.45;color:var(--muted)}
.hero-leaf{border-top-color:var(--leaf)}
.hero-leaf .ic{color:var(--leaf-dk)}
.hero-earth{border-top-color:var(--gold)}
.hero-earth .ic{color:var(--gold-dk)}
.hero:hover{border-color:var(--gold);box-shadow:0 2px 12px rgba(34,57,43,.08)}
.hero-leaf:hover{border-top-color:var(--leaf)}
.hero-earth:hover{border-top-color:var(--gold)}

/* ── Seções e módulos ────────────────────── */
.sec-head{display:flex;align-items:center;gap:14px;margin:28px 0 15px}
.sec-head span{color:var(--green);font-family:var(--mono);font-size:11.5px;
  font-weight:700;letter-spacing:.12em;white-space:nowrap}
.sec-head i{flex:1;height:1px;background:var(--line)}

.mods{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mod{
  text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:17px;position:relative
}
.mod:hover{border-color:var(--gold);box-shadow:0 2px 12px rgba(34,57,43,.07)}
.mod .ic{
  width:42px;height:42px;border-radius:10px;background:var(--leaf-soft);
  display:grid;place-items:center;margin-bottom:13px;color:var(--green)
}
.mod .ic svg{width:22px;height:22px}
.mod h3{color:var(--green);font-size:16px;font-weight:800;margin-bottom:4px}
.mod p{color:var(--muted);font-size:12.5px;line-height:1.4}
.mod .tag{
  position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:9.5px;
  font-weight:700;padding:3px 7px;border-radius:5px;letter-spacing:.06em
}
.tag-soon{background:var(--line-soft);color:#9B9587}
.tag-ready{background:var(--gold-soft);color:var(--amber)}

/* ── Indicadores ─────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--leaf);
  border-radius:11px;padding:15px 17px}
.kpi:nth-child(2){border-left-color:var(--gold)}
.kpi:nth-child(3){border-left-color:var(--green-lt)}
.kpi-rot{display:block;color:var(--muted);font-family:var(--mono);font-size:10.5px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.kpi-val{display:block;color:var(--green);font-size:24px;font-weight:800;
  letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-val i{font-style:normal;font-size:12.5px;font-weight:600;color:var(--muted);font-family:var(--mono)}

/* ── Ações ───────────────────────────────── */
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.btn-act{background:var(--card);border:1px solid var(--line);color:var(--green);
  border-radius:9px;padding:10px 16px;font-family:var(--mono);font-size:12.5px;font-weight:700}
.btn-act:hover{border-color:var(--gold);background:#fff}
.btn-act.primary{background:var(--gold);border-color:var(--gold);color:#3A3117}
.btn-act.primary:hover{background:var(--gold-dk)}
.busca{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);
  border-radius:9px;background:#fff;font-size:14px;color:var(--text)}
.busca:focus{border-color:var(--gold);outline:none}

/* ── Lista de talhões ────────────────────── */
.tal-list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tal{display:grid;grid-template-columns:4px 1fr auto auto;align-items:center;gap:14px;
  padding:13px 17px;border-bottom:1px solid var(--line-soft)}
.tal:last-child{border-bottom:none}
.tal:hover{background:#fff}
.tal-bar{width:4px;height:34px;background:var(--line-soft);border-radius:3px;overflow:hidden;
  display:flex;align-items:flex-end}
.tal-bar i{display:block;width:100%;background:var(--leaf);border-radius:3px;height:100%}
.tal-nome{color:var(--green);font-size:15px;font-weight:700;min-width:0}
.pill{display:inline-block;margin-left:8px;background:var(--gold-soft);color:var(--amber);
  font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
  vertical-align:middle;letter-spacing:.03em}
.tal-ha{color:var(--green);font-size:15.5px;font-weight:800;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-family:var(--mono)}
.tal-ha span{color:var(--muted);font-size:11px;font-weight:600}
.tal-acts{display:flex;gap:6px}
.tal-acts button{background:none;border:1px solid var(--line);border-radius:7px;
  padding:6px 11px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted)}
.tal-acts button:hover{border-color:var(--gold);color:var(--green)}
.tal-acts .rm:hover{border-color:var(--red);color:var(--red)}

/* ── Modal ───────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(34,57,43,.55);display:flex;
  align-items:center;justify-content:center;padding:16px;z-index:200}
.modal{background:var(--card);border-radius:14px;padding:23px;width:100%;max-width:440px;
  max-height:88vh;overflow-y:auto;border-top:4px solid var(--gold)}
.modal h2{color:var(--green);font-size:19px;font-weight:800;margin-bottom:5px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:19px}
.frm{display:flex;flex-direction:column;gap:13px}
.frm label{display:block;color:var(--green);font-family:var(--mono);font-size:11px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.frm input,.frm select{width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--text);font-size:15px}
.frm input:focus,.frm select:focus{border-color:var(--gold);outline:none}
.modal-acts{display:flex;gap:10px;margin-top:21px}
.modal-acts button{flex:1;padding:12px;border-radius:9px;font-size:14px;font-weight:800;border:none}
.btn-cancel{background:var(--line-soft);color:var(--muted)}
.btn-cancel:hover{background:#E5E1D7}
.btn-save{background:var(--gold);color:#3A3117}
.btn-save:hover{background:var(--gold-dk)}

#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom));background:var(--green);color:#EDF1EB;
  padding:12px 21px;border-radius:9px;font-size:14px;font-weight:600;z-index:300;
  display:none;max-width:90vw;text-align:center;box-shadow:0 4px 18px rgba(34,57,43,.3)}

.stub{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);
  border-radius:14px;padding:42px 24px;text-align:center;margin-top:20px}
.stub .ic{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:16px;
  background:var(--leaf-soft);color:var(--green);margin-bottom:17px}
.stub .ic svg{width:30px;height:30px}
.stub h2{color:var(--green);font-size:21px;font-weight:800;margin-bottom:9px}
.stub p{color:var(--muted);font-size:14px;max-width:430px;margin:0 auto 21px;line-height:1.55}

/* ── Colheita: abas ──────────────────────── */
.abas{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.ab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;
  padding:11px 15px;font-family:var(--mono);font-size:12.5px;font-weight:700;
  color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.ab:hover{color:var(--green)}
.ab.on{color:var(--green);border-bottom-color:var(--gold)}
.ab b{background:var(--line-soft);color:var(--muted);font-size:10px;padding:2px 6px;border-radius:5px;font-weight:700}
.ab.on b{background:var(--gold-soft);color:var(--amber)}
.kpis-4{grid-template-columns:repeat(4,1fr)}
.kpis-4 .kpi:nth-child(4){border-left-color:var(--gold)}
.sel-f{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;
  font-family:var(--mono);font-size:12.5px;color:var(--green)}
.sel-f:focus{border-color:var(--gold);outline:none}

/* ── Tabela ──────────────────────────────── */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:var(--line-soft);color:var(--green);font-family:var(--mono);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-align:left;
  padding:10px 13px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#fff}
.tbl .num{text-align:right}
.tbl .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.tbl .forte{font-weight:800;color:var(--green)}
.tbl .alerta{color:var(--red);font-weight:700}
.tbl tr.pendente td{opacity:.5}
.tagdest{background:var(--leaf-soft);color:var(--green);font-family:var(--mono);font-size:10.5px;
  font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap}
.tal-col{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted);font-size:12.5px}
.acoes{display:flex;gap:6px;justify-content:flex-end}
.acoes button{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 10px;
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
.acoes button:hover{border-color:var(--gold);color:var(--green)}
.acoes .rm:hover{border-color:var(--red);color:var(--red)}
.sc-ha{font-weight:800}
.sc-ha.bom{color:var(--leaf-dk)}
.sc-ha.baixo{color:var(--red)}
input.silo{width:62px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;
  background:#fff;font-family:var(--mono);font-size:12.5px;text-align:center;color:var(--green)}
input.silo:focus{border-color:var(--gold);outline:none}

/* ── Resumo ──────────────────────────────── */
.resumo{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);
  border-radius:12px;padding:19px;margin-top:18px}
.resumo-t{color:var(--green);font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;margin-bottom:14px}
.resumo-g{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.rl{display:flex;flex-direction:column;gap:3px;padding:11px 13px;background:var(--bg);border-radius:9px}
.rl span{color:var(--muted);font-size:11.5px}
.rl b{color:var(--green);font-family:var(--mono);font-size:16px;font-weight:800;
  font-variant-numeric:tabular-nums}
.rl.forte{background:var(--gold-soft)}
.rl.forte b{color:var(--amber);font-size:19px}
.resumo-obs{color:var(--muted);font-size:12px;margin-top:13px;line-height:1.5}

/* ── Modal de carga ──────────────────────── */
.modal-lg{max-width:600px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.calc{display:flex;flex-wrap:wrap;gap:9px;background:var(--bg);border-radius:9px;padding:13px}
.calc span{display:flex;flex-direction:column;gap:2px;min-width:88px}
.calc i{font-style:normal;color:var(--muted);font-size:10.5px;font-family:var(--mono);
  letter-spacing:.05em;text-transform:uppercase}
.calc b{color:var(--green);font-family:var(--mono);font-size:14.5px;font-weight:800;
  font-variant-numeric:tabular-nums}
.calc b.neg{color:var(--red)}
.calc b.ok{color:var(--leaf-dk)}
.calc .nota{flex-basis:100%;color:var(--muted);font-size:11.5px;min-width:0}
.item{display:grid;grid-template-columns:1fr 130px 34px;gap:8px;margin-bottom:8px;align-items:center}
.item select,.item input{padding:10px 11px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-size:14px;color:var(--text);width:100%}
.item select:focus,.item input:focus{border-color:var(--gold);outline:none}
.item button{background:none;border:1px solid var(--line);border-radius:8px;padding:9px;
  color:var(--muted);font-size:13px}
.item button:hover{border-color:var(--red);color:var(--red)}
.btn-mini{background:none;border:1px dashed var(--line);border-radius:8px;padding:8px 13px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted)}
.btn-mini:hover{border-color:var(--gold);color:var(--green)}
.dica{color:var(--muted);font-size:11.5px;margin-top:6px}

/* ── Cadastros ───────────────────────────── */

.chip button:hover{color:var(--red)}
.lista-cam{display:flex;flex-direction:column}

  padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}

.dq:hover{border-color:var(--gold)}
.dq.tem{background:var(--blue-soft);border-color:#C9DCEA}
.dq.tem i{color:var(--blue)}
.dq.sel{background:var(--green);border-color:var(--green)}
.dq.sel i,.dq.sel u{color:#fff}

/* lançamento do dia */
.lanc{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--blue);

.lp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;

.lp-in{display:flex;align-items:center;gap:7px}
.lp-in input{width:96px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-family:var(--mono);font-size:15px;text-align:right;color:var(--green)}
.lp-in input:focus{border-color:var(--blue);outline:none}
.lp-in span{color:var(--muted);font-family:var(--mono);font-size:12px;width:20px}

/* grade mensal */
.grade table{font-size:12.5px}
.grade th.fix,.grade td.fix{position:sticky;left:0;background:var(--line-soft);z-index:2;

.grade tbody td.fix{background:var(--card)}
.grade tr.molhado td.fix{background:var(--blue-soft);color:var(--blue)}

.grade .tot{background:var(--gold-soft);font-weight:800;color:var(--amber)}

.grade tfoot td.tot{background:var(--gold);color:#3A3117}

.dsc-in{display:grid;grid-template-columns:1fr 1.15fr;gap:6px}
.dsc-c{position:relative;display:block}

  border-radius:8px;background:#fff;font-family:var(--mono);font-size:14px;
  text-align:right;color:var(--green)}

input.lv-s{font-family:var(--mono);text-align:center;max-width:80px}

@media(max-width:640px){
  body{font-size:14.5px}
  .wrap{padding:16px 12px 34px}
  .heroes,.mods{grid-template-columns:1fr;gap:12px}

}

    const q = this.queue();
    if(!q.length){ this.render(); return; }
    if(!SUPABASE.enabled()){ this.render(); return; }
    const restantes = [];
    for(const item of q){
      try{
        const method = item.op === "delete" ? "DELETE" : "POST";
        const r = await fetch(SUPABASE.url+"/rest/v1/"+item.table, {
          method,
          headers:{ "apikey":SUPABASE.anonKey, "Authorization":"Bearer "+SUPABASE.anonKey,
                    "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates" },
          body: method==="DELETE" ? undefined : JSON.stringify(item.payload)
        });
        if(!r.ok) restantes.push(item);
      }catch(e){ restantes.push(item); }
    }
    Store.set("sync_queue", restantes);
    this.render();
    if(!restantes.length && q.length) toast("Tudo sincronizado na nuvem");
  },
  render(){
    const el = document.getElementById("sync-chip");
    if(!el) return;
    const n = this.pending(), on = navigator.onLine;
    if(on && !n){ el.className="sync-chip";
      el.innerHTML='<span class="sync-dot"></span> Sincronizado na nuvem'; }
    else if(!on){ el.className="sync-chip off";
      el.innerHTML='<span class="sync-dot"></span> Sem sinal'+(n?" · "+n+" a enviar":""); }
    else { el.className="sync-chip off";
      el.innerHTML='<span class="sync-dot"></span> '+n+" a enviar"; }
  }
};
window.addEventListener("online",  ()=>{ Sync.flush(); render(); });
window.addEventListener("offline", ()=>{ render(); });

/* Lançamento: só o peso da balança da fazenda.
   A umidade daqui é referência — quem desconta é o armazém, na baixa. */
function calcCarga(c){
  const bruto = Number(c.peso_bruto)||0;
  const tara  = Number(c.tara)||0;
  const liq   = Math.max(0, bruto - tara);
  return { liquido:liq, sacas:liq/SACA_KG };
}

function proximoCodigo(f){

/* ═══════════════════════════════════════════════════
   BAIXA DA CARGA
   A carga sai da fazenda com o peso da balança. Só vira
   produtividade quando volta o romaneio do armazém, com
   os descontos reais de umidade, impureza e avariados.
   ═══════════════════════════════════════════════════ */
const BASE_PADRAO = { umidade:14, impureza:1, avariados:6 };
function kBases(f){ return "faz_"+f+"_bases"; }
function basesDe(f){ return Store.get(kBases(f), BASE_PADRAO); }

/* Desconto: o kg vale o que veio no romaneio. A fórmula só
   sugere quando o campo está vazio — cada armazém tem sua regra. */
function sugerirDesc(tipo, liq, pct, bases){
  const p = Number(pct)||0;
  if(tipo==="umidade"){
    const b = Number(bases.umidade);
    return p > b ? Math.round(liq * ((p-b)/(100-p))) : 0;
  }
  const b = Number(tipo==="impureza" ? bases.impureza : bases.avariados);
  return p > b ? Math.round(liq * (p-b)/100) : 0;
}

function calcBaixa(b){
  const liq   = Number(b.liquido)||0;
  const dUmid = Math.max(0, Number(b.desc_umidade)||0);
  const dImp  = Math.max(0, Number(b.desc_impureza)||0);
  const dAvar = Math.max(0, Number(b.desc_avariados)||0);
  const final = Math.max(0, liq - dUmid - dImp - dAvar);
  return { desc_umidade:dUmid, desc_impureza:dImp, desc_avariados:dAvar,
           desc_total:dUmid+dImp+dAvar, peso_final:final, sacas_final:final/SACA_KG };
}

function cargaBaixada(c){ return !!(c.baixa && c.baixa.data); }
function sacasValidas(c){ return cargaBaixada(c) ? c.baixa.sacas_final : 0; }

function darBaixa(f, id, dados){
  const l = cargasDe(f), i = l.findIndex(x=>x.id===id);
  if(i<0) return null;
  const calc = calcBaixa(dados);
  l[i].baixa = Object.assign({}, dados, calc);
  l[i].status = "baixada";
  Store.set(kCargas(f), l);
  Sync.push("cargas","upsert",l[i]);
  return l[i];
}
function desfazerBaixa(f, id){
  const l = cargasDe(f), i = l.findIndex(x=>x.id===id);
  if(i<0) return;
  delete l[i].baixa; l[i].status = "transito";
  Store.set(kCargas(f), l);
  Sync.push("cargas","upsert",l[i]);
}

/* Descontos acumulados da safra, por tipo e por destino */
function resumoDescontos(f){
  const l = cargasDe(f).filter(cargaBaixada);
  const tot = { umidade:0, impureza:0, avariados:0, total:0,
                bruto:0, final:0, cargas:l.length };
  const porDestino = {};
  l.forEach(c=>{
    const b=c.baixa;
    tot.umidade   += b.desc_umidade;
    tot.impureza  += b.desc_impureza;
    tot.avariados += b.desc_avariados;
    tot.total     += b.desc_total;
    tot.bruto     += Number(b.liquido)||0;
    tot.final     += b.peso_final;
    const d=c.destino||"—";
    if(!porDestino[d]) porDestino[d]={destino:d,cargas:0,bruto:0,umidade:0,impureza:0,avariados:0,total:0,final:0};
    const p=porDestino[d];
    p.cargas++; p.bruto+=Number(b.liquido)||0;
    p.umidade+=b.desc_umidade; p.impureza+=b.desc_impureza;
    p.avariados+=b.desc_avariados; p.total+=b.desc_total; p.final+=b.peso_final;
  });
  tot.pct = tot.bruto>0 ? tot.total/tot.bruto*100 : 0;
  return { tot, porDestino:Object.values(porDestino).sort((a,b)=>b.total-a.total) };
}

/* Produtividade: rateia as sacas de cada carga entre os talhões dela */
function produtividade(f){
  const tals = talhoesDe(f);
  const cap  = siloCap(f);
  const mapa = {};
  tals.forEach(t => mapa[t.id] = {
    id:t.id, nome:t.nome, hectares:t.hectares,
    sacas:0, cargas:0, silos:Number(t.silo)||0
  });

  // Só entra na produtividade a carga já baixada no armazém.
  cargasDe(f).filter(cargaBaixada).forEach(c=>{
    const itens = (c.talhoes||[]).filter(i=>mapa[i.talhao_id]);
    if(!itens.length) return;
    const somaKg = itens.reduce((s,i)=>s+(Number(i.kg)||0),0);
    const sc = c.baixa.sacas_final;
    itens.forEach(i=>{
      const frac = somaKg>0 ? (Number(i.kg)||0)/somaKg : 1/itens.length;
      mapa[i.talhao_id].sacas  += sc * frac;
      mapa[i.talhao_id].cargas += 1;
    });
  });

  const linhas = Object.values(mapa).map(t=>{
    const scSilo = t.silos * cap;
    const total  = t.sacas + scSilo;
    return Object.assign(t,{ sc_silo:scSilo, total_sc:total,
      sc_ha: t.hectares>0 ? total/t.hectares : 0,
      colhido: t.cargas>0 || t.silos>0 });
  });
  linhas.sort((a,b)=>b.sc_ha-a.sc_ha || a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));

  const colhidos = linhas.filter(l=>l.colhido);
  const haColh = colhidos.reduce((s,l)=>s+l.hectares,0);
  const scTot  = linhas.reduce((s,l)=>s+l.total_sc,0);
  const haTot  = linhas.reduce((s,l)=>s+l.hectares,0);
  return { linhas, colhidos,
    sacasArmazem: linhas.reduce((s,l)=>s+l.sacas,0),
    sacasSilo: linhas.reduce((s,l)=>s+l.sc_silo,0),
    totalSacas: scTot, haColhida: haColh, haTotal: haTot,
    prodColhida: haColh>0 ? scTot/haColh : 0,
    prodFazenda: haTot>0 ? scTot/haTot : 0 };
}

function definirSilo(f, talhaoId, qtd){
  const l = talhoesDe(f), t = l.find(x=>x.id===talhaoId);
  if(!t) return;
  t.silo = Number(qtd)||0;

/* ═══════════════════════════════════════════════════
   PLUVIOMETRIA — dias x pontos de medição
   Cada ponto é um pluviômetro. Pode cobrir um talhão
   ou um grupo deles ("Pivôs", "T1 T2").
   ═══════════════════════════════════════════════════ */
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
               "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function kPontos(f){ return "faz_"+f+"_pontos"; }
function kChuva(f){ return "faz_"+f+"_chuva"; }
function pontosDe(f){ return Store.get(kPontos(f), []); }
function chuvaDe(f){ return Store.get(kChuva(f), {}); }

/* A safra vai de outubro do 1º ano a setembro do 2º */
function mesesDaSafra(safra){
  const a = parseInt(String(safra).slice(0,4),10);
  const out = [];
  for(let m=9;m<12;m++) out.push({ano:a, mes:m});
  for(let m=0;m<9;m++) out.push({ano:a+1, mes:m});
  return out;
}
function diasNoMes(ano,mes){ return new Date(ano,mes+1,0).getDate(); }
function chaveDia(ano,mes,dia){
  return ano+"-"+String(mes+1).padStart(2,"0")+"-"+String(dia).padStart(2,"0");
}

/* Dias com chuva na safra, em ordem — é assim que a fazenda registra:
   só entra a linha do dia que choveu. */
function diasDeChuva(f, safra){
  const meses = mesesDaSafra(safra), todo = chuvaDe(f);
  const ini = chaveDia(meses[0].ano, meses[0].mes, 1);
  const ult = meses[meses.length-1];
  const fim = chaveDia(ult.ano, ult.mes, diasNoMes(ult.ano,ult.mes));
  return Object.keys(todo).filter(k=>k>=ini && k<=fim).sort();
}
const MES_ABREV = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function diaCurto(k){
  const p = String(k).split("-");
  return p[2]+"/"+MES_ABREV[parseInt(p[1],10)-1];
}

function lerChuva(f,dia,pontoId){
  const d = chuvaDe(f)[dia];
  return d && d[pontoId] != null ? Number(d[pontoId]) : null;
}
function gravarChuva(f,dia,pontoId,mm){
  const todo = chuvaDe(f);
  const v = (mm===""||mm==null) ? null : Number(String(mm).replace(",","."));
  if(!todo[dia]) todo[dia] = {};
  if(v==null || isNaN(v) || v<0) delete todo[dia][pontoId];
  else todo[dia][pontoId] = v;
  if(!Object.keys(todo[dia]).length) delete todo[dia];
  Store.set(kChuva(f), todo);
  Sync.push("chuva","upsert",{fazenda_id:f, dia:dia, ponto_id:pontoId, mm:v});
}

/* Totais do mês: por ponto, por dia e geral */
function resumoMes(f, ano, mes){
  const pts = pontosDe(f), nd = diasNoMes(ano,mes), todo = chuvaDe(f);
  const porPonto = {}, porDia = {};
  let geral = 0, diasComChuva = 0;
  pts.forEach(p=>porPonto[p.id]=0);
  for(let d=1; d<=nd; d++){
    const k = chaveDia(ano,mes,d), reg = todo[k] || {};
    let soma = 0, n = 0;
    pts.forEach(p=>{
      const v = reg[p.id];
      if(v!=null){ soma += v; n++; porPonto[p.id] += v; }
    });
    porDia[d] = { soma, n, media: n ? soma/n : 0 };
    if(n) diasComChuva++;
    geral += soma;
  }
  const medias = pts.map(p=>porPonto[p.id]);
  return { porPonto, porDia, geral, diasComChuva, nd,
           mediaPontos: medias.length ? medias.reduce((a,b)=>a+b,0)/medias.length : 0 };
}

function acumuladoSafra(f, safra){
  const pts = pontosDe(f);
  const por = {}; pts.forEach(p=>por[p.id]=0);
  let total = 0;
  mesesDaSafra(safra).forEach(({ano,mes})=>{
    const r = resumoMes(f,ano,mes);
    pts.forEach(p=>por[p.id]+=r.porPonto[p.id]||0);
    total += r.geral;
  });
  return { porPonto:por, total,
           media: pts.length ? total/pts.length : 0 };
}


/* ═══════════════════════════════════════════════════

   Uma aplicação = data + área + tipo + a calda de

function aplicacoesDe(f){ return Store.get(kApl(f), []); }

function salvarProduto(f, d, id){
  const l = produtosDe(f);
  if(id){
    const p = l.find(x=>x.id===id); if(!p) return null;
    Object.assign(p,{nome:d.nome.trim(), unidade:d.unidade, preco:Number(d.preco)||0});

  l.push(novo); Store.set(kProd(f),l); Sync.push("produtos","upsert",novo);

}
function apagarProduto(f,id){

  Sync.push("produtos","delete",{id});
}

/* Linhas da aplicação: uma por produto, como no relatório */
function linhasAplicacao(f, a){
  const ha = Number(a.hectares)||0;
  return (a.itens||[]).map(i=>{
    const p = acharProduto(f, i.produto_id);
    const dose = Number(i.dose)||0;
    const qtd  = dose * ha;
    const preco = p ? Number(p.preco)||0 : 0;
    return { produto: p?p.nome:"(removido)", unidade: p?p.unidade:"L",
             dose, hectares:ha, qtd, preco, valor: qtd*preco, semPreco: preco<=0 };
  });
}
function custoAplicacao(f,a){
  return linhasAplicacao(f,a).reduce((s,l)=>s+l.valor,0);
}

function salvarAplicacao(f, d, id){
  const l = aplicacoesDe(f);
  const dados = { data:d.data, tipo:d.tipo, talhoes:d.talhoes||[],
                  hectares:Number(d.hectares)||0, obs:(d.obs||"").trim(),
                  itens:(d.itens||[]).filter(i=>i.produto_id && Number(i.dose)>0) };
  if(id){
    const i = l.findIndex(x=>x.id===id); if(i<0) return null;
    l[i] = Object.assign({}, l[i], dados);
    Store.set(kApl(f),l); Sync.push("aplicacoes","upsert",l[i]); return l[i];
  }
  const nova = Object.assign({ id:"ap_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, criado_em:new Date().toISOString() }, dados);
  l.push(nova); Store.set(kApl(f),l); Sync.push("aplicacoes","upsert",nova);
  return nova;
}
function apagarAplicacao(f,id){
  Store.set(kApl(f), aplicacoesDe(f).filter(a=>a.id!==id));
  Sync.push("aplicacoes","delete",{id});
}

/* Resumo: custo total, por tipo, por produto e por talhão */
function resumoOperacoes(f, tipo){
  let aps = aplicacoesDe(f);
  if(tipo) aps = aps.filter(a=>a.tipo===tipo);
  const porProduto = {}, porTipo = {}, porTalhao = {};
  let total = 0, haAplicada = 0, semPreco = 0;

  aps.forEach(a=>{
    const custo = custoAplicacao(f,a);
    total += custo;
    haAplicada += Number(a.hectares)||0;
    porTipo[a.tipo] = (porTipo[a.tipo]||0) + custo;
    linhasAplicacao(f,a).forEach(l=>{
      if(l.semPreco) semPreco++;
      if(!porProduto[l.produto]) porProduto[l.produto]={nome:l.produto,unidade:l.unidade,qtd:0,valor:0,aplic:0};
      const p=porProduto[l.produto];
      p.qtd+=l.qtd; p.valor+=l.valor; p.aplic++;
    });
    const n = (a.talhoes||[]).length || 1;
    (a.talhoes||[]).forEach(tid=>{
      if(!porTalhao[tid]) porTalhao[tid]={talhao_id:tid,valor:0,aplic:0};
      porTalhao[tid].valor += custo/n;
      porTalhao[tid].aplic++;
    });
  });

  return { aplicacoes:aps, total, haAplicada, semPreco,
    custoHa: haAplicada>0 ? total/haAplicada : 0,
    porProduto: Object.values(porProduto).sort((a,b)=>b.valor-a.valor),
    porTipo, porTalhao };
}

const moeda = v => "R$ " + Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});


/* ═══════════════════════════════════════════════════
   DADOS DA LAVOURA — plantio por talhão
   Variedade, sementes por metro e janela de plantio.
   ═══════════════════════════════════════════════════ */
function kLavoura(f){ return "faz_"+f+"_lavoura"; }
function lavouraDe(f){ return Store.get(kLavoura(f), {}); }

function plantioDe(f, talId){
  const l = lavouraDe(f)[talId];
  return l || { variedade:"", area:null, sementes:"", inicio:"", fim:"" };
}
function salvarPlantio(f, talId, campo, valor){
  const todo = lavouraDe(f);
  if(!todo[talId]) todo[talId] = { variedade:"", area:null, sementes:"", inicio:"", fim:"" };
  todo[talId][campo] = valor;
  const p = todo[talId];
  const vazio = !p.variedade && p.area==null && !p.sementes && !p.inicio && !p.fim;
  if(vazio) delete todo[talId];
  Store.set(kLavoura(f), todo);
  Sync.push("lavoura","upsert",{fazenda_id:f, talhao_id:talId, ...todo[talId]});
}

function resumoLavoura(f){
  const tals = talhoesDe(f).slice()
    .sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
  const linhas = tals.map(t=>{
    const p = plantioDe(f,t.id);
    const area = p.area!=null && p.area!=="" ? Number(p.area) : t.hectares;
    const plantado = !!(p.variedade || p.inicio);
    let dias = null;
    if(p.inicio && p.fim){
      const d = (new Date(p.fim+"T12:00:00") - new Date(p.inicio+"T12:00:00"))/86400000;
      if(!isNaN(d) && d>=0) dias = Math.round(d)+1;
    }
    return { id:t.id, nome:t.nome, hectares:t.hectares, area,
             variedade:p.variedade||"", sementes:p.sementes||"",
             inicio:p.inicio||"", fim:p.fim||"", dias, plantado };
  });
  const plantadas = linhas.filter(l=>l.plantado);
  const vars = {};
  plantadas.forEach(l=>{
    const v = l.variedade.trim() || "—";
    vars[v] = (vars[v]||0) + l.area;
  });
  const datas = plantadas.map(l=>l.inicio).filter(Boolean).sort();
  const fins  = plantadas.map(l=>l.fim).filter(Boolean).sort();
  return { linhas, plantadas,
    areaPlantada: plantadas.reduce((s,l)=>s+l.area,0),
    areaTotal: linhas.reduce((s,l)=>s+l.area,0),
    variedades: Object.entries(vars).map(([nome,area])=>({nome,area}))
                  .sort((a,b)=>b.area-a.area),
    inicio: datas[0]||"", fim: fins[fins.length-1]||"" };
}

function salvarTalhao(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const nome = document.getElementById("t-nome").value.trim();
  const ha   = parseFloat(String(document.getElementById("t-ha").value).replace(",","."))||0;
  const ab   = parseFloat(String(document.getElementById("t-ab").value).replace(",","."))||0;
  if(!nome){ toast("Informe o nome do talhão"); return; }
  if(ha<=0){ toast("Informe a área em hectares"); return; }
  if(ab>ha){ toast("A área nova não pode ser maior que a área do talhão"); return; }

  const jaExiste = talhoesDe(f.id).some(t =>
    t.id!==id && t.nome.toLowerCase()===nome.toLowerCase());
  if(jaExiste){ toast("Já existe um talhão com esse nome"); return; }

  if(id) editarTalhao(f.id,id,{nome,hectares:ha,abertura:ab});
  else   novoTalhao(f.id,{nome,hectares:ha,abertura:ab});
  fecharModal(); toast(id?"Talhão atualizado":"Talhão cadastrado"); render();
}

function removerTalhao(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const t = talhoesDe(f.id).find(x=>x.id===id); if(!t) return;
  if(!confirm('Remover o talhão "'+t.nome+'"?')) return;
  apagarTalhao(f.id,id); toast("Talhão removido"); render();
}

function exportarTalhoes(){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const l = talhoesDe(f.id).slice()
    .sort((a,z)=>a.nome.localeCompare(z.nome,"pt-BR",{numeric:true}));
  const linhas = [["Talhao","Area_ha","Area_nova_ha"]]
    .concat(l.map(t=>[t.nome, String(t.hectares).replace(".",","), String(t.abertura||0).replace(".",",")]));
  const csv = "\ufeff"+linhas.map(r=>r.map(v=>{
    const s=String(v); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download = "talhoes-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Planilha baixada");
}

/* ═══════════════════════════════════════════════════
   TELA — Colheita
   ═══════════════════════════════════════════════════ */
let _abaColh = "cargas";
let _fCarga  = { destino:"", talhao:"", busca:"" };

const nf = (v,d=2)=>Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const n0 = v=>Number(v||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const dataBR = s=>{ if(!s) return "—"; const p=String(s).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : s; };

function telaColheita(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const cargas = cargasDe(f.id);
  const p = produtividade(f.id);

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
       '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
       '<div class="farm-head-mid"><h1>Colheita</h1>'+
       '<p>Cargas, produtividade e silo bolsa · safra '+esc(f.safra)+'</p></div></div>';

  const emTransito = cargas.filter(x=>!cargaBaixada(x)).length;
  h += '<div class="kpis kpis-4">'+
    kpi("Cargas", n0(cargas.length), emTransito ? emTransito+" a baixar" : "todas baixadas") +
    kpi("Sacas confirmadas", nf(p.totalSacas,0), "sc") +
    kpi("Área colhida", nf(p.haColhida,1), "ha") +
    kpi("Produtividade", nf(p.prodColhida,2), "sc/ha") +
  '</div>';

  h += '<div class="abas">'+
    aba("cargas","Cargas", cargas.length)+
    aba("prod","Produtividade", p.colhidos.length)+
    aba("desc","Descontos", cargas.filter(cargaBaixada).length)+
    aba("cad","Armazéns e caminhões", armazensDe(f.id).length+caminhoesDe(f.id).length)+
  '</div>';

  if(_abaColh==="cargas")    h += abaCargas(f, cargas);
  else if(_abaColh==="prod") h += abaProdutividade(f, p);
  else if(_abaColh==="desc") h += abaDescontos(f);
  else                       h += abaCadastros(f);

  return h+'</div>';
}

function aba(id, rot, n){
  return '<button class="ab'+(_abaColh===id?' on':'')+'" onclick="_abaColh=\''+id+'\';render()">'+
         esc(rot)+(n?'<b>'+n+'</b>':'')+'</button>';
}

/* ── Aba: cargas ─────────────────────────── */
/* Umidade da fazenda ao lado da do armazém — o comparativo que interessa */
function umidCompara(c){
  const uf = Number(c.umidade)||0;
  if(!cargaBaixada(c)) return uf ? nf(uf,1)+"%" : "—";
  const ua = Number(c.baixa.umidade)||0;
  const d  = ua - uf;
  const cor = Math.abs(d) >= 1.5 ? " alerta" : "";
  return (uf?nf(uf,1):"—")+" <u class="+JSON.stringify("cmp"+cor)+">"+
         (d>0?"+":"")+nf(d,1)+"</u> "+nf(ua,1)+"%";
}

function abaCargas(f, cargas){
  const tals = talhoesDe(f.id);
  if(!armazensDe(f.id).length)
    return '<div class="empty"><strong>Cadastre um destino primeiro</strong>'+
      'A carga precisa saber para qual armazém ou silo foi entregue.'+
      '<div style="margin-top:16px"><button class="btn-act primary" '+
      'onclick="_abaColh=\'cad\';render();setTimeout(modalArmazem,80)">Cadastrar destino</button></div></div>';
  if(!tals.length)
    return '<div class="empty"><strong>Cadastre os talhões primeiro</strong>'+
      'A carga precisa saber de qual talhão veio o grão.'+
      '<div style="margin-top:16px"><button class="btn-act primary" '+
      'onclick="irPara(\'modulo\',{moduloId:\'talhoes\'})">Ir para Dados da fazenda</button></div></div>';

  let l = cargas.slice();
  if(_fCarga.destino) l = l.filter(c=>c.destino===_fCarga.destino);
  if(_fCarga.talhao)  l = l.filter(c=>(c.talhoes||[]).some(i=>i.talhao_id===_fCarga.talhao));
  if(_fCarga.busca){
    const b=_fCarga.busca.toLowerCase();
    l = l.filter(c=>(c.romaneio||"").toLowerCase().includes(b) ||
                    (c.motorista||"").toLowerCase().includes(b) ||
                    (c.placa||"").toLowerCase().includes(b) ||
                    (c.codigo||"").toLowerCase().includes(b));
  }
  l.sort((a,b)=>(b.data||"").localeCompare(a.data||"") || (b.codigo||"").localeCompare(a.codigo||""));

  let h = '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalCarga()">+ Lançar carga</button>'+
    (cargas.length?'<button class="btn-act" onclick="exportarCargas()">Baixar planilha</button>':'')+
    (cargas.length?'<select class="sel-f" onchange="_fCarga.destino=this.value;render()">'+
      '<option value="">Todos os destinos</option>'+
      armazensDe(f.id).map(a=>'<option '+(_fCarga.destino===a?'selected':'')+'>'+esc(a)+'</option>').join("")+
      '</select>':'')+
    (cargas.length?'<input class="busca" placeholder="Romaneio, motorista ou placa…" value="'+esc(_fCarga.busca)+'" '+
      'oninput="clearTimeout(window._bc);window._bc=setTimeout(()=>{_fCarga.busca=this.value;render();},250)">':'')+
  '</div>';

  if(!cargas.length)
    return h+'<div class="empty"><strong>Nenhuma carga lançada</strong>'+
      'Cada caminhão que sai da lavoura vira uma carga. O sistema calcula o desconto de umidade e as sacas.</div>';
  if(!l.length)
    return h+'<div class="empty"><strong>Nada encontrado</strong>Ajuste os filtros para ver as cargas.</div>';

  h += '<div class="tbl"><table><thead><tr>'+
    '<th>Data</th><th>Romaneio</th><th>Destino</th><th class="hide-sm">Motorista</th>'+
    '<th class="num">Líquido</th><th class="num">Sacas</th>'+
    '<th class="num hide-sm">Umid.</th><th>Situação</th>'+
    '<th class="hide-sm">Talhão</th><th></th></tr></thead><tbody>';
  l.forEach(c=>{
    const nomes = (c.talhoes||[]).map(i=>{
      const t = talhoesDe(f.id).find(x=>x.id===i.talhao_id);
      return t?t.nome:"—";
    });
    const ok = cargaBaixada(c);
    const sc = ok ? c.baixa.sacas_final : c.sacas;
    h += '<tr'+(ok?'':' class="transito"')+'>'+
      '<td class="mono">'+dataBR(c.data)+'</td>'+
      '<td class="mono">'+esc(c.romaneio||c.codigo||"")+'</td>'+
      '<td><span class="tagdest">'+esc(c.destino||"—")+'</span></td>'+
      '<td class="hide-sm">'+esc(c.motorista||"—")+'</td>'+
      '<td class="num mono">'+n0(c.liquido)+'</td>'+
      '<td class="num mono forte">'+nf(sc,1)+(ok?"":'<i class="est">est.</i>')+'</td>'+
      '<td class="num mono hide-sm">'+umidCompara(c)+'</td>'+
      '<td>'+(ok
        ? '<span class="sit ok" title="Baixada em '+dataBR(c.baixa.data)+'">Baixada</span>'
        : '<span class="sit tr">A caminho</span>')+'</td>'+
      '<td class="tal-col hide-sm" title="'+esc(nomes.join(" + "))+'">'+esc(nomes.join(" + ")||"—")+'</td>'+
      '<td class="acoes">'+
        (ok ? '<button onclick="modalBaixa(\''+c.id+'\')">Ver baixa</button>'
            : '<button class="bx" onclick="modalBaixa(\''+c.id+'\')">Baixar</button>')+
        '<button onclick="modalCarga(\''+c.id+'\')">Editar</button>'+
        '<button class="rm" onclick="removerCarga(\''+c.id+'\')">✕</button></td>'+
    '</tr>';
  });
  h += '</tbody></table></div>';
  if(l.length!==cargas.length) h+='<p class="ver">'+l.length+' de '+cargas.length+' cargas</p>';
  return h;
}

/* ── Aba: produtividade ──────────────────── */
function abaProdutividade(f, p){
  if(!p.linhas.length)
    return '<div class="empty"><strong>Sem talhões cadastrados</strong>'+
      'Cadastre os talhões em Dados da fazenda para acompanhar a produtividade.</div>';

  const cap = siloCap(f.id);
  let h = '<div class="acts">'+
    '<button class="btn-act" onclick="modalSiloCap()">Saca por silo: '+n0(cap)+'</button>'+
    '<button class="btn-act" onclick="exportarProdutividade()">Baixar planilha</button></div>';

  h += '<div class="tbl"><table><thead><tr>'+
    '<th>Talhão</th><th class="num">Área</th><th class="num">Sacas armazém</th>'+
    '<th class="num">Silos</th><th class="num">Sacas silo</th>'+
    '<th class="num">Total</th><th class="num">sc/ha</th></tr></thead><tbody>';
  p.linhas.forEach(t=>{
    const media = p.prodColhida;
    const cor = !t.colhido ? "" : (t.sc_ha>=media ? " bom" : " baixo");
    h += '<tr'+(t.colhido?"":' class="pendente"')+'>'+
      '<td class="forte">'+esc(t.nome)+'</td>'+
      '<td class="num mono">'+nf(t.hectares,2)+'</td>'+
      '<td class="num mono">'+(t.sacas>0?nf(t.sacas,1):"—")+'</td>'+
      '<td class="num"><input class="silo" type="number" min="0" step="0.5" value="'+(t.silos||"")+'" '+
        'placeholder="0" oninput="clearTimeout(window._bs);window._bs=setTimeout(()=>{aplicarSilo(\''+t.id+'\',this.value);},400)"></td>'+
      '<td class="num mono">'+(t.sc_silo>0?nf(t.sc_silo,0):"—")+'</td>'+
      '<td class="num mono forte">'+(t.total_sc>0?nf(t.total_sc,1):"—")+'</td>'+
      '<td class="num mono sc-ha'+cor+'">'+(t.colhido?nf(t.sc_ha,2):"—")+'</td>'+
    '</tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="resumo">'+
    '<div class="resumo-t">Resumo da safra</div><div class="resumo-g">'+
    linhaResumo("Sacas no armazém", nf(p.sacasArmazem,2)+" sc")+
    linhaResumo("Sacas em silo bolsa", nf(p.sacasSilo,0)+" sc")+
    linhaResumo("Total colhido", nf(p.totalSacas,2)+" sc")+
    linhaResumo("Área colhida", nf(p.haColhida,2)+" ha")+
    linhaResumo("Produtividade da área colhida", nf(p.prodColhida,2)+" sc/ha", true)+
    linhaResumo("Produtividade da fazenda toda", nf(p.prodFazenda,2)+" sc/ha")+
    '</div><p class="resumo-obs">A produtividade da área colhida considera só os '+
    p.colhidos.length+' talhões com carga ou silo lançado. A da fazenda divide pelos '+
    nf(p.haTotal,2)+' ha totais.</p></div>';
  return h;
}
function linhaResumo(rot,val,forte){
  return '<div class="rl'+(forte?" forte":"")+'"><span>'+esc(rot)+'</span><b>'+esc(val)+'</b></div>';
}

function abaCadastros(f){
  const arm = armazensDe(f.id), cam = caminhoesDe(f.id);
  let h = '<div class="dupla">';

  h += '<div class="bloco"><div class="bloco-h"><h3>Armazéns e destinos</h3>'+
       '<button class="btn-act" onclick="modalArmazem()">+ Novo</button></div>';
  h += arm.length ? '<div class="chips">'+arm.map(a=>
        '<span class="chip">'+esc(a)+'<button onclick="removerArmazem(\''+esc(a).replace(/'/g,"\\'")+'\')">✕</button></span>').join("")+'</div>'
      : '<p class="vazio">Nenhum destino cadastrado.</p>';
  h += '</div>';

  h += '<div class="bloco"><div class="bloco-h"><h3>Caminhões</h3>'+
       '<button class="btn-act" onclick="modalCaminhao()">+ Novo</button></div>';
  h += cam.length ? '<div class="lista-cam">'+cam.map(c=>
        '<div class="cam"><span class="mono">'+esc(c.placa)+'</span>'+
        '<span>'+esc(c.motorista||"—")+'</span>'+
        '<button onclick="removerCaminhao(\''+c.id+'\')">✕</button></div>').join("")+'</div>'
      : '<p class="vazio">Nenhum caminhão cadastrado.</p>';
  h += '</div></div>';
  return h;
}

/* ═══════════════════════════════════════════════════
   TELA — Pluviometria
   ═══════════════════════════════════════════════════ */
let _mesIdx = null;      // posição dentro da safra
let _modoChuva = "dia";  // dia | planilha

function telaChuva(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const meses = mesesDaSafra(f.safra);
  if(_mesIdx==null){
    const hoje=new Date(), i=meses.findIndex(m=>m.ano===hoje.getFullYear()&&m.mes===hoje.getMonth());
    _mesIdx = i>=0 ? i : 0;
  }
  _mesIdx = Math.max(0, Math.min(meses.length-1, _mesIdx));
  const {ano,mes} = meses[_mesIdx];
  const pts = pontosDe(f.id);
  const r = resumoMes(f.id,ano,mes);
  const ac = acumuladoSafra(f.id,f.safra);

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
       '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
       '<div class="farm-head-mid"><h1>Pluviometria</h1>'+
       '<p>Chuva por dia e ponto de medição · safra '+esc(f.safra)+'</p></div></div>';

  if(!pts.length)
    return h+'<div class="empty"><strong>Cadastre os pontos de medição</strong>'+
      'Cada pluviômetro da fazenda vira uma coluna. Pode ser um talhão ou um grupo deles.'+
      '<div style="margin-top:16px"><button class="btn-act primary" onclick="modalPonto()">'+
      'Cadastrar ponto</button></div></div></div>';

  h += '<div class="kpis kpis-4">'+
    kpi("No mês", nf(r.mediaPontos,0), "mm (média)")+
    kpi("Dias com chuva", r.diasComChuva, "de "+r.nd)+
    kpi("Acumulado da safra", nf(ac.media,0), "mm (média)")+
    kpi("Pontos", pts.length, "")+
  '</div>';

  // Navegação de mês
  h += '<div class="mesnav">'+
    (_modoChuva==="dia" ?
      '<button class="mn-b" onclick="_mesIdx--;render()" '+(_mesIdx===0?'disabled':'')+'>‹</button>'+
      '<select class="mn-s" onchange="_mesIdx=+this.value;render()">'+
        meses.map((m,i)=>'<option value="'+i+'" '+(i===_mesIdx?'selected':'')+'>'+
          MESES[m.mes]+' '+m.ano+'</option>').join("")+
      '</select>'+
      '<button class="mn-b" onclick="_mesIdx++;render()" '+(_mesIdx===meses.length-1?'disabled':'')+'>›</button>'
      : '')+
    '<div class="mn-modo">'+
      '<button class="'+(_modoChuva==="dia"?"on":"")+'" onclick="_modoChuva=\'dia\';render()">Por dia</button>'+
      '<button class="'+(_modoChuva==="planilha"?"on":"")+'" onclick="_modoChuva=\'planilha\';render()">Planilha</button>'+
    '</div>'+
    '<button class="btn-act" onclick="modalPontos()">Pontos</button>'+
    '<button class="btn-act" onclick="exportarChuva()">Baixar planilha</button>'+
  '</div>';

  h += _modoChuva==="dia" ? chuvaPorDia(f,ano,mes,pts,r) : chuvaPlanilha(f,ano,mes,pts,r);

  // Acumulado por ponto
  h += '<div class="resumo"><div class="resumo-t">Acumulado da safra por ponto</div>'+
    '<div class="acum">'+ pts.map(p=>
      '<div class="ac"><span>'+esc(p.nome)+'</span><b>'+nf(ac.porPonto[p.id]||0,0)+' <i>mm</i></b></div>'
    ).join("")+'</div>'+
    '<p class="resumo-obs">Total lançado na safra: '+nf(ac.total,0)+' mm somando todos os pontos. '+
    'A média entre os '+pts.length+' pontos é '+nf(ac.media,0)+' mm.</p></div>';

  return h+'</div>';
}

/* Modo celular: escolhe o dia, digita ponto a ponto */
function chuvaPorDia(f,ano,mes,pts,r){
  const nd = diasNoMes(ano,mes);
  const hoje = new Date();
  let dia = (hoje.getFullYear()===ano && hoje.getMonth()===mes) ? hoje.getDate() : 1;
  if(window._diaSel && window._diaSel.ano===ano && window._diaSel.mes===mes) dia = window._diaSel.dia;

  let h = '<div class="dias">';
  for(let d=1; d<=nd; d++){
    const info = r.porDia[d];
    const cls = d===dia ? " sel" : (info.n ? " tem" : "");
    h += '<button class="dq'+cls+'" onclick="selDia('+ano+','+mes+','+d+')">'+
         '<i>'+d+'</i>'+(info.n?'<u>'+nf(info.media,0)+'</u>':'')+'</button>';
  }
  h += '</div>';

  const k = chaveDia(ano,mes,dia);
  h += '<div class="lanc"><div class="lanc-h">'+
    '<h3>'+dia+' de '+MESES[mes]+'</h3>'+
    '<span>'+(r.porDia[dia].n ? nf(r.porDia[dia].media,1)+' mm de média' : "sem registro")+'</span></div>';
  pts.forEach(p=>{
    const v = lerChuva(f.id,k,p.id);
    h += '<div class="lp"><label for="mm-'+p.id+'">'+esc(p.nome)+'</label>'+
      '<div class="lp-in"><input id="mm-'+p.id+'" type="number" inputmode="decimal" step="0.5" min="0" '+
      'value="'+(v==null?"":v)+'" placeholder="0" '+
      'onchange="gravarChuva(\''+f.id+'\',\''+k+'\',\''+p.id+'\',this.value);render()"><span>mm</span></div></div>';
  });
  return h+'</div>';
}

/* Modo planilha: a safra inteira, só os dias que choveram —
   igual ao controle da fazenda. */
function chuvaPlanilha(f,ano,mes,pts,r){
  const dias = diasDeChuva(f.id, f.safra);
  if(!dias.length)
    return '<div class="empty"><strong>Nenhuma chuva lançada nesta safra</strong>'+
      'Use o modo <b>Por dia</b> para registrar. Aqui aparecem só os dias que choveram.</div>';

  const tot = {}; pts.forEach(p=>tot[p.id]=0);
  let geral = 0;

  let h = '<div class="tbl grade"><table><thead><tr>'+
    '<th class="fix">'+esc(String(f.safra).replace("/","/"))+'</th>'+
    pts.map(p=>'<th class="num">'+esc(p.nome)+'</th>').join("")+
    '<th class="num tot">Total</th></tr></thead><tbody>';

  dias.forEach(k=>{
    let soma=0, n=0;
    const cels = pts.map(p=>{
      const v = lerChuva(f.id,k,p.id);
      if(v!=null){ soma+=v; n++; tot[p.id]+=v; }
      return '<td class="num"><input class="gr" type="number" inputmode="decimal" step="0.5" min="0" '+
        'value="'+(v==null?"":v)+'" '+
        'onchange="gravarChuva(\''+f.id+'\',\''+k+'\',\''+p.id+'\',this.value);render()"></td>';
    }).join("");
    geral += soma;
    h += '<tr class="molhado"><td class="fix mono dia">'+diaCurto(k)+'</td>'+cels+
         '<td class="num mono tot">'+nf(soma,1)+'</td></tr>';
  });

  h += '</tbody><tfoot><tr><td class="fix">Total</td>'+
    pts.map(p=>'<td class="num mono">'+nf(tot[p.id],1)+'</td>').join("")+
    '<td class="num mono tot">'+nf(geral,1)+'</td></tr>'+
    '<tr class="med"><td class="fix">Média</td>'+
    pts.map(()=>'<td class="num mono">'+nf(geral/pts.length,1)+'</td>').join("")+
    '<td class="num mono tot">'+nf(geral/pts.length,1)+'</td></tr></tfoot></table></div>'+
    '<p class="ver">'+dias.length+' dias com chuva na safra</p>';
  return h;
}

function selDia(ano,mes,dia){ window._diaSel={ano,mes,dia}; render(); }

/* ── Pontos de medição ───────────────────── */
function modalPontos(){
  const f=acharFazenda(App.fazendaId);
  const pts=pontosDe(f.id);
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Pontos de medição</h2>'+
    '<p class="sub">Cada pluviômetro vira uma coluna na planilha.</p>'+
    (pts.length?'<div class="lista-cam">'+pts.map(p=>
      '<div class="cam"><span class="mono">'+esc(p.nome)+'</span><span></span>'+
      '<button onclick="removerPonto(\''+p.id+'\')">✕</button></div>').join("")+'</div>'
      :'<p class="vazio">Nenhum ponto cadastrado.</p>')+
    '<div class="modal-acts">'+
      '<button class="btn-cancel" onclick="fecharModal()">Fechar</button>'+

function modalPonto(){
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Novo ponto</h2><p class="sub">Nome curto — aparece como coluna na planilha.</p>'+
    '<div class="frm"><div><label for="pt-nome">Nome</label>'+
      '<input id="pt-nome" placeholder="Pivôs, Sede, T1 T2…" maxlength="22"></div></div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="modalPontos()">Voltar</button>'+
      '<button class="btn-save" onclick="gravarPonto()">Adicionar</button></div></div></div>';
  setTimeout(()=>{const e=document.getElementById("pt-nome"); if(e) e.focus();},60);
}
function gravarPonto(){
  const f=acharFazenda(App.fazendaId);
  const v=document.getElementById("pt-nome").value.trim();
  if(!v){ toast("Informe o nome"); return; }
  const l=pontosDe(f.id);
  if(l.some(p=>p.nome.toLowerCase()===v.toLowerCase())){ toast("Esse ponto já existe"); return; }
  const novo={id:"pt_"+Date.now().toString(36), fazenda_id:f.id, nome:v};
  l.push(novo); Store.set(kPontos(f.id),l);
  Sync.push("chuva_pontos","upsert",novo);
  fecharModal(); toast("Ponto adicionado"); render();
}
function removerPonto(id){
  const f=acharFazenda(App.fazendaId);
  const todo=chuvaDe(f.id);
  let usos=0; Object.values(todo).forEach(d=>{ if(d[id]!=null) usos++; });
  if(usos && !confirm("Esse ponto tem "+usos+" lançamento(s) de chuva.\nRemover mesmo assim?")) return;
  Store.set(kPontos(f.id), pontosDe(f.id).filter(p=>p.id!==id));
  if(usos){ Object.keys(todo).forEach(d=>{ delete todo[d][id];
    if(!Object.keys(todo[d]).length) delete todo[d]; }); Store.set(kChuva(f.id),todo); }
  Sync.push("chuva_pontos","delete",{id});
  toast("Ponto removido"); modalPontos(); render();
}

function exportarChuva(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const pts=pontosDe(f.id), dias=diasDeChuva(f.id,f.safra);
  if(!dias.length){ toast("Nenhuma chuva lançada ainda"); return; }
  const tot={}; pts.forEach(p=>tot[p.id]=0);
  const linhas=[["CONTROLE DE CHUVA - SAFRA "+f.safra+" - "+f.nome.toUpperCase()]];
  linhas.push(["Dia"].concat(pts.map(p=>p.nome)).concat(["Total"]));
  let geral=0;
  dias.forEach(k=>{
    let soma=0;
    const cel=pts.map(p=>{
      const v=lerChuva(f.id,k,p.id);
      if(v!=null){ soma+=v; tot[p.id]+=v; }
      return v==null?"":vBR(v);
    });
    geral+=soma;
    linhas.push([diaCurto(k)].concat(cel).concat([vBR(soma)]));
  });
  linhas.push(["Total"].concat(pts.map(p=>vBR(tot[p.id]))).concat([vBR(geral)]));
  linhas.push(["Média"].concat(pts.map(()=>vBR((geral/pts.length).toFixed(1))))
                       .concat([vBR((geral/pts.length).toFixed(1))]));
  baixarCSV(linhas,"chuvas-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

/* ── Relatório: igual ao da fazenda ──────── */
function abaRelatorio(f,R){
  const tals = talhoesDe(f.id);
  const nomeT = a => (a.talhoes||[]).map(id=>{
    const t=tals.find(x=>x.id===id); return t?t.nome:"—"; }).join(", ") || "—";

  let h = '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalAplicacao()">+ Nova aplicação</button>'+
    (R.aplicacoes.length?'<button class="btn-act" onclick="exportarOperacoes()">Baixar planilha</button>':'')+
    '<select class="sel-f" onchange="_fTipo=this.value;render()">'+
      '<option value="">Todos os tipos</option>'+
      TIPOS_OP.map(t=>'<option '+(_fTipo===t?'selected':'')+'>'+esc(t)+'</option>').join("")+
    '</select></div>';

  if(!produtosDe(f.id).length)
    return h+'<div class="empty"><strong>Cadastre os produtos primeiro</strong>'+
      'Defesivos, adubos e sementes com o preço por litro ou quilo.'+
      '<div style="margin-top:16px"><button class="btn-act primary" '+
      'onclick="_abaOp=\'produtos\';render();setTimeout(modalProduto,80)">Cadastrar produto</button></div></div>';

  if(!R.aplicacoes.length)
    return h+'<div class="empty"><strong>Nenhuma aplicação lançada</strong>'+
      'Cada passada de pulverizador vira uma aplicação, com a calda de produtos e a área tratada.</div>';

  const aps = R.aplicacoes.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  let h2 = '<div class="tbl"><table><thead><tr>'+
    '<th>Data</th><th>Talhão</th><th>Produto</th><th class="num">Dose</th>'+
    '<th class="num">Hectares</th><th class="num">Qtd</th>'+
    '<th class="num hide-sm">Valor un.</th><th class="num">Valor total</th><th></th>'+
    '</tr></thead><tbody>';
  let total = 0;
  aps.forEach(a=>{
    const ls = linhasAplicacao(f.id,a);
    const custo = ls.reduce((s,l)=>s+l.valor,0);
    total += custo;
    if(!ls.length){
      h2 += '<tr class="ap-ini"><td class="mono">'+dataBR(a.data)+'</td>'+
        '<td class="forte">'+esc(nomeT(a))+'</td><td colspan="6" class="vaz">sem produto na calda</td>'+
        '<td class="acoes"><button onclick="modalAplicacao(\''+a.id+'\')">Editar</button>'+
        '<button class="rm" onclick="removerAplicacao(\''+a.id+'\')">✕</button></td></tr>';
      return;
    }
    ls.forEach((l,i)=>{
      h2 += '<tr'+(i===0?' class="ap-ini"':'')+'>'+
        (i===0 ? '<td class="mono" rowspan="'+ls.length+'">'+dataBR(a.data)+
                 '<u class="tp">'+esc(a.tipo||"").replace("Pulverização ","")+'</u></td>'+
                 '<td class="forte" rowspan="'+ls.length+'">'+esc(nomeT(a))+
                 (a.obs?'<u class="ob">'+esc(a.obs)+'</u>':'')+'</td>' : '')+
        '<td>'+esc(l.produto)+'</td>'+
        '<td class="num mono">'+nf(l.dose,l.dose<1?3:2)+'</td>'+
        '<td class="num mono">'+nf(l.hectares,0)+'</td>'+
        '<td class="num mono">'+nf(l.qtd,1)+' <i class="un">'+esc(l.unidade)+'</i></td>'+
        '<td class="num mono hide-sm">'+(l.semPreco?'<i class="sp">sem preço</i>':moeda(l.preco))+'</td>'+
        '<td class="num mono forte">'+(l.semPreco?"—":moeda(l.valor))+'</td>'+
        (i===0 ? '<td class="acoes" rowspan="'+ls.length+'">'+
                 '<button onclick="modalAplicacao(\''+a.id+'\')">Editar</button>'+
                 '<button class="rm" onclick="removerAplicacao(\''+a.id+'\')">✕</button></td>' : '')+
      '</tr>';
    });
  });
  h2 += '</tbody><tfoot><tr><td class="fix" colspan="7">Total geral'+
    (_fTipo?' · '+esc(_fTipo):'')+'</td>'+
    '<td class="num mono tot">'+moeda(total)+'</td><td></td></tr></tfoot></table></div>';

  if(R.semPreco) h2 += '<p class="resumo-obs">'+R.semPreco+
    ' lançamento(s) sem preço cadastrado — o valor deles não entra no total.</p>';
  return h+h2;
}

function abaProdutos(f){
  const l = produtosDe(f.id).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  let h = '<div class="acts"><button class="btn-act primary" onclick="modalProduto()">+ Novo produto</button></div>';
  if(!l.length)
    return h+'<div class="empty"><strong>Nenhum produto cadastrado</strong>'+
      'Cadastre defensivos, adubos e sementes com o preço por litro ou quilo. '+
      'O custo das aplicações sai daqui.</div>';

    '<th class="num">Preço</th><th class="num hide-sm">Aplicações</th><th></th></tr></thead><tbody>';
  const R = resumoOperacoes(f.id);
  l.forEach(p=>{
    const u = R.porProduto.find(x=>x.nome===p.nome);
    h += '<tr><td class="forte">'+esc(p.nome)+'</td>'+
      '<td class="num mono">'+esc(p.unidade)+'</td>'+
      '<td class="num mono'+(p.preco>0?'':' vaz')+'">'+(p.preco>0?moeda(p.preco):"sem preço")+'</td>'+
      '<td class="num mono hide-sm">'+(u?u.aplic:0)+'</td>'+

      '<button class="rm" onclick="removerProduto(\''+p.id+'\')">✕</button></td></tr>';

  return h+'</tbody></table></div>';
}

/* ── Consumo por produto ─────────────────── */
function abaResumoProd(f,R){
  if(!R.porProduto.length)
    return '<div class="empty"><strong>Nada aplicado ainda</strong>'+
      'Este resumo mostra quanto de cada produto foi gasto na safra.</div>';
  let h = '<div class="tbl"><table><thead><tr><th>Produto</th>'+
    '<th class="num">Aplicações</th><th class="num">Quantidade</th>'+
    '<th class="num">Valor</th><th class="num hide-sm">% do custo</th></tr></thead><tbody>';

      '<div class="g3">'+
        '<div><label for="k-data">Data</label><input type="date" id="k-data" value="'+(c?c.data:hoje)+'"></div>'+

      '<div class="g2">'+
        '<div><label for="k-cam">Caminhão</label><select id="k-cam" onchange="preencherPlaca()">'+
          '<option value="">Avulso</option>'+
          cam.map(x=>'<option value="'+x.id+'" '+(c&&c.placa===x.placa?"selected":"")+'>'+

function desenharItens(){
  const f = acharFazenda(App.fazendaId);
  const tals = talhoesDe(f.id).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
  document.getElementById("itens").innerHTML = _itensCarga.map((it,i)=>
    '<div class="item">'+
      '<select onchange="_itensCarga['+i+'].talhao_id=this.value">'+
        tals.map(t=>'<option value="'+t.id+'" '+(it.talhao_id===t.id?"selected":"")+'>'+esc(t.nome)+'</option>').join("")+
      '</select>'+
      '<input type="number" inputmode="decimal" placeholder="kg (opcional)" value="'+(it.kg||"")+'" '+
        'oninput="_itensCarga['+i+'].kg=this.value">'+
      (_itensCarga.length>1?'<button type="button" onclick="remItemCarga('+i+')">✕</button>':'<span></span>')+
    '</div>').join("") +
    (_itensCarga.length>1?'<p class="dica">Sem os kg, a carga é dividida em partes iguais entre os talhões.</p>':"");
}
function addItemCarga(){
  const f=acharFazenda(App.fazendaId), t=talhoesDe(f.id);
  _itensCarga.push({talhao_id:t[0]?t[0].id:"", kg:""}); desenharItens();
}
function remItemCarga(i){ _itensCarga.splice(i,1); desenharItens(); }

function preencherPlaca(){
  const f=acharFazenda(App.fazendaId);
  const sel=document.getElementById("k-cam").value;
  const cm=caminhoesDe(f.id).find(x=>x.id===sel);
  if(cm && cm.motorista){ const m=document.getElementById("k-mot"); if(m && !m.value) m.value=cm.motorista; }
}

function recalcCarga(){
  const g=id=>parseFloat(String((document.getElementById(id)||{}).value||"").replace(",","."))||0;
  const r = calcCarga({ peso_bruto:g("k-bruto"), tara:g("k-tara") });
  const box=document.getElementById("calc-box"); if(!box) return;
  const u=g("k-umid");
  box.innerHTML =
    '<span><i>Líquido</i><b>'+n0(r.liquido)+' kg</b></span>'+
    '<span><i>Sacas estimadas</i><b class="ok">'+nf(r.sacas,1)+' sc</b></span>'+
    (u>0?'<span><i>Umidade fazenda</i><b>'+nf(u,1)+'%</b></span>':'')+
    '<span class="nota">Valor de saída. As sacas confirmadas saem na baixa, com os descontos do armazém.</span>';
}


function gravarCarga(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const n=i=>parseFloat(g(i).replace(",","."))||0;

  const bruto=n("k-bruto"), tara=n("k-tara");
  if(bruto<=0){ toast("Informe o peso bruto"); return; }
  if(tara>=bruto){ toast("A tara precisa ser menor que o peso bruto"); return; }
  const itens=_itensCarga.filter(i=>i.talhao_id);
  if(!itens.length){ toast("Escolha o talhão de origem"); return; }
  const dest=g("k-dest");
  if(!dest){ toast("Escolha o destino da carga"); return; }

  const cm=caminhoesDe(f.id).find(x=>x.id===g("k-cam"));
  salvarCarga(f.id,{
    data:g("k-data")||new Date().toISOString().slice(0,10),
    romaneio:g("k-rom"), destino:dest,
    placa: cm?cm.placa:"", motorista:g("k-mot"),
    peso_bruto:bruto, tara:tara, umidade:n("k-umid"), obs:g("k-obs"),
    talhoes: itens.map(i=>({talhao_id:i.talhao_id, kg:parseFloat(String(i.kg).replace(",","."))||0}))
  }, id);
  fecharModal(); toast(id?"Carga atualizada":"Carga lançada"); render();
}

function removerCarga(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const c=cargasDe(f.id).find(x=>x.id===id); if(!c) return;
  if(!confirm("Remover a carga "+(c.romaneio||c.codigo)+"?")) return;
  apagarCarga(f.id,id); toast("Carga removida"); render();
}

function abaDescontos(f){

  if(!t.cargas)
    return '<div class="empty"><strong>Nenhuma carga baixada ainda</strong>'+
      'Quando o romaneio do armazém voltar, dê baixa na carga. Os descontos aparecem aqui.</div>';

  const b = basesDe(f.id);
  let h = '<div class="acts">'+
    '<button class="btn-act" onclick="modalBases()">Padrões: umidade '+nf(b.umidade,0)+
    '% · impureza '+nf(b.impureza,0)+'% · avariados '+nf(b.avariados,0)+'%</button>'+
    '<button class="btn-act" onclick="exportarDescontos()">Baixar planilha</button></div>';

  h += '<div class="kpis kpis-4">'+
    kpi("Umidade", nf(t.umidade/SACA_KG,1), "sc · "+n0(t.umidade)+" kg")+
    kpi("Impureza", nf(t.impureza/SACA_KG,1), "sc · "+n0(t.impureza)+" kg")+
    kpi("Avariados", nf(t.avariados/SACA_KG,1), "sc · "+n0(t.avariados)+" kg")+
    kpi("Total descontado", nf(t.total/SACA_KG,1), "sc · "+nf(t.pct,2)+"% do bruto")+
  '</div>';

  h += '<div class="tbl"><table><thead><tr><th>Destino</th><th class="num">Cargas</th>'+
    '<th class="num">Bruto</th><th class="num">Umidade</th><th class="num">Impureza</th>'+
    '<th class="num">Avariados</th><th class="num">Total desc.</th>'+
    '<th class="num">%</th><th class="num">Líquido final</th></tr></thead><tbody>';
  R.porDestino.forEach(d=>{
    const pct = d.bruto>0 ? d.total/d.bruto*100 : 0;
    h += '<tr><td class="forte">'+esc(d.destino)+'</td>'+
      '<td class="num mono">'+d.cargas+'</td>'+
      '<td class="num mono">'+n0(d.bruto)+'</td>'+
      '<td class="num mono">'+n0(d.umidade)+'</td>'+
      '<td class="num mono">'+n0(d.impureza)+'</td>'+
      '<td class="num mono">'+n0(d.avariados)+'</td>'+
      '<td class="num mono forte">'+n0(d.total)+'</td>'+
      '<td class="num mono'+(pct>=8?' alerta':'')+'">'+nf(pct,2)+'%</td>'+
      '<td class="num mono">'+n0(d.final)+'</td></tr>';
  });
  h += '</tbody><tfoot><tr><td class="fix">Total</td><td class="num mono">'+t.cargas+'</td>'+
    '<td class="num mono">'+n0(t.bruto)+'</td><td class="num mono">'+n0(t.umidade)+'</td>'+
    '<td class="num mono">'+n0(t.impureza)+'</td><td class="num mono">'+n0(t.avariados)+'</td>'+
    '<td class="num mono">'+n0(t.total)+'</td><td class="num mono">'+nf(t.pct,2)+'%</td>'+
    '<td class="num mono">'+n0(t.final)+'</td></tr></tfoot></table></div>';

  h += '<p class="resumo-obs">O desconto de umidade usa a fórmula sobre o excedente do grau padrão. '+
    'Impureza e avariados incidem sobre o peso já seco, só na parte acima do padrão do contrato.</p>';
  return h;
}

/* Cada desconto tem dois campos: o grau e o kg. O kg é o que
   conta — vem pronto no romaneio. O grau fica de registro. */
function campoDesc(k, rot, pct, kg, padrao, extra){
  return '<div class="dsc">'+
    '<label>'+esc(rot)+'</label>'+
    '<div class="dsc-in">'+
      '<span class="dsc-c"><input id="b-'+k+'-p" type="number" step="0.01" inputmode="decimal" '+
        'value="'+(pct!=null?pct:"")+'" placeholder="0" oninput="sugerirKg(\''+k+'\');recalcBaixa()">'+
        '<i>%</i></span>'+
      '<span class="dsc-c"><input id="b-'+k+'-k" type="number" step="1" inputmode="decimal" '+
        'value="'+(kg!=null?kg:"")+'" placeholder="0" oninput="_kgManual.'+k+'=true;recalcBaixa()">'+
        '<i>kg</i></span>'+
    '</div>'+
    '<span class="pad">padrão '+padrao+(extra?" · "+esc(extra):"")+'</span>'+
  '</div>';
}
let _kgManual = {};

/* Preenche o kg a partir do grau — só enquanto o campo não
   for tocado à mão. Armazém que calcula diferente, digita direto. */
function sugerirKg(k){
  if(_kgManual[k]) return;
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>parseFloat(String((document.getElementById(i)||{}).value||"").replace(",","."))||0;
  const tipo = k==="umid" ? "umidade" : k==="imp" ? "impureza" : "avariados";
  const liq = g("b-liq");
  const el = document.getElementById("b-"+k+"-k");
  if(el) el.value = sugerirDesc(tipo, liq, g("b-"+k+"-p"), basesDe(f.id)) || "";
}

/* ── Modal: baixar carga ─────────────────── */
function modalBaixa(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const c = cargasDe(f.id).find(x=>x.id===id); if(!c) return;
  const b = basesDe(f.id);
  const j = c.baixa || {};
  const hoje = new Date().toISOString().slice(0,10);
  const tals = talhoesDe(f.id);
  const nomes = (c.talhoes||[]).map(i=>{
    const t=tals.find(x=>x.id===i.talhao_id); return t?t.nome:"—"; });

  document.getElementById("modal-root").innerHTML =
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal modal-lg">'+
    '<h2>'+(cargaBaixada(c)?"Baixa da carga":"Baixar carga")+' '+esc(c.romaneio||c.codigo||"")+'</h2>'+
    '<p class="sub">Informe o que veio no romaneio do armazém. Só depois disso a carga entra na produtividade.</p>'+
    '<div class="frm">'+
      '<div class="g3">'+
        '<div><label for="b-data">Data da baixa</label>'+
          '<input type="date" id="b-data" value="'+(j.data||hoje)+'"></div>'+
        '<div><label for="b-rom">Romaneio do armazém</label>'+
          '<input id="b-rom" value="'+esc(j.romaneio_arm||"")+'" placeholder="opcional"></div>'+
        '<div><label for="b-liq">Peso líquido no armazém (kg)</label>'+
          '<input id="b-liq" type="number" inputmode="decimal" value="'+(j.liquido!=null?j.liquido:(c.liquido||""))+'" oninput="recalcBaixa()"></div>'+
      '</div>'+
      '<div class="descs">'+
        campoDesc("umid","Umidade", j.umidade, j.desc_umidade, nf(b.umidade,0)+"%",
                  c.umidade?"fazenda marcou "+nf(c.umidade,1)+"%":"")+
        campoDesc("imp","Impureza", j.impureza, j.desc_impureza, nf(b.impureza,0)+"%","")+
        campoDesc("avar","Avariados", j.avariados, j.desc_avariados, nf(b.avariados,0)+"%","")+
      '</div>'+
      '<div id="baixa-calc" class="calc"></div>'+
      '<div><label>Como fica em cada talhão</label><div id="baixa-rateio" class="rateio"></div>'+
        (nomes.length>1?'<p class="dica">O rateio segue os kg informados no lançamento da carga.</p>':'')+'</div>'+
      '<div><label for="b-obs">Observação da baixa</label>'+
        '<input id="b-obs" value="'+esc(j.obs||"")+'" placeholder="opcional"></div>'+
    '</div>'+
    '<div class="modal-acts">'+
      (cargaBaixada(c)
        ? '<button class="btn-cancel" onclick="reabrirCarga(\''+c.id+'\')">Reabrir carga</button>'
        : '<button class="btn-cancel" onclick="fecharModal()">Cancelar</button>')+
      '<button class="btn-save" onclick="gravarBaixa(\''+c.id+'\')">'+
        (cargaBaixada(c)?"Salvar alterações":"Confirmar baixa")+'</button>'+
    '</div></div></div>';
  window._cargaBaixa = c;
  _kgManual = {};
  recalcBaixa();
}

function recalcBaixa(){
  const f=acharFazenda(App.fazendaId), c=window._cargaBaixa;
  if(!f||!c) return;
  const g=i=>parseFloat(String((document.getElementById(i)||{}).value||"").replace(",","."))||0;
  const liq=g("b-liq");
  const r = calcBaixa({ liquido:liq,
    desc_umidade:g("b-umid-k"), desc_impureza:g("b-imp-k"), desc_avariados:g("b-avar-k") });

  const box=document.getElementById("baixa-calc");
  if(box) box.innerHTML =
    '<span><i>Bruto armazém</i><b>'+n0(liq)+' kg</b></span>'+
    '<span><i>Descontos</i><b class="'+(r.desc_total?"neg":"")+'">'+
      (r.desc_total?"−"+n0(r.desc_total):"0")+' kg</b></span>'+
    '<span><i>Líquido final</i><b>'+n0(r.peso_final)+' kg</b></span>'+
    '<span><i>Sacas</i><b class="ok">'+nf(r.sacas_final,1)+' sc</b></span>'+
    (liq>0 && r.desc_total ? '<span class="nota">'+
      nf(r.desc_total/liq*100,2)+'% do bruto descontado.'+
      ((c.umidade && g("b-umid-p")) ? ' A fazenda mediu '+nf(c.umidade,1)+'% de umidade e o armazém '+
        nf(g("b-umid-p"),1)+'%.' : '')+'</span>' : '');

  const tals=talhoesDe(f.id);
  const itens=(c.talhoes||[]).filter(i=>tals.some(t=>t.id===i.talhao_id));
  const soma=itens.reduce((s,i)=>s+(Number(i.kg)||0),0);
  const rt=document.getElementById("baixa-rateio");
  if(rt) rt.innerHTML = itens.map(i=>{
    const frac = soma>0 ? (Number(i.kg)||0)/soma : 1/itens.length;
    const t = tals.find(x=>x.id===i.talhao_id);
    return '<div class="rt"><span>'+esc(t?t.nome:"—")+
      (itens.length>1?' <u>'+nf(frac*100,0)+'%</u>':'')+'</span>'+
      '<b>'+nf(r.sacas_final*frac,1)+' sc</b></div>';
  }).join("") || '<p class="vazio">Carga sem talhão vinculado.</p>';
}

function gravarBaixa(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const n=i=>parseFloat(g(i).replace(",","."))||0;
  const liq=n("b-liq");
  if(liq<=0){ toast("Informe o peso líquido do armazém"); return; }
  const dTot = n("b-umid-k")+n("b-imp-k")+n("b-avar-k");
  if(dTot > liq){ toast("Os descontos passam do peso líquido"); return; }
  darBaixa(f.id,id,{ data:g("b-data")||new Date().toISOString().slice(0,10),
    romaneio_arm:g("b-rom"), liquido:liq,
    umidade:n("b-umid-p"),   desc_umidade:n("b-umid-k"),
    impureza:n("b-imp-p"),   desc_impureza:n("b-imp-k"),
    avariados:n("b-avar-p"), desc_avariados:n("b-avar-k"),
    obs:g("b-obs") });
  fecharModal(); toast("Carga baixada · entrou na produtividade"); render();
}

function sugerirArea(){
  const f=acharFazenda(App.fazendaId);
  const el=document.getElementById("ap-ha"); if(!el||el.value) return;
  const ids=[...document.querySelectorAll('.tsel input:checked')].map(x=>x.value);
  const soma=talhoesDe(f.id).filter(t=>ids.includes(t.id)).reduce((s,t)=>s+t.hectares,0);
  if(soma>0){ el.value=soma.toFixed(2); recalcApl(); }

function recalcApl(){
  const f=acharFazenda(App.fazendaId);
  const ha=parseFloat(String((document.getElementById("ap-ha")||{}).value||"").replace(",","."))||0;
  let total=0, n=0, sem=0;
  _itensApl.forEach(it=>{
    const p=acharProduto(f.id,it.produto_id); if(!p) return;
    const dose=parseFloat(String(it.dose).replace(",","."))||0;
    if(dose<=0) return;
    n++;
    if((Number(p.preco)||0)<=0){ sem++; return; }
    total += dose*ha*Number(p.preco);
  });
  const box=document.getElementById("ap-calc"); if(!box) return;
  box.innerHTML =
    '<span><i>Produtos</i><b>'+n+'</b></span>'+
    '<span><i>Área</i><b>'+nf(ha,2)+' ha</b></span>'+
    '<span><i>Custo por hectare</i><b>'+(ha>0?moeda(total/ha):"—")+'</b></span>'+
    '<span><i>Custo da aplicação</i><b class="ok">'+moeda(total)+'</b></span>'+
    (sem?'<span class="nota">'+sem+' produto(s) sem preço — não entram no custo.</span>':'');
}

  salvarAplicacao(f.id,{ data:document.getElementById("ap-data").value||new Date().toISOString().slice(0,10),
    tipo:document.getElementById("ap-tipo").value, talhoes:ids, hectares:ha,

/* ── Planilhas ───────────────────────────── */
function baixarCSV(linhas, nome){
  const csv="\ufeff"+linhas.map(r=>r.map(v=>{
    const s=String(v==null?"":v);
    return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download=nome+".csv"; a.click(); URL.revokeObjectURL(a.href);
  toast("Planilha baixada");
}
const vBR = v => String(v==null?"":v).replace(".",",");

      id:"pt_"+i, fazenda_id:f.id, nome:n })));
}
