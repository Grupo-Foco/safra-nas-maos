<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Safra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#22392B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<title>Safra nas Mãos · FOCO Agropecuária</title>
<style>
:root{
  /* Identidade Grupo Foco — alinhada ao Gestão Financeira */
  --green:#22392B;        /* verde-floresta: barra, títulos */
  --green-mid:#394D41;    /* verde médio: botões sobre o escuro */
  --green-lt:#4F6B57;
  --gold:#C3A95A;         /* ouro: ação principal, estado ativo */
  --gold-dk:#A98F42;
  --gold-soft:#FDF3D1;
  --leaf:#7FA646;
  --leaf-dk:#4E8530;
  --leaf-soft:#EDF2E2;

  --bg:#F4F0E9;
  --card:#FAFAF7;
  --line:#E4DDCE;
  --line-soft:#EEEBE4;
  --text:#2C3A30;
  --muted:#7A8279;
  --red:#D65745;  --red-soft:#FAEDEA;
  --amber:#9A7226; --amber-soft:#FDF3D1;
  --blue:#4A7093; --blue-soft:#E9F0F5;
  --r:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg{display:block}

/* ── Barra superior ──────────────────────── */
.topbar{
  background:var(--green);color:#E8EDE6;
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px}
.brand .badge{
  background:#fff;border-radius:9px;padding:4px;width:36px;height:36px;flex:none;
  display:grid;place-items:center
}
.brand .badge svg{width:28px;height:28px}
.brand-txt{line-height:1.15}
.brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.02em;color:var(--gold)}
.brand-txt span{display:block;font-size:10px;letter-spacing:.13em;font-weight:600;color:#93A392}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.sync-chip{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:7px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  background:var(--green-mid);color:#C9D4C7
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#7CC46A}
.sync-chip.off{background:#4A4030;color:var(--gold)}
.sync-chip.off .sync-dot{background:var(--gold)}
.btn-ghost{
  background:var(--green-mid);border:1px solid rgba(255,255,255,.14);color:#DCE4DA;
  padding:6px 13px;border-radius:7px;font-family:var(--mono);font-size:12px;font-weight:600
}
.btn-ghost:hover{background:var(--green-lt);color:#fff}
.user-nome{font-family:var(--mono);font-size:12.5px;color:#B9C6B8}

/* ── Avisos ──────────────────────────────── */
.banner{padding:11px 16px;font-size:14px;text-align:center}
.banner.err{background:var(--red-soft);color:var(--red);border-bottom:1px solid #F0D6D0}
.banner.warn{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid #EFE0B8}

.wrap{max-width:900px;margin:0 auto;padding:22px 16px 44px}
.wrap-wide{max-width:1100px}

/* ── Tela de fazendas ────────────────────── */
.lbl{display:block;color:var(--green);font-size:12px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.field-lg{
  width:100%;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--r);background:#fff;font-size:16px;color:var(--text)
}
.field-lg::placeholder{color:#A8A99C}
.field-lg:focus{border-color:var(--gold);outline:none}
.btn-primary{
  width:100%;background:var(--gold);color:#3A3117;border:none;
  padding:15px;border-radius:var(--r);font-size:16px;font-weight:800;
  letter-spacing:.02em;margin-top:12px
}
.btn-primary:hover{background:var(--gold-dk);color:#2C2611}

.panorama{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-top:18px;
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--leaf);
  border-radius:var(--r);padding:15px 17px;color:var(--muted);font-size:13.5px;line-height:1.5
}
.panorama b{font-size:15px;display:block;margin-bottom:3px;color:var(--green)}
.panorama:hover{border-color:var(--gold);border-left-color:var(--leaf)}
.panorama svg{width:22px;height:22px;flex:none;margin-top:2px;color:var(--leaf-dk)}

.farm-card{
  display:flex;align-items:center;gap:12px;width:100%;
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);
  border-radius:var(--r);padding:15px 17px;margin-top:11px
}
.farm-card:hover{border-color:var(--gold);border-left-color:var(--gold);
  box-shadow:0 1px 8px rgba(34,57,43,.08)}
.farm-card h3{color:var(--green);font-size:17px;font-weight:800;margin-bottom:3px}
.farm-card p{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.farm-card .chev{margin-left:auto;color:var(--gold);font-size:24px;font-weight:700;cursor:pointer}
.farm-card .del{margin-left:8px;background:none;border:none;color:#CFCABD;font-size:17px;padding:4px 6px}
.farm-card .del:hover{color:var(--red)}

.empty{
  text-align:center;padding:38px 22px;color:var(--muted);
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r);margin-top:18px
}
.empty strong{display:block;color:var(--green);font-size:16px;font-weight:800;margin-bottom:7px}
.ver{text-align:center;color:#AFAA9D;font-size:11.5px;font-family:var(--mono);margin-top:30px}

/* ── Cabeçalho da fazenda ────────────────── */
.farm-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;padding:20px 0 22px}
.btn-back{
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:9px 14px;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--green)
}
.btn-back:hover{border-color:var(--gold);background:#fff}
.farm-head-mid h1{color:var(--green);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.farm-head-mid p{color:var(--muted);font-size:13px;font-family:var(--mono);margin-top:5px}
.safra-box{margin-left:auto;text-align:right}
.safra-box label{display:block;color:var(--muted);font-size:10.5px;font-family:var(--mono);
  font-weight:700;letter-spacing:.1em;margin-bottom:3px}
.safra-box select{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:7px 11px;font-size:17px;font-weight:800;color:var(--green);font-family:var(--mono)
}
.safra-box select:focus{border-color:var(--gold);outline:none}

/* ── Destaques ───────────────────────────── */
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.hero{text-align:left;border-radius:13px;padding:21px;background:var(--card);
  border:1px solid var(--line);border-top:4px solid}
.hero .ic{display:block;margin-bottom:12px}
.hero .ic svg{width:28px;height:28px}
.hero h2{font-size:19px;font-weight:800;color:var(--green);margin-bottom:5px;letter-spacing:-.01em}
.hero p{font-size:13px;line-height:1.45;color:var(--muted)}
.hero-leaf{border-top-color:var(--leaf)}
.hero-leaf .ic{color:var(--leaf-dk)}
.hero-earth{border-top-color:var(--gold)}
.hero-earth .ic{color:var(--gold-dk)}
.hero:hover{border-color:var(--gold);box-shadow:0 2px 12px rgba(34,57,43,.08)}
.hero-leaf:hover{border-top-color:var(--leaf)}
.hero-earth:hover{border-top-color:var(--gold)}

/* ── Seções e módulos ────────────────────── */
.sec-head{display:flex;align-items:center;gap:14px;margin:28px 0 15px}
.sec-head span{color:var(--green);font-family:var(--mono);font-size:11.5px;
  font-weight:700;letter-spacing:.12em;white-space:nowrap}
.sec-head i{flex:1;height:1px;background:var(--line)}

.mods{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mod{
  text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:17px;position:relative
}
.mod:hover{border-color:var(--gold);box-shadow:0 2px 12px rgba(34,57,43,.07)}
.mod .ic{
  width:42px;height:42px;border-radius:10px;background:var(--leaf-soft);
  display:grid;place-items:center;margin-bottom:13px;color:var(--green)
}
.mod .ic svg{width:22px;height:22px}
.mod h3{color:var(--green);font-size:16px;font-weight:800;margin-bottom:4px}
.mod p{color:var(--muted);font-size:12.5px;line-height:1.4}
.mod .tag{
  position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:9.5px;
  font-weight:700;padding:3px 7px;border-radius:5px;letter-spacing:.06em
}
.tag-soon{background:var(--line-soft);color:#9B9587}
.tag-ready{background:var(--gold-soft);color:var(--amber)}

/* ── Indicadores ─────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--leaf);
  border-radius:11px;padding:15px 17px}
.kpi:nth-child(2){border-left-color:var(--gold)}
.kpi:nth-child(3){border-left-color:var(--green-lt)}
.kpi-rot{display:block;color:var(--muted);font-family:var(--mono);font-size:10.5px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.kpi-val{display:block;color:var(--green);font-size:24px;font-weight:800;
  letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-val i{font-style:normal;font-size:12.5px;font-weight:600;color:var(--muted);font-family:var(--mono)}

/* ── Ações ───────────────────────────────── */
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.btn-act{background:var(--card);border:1px solid var(--line);color:var(--green);
  border-radius:9px;padding:10px 16px;font-family:var(--mono);font-size:12.5px;font-weight:700}
.btn-act:hover{border-color:var(--gold);background:#fff}
.btn-act.primary{background:var(--gold);border-color:var(--gold);color:#3A3117}
.btn-act.primary:hover{background:var(--gold-dk)}
.busca{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);
  border-radius:9px;background:#fff;font-size:14px;color:var(--text)}
.busca:focus{border-color:var(--gold);outline:none}

/* ── Lista de talhões ────────────────────── */
.tal-list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tal{display:grid;grid-template-columns:4px 1fr auto auto;align-items:center;gap:14px;
  padding:13px 17px;border-bottom:1px solid var(--line-soft)}
.tal:last-child{border-bottom:none}
.tal:hover{background:#fff}
.tal-bar{width:4px;height:34px;background:var(--line-soft);border-radius:3px;overflow:hidden;
  display:flex;align-items:flex-end}
.tal-bar i{display:block;width:100%;background:var(--leaf);border-radius:3px;height:100%}
.tal-nome{color:var(--green);font-size:15px;font-weight:700;min-width:0}
.pill{display:inline-block;margin-left:8px;background:var(--gold-soft);color:var(--amber);
  font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
  vertical-align:middle;letter-spacing:.03em}
.tal-ha{color:var(--green);font-size:15.5px;font-weight:800;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-family:var(--mono)}
.tal-ha span{color:var(--muted);font-size:11px;font-weight:600}
.tal-acts{display:flex;gap:6px}
.tal-acts button{background:none;border:1px solid var(--line);border-radius:7px;
  padding:6px 11px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted)}
.tal-acts button:hover{border-color:var(--gold);color:var(--green)}
.tal-acts .rm:hover{border-color:var(--red);color:var(--red)}

/* ── Modal ───────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(34,57,43,.55);display:flex;
  align-items:center;justify-content:center;padding:16px;z-index:200}
.modal{background:var(--card);border-radius:14px;padding:23px;width:100%;max-width:440px;
  max-height:88vh;overflow-y:auto;border-top:4px solid var(--gold)}
.modal h2{color:var(--green);font-size:19px;font-weight:800;margin-bottom:5px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:19px}
.frm{display:flex;flex-direction:column;gap:13px}
.frm label{display:block;color:var(--green);font-family:var(--mono);font-size:11px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.frm input,.frm select{width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--text);font-size:15px}
.frm input:focus,.frm select:focus{border-color:var(--gold);outline:none}
.modal-acts{display:flex;gap:10px;margin-top:21px}
.modal-acts button{flex:1;padding:12px;border-radius:9px;font-size:14px;font-weight:800;border:none}
.btn-cancel{background:var(--line-soft);color:var(--muted)}
.btn-cancel:hover{background:#E5E1D7}
.btn-save{background:var(--gold);color:#3A3117}
.btn-save:hover{background:var(--gold-dk)}

#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom));background:var(--green);color:#EDF1EB;
  padding:12px 21px;border-radius:9px;font-size:14px;font-weight:600;z-index:300;
  display:none;max-width:90vw;text-align:center;box-shadow:0 4px 18px rgba(34,57,43,.3)}

.stub{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);
  border-radius:14px;padding:42px 24px;text-align:center;margin-top:20px}
.stub .ic{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:16px;
  background:var(--leaf-soft);color:var(--green);margin-bottom:17px}
.stub .ic svg{width:30px;height:30px}
.stub h2{color:var(--green);font-size:21px;font-weight:800;margin-bottom:9px}
.stub p{color:var(--muted);font-size:14px;max-width:430px;margin:0 auto 21px;line-height:1.55}

/* ── Colheita: abas ──────────────────────── */
.abas{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.ab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;
  padding:11px 15px;font-family:var(--mono);font-size:12.5px;font-weight:700;
  color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.ab:hover{color:var(--green)}
.ab.on{color:var(--green);border-bottom-color:var(--gold)}
.ab b{background:var(--line-soft);color:var(--muted);font-size:10px;padding:2px 6px;border-radius:5px;font-weight:700}
.ab.on b{background:var(--gold-soft);color:var(--amber)}
.kpis-4{grid-template-columns:repeat(4,1fr)}
.kpis-4 .kpi:nth-child(4){border-left-color:var(--gold)}
.sel-f{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;
  font-family:var(--mono);font-size:12.5px;color:var(--green)}
.sel-f:focus{border-color:var(--gold);outline:none}

/* ── Tabela ──────────────────────────────── */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:var(--line-soft);color:var(--green);font-family:var(--mono);font-size:10.5px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-align:left;
  padding:10px 13px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#fff}
.tbl .num{text-align:right}
.tbl .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.tbl .forte{font-weight:800;color:var(--green)}
.tbl .alerta{color:var(--red);font-weight:700}
.tbl tr.pendente td{opacity:.5}
.tagdest{background:var(--leaf-soft);color:var(--green);font-family:var(--mono);font-size:10.5px;
  font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap}
.tal-col{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted);font-size:12.5px}
.acoes{display:flex;gap:6px;justify-content:flex-end}
.acoes button{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 10px;
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
.acoes button:hover{border-color:var(--gold);color:var(--green)}
.acoes .rm:hover{border-color:var(--red);color:var(--red)}
.sc-ha{font-weight:800}
.sc-ha.bom{color:var(--leaf-dk)}
.sc-ha.baixo{color:var(--red)}
input.silo{width:62px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;
  background:#fff;font-family:var(--mono);font-size:12.5px;text-align:center;color:var(--green)}
input.silo:focus{border-color:var(--gold);outline:none}

/* ── Resumo ──────────────────────────────── */
.resumo{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);
  border-radius:12px;padding:19px;margin-top:18px}
.resumo-t{color:var(--green);font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;margin-bottom:14px}
.resumo-g{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.rl{display:flex;flex-direction:column;gap:3px;padding:11px 13px;background:var(--bg);border-radius:9px}
.rl span{color:var(--muted);font-size:11.5px}
.rl b{color:var(--green);font-family:var(--mono);font-size:16px;font-weight:800;
  font-variant-numeric:tabular-nums}
.rl.forte{background:var(--gold-soft)}
.rl.forte b{color:var(--amber);font-size:19px}
.resumo-obs{color:var(--muted);font-size:12px;margin-top:13px;line-height:1.5}

/* ── Modal de carga ──────────────────────── */
.modal-lg{max-width:600px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.calc{display:flex;flex-wrap:wrap;gap:9px;background:var(--bg);border-radius:9px;padding:13px}
.calc span{display:flex;flex-direction:column;gap:2px;min-width:88px}
.calc i{font-style:normal;color:var(--muted);font-size:10.5px;font-family:var(--mono);
  letter-spacing:.05em;text-transform:uppercase}
.calc b{color:var(--green);font-family:var(--mono);font-size:14.5px;font-weight:800;
  font-variant-numeric:tabular-nums}
.calc b.neg{color:var(--red)}
.calc b.ok{color:var(--leaf-dk)}
.calc .nota{flex-basis:100%;color:var(--muted);font-size:11.5px;min-width:0}
.item{display:grid;grid-template-columns:1fr 130px 34px;gap:8px;margin-bottom:8px;align-items:center}
.item select,.item input{padding:10px 11px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-size:14px;color:var(--text);width:100%}
.item select:focus,.item input:focus{border-color:var(--gold);outline:none}
.item button{background:none;border:1px solid var(--line);border-radius:8px;padding:9px;
  color:var(--muted);font-size:13px}
.item button:hover{border-color:var(--red);color:var(--red)}
.btn-mini{background:none;border:1px dashed var(--line);border-radius:8px;padding:8px 13px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted)}
.btn-mini:hover{border-color:var(--gold);color:var(--green)}
.dica{color:var(--muted);font-size:11.5px;margin-top:6px}

/* ── Cadastros ───────────────────────────── */
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bloco{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px}
.bloco-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.bloco-h h3{color:var(--green);font-size:15px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--leaf-soft);color:var(--green);
  font-family:var(--mono);font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:7px}
.chip button{background:none;border:none;color:var(--muted);font-size:12px;padding:0 2px}
.chip button:hover{color:var(--red)}
.lista-cam{display:flex;flex-direction:column}
.cam{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.cam:last-child{border-bottom:none}
.cam .mono{font-family:var(--mono);font-weight:700;color:var(--green);font-size:12.5px}
.cam span:nth-child(2){color:var(--muted)}
.cam button{background:none;border:none;color:#CFCABD;font-size:13px;padding:3px 6px}
.cam button:hover{color:var(--red)}
.vazio{color:var(--muted);font-size:13px;padding:8px 0}

@media(max-width:640px){
  .kpis-4{grid-template-columns:1fr 1fr}
  .resumo-g{grid-template-columns:1fr}
  .dupla{grid-template-columns:1fr}
  .g2,.g3{grid-template-columns:1fr}
  .hide-sm{display:none}
  .tbl table{font-size:12.5px}
  .tbl th,.tbl td{padding:9px 10px}
  .modal-lg{max-width:100%}
  .item{grid-template-columns:1fr 100px 32px}
  .calc span{min-width:calc(50% - 5px)}
}

/* ── Pluviometria ────────────────────────── */
.mesnav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.mn-b{width:38px;height:38px;border:1px solid var(--line);background:var(--card);
  border-radius:9px;font-size:19px;color:var(--green);line-height:1}
.mn-b:hover:not(:disabled){border-color:var(--gold)}
.mn-b:disabled{opacity:.35;cursor:not-allowed}
.mn-s{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card);
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--green);min-width:160px}
.mn-s:focus{border-color:var(--gold);outline:none}
.mn-modo{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.mn-modo button{background:none;border:none;padding:10px 15px;font-family:var(--mono);
  font-size:12px;font-weight:700;color:var(--muted)}
.mn-modo button.on{background:var(--gold);color:#3A3117}
.mn-modo button:not(.on):hover{background:var(--line-soft)}

/* calendário de dias */
.dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px;margin-bottom:18px}
.dq{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.dq i{font-style:normal;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted)}
.dq u{text-decoration:none;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--blue)}
.dq:hover{border-color:var(--gold)}
.dq.tem{background:var(--blue-soft);border-color:#C9DCEA}
.dq.tem i{color:var(--blue)}
.dq.sel{background:var(--green);border-color:var(--green)}
.dq.sel i,.dq.sel u{color:#fff}

/* lançamento do dia */
.lanc{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--blue);
  border-radius:12px;padding:18px;margin-bottom:18px}
.lanc-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid var(--line-soft)}
.lanc-h h3{color:var(--green);font-size:17px;font-weight:800}
.lanc-h span{color:var(--muted);font-family:var(--mono);font-size:12px}
.lp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line-soft)}
.lp:last-child{border-bottom:none}
.lp label{color:var(--green);font-size:14.5px;font-weight:700}
.lp-in{display:flex;align-items:center;gap:7px}
.lp-in input{width:96px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-family:var(--mono);font-size:15px;text-align:right;color:var(--green)}
.lp-in input:focus{border-color:var(--blue);outline:none}
.lp-in span{color:var(--muted);font-family:var(--mono);font-size:12px;width:20px}

/* grade mensal */
.grade table{font-size:12.5px}
.grade th.fix,.grade td.fix{position:sticky;left:0;background:var(--line-soft);z-index:2;
  font-family:var(--mono);font-weight:700;color:var(--green);min-width:54px;text-align:left}
.grade tbody td.fix{background:var(--card)}
.grade tr.molhado td.fix{background:var(--blue-soft);color:var(--blue)}
.grade td{padding:3px 4px}
.grade th{padding:9px 7px;font-size:9.5px}
input.gr{width:100%;min-width:46px;padding:6px 5px;border:1px solid transparent;border-radius:6px;
  background:transparent;font-family:var(--mono);font-size:12.5px;text-align:center;color:var(--green)}
input.gr:hover{border-color:var(--line)}
input.gr:focus{border-color:var(--blue);background:#fff;outline:none}
.grade .tot{background:var(--gold-soft);font-weight:800;color:var(--amber)}
.grade tfoot td{background:var(--line-soft);font-weight:800;color:var(--green);
  border-top:2px solid var(--line);padding:10px 7px}
.grade tfoot td.tot{background:var(--gold);color:#3A3117}

/* acumulado */
.acum{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ac{background:var(--bg);border-radius:9px;padding:11px 13px;display:flex;
  flex-direction:column;gap:3px}
.ac span{color:var(--muted);font-size:11.5px}
.ac b{color:var(--green);font-family:var(--mono);font-size:16px;font-weight:800}
.ac b i{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}

@media(max-width:640px){
  .mesnav{gap:7px}
  .mn-s{flex:1;min-width:0}
  .mn-modo{width:100%;order:5}
  .mn-modo button{flex:1}
  .mesnav .btn-act{flex:1}
  .dias{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
  .dq{padding:6px 2px}
  .acum{grid-template-columns:1fr 1fr}
}

.grade td.fix.dia{min-width:66px;color:var(--red);font-weight:800}
.grade tfoot tr.med td{background:var(--bg);color:var(--muted);font-weight:700;border-top:1px solid var(--line)}
.grade tfoot tr.med td.tot{background:var(--gold-soft);color:var(--amber)}

/* ── Baixa de carga ──────────────────────── */
.tbl tr.transito td{background:#FFFDF6}
.sit{font-family:var(--mono);font-size:10px;font-weight:800;padding:4px 9px;
  border-radius:6px;white-space:nowrap;letter-spacing:.04em}
.sit.ok{background:var(--leaf-soft);color:var(--leaf-dk)}
.sit.tr{background:var(--gold-soft);color:var(--amber)}
.tbl i.est{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--amber);
  margin-left:4px;font-weight:700}
.acoes .bx{background:var(--gold);border-color:var(--gold);color:#3A3117;font-weight:800}
.acoes .bx:hover{background:var(--gold-dk);border-color:var(--gold-dk);color:#2C2611}
.frm span.pad{display:block;color:var(--muted);font-family:var(--mono);font-size:10px;margin-top:4px}
.rateio{display:flex;flex-direction:column;gap:6px}
.rt{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg);border-radius:8px;padding:9px 13px}
.rt span{color:var(--green);font-size:13.5px;font-weight:600}
.rt span u{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--line-soft);padding:1px 6px;border-radius:4px;margin-left:4px}
.rt b{color:var(--leaf-dk);font-family:var(--mono);font-size:14px;font-weight:800}
.tbl tfoot td{background:var(--line-soft);font-weight:800;color:var(--green);
  border-top:2px solid var(--line);padding:11px 13px}
.tbl tfoot td.fix{font-family:var(--mono)}

.tbl u.cmp{text-decoration:none;font-size:10px;font-weight:700;color:var(--muted);
  background:var(--line-soft);padding:1px 5px;border-radius:4px;margin:0 2px}
.tbl u.cmp.alerta{background:var(--red-soft);color:var(--red)}

/* ── Operações ───────────────────────────── */
.tbl tr.ap-ini td{border-top:2px solid var(--line)}
.tbl td u.tp{display:block;text-decoration:none;font-family:var(--mono);font-size:9px;
  color:var(--muted);margin-top:3px;letter-spacing:.04em}
.tbl td u.ob{display:block;text-decoration:none;font-size:11px;color:var(--muted);
  font-weight:400;margin-top:3px}
.tbl i.un{font-style:normal;font-size:10px;color:var(--muted);font-family:var(--mono)}
.tbl i.sp{font-style:normal;font-size:10.5px;color:var(--amber);font-family:var(--mono)}
.tbl td.vaz{color:var(--muted);font-style:italic;font-size:12.5px}
.barra{display:inline-block;width:64px;height:6px;background:var(--line-soft);
  border-radius:3px;overflow:hidden;vertical-align:middle}
.barra i{display:block;height:100%;background:var(--gold);border-radius:3px}
u.pc{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:7px}
.tsel{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow-y:auto;
  border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}
.tc{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid transparent;
  border-radius:7px;padding:5px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tc input{width:13px;height:13px;margin:0}
.tc.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--green);font-weight:700}
.item-p{grid-template-columns:1fr 110px 34px}

.descs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dsc label{display:block;color:var(--green);font-family:var(--mono);font-size:11px;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.dsc-in{display:grid;grid-template-columns:1fr 1.15fr;gap:6px}
.dsc-c{position:relative;display:block}
.dsc-c input{width:100%;padding:11px 30px 11px 11px;border:1px solid var(--line);
  border-radius:8px;background:#fff;font-family:var(--mono);font-size:14px;
  text-align:right;color:var(--green)}
.dsc-c input:focus{border-color:var(--gold);outline:none}
.dsc-c i{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);pointer-events:none}
@media(max-width:640px){ .descs{grid-template-columns:1fr} }

.lav table{font-size:13px}
.lav td{padding:6px 8px}
input.lv{width:100%;padding:8px 9px;border:1px solid transparent;border-radius:7px;
  background:transparent;font-size:13px;color:var(--text)}
input.lv:hover{border-color:var(--line);background:#fff}
input.lv:focus{border-color:var(--gold);background:#fff;outline:none}
input.lv-n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input.lv-s{font-family:var(--mono);text-align:center;max-width:80px}
input.lv-d{font-family:var(--mono);font-size:12.5px;min-width:130px}
.lav tr.pendente td{opacity:1}
.lav tr.pendente td.forte{color:var(--muted)}

.lanc-tudo{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--bg);
  border-radius:9px;padding:11px 13px;margin-bottom:14px}
.lanc-tudo input{width:100px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-family:var(--mono);font-size:14px;text-align:right;color:var(--green)}
.lanc-tudo input:focus{border-color:var(--blue);outline:none}
.lanc-tudo .dica{flex:1;min-width:180px;margin:0;font-size:11.5px}
@media(max-width:640px){ .lanc-tudo .dica{flex-basis:100%} .lanc-tudo .btn-act{flex:0 0 auto} }

.ver-chip{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#9FB09E;
  background:rgba(255,255,255,.08);padding:3px 8px;border-radius:6px;letter-spacing:.03em}

.tbl tr.neg-row td{background:#FDF4F2}

.mapa-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:auto;padding:8px;-webkit-overflow-scrolling:touch}
.mapa-wrap img{display:block;width:100%;height:auto;border-radius:8px;cursor:zoom-in}
.mapa-wrap img:active{cursor:zoom-out}
@media(max-width:640px){ .mapa-wrap img{min-width:760px;cursor:default} }
a.btn-act{display:inline-block;text-decoration:none;line-height:1.3}

/* ── Tempo ───────────────────────────────── */
.tempo-agora{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:13px;padding:20px 22px}
.ta-ico{font-size:52px;line-height:1}
.ta-mid{display:flex;flex-direction:column;gap:2px}
.ta-mid b{font-size:38px;font-weight:800;color:var(--green);line-height:1;letter-spacing:-.03em}
.ta-mid span{color:var(--muted);font-size:13.5px}
.ta-det{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
.ta-det span{display:flex;flex-direction:column;gap:2px;color:var(--green);
  font-family:var(--mono);font-size:15px;font-weight:700}
.ta-det i{font-style:normal;color:var(--muted);font-size:10.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase}
.dias7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.d7{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 9px;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.d7.molha{border-color:#C9DCEA;background:var(--blue-soft)}
.d7-dia{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--green);line-height:1.3}
.d7-dia u{display:block;text-decoration:none;font-size:10px;color:var(--muted);font-weight:600}
.d7-ico{font-size:26px;line-height:1}
.d7-t b{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--green)}
.d7-t i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:5px}
.d7-ch{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.3}
.d7-ch.tem{color:var(--blue);font-weight:700}
.d7-ch u{display:block;text-decoration:none;font-size:10px;color:var(--muted);font-weight:600}
.d7-d{font-size:10.5px;color:var(--muted);line-height:1.25}
.lc-lista{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.lc-op{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.lc-op:hover{border-color:var(--gold);background:#fff}
.lc-op b{color:var(--green);font-size:14px}
.lc-op span{color:var(--muted);font-family:var(--mono);font-size:11px}
@media(max-width:640px){
  .dias7{grid-template-columns:repeat(2,1fr)}
  .ta-det{margin-left:0;width:100%;gap:16px}
  .ta-mid b{font-size:32px}
}

/* ── Cotações ────────────────────────────── */
.cot-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);
  border-radius:13px;padding:20px 22px 6px;margin-bottom:16px;overflow:hidden}
.cot-top{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:6px}
.cot-rot{display:block;color:var(--muted);font-family:var(--mono);font-size:10.5px;
  font-weight:700;letter-spacing:.09em;margin-bottom:5px}
.cot-val b{display:block;font-size:36px;font-weight:800;color:var(--green);
  letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.cot-val u{display:inline-block;text-decoration:none;margin-top:7px;font-family:var(--mono);
  font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px}
.cot-val u.sobe{background:var(--leaf-soft);color:var(--leaf-dk)}
.cot-val u.desce{background:var(--red-soft);color:var(--red)}
.cot-lados{margin-left:auto;display:flex;gap:20px;flex-wrap:wrap}
.cot-lados span{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);
  font-size:14px;font-weight:700;color:var(--green)}
.cot-lados i,.cot-pe i{font-style:normal;color:var(--muted);font-size:10px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase}
.spark{display:block;width:100%;height:110px;margin:4px 0}
.cot-pe{display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid var(--line-soft);
  padding:12px 0;margin-top:2px}
.cot-pe span{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);
  font-size:13.5px;font-weight:700;color:var(--green)}
.ptax{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-left:4px solid var(--green);border-radius:11px;
  padding:15px 18px;margin-bottom:16px}
.ptax b{display:block;color:var(--green);font-size:14.5px;font-weight:800}
.ptax span{color:var(--muted);font-size:12px}
.ptax-v{margin-left:auto;display:flex;gap:20px}
.ptax-v span{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);
  font-size:14px;font-weight:700;color:var(--green)}
.ptax-v i{font-style:normal;color:var(--muted);font-size:10px;letter-spacing:.07em;text-transform:uppercase}
.cot-up{color:var(--leaf-dk);font-weight:700}
.cot-down{color:var(--red);font-weight:700}
.fontes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fonte{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:15px 17px;text-decoration:none}
.fonte:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(34,57,43,.07)}
.fonte b{color:var(--green);font-size:15px;font-weight:800}
.fonte span{color:var(--muted);font-size:12.5px}
.fonte u{text-decoration:none;color:var(--gold-dk);font-family:var(--mono);
  font-size:11px;font-weight:700;margin-top:4px}
@media(max-width:640px){
  .cot-val b{font-size:30px}
  .cot-lados,.ptax-v{margin-left:0;width:100%;gap:16px}
  .cot-pe{gap:16px}
}

input.auto{background:var(--leaf-soft)!important;border-color:var(--leaf)!important;
  color:var(--leaf-dk)!important;font-family:var(--mono);font-weight:800;text-align:right;
  cursor:default}
input.auto.estouro{background:var(--red-soft)!important;border-color:var(--red)!important;
  color:var(--red)!important}
.dica b.erro{color:var(--red)}

/* ── Importar XML ────────────────────────── */
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--line);
  border-radius:11px;padding:24px 18px;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover{border-color:var(--gold);background:#fff}
.drop b{color:var(--green);font-size:15px}
.drop span{color:var(--muted);font-size:12.5px}

.nfe-cab{display:flex;gap:22px;flex-wrap:wrap;background:var(--leaf-soft);border-radius:10px;
  padding:13px 16px;margin-top:14px}

  letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.nfe-cab b{color:var(--green);font-size:14px}
.nfe-itens{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:280px;overflow-y:auto}
.nfe-it{display:grid;grid-template-columns:26px 1fr 170px;gap:10px;align-items:center;
  background:var(--bg);border-radius:9px;padding:10px 12px}
.nfe-it.fora{opacity:.45}
.nfe-ck input{width:16px;height:16px}
.nfe-nome b{display:block;color:var(--green);font-size:13.5px;line-height:1.3}
.nfe-nome span{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.nfe-sel{padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;

/* ═══════════════════════════════════════════════════
   STORAGE — offline-first, seguro no iOS
   ═══════════════════════════════════════════════════ */
const _mem = {};
function _storageOk(kind){
  try{ const s = window[kind], k = "__t__"; s.setItem(k,"1"); s.removeItem(k); return true; }
  catch(e){ return false; }
}
const _ls = _storageOk("localStorage") ? localStorage
          : _storageOk("sessionStorage") ? sessionStorage : null;


/* Só os blocos da fazenda e a lista de fazendas vão para a nuvem */
function ehBloco(k){
  if(k === "fazendas") return true;
  const m = String(k).match(/^faz_(.+)_([a-z]+)$/);
  return !!(m && typeof BLOCOS !== "undefined" && BLOCOS.includes(m[2]));
}

const Store = {
  get(k,d){
    try{
      if(_ls){ const v=_ls.getItem("sm_"+k); if(v!=null) return JSON.parse(v); }
      return (k in _mem) ? _mem[k] : d;
    }catch(e){ return d; }
  },
  set(k,v){
    _mem[k]=v;
    try{ if(_ls) _ls.setItem("sm_"+k, JSON.stringify(v)); }catch(e){}
    if(typeof Sync!=="undefined" && Sync.marcar && !Sync._aplicando && ehBloco(k)) Sync.marcar(k);
  },
  del(k){ delete _mem[k]; try{ if(_ls) _ls.removeItem("sm_"+k); }catch(e){} },
  persistent(){ return _ls !== null; }
};

/* ═══════════════════════════════════════════════════

   ═══════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════

const SUPABASE = {
  url: "https://zdckrfthpfpnzcxzaghd.supabase.co",

  ligado(){ return !!(this.url && this.anonKey); }
};

/* Blocos de estado que sobem para a nuvem */
const BLOCOS = ["talhoes","cargas","armazens","caminhoes","silocap","bases","chuva",
                "lavoura","produtos","aplicacoes","entradas","docs","mapa"];

/* ── Sessão ──────────────────────────────── */
const Auth = {
  sessao(){ return Store.get("sb_sessao", null); },
  usuario(){ const s=this.sessao(); return s && s.user ? s.user : null; },
  logado(){ return !!this.sessao(); },
  async entrar(email, senha){
    const r = await fetch(SUPABASE.url+"/auth/v1/token?grant_type=password", {
      method:"POST",
      headers:{ "apikey":SUPABASE.anonKey, "Content-Type":"application/json" },
      body: JSON.stringify({ email:email.trim(), password:senha })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error_description || d.msg || d.message || "Não consegui entrar");
    Store.set("sb_sessao", { token:d.access_token, refresh:d.refresh_token,
      expira: Date.now() + (d.expires_in||3600)*1000, user:d.user });
    return d.user;
  },
  async criar(email, senha){
    const r = await fetch(SUPABASE.url+"/auth/v1/signup", {
      method:"POST",
      headers:{ "apikey":SUPABASE.anonKey, "Content-Type":"application/json" },
      body: JSON.stringify({ email:email.trim(), password:senha })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error_description || d.msg || d.message || "Não consegui criar a conta");
    if(d.access_token)
      Store.set("sb_sessao", { token:d.access_token, refresh:d.refresh_token,
        expira: Date.now() + (d.expires_in||3600)*1000, user:d.user });
    return d;
  },
  async renovar(){
    const s = this.sessao(); if(!s || !s.refresh) return false;
    try{
      const r = await fetch(SUPABASE.url+"/auth/v1/token?grant_type=refresh_token", {
        method:"POST",
        headers:{ "apikey":SUPABASE.anonKey, "Content-Type":"application/json" },
        body: JSON.stringify({ refresh_token:s.refresh })
      });
      const d = await r.json();
      if(!r.ok) return false;
      Store.set("sb_sessao", { token:d.access_token, refresh:d.refresh_token,
        expira: Date.now() + (d.expires_in||3600)*1000, user:d.user||s.user });
      return true;
    }catch(e){ return false; }
  },
  sair(){
    Store.del("sb_sessao");
    Store.del("sync_fila"); Store.del("sync_sujo"); Store.del("sync_ultimo");
  },
  async token(){
    const s = this.sessao(); if(!s) return null;
    if(Date.now() > s.expira - 60000){ await this.renovar(); }
    const n = this.sessao();
    return n ? n.token : null;

/* ── Chamada à API ───────────────────────── */
async function api(caminho, opcoes){
  const t = await Auth.token();
  if(!t) throw new Error("sem sessão");
  const o = opcoes || {};
  const r = await fetch(SUPABASE.url+"/rest/v1/"+caminho, {
    method: o.method || "GET",
    headers: Object.assign({
      "apikey": SUPABASE.anonKey,
      "Authorization": "Bearer "+t,
      "Content-Type": "application/json",
      "Prefer": o.prefer || "return=representation"
    }, o.headers||{}),
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  if(r.status === 204) return null;
  const d = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((d && (d.message||d.hint)) || "erro "+r.status);
  return d;
}

/* ── Sincronização ───────────────────────── */
const Sync = {
  sujos(){ return Store.get("sync_sujo", []); },
  marcar(chave){
    if(!SUPABASE.ligado()) return;
    const l = this.sujos();
    if(!l.includes(chave)){ l.push(chave); Store.set("sync_sujo", l); }
    this.render();
  },
  pending(){ return this.sujos().length; },
  push(){ /* mantido por compatibilidade: o que conta é marcar() */ },

  async subir(){
    let sujos = this.sujos();
    if(!sujos.length) return 0;
    // A fazenda precisa existir na nuvem antes dos blocos dela:
    // é o vínculo de membro que libera a gravação do resto.
    sujos = sujos.slice().sort((a,b)=>
      (a==="fazendas"?0:1) - (b==="fazendas"?0:1));
    const restam = []; let erro = null;
    for(const chave of sujos){
      try{
        if(chave === "fazendas"){
          const l = fazendas();
          for(const f of l){
            await api("safra_fazendas", { method:"POST",
              prefer:"resolution=merge-duplicates,return=minimal",
              body:{ id:f.id, nome:f.nome, produtor:f.produtor||null,
                     municipio:f.municipio||null, uf:f.uf||null, safra:f.safra||null,
                     lat:f.lat??null, lon:f.lon??null } });
          }
        }else{
          const [_, fid, bloco] = chave.match(/^faz_(.+)_([a-z]+)$/) || [];
          if(!fid) continue;
          await api("safra_estado", { method:"POST",
            prefer:"resolution=merge-duplicates,return=minimal",
            headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
            body:{ fazenda_id:fid, chave:bloco, dados: Store.get(chave, null) } });
        }
      }catch(e){ restam.push(chave); erro = e; }
    }
    if(erro) Store.set("sync_erro", String(erro.message||erro));
    else Store.del("sync_erro");
    Store.set("sync_sujo", restam);
    this.render();
    return sujos.length - restam.length;
  },

  async baixar(){
    this._aplicando = true;
    try{
    const fz = await api("safra_fazendas?select=*");
    const locais = fazendas();
    const mapa = {}; locais.forEach(f=>mapa[f.id]=f);
    (fz||[]).forEach(r=>{
      const atual = mapa[r.id] || {};
      mapa[r.id] = Object.assign({}, atual, {
        id:r.id, nome:r.nome, produtor:r.produtor||"", municipio:r.municipio||"",
        uf:r.uf||"", safra:r.safra||atual.safra||safraAtual(),
        lat:r.lat??null, lon:r.lon??null,
        talhoes:atual.talhoes||0, hectares:atual.hectares||0 });
    });
    Store.set("fazendas", Object.values(mapa));

    const est = await api("safra_estado?select=fazenda_id,chave,dados,atualizado_em");
    const sujos = this.sujos();
    (est||[]).forEach(r=>{
      const chave = "faz_"+r.fazenda_id+"_"+r.chave;
      if(sujos.includes(chave)) return;   // mudança local ainda não enviada tem prioridade
      if(r.dados != null) Store.set(chave, r.dados);
    });
    (fz||[]).forEach(r=>recontarFazenda(r.id));
    Store.set("sync_ultimo", new Date().toISOString());
    return (fz||[]).length;
    } finally { this._aplicando = false; }
  },

  async rodar(){
    if(!SUPABASE.ligado() || !Auth.logado() || !navigator.onLine) { this.render(); return; }
    if(this._rodando) return;
    this._rodando = true;
    try{
      await this.subir();
      await this.baixar();
      if(!this.pending()) Store.del("sync_erro");
      this.render();
    }catch(e){ Store.set("sync_erro", String(e.message||e)); this.render(); }
    finally{ this._rodando = false; }
  },

  async flush(){ return this.rodar(); },

  render(){
    const el = document.getElementById("sync-chip");
    if(!el) return;
    const n = this.pending(), on = navigator.onLine;
    if(!SUPABASE.ligado()){
      el.className="sync-chip off";
      el.innerHTML='<span class="sync-dot"></span> Só neste aparelho'; return;
    }
    if(!Auth.logado()){
      el.className="sync-chip off";
      el.innerHTML='<span class="sync-dot"></span> Fora da conta'; return;
    }
    if(on && !n){ el.className="sync-chip";
      el.innerHTML='<span class="sync-dot"></span> Sincronizado na nuvem'; }
    else if(!on){ el.className="sync-chip off";
      el.innerHTML='<span class="sync-dot"></span> Sem sinal'+(n?" · "+n+" a enviar":""); }
    else { el.className="sync-chip off";
      el.innerHTML='<span class="sync-dot"></span> '+n+" a enviar"; }
  }
};

window.addEventListener("online",  ()=>{ Sync.flush(); render(); });
window.addEventListener("offline", ()=>{ render(); });

/* Lançamento: só o peso da balança da fazenda.
   A umidade daqui é referência — quem desconta é o armazém, na baixa. */
function calcCarga(c){
  const bruto = Number(c.peso_bruto)||0;
  const tara  = Number(c.tara)||0;
  const liq   = Math.max(0, bruto - tara);
  return { liquido:liq, sacas:liq/SACA_KG };
}

function proximoCodigo(f){
  const n = cargasDe(f).length + 1;
  return "C-" + String(n).padStart(5,"0");
}

function salvarCarga(f, dados, id){

    id:"cg_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    fazenda_id:f, codigo:proximoCodigo(f), criado_em:new Date().toISOString()

/* ═══════════════════════════════════════════════════
   BAIXA DA CARGA
   A carga sai da fazenda com o peso da balança. Só vira
   produtividade quando volta o romaneio do armazém, com
   os descontos reais de umidade, impureza e avariados.
   ═══════════════════════════════════════════════════ */
const BASE_PADRAO = { umidade:14, impureza:1, avariados:6 };
function kBases(f){ return "faz_"+f+"_bases"; }
function basesDe(f){ return Store.get(kBases(f), BASE_PADRAO); }

/* Desconto: o kg vale o que veio no romaneio. A fórmula só
   sugere quando o campo está vazio — cada armazém tem sua regra. */
function sugerirDesc(tipo, liq, pct, bases){
  const p = Number(pct)||0;
  if(tipo==="umidade"){
    const b = Number(bases.umidade);
    return p > b ? Math.round(liq * ((p-b)/(100-p))) : 0;
  }
  const b = Number(tipo==="impureza" ? bases.impureza : bases.avariados);
  return p > b ? Math.round(liq * (p-b)/100) : 0;
}

function calcBaixa(b){
  const liq   = Number(b.liquido)||0;
  const dUmid = Math.max(0, Number(b.desc_umidade)||0);
  const dImp  = Math.max(0, Number(b.desc_impureza)||0);
  const dAvar = Math.max(0, Number(b.desc_avariados)||0);
  const final = Math.max(0, liq - dUmid - dImp - dAvar);
  return { desc_umidade:dUmid, desc_impureza:dImp, desc_avariados:dAvar,
           desc_total:dUmid+dImp+dAvar, peso_final:final, sacas_final:final/SACA_KG };
}

function cargaBaixada(c){ return !!(c.baixa && c.baixa.data); }
function sacasValidas(c){ return cargaBaixada(c) ? c.baixa.sacas_final : 0; }

function darBaixa(f, id, dados){
  const l = cargasDe(f), i = l.findIndex(x=>x.id===id);
  if(i<0) return null;
  const calc = calcBaixa(dados);
  l[i].baixa = Object.assign({}, dados, calc);
  l[i].status = "baixada";
  Store.set(kCargas(f), l);
  Sync.push("cargas","upsert",l[i]);
  return l[i];
}
function desfazerBaixa(f, id){
  const l = cargasDe(f), i = l.findIndex(x=>x.id===id);
  if(i<0) return;
  delete l[i].baixa; l[i].status = "transito";
  Store.set(kCargas(f), l);
  Sync.push("cargas","upsert",l[i]);
}

/* Descontos acumulados da safra, por tipo e por destino */
function resumoDescontos(f){
  const l = cargasDe(f).filter(cargaBaixada);
  const tot = { umidade:0, impureza:0, avariados:0, total:0,
                bruto:0, final:0, cargas:l.length };
  const porDestino = {};
  l.forEach(c=>{
    const b=c.baixa;
    tot.umidade   += b.desc_umidade;
    tot.impureza  += b.desc_impureza;
    tot.avariados += b.desc_avariados;
    tot.total     += b.desc_total;
    tot.bruto     += Number(b.liquido)||0;
    tot.final     += b.peso_final;
    const d=c.destino||"—";
    if(!porDestino[d]) porDestino[d]={destino:d,cargas:0,bruto:0,umidade:0,impureza:0,avariados:0,total:0,final:0};
    const p=porDestino[d];
    p.cargas++; p.bruto+=Number(b.liquido)||0;
    p.umidade+=b.desc_umidade; p.impureza+=b.desc_impureza;
    p.avariados+=b.desc_avariados; p.total+=b.desc_total; p.final+=b.peso_final;
  });
  tot.pct = tot.bruto>0 ? tot.total/tot.bruto*100 : 0;
  return { tot, porDestino:Object.values(porDestino).sort((a,b)=>b.total-a.total) };
}

/* Produtividade: rateia as sacas de cada carga entre os talhões dela */
function produtividade(f){
  const tals = talhoesDe(f);
  const cap  = siloCap(f);
  const mapa = {};
  tals.forEach(t => mapa[t.id] = {
    id:t.id, nome:t.nome, hectares:t.hectares,
    sacas:0, cargas:0, silos:Number(t.silo)||0
  });

  // Só entra na produtividade a carga já baixada no armazém.
  cargasDe(f).filter(cargaBaixada).forEach(c=>{
    const itens = (c.talhoes||[]).filter(i=>mapa[i.talhao_id]);
    if(!itens.length) return;
    const somaKg = itens.reduce((s,i)=>s+(Number(i.kg)||0),0);
    const sc = c.baixa.sacas_final;
    itens.forEach(i=>{
      const frac = somaKg>0 ? (Number(i.kg)||0)/somaKg : 1/itens.length;
      mapa[i.talhao_id].sacas  += sc * frac;
      mapa[i.talhao_id].cargas += 1;
    });
  });

  const linhas = Object.values(mapa).map(t=>{
    const scSilo = t.silos * cap;
    const total  = t.sacas + scSilo;
    return Object.assign(t,{ sc_silo:scSilo, total_sc:total,
      sc_ha: t.hectares>0 ? total/t.hectares : 0,
      colhido: t.cargas>0 || t.silos>0 });
  });
  linhas.sort((a,b)=>b.sc_ha-a.sc_ha || a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));

  const colhidos = linhas.filter(l=>l.colhido);
  const haColh = colhidos.reduce((s,l)=>s+l.hectares,0);
  const scTot  = linhas.reduce((s,l)=>s+l.total_sc,0);
  const haTot  = linhas.reduce((s,l)=>s+l.hectares,0);
  return { linhas, colhidos,
    sacasArmazem: linhas.reduce((s,l)=>s+l.sacas,0),
    sacasSilo: linhas.reduce((s,l)=>s+l.sc_silo,0),
    totalSacas: scTot, haColhida: haColh, haTotal: haTot,
    prodColhida: haColh>0 ? scTot/haColh : 0,
    prodFazenda: haTot>0 ? scTot/haTot : 0 };
}

function definirSilo(f, talhaoId, qtd){
  const l = talhoesDe(f), t = l.find(x=>x.id===talhaoId);
  if(!t) return;
  t.silo = Number(qtd)||0;

/* ═══════════════════════════════════════════════════
   PLUVIOMETRIA — dias x pontos de medição
   Cada ponto é um pluviômetro. Pode cobrir um talhão
   ou um grupo deles ("Pivôs", "T1 T2").
   ═══════════════════════════════════════════════════ */
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
               "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function kChuva(f){ return "faz_"+f+"_chuva"; }
function chuvaDe(f){ return Store.get(kChuva(f), {}); }

/* A chuva é medida por talhão — os mesmos do cadastro da fazenda. */
function pontosDe(f){
  return talhoesDe(f).slice()
    .sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
}

/* A safra vai de outubro do 1º ano a setembro do 2º */
function mesesDaSafra(safra){
  const a = parseInt(String(safra).slice(0,4),10);
  const out = [];
  for(let m=9;m<12;m++) out.push({ano:a, mes:m});
  for(let m=0;m<9;m++) out.push({ano:a+1, mes:m});
  return out;
}
function diasNoMes(ano,mes){ return new Date(ano,mes+1,0).getDate(); }
function chaveDia(ano,mes,dia){
  return ano+"-"+String(mes+1).padStart(2,"0")+"-"+String(dia).padStart(2,"0");
}

/* Dias com chuva na safra, em ordem — é assim que a fazenda registra:
   só entra a linha do dia que choveu. */
function diasDeChuva(f, safra){
  const meses = mesesDaSafra(safra), todo = chuvaDe(f);
  const ini = chaveDia(meses[0].ano, meses[0].mes, 1);
  const ult = meses[meses.length-1];
  const fim = chaveDia(ult.ano, ult.mes, diasNoMes(ult.ano,ult.mes));
  return Object.keys(todo).filter(k=>k>=ini && k<=fim).sort();
}
const MES_ABREV = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function diaCurto(k){
  const p = String(k).split("-");
  return p[2]+"/"+MES_ABREV[parseInt(p[1],10)-1];
}

function lerChuva(f,dia,pontoId){
  const d = chuvaDe(f)[dia];
  return d && d[pontoId] != null ? Number(d[pontoId]) : null;
}
function gravarChuva(f,dia,pontoId,mm){
  const todo = chuvaDe(f);
  const v = (mm===""||mm==null) ? null : Number(String(mm).replace(",","."));
  if(!todo[dia]) todo[dia] = {};
  if(v==null || isNaN(v) || v<0) delete todo[dia][pontoId];
  else todo[dia][pontoId] = v;
  if(!Object.keys(todo[dia]).length) delete todo[dia];
  Store.set(kChuva(f), todo);
  Sync.push("chuva","upsert",{fazenda_id:f, dia:dia, ponto_id:pontoId, mm:v});
}

/* Totais do mês: por ponto, por dia e geral */
function resumoMes(f, ano, mes){
  const pts = pontosDe(f), nd = diasNoMes(ano,mes), todo = chuvaDe(f);
  const porPonto = {}, porDia = {};
  let geral = 0, diasComChuva = 0;
  pts.forEach(p=>porPonto[p.id]=0);
  for(let d=1; d<=nd; d++){
    const k = chaveDia(ano,mes,d), reg = todo[k] || {};
    let soma = 0, n = 0;
    pts.forEach(p=>{
      const v = reg[p.id];
      if(v!=null){ soma += v; n++; porPonto[p.id] += v; }
    });
    porDia[d] = { soma, n, media: n ? soma/n : 0 };
    if(n) diasComChuva++;
    geral += soma;
  }
  const medias = pts.map(p=>porPonto[p.id]);
  return { porPonto, porDia, geral, diasComChuva, nd,
           mediaPontos: medias.length ? medias.reduce((a,b)=>a+b,0)/medias.length : 0 };
}

function acumuladoSafra(f, safra){
  const pts = pontosDe(f);
  const por = {}; pts.forEach(p=>por[p.id]=0);
  let total = 0;
  mesesDaSafra(safra).forEach(({ano,mes})=>{
    const r = resumoMes(f,ano,mes);
    pts.forEach(p=>por[p.id]+=r.porPonto[p.id]||0);
    total += r.geral;
  });
  return { porPonto:por, total,
           media: pts.length ? total/pts.length : 0 };
}


/* ═══════════════════════════════════════════════════
   OPERAÇÕES NO TALHÃO
   Uma aplicação = data + área + tipo + a calda de
   produtos. Quantidade = dose × hectares.
   ═══════════════════════════════════════════════════ */
const TIPOS_OP = ["Pulverização terrestre","Pulverização aérea","Semeadura","Adubação"];

function kProd(f){ return "faz_"+f+"_produtos"; }
function kApl(f){ return "faz_"+f+"_aplicacoes"; }
function produtosDe(f){ return Store.get(kProd(f), []); }
function aplicacoesDe(f){ return Store.get(kApl(f), []); }
function acharProduto(f,id){ return produtosDe(f).find(p=>p.id===id)||null; }

function salvarProduto(f, d, id){
  const l = produtosDe(f);
  if(id){
    const p = l.find(x=>x.id===id); if(!p) return null;
    Object.assign(p,{nome:d.nome.trim(), unidade:d.unidade, preco:Number(d.preco)||0});
    Store.set(kProd(f),l); Sync.push("produtos","upsert",p); return p;
  }
  const novo = { id:"pr_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, nome:d.nome.trim(), unidade:d.unidade||"L", preco:Number(d.preco)||0 };
  l.push(novo); Store.set(kProd(f),l); Sync.push("produtos","upsert",novo);
  return novo;
}
function apagarProduto(f,id){
  Store.set(kProd(f), produtosDe(f).filter(p=>p.id!==id));
  Sync.push("produtos","delete",{id});
}

/* Linhas da aplicação: uma por produto, como no relatório */
function linhasAplicacao(f, a){
  const ha = Number(a.hectares)||0;
  return (a.itens||[]).map(i=>{
    const p = acharProduto(f, i.produto_id);
    const dose = Number(i.dose)||0;
    const qtd  = dose * ha;
    const preco = p ? Number(p.preco)||0 : 0;
    return { produto: p?p.nome:"(removido)", unidade: p?p.unidade:"L",
             dose, hectares:ha, qtd, preco, valor: qtd*preco, semPreco: preco<=0 };
  });
}
function custoAplicacao(f,a){
  return linhasAplicacao(f,a).reduce((s,l)=>s+l.valor,0);
}

function salvarAplicacao(f, d, id){
  const l = aplicacoesDe(f);
  const dados = { data:d.data, tipo:d.tipo, talhoes:d.talhoes||[],
                  hectares:Number(d.hectares)||0, obs:(d.obs||"").trim(),
                  itens:(d.itens||[]).filter(i=>i.produto_id && Number(i.dose)>0) };
  if(id){

    l[i] = Object.assign({}, l[i], dados);

  }
  const nova = Object.assign({ id:"ap_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, criado_em:new Date().toISOString() }, dados);

  return nova;
}
function apagarAplicacao(f,id){
  Store.set(kApl(f), aplicacoesDe(f).filter(a=>a.id!==id));
  Sync.push("aplicacoes","delete",{id});
}

/* Resumo: custo total, por tipo, por produto e por talhão */
function resumoOperacoes(f, tipo){
  let aps = aplicacoesDe(f);
  if(tipo) aps = aps.filter(a=>a.tipo===tipo);
  const porProduto = {}, porTipo = {}, porTalhao = {};
  let total = 0, haAplicada = 0, semPreco = 0;

  aps.forEach(a=>{
    const custo = custoAplicacao(f,a);
    total += custo;
    haAplicada += Number(a.hectares)||0;
    porTipo[a.tipo] = (porTipo[a.tipo]||0) + custo;
    linhasAplicacao(f,a).forEach(l=>{
      if(l.semPreco) semPreco++;
      if(!porProduto[l.produto]) porProduto[l.produto]={nome:l.produto,unidade:l.unidade,qtd:0,valor:0,aplic:0};
      const p=porProduto[l.produto];
      p.qtd+=l.qtd; p.valor+=l.valor; p.aplic++;
    });
    const n = (a.talhoes||[]).length || 1;
    (a.talhoes||[]).forEach(tid=>{
      if(!porTalhao[tid]) porTalhao[tid]={talhao_id:tid,valor:0,aplic:0};
      porTalhao[tid].valor += custo/n;
      porTalhao[tid].aplic++;
    });
  });

  return { aplicacoes:aps, total, haAplicada, semPreco,
    custoHa: haAplicada>0 ? total/haAplicada : 0,
    porProduto: Object.values(porProduto).sort((a,b)=>b.valor-a.valor),
    porTipo, porTalhao };
}

/* ═══════════════════════════════════════════════════
   DADOS DA LAVOURA — plantio por talhão
   Variedade, sementes por metro e janela de plantio.
   ═══════════════════════════════════════════════════ */
function kLavoura(f){ return "faz_"+f+"_lavoura"; }
function lavouraDe(f){ return Store.get(kLavoura(f), {}); }

function plantioDe(f, talId){
  const l = lavouraDe(f)[talId];
  return l || { variedade:"", area:null, sementes:"", inicio:"", fim:"" };
}
function salvarPlantio(f, talId, campo, valor){
  const todo = lavouraDe(f);
  if(!todo[talId]) todo[talId] = { variedade:"", area:null, sementes:"", inicio:"", fim:"" };
  todo[talId][campo] = valor;
  const p = todo[talId];
  const vazio = !p.variedade && p.area==null && !p.sementes && !p.inicio && !p.fim;
  if(vazio) delete todo[talId];
  Store.set(kLavoura(f), todo);
  Sync.push("lavoura","upsert",{fazenda_id:f, talhao_id:talId, ...todo[talId]});
}

function resumoLavoura(f){
  const tals = talhoesDe(f).slice()
    .sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
  const linhas = tals.map(t=>{
    const p = plantioDe(f,t.id);
    const area = p.area!=null && p.area!=="" ? Number(p.area) : t.hectares;
    const plantado = !!(p.variedade || p.inicio);
    let dias = null;
    if(p.inicio && p.fim){
      const d = (new Date(p.fim+"T12:00:00") - new Date(p.inicio+"T12:00:00"))/86400000;
      if(!isNaN(d) && d>=0) dias = Math.round(d)+1;
    }
    return { id:t.id, nome:t.nome, hectares:t.hectares, area,
             variedade:p.variedade||"", sementes:p.sementes||"",
             inicio:p.inicio||"", fim:p.fim||"", dias, plantado };
  });
  const plantadas = linhas.filter(l=>l.plantado);
  const vars = {};
  plantadas.forEach(l=>{
    const v = l.variedade.trim() || "—";
    vars[v] = (vars[v]||0) + l.area;
  });
  const datas = plantadas.map(l=>l.inicio).filter(Boolean).sort();
  const fins  = plantadas.map(l=>l.fim).filter(Boolean).sort();
  return { linhas, plantadas,
    areaPlantada: plantadas.reduce((s,l)=>s+l.area,0),
    areaTotal: linhas.reduce((s,l)=>s+l.area,0),
    variedades: Object.entries(vars).map(([nome,area])=>({nome,area}))
                  .sort((a,b)=>b.area-a.area),
    inicio: datas[0]||"", fim: fins[fins.length-1]||"" };
}

function kEntradas(f){ return "faz_"+f+"_entradas"; }

function salvarEntrada(f, d, id){

                  qtd:Number(d.qtd)||0, preco:Number(d.preco)||0,
                  nota:(d.nota||"").trim(), fornecedor:(d.fornecedor||"").trim(),
                  obs:(d.obs||"").trim() };

    l[i]=Object.assign({},l[i],dados);

  }
  const nova=Object.assign({id:"en_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, criado_em:new Date().toISOString()}, dados);

  Sync.push("entradas","delete",{id});

/* Quanto saiu de cada produto nas aplicações */
function consumoProduto(f, prodId){
  let qtd = 0;
  aplicacoesDe(f).forEach(a=>{
    const ha = Number(a.hectares)||0;
    (a.itens||[]).forEach(i=>{
      if(i.produto_id===prodId) qtd += (Number(i.dose)||0) * ha;
    });
  });
  return qtd;
}

/* Saldo por produto: entrou, saiu, sobrou — e o custo médio */
function estoqueDe(f){
  const prods = produtosDe(f);
  const ents  = entradasDe(f);
  const linhas = prods.map(p=>{
    const es = ents.filter(e=>e.produto_id===p.id);
    const entrou = es.reduce((s,e)=>s+e.qtd,0);
    const gasto  = es.reduce((s,e)=>s+e.qtd*e.preco,0);
    const saiu   = consumoProduto(f,p.id);
    const saldo  = entrou - saiu;
    const medio  = entrou>0 ? gasto/entrou : Number(p.preco)||0;
    return { id:p.id, nome:p.nome, unidade:p.unidade, preco:Number(p.preco)||0,
             entrou, saiu, saldo, gasto, medio,
             valorSaldo: saldo>0 ? saldo*medio : 0,
             compras: es.length,
             negativo: saldo < -0.001, semEntrada: entrou<=0 && saiu>0 };
  });
  linhas.sort((a,b)=>b.valorSaldo-a.valorSaldo || a.nome.localeCompare(b.nome,"pt-BR"));
  return { linhas,
    totalComprado: linhas.reduce((s,l)=>s+l.gasto,0),
    totalAplicado: linhas.reduce((s,l)=>s+l.saiu*l.medio,0),
    valorEstoque:  linhas.reduce((s,l)=>s+l.valorSaldo,0),
    alertas: linhas.filter(l=>l.negativo||l.semEntrada).length };
}

/* ═══════════════════════════════════════════════════
   COTAÇÃO DO DÓLAR
   Comercial: AwesomeAPI (aberta, 100 mil consultas/mês).
   Oficial: PTAX do Banco Central (aberta, sem chave).
   A última consulta fica guardada para abrir sem sinal.
   ═══════════════════════════════════════════════════ */
const API_USD  = "https://economia.awesomeapi.com.br/json/daily/USD-BRL/";
const API_PTAX = "https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/"+
                 "CotacaoDolarPeriodo(dataInicial=@di,dataFinalCotacao=@df)";

function kDolar(){ return "cotacao_usd"; }
function dolarCache(){ return Store.get(kDolar(), null); }

function ddmmaaaaUS(d){
  return String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0")+"-"+d.getFullYear();
}

async function buscarDolar(dias){
  const n = dias || 30;
  const r = await fetch(API_USD + n);
  if(!r.ok) throw new Error("falha");
  const bruto = await r.json();
  if(!Array.isArray(bruto) || !bruto.length) throw new Error("vazio");
  const serie = bruto.map(x=>({
    ts: Number(x.timestamp)*1000,
    venda: Number(x.bid), compra: Number(x.ask),
    alta: Number(x.high), baixa: Number(x.low),
    var_abs: Number(x.varBid), var_pct: Number(x.pctChange)
  })).sort((a,b)=>a.ts-b.ts);

  let ptax = null;
  try{
    const hoje=new Date(), ini=new Date(hoje.getTime()-12*86400000);
    const u = API_PTAX+"?@di='"+ddmmaaaaUS(ini)+"'&@df='"+ddmmaaaaUS(hoje)+
              "'&$orderby=dataHoraCotacao%20desc&$top=1&$format=json";
    const rp = await fetch(u);
    if(rp.ok){
      const dp = await rp.json();
      const v = dp && dp.value && dp.value[0];
      if(v) ptax = { compra:Number(v.cotacaoCompra), venda:Number(v.cotacaoVenda),
                     data:String(v.dataHoraCotacao||"").slice(0,10) };
    }
  }catch(e){ /* PTAX é complemento: se falhar, segue com o comercial */ }

  const pacote = { buscado_em:new Date().toISOString(), serie, ptax };
  Store.set(kDolar(), pacote);
  return pacote;
}

/* Estatísticas da série para o painel */
function resumoDolar(p){
  if(!p || !p.serie || !p.serie.length) return null;
  const s = p.serie, ult = s[s.length-1], pri = s[0];
  const vals = s.map(x=>x.venda);
  const max = Math.max(...vals), min = Math.min(...vals);
  const media = vals.reduce((a,b)=>a+b,0)/vals.length;
  const varPeriodo = pri.venda>0 ? (ult.venda-pri.venda)/pri.venda*100 : 0;
  return { atual:ult, primeiro:pri, max, min, media, varPeriodo, dias:s.length };
}

/* Mini gráfico em SVG, sem biblioteca */
function sparkDolar(serie, larg, alt){
  const W=larg||640, H=alt||120, P=6;
  const v=serie.map(x=>x.venda);
  const mx=Math.max(...v), mn=Math.min(...v), amp=(mx-mn)||1;
  const px=i=>P+(i/(v.length-1||1))*(W-2*P);
  const py=x=>P+(1-(x-mn)/amp)*(H-2*P);
  const linha=v.map((x,i)=>(i?"L":"M")+px(i).toFixed(1)+","+py(x).toFixed(1)).join(" ");
  const area=linha+" L"+px(v.length-1).toFixed(1)+","+(H-P)+" L"+px(0).toFixed(1)+","+(H-P)+" Z";
  const sobe=v[v.length-1]>=v[0];
  const cor=sobe?"var(--leaf-dk)":"var(--red)";
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+area+'" fill="'+cor+'" opacity=".10"/>'+
    '<path d="'+linha+'" fill="none" stroke="'+cor+'" stroke-width="2" '+
      'stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+px(v.length-1).toFixed(1)+'" cy="'+py(v[v.length-1]).toFixed(1)+
      '" r="3.5" fill="'+cor+'"/></svg>';
}


/* ═══════════════════════════════════════════════════
   IMPORTAR XML DA NOTA FISCAL
   Lê o XML da NF-e e traz fornecedor, número da nota
   e os itens com quantidade e preço.
   ═══════════════════════════════════════════════════ */
const UNID_NFE = { LT:"L", L:"L", LTS:"L", LITRO:"L", LI:"L",
  KG:"kg", QG:"kg", KGS:"kg", TON:"kg", T:"kg",
  UN:"un", UND:"un", PC:"un", PCT:"un", CX:"un", FR:"un", GL:"un", BD:"un", BB:"un",
  SC:"sc", SACA:"sc", SAC:"sc" };

function normUnid(u){
  const k = String(u||"").trim().toUpperCase().replace(/[^A-Z]/g,"");
  return UNID_NFE[k] || "un";
}

function lerXmlNfe(texto){
  const doc = new DOMParser().parseFromString(texto, "application/xml");
  if(doc.querySelector("parsererror")) throw new Error("XML inválido");
  const t = (no, tag) => {
    const e = no && no.getElementsByTagName(tag)[0];
    return e ? e.textContent.trim() : "";
  };
  const inf = doc.getElementsByTagName("infNFe")[0];
  if(!inf) throw new Error("Não parece um XML de NF-e");

  const emit = inf.getElementsByTagName("emit")[0];
  const ide  = inf.getElementsByTagName("ide")[0];
  const dh   = t(ide,"dhEmi") || t(ide,"dEmi");

  const itens = [...inf.getElementsByTagName("det")].map(det=>{
    const p = det.getElementsByTagName("prod")[0];
    if(!p) return null;
    const qtd   = parseFloat(t(p,"qCom"))   || 0;
    const preco = parseFloat(t(p,"vUnCom")) || 0;
    return { nome: t(p,"xProd"), codigo: t(p,"cProd"),
             unidade: normUnid(t(p,"uCom")), qtd, preco,
             total: parseFloat(t(p,"vProd")) || qtd*preco, usar:true };
  }).filter(Boolean).filter(i=>i.nome && i.qtd>0);

  return { fornecedor: t(emit,"xNome"), cnpj: t(emit,"CNPJ"),
           nota: t(ide,"nNF"), data: dh ? dh.slice(0,10) : "",
           itens };
}

/* Casa o item da nota com um produto já cadastrado */
function acharSemelhante(f, nome){
  const limpa = s => String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const alvo = limpa(nome);
  if(!alvo) return null;
  const prods = produtosDe(f);
  let exato = prods.find(p=>limpa(p.nome) === alvo);
  if(exato) return exato;
  const tokens = alvo.split(" ").filter(w=>w.length>2);
  if(!tokens.length) return null;
  return prods.find(p=>{
    const n = limpa(p.nome);
    return tokens.some(w=>n.includes(w) && w.length>3);
  }) || null;
}


/* ═══════════════════════════════════════════════════
   DOCUMENTOS
   Os dados ficam no armazenamento comum; o arquivo em
   si vai para o IndexedDB, que aguenta bem mais que os
   5 MB do localStorage e funciona sem internet.
   ═══════════════════════════════════════════════════ */
const TIPOS_DOC = ["Contrato de venda","Contrato de compra","Prestação de serviço",
                   "Arrendamento","Nota fiscal","Laudo","Outro"];

function kDocs(f){ return "faz_"+f+"_docs"; }
function docsDe(f){ return Store.get(kDocs(f), []); }

function abrirBanco(){
  return new Promise((ok,err)=>{
    if(!("indexedDB" in window)) return err(new Error("sem IndexedDB"));
    const r = indexedDB.open("safra-arquivos", 1);
    r.onupgradeneeded = ()=>{
      if(!r.result.objectStoreNames.contains("arquivos"))
        r.result.createObjectStore("arquivos", {keyPath:"id"});
    };
    r.onsuccess = ()=>ok(r.result);
    r.onerror   = ()=>err(r.error);
  });
}
function guardarArquivo(id, blob){
  return abrirBanco().then(db=>new Promise((ok,err)=>{
    const t = db.transaction("arquivos","readwrite");
    t.objectStore("arquivos").put({id, blob});
    t.oncomplete = ()=>ok(true);
    t.onerror    = ()=>err(t.error);
  }));
}
function pegarArquivo(id){
  return abrirBanco().then(db=>new Promise((ok,err)=>{
    const r = db.transaction("arquivos","readonly").objectStore("arquivos").get(id);
    r.onsuccess = ()=>ok(r.result ? r.result.blob : null);
    r.onerror   = ()=>err(r.error);
  }));
}
function removerArquivo(id){
  return abrirBanco().then(db=>new Promise(ok=>{
    const t = db.transaction("arquivos","readwrite");
    t.objectStore("arquivos").delete(id);
    t.oncomplete = ()=>ok(true);
    t.onerror    = ()=>ok(false);
  })).catch(()=>false);
}

function salvarDoc(f, d, id){
  const l = docsDe(f);
  const dados = { nome:(d.nome||"").trim(), tipo:d.tipo, data:d.data||"",
                  vencimento:d.vencimento||"", contraparte:(d.contraparte||"").trim(),
                  valor:Number(d.valor)||0, obs:(d.obs||"").trim(),
                  arquivo:d.arquivo||null, tamanho:d.tamanho||0 };
  if(id){
    const i=l.findIndex(x=>x.id===id); if(i<0) return null;
    l[i]=Object.assign({},l[i],dados);
    Store.set(kDocs(f),l); Sync.push("documentos","upsert",l[i]); return l[i];
  }
  const novo=Object.assign({id:"dc_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, criado_em:new Date().toISOString()}, dados);
  l.push(novo); Store.set(kDocs(f),l); Sync.push("documentos","upsert",novo);
  return novo;
}
function apagarDoc(f,id){
  const d = docsDe(f).find(x=>x.id===id);
  if(d && d.arquivo) removerArquivo(id);
  Store.set(kDocs(f), docsDe(f).filter(x=>x.id!==id));
  Sync.push("documentos","delete",{id});
}

function tamanhoLegivel(b){
  if(!b) return "—";
  if(b < 1024) return b+" B";
  if(b < 1048576) return (b/1024).toFixed(0)+" KB";
  return (b/1048576).toFixed(1)+" MB";
}
function diasAte(iso){
  if(!iso) return null;
  const d=(new Date(iso+"T12:00:00") - new Date())/86400000;
  return Math.ceil(d);
}

function chavesLocais(){
  const out = [];
  try{
    if(_ls){
      for(let i=0;i<_ls.length;i++){
        const k=_ls.key(i);
        if(k && k.startsWith("sm_") && k!=="sm_sb_sessao") out.push(k.slice(3));
      }
    }
  }catch(e){}
  Object.keys(_mem).forEach(k=>{ if(k!=="sb_sessao" && !out.includes(k)) out.push(k); });
  return out;
}

function exportarTudo(){
  const dados = {};
  chavesLocais().forEach(k=>{ dados[k] = Store.get(k, null); });
  const pacote = { app:"safra-nas-maos", versao:APP_VERSION,
                   gerado_em:new Date().toISOString(),
                   fazendas:(dados.fazendas||[]).length, dados };
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(pacote,null,1)],
    {type:"application/json"}));
  a.download="safra-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("Cópia baixada · "+Object.keys(dados).length+" registros");
}

function importarTudo(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{
    const arq=inp.files && inp.files[0]; if(!arq) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const p=JSON.parse(String(fr.result));
        if(!p || !p.dados || p.app!=="safra-nas-maos")
          throw new Error("Não é um arquivo de cópia do Safra");
        const qtd=Object.keys(p.dados).length;
        if(!confirm("Restaurar a cópia de "+(p.gerado_em||"").slice(0,10)+"?\n\n"+
          p.fazendas+" fazenda(s) · "+qtd+" registros.\n"+
          "O que está neste aparelho será substituído.")) return;
        Object.entries(p.dados).forEach(([k,v])=>{ if(v!==null) Store.set(k,v); });
        toast("Cópia restaurada");
        setTimeout(()=>location.reload(), 800);
      }catch(e){ alert(e.message||"Arquivo inválido"); }
    };
    fr.readAsText(arq);
  };
  inp.click();
}

/* Traduz o que o servidor devolveu para algo acionável */
function explicaErro(m){
  const s = String(m||"");
  if(/does not exist|42P01|Could not find the table|schema cache/i.test(s))
    return "As tabelas ainda não existem no Supabase — rode o supabase-schema.sql.";
  if(/row-level security|violates row-level|42501/i.test(s))
    return "O banco recusou a gravação (permissão). Confira se o schema foi aplicado inteiro.";
  if(/JWT|token|401|Unauthorized/i.test(s))
    return "Sua sessão expirou. Saia e entre de novo.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(s))
    return "Não consegui falar com o servidor.";
  if(/foreign key|23503/i.test(s))
    return "A fazenda ainda não chegou na nuvem. Tente de novo em instantes.";
  return s;
}

async function enviarLogin(){
  const email=(document.getElementById("lg-email").value||"").trim();
  const senha=document.getElementById("lg-senha").value||"";
  const err=document.getElementById("lg-erro");
  const btn=document.getElementById("lg-btn");
  err.textContent="";
  if(!email || !email.includes("@")){ err.textContent="Informe um e-mail válido"; return; }
  if(senha.length<6){ err.textContent="A senha precisa de pelo menos 6 caracteres"; return; }
  if(!navigator.onLine){ err.textContent="Sem internet. Conecte para entrar na conta."; return; }
  btn.disabled=true; btn.textContent="Aguarde…";
  try{
    if(_modoLogin==="criar"){
      const d = await Auth.criar(email,senha);
      if(!Auth.logado()){
        err.innerHTML='Conta criada. <b>Confirme o e-mail</b> e volte para entrar.';
        _modoLogin="entrar"; btn.disabled=false; render(); return;
      }
    }else{
      await Auth.entrar(email,senha);
    }
    Store.set("ult_email", email);
    Store.set("perfil", { nome: email.split("@")[0] });
    try{ await api("rpc/safra_aceitar_convites", {method:"POST", body:{}}); }catch(e){}
    toast("Bem-vindo");
    await primeiraSincronizacao();
    render();
  }catch(e){
    const m=String(e.message||"");
    err.textContent =
        /Invalid login/i.test(m) ? "E-mail ou senha não conferem"
      : /already registered|already been registered/i.test(m) ? "Esse e-mail já tem conta. Use Entrar."
      : /signups? (are |is )?disabled/i.test(m) ? "O cadastro está fechado. Peça ao administrador para criar sua conta."
      : /Email not confirmed/i.test(m) ? "Confirme o e-mail que você recebeu e tente de novo."
      : /rate limit|too many/i.test(m) ? "Muitas tentativas. Espere um minuto."
      : /relation .* does not exist/i.test(m) ? "O banco ainda não foi preparado. Rode o schema no Supabase."
      : /Failed to fetch|NetworkError|Load failed/i.test(m) ? "Não consegui falar com o servidor. Confira a internet."
      : m;
    btn.disabled=false;
    btn.textContent=(_modoLogin==="entrar"?"Entrar":"Criar conta");
  }
}

/* ═══════════════════════════════════════════════════
   TELA — Dados da fazenda (talhões)
