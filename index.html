let _buscaTal = "";

function telaTalhoes(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }

  const todos = talhoesDe(f.id);
  const b = _buscaTal.trim().toLowerCase();
  const lista = b ? todos.filter(t=>t.nome.toLowerCase().includes(b)) : todos;
  lista.sort((a,z)=>a.nome.localeCompare(z.nome,"pt-BR",{numeric:true}));

  const totHa = todos.reduce((s,t)=>s+t.hectares,0);
  const totAb = todos.reduce((s,t)=>s+(t.abertura||0),0);
  const nAb   = todos.filter(t=>(t.abertura||0)>0).length;

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
         '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
         '<div class="farm-head-mid"><h1>Dados da fazenda</h1>'+
         '<p>Talhões, áreas e tipo de área · safra '+esc(f.safra)+'</p></div></div>';

  // Indicadores
  h += '<div class="kpis">'+
    kpi("Talhões", todos.length, "") +
    kpi("Área total", totHa.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}), "ha") +
    kpi("Área nova", totAb>0 ? totAb.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "—", totAb>0?"ha · "+nAb+" talhões":"") +
  '</div>';

  // Ações
  h += '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalTalhao()">+ Novo talhão</button>'+
    (todos.length ? '<button class="btn-act" onclick="exportarTalhoes()">Baixar planilha</button>' : '')+
    (todos.length ? '<input class="busca" placeholder="Buscar talhão…" value="'+esc(_buscaTal)+'" '+
       'oninput="clearTimeout(window._bt);window._bt=setTimeout(()=>{_buscaTal=this.value;render();},250)">' : '')+
  '</div>';

  if(!todos.length){
    h += '<div class="empty"><strong>Nenhum talhão cadastrado</strong>'+
         'Cadastre os talhões com nome e área. Eles são a base para colheita, operações, chuva e NDVI.'+
         (f.nome.toLowerCase().includes("santa angelina")
           ? '<div style="margin-top:16px"><button class="btn-act primary" onclick="carregarSA()">'+
             'Carregar os 36 talhões da Santa Angelina</button></div>' : '')+
         '</div>';
  }else if(!lista.length){
    h += '<div class="empty"><strong>Nada encontrado</strong>Nenhum talhão com “'+esc(_buscaTal)+'”.</div>';
  }else{
    h += '<div class="tal-list">';
    lista.forEach(t=>{
      const pct = totHa>0 ? (t.hectares/totHa*100) : 0;
      h += '<div class="tal">'+
        '<div class="tal-bar"><i style="width:'+Math.max(2,Math.min(100,pct*3)).toFixed(1)+'%"></i></div>'+
        '<div class="tal-nome">'+esc(t.nome)+
          ((t.abertura||0)>0 ? '<span class="pill">área nova '+t.abertura.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+' ha</span>' : '')+
        '</div>'+
        '<div class="tal-ha">'+t.hectares.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+' <span>ha</span></div>'+
        '<div class="tal-acts">'+
          '<button onclick="modalTalhao(\''+t.id+'\')" title="Editar">Editar</button>'+
          '<button class="rm" onclick="removerTalhao(\''+t.id+'\')" title="Remover">✕</button>'+
        '</div></div>';
    });
    h += '</div>';
    if(b) h += '<p class="ver">'+lista.length+' de '+todos.length+' talhões</p>';
  }
  return h+'</div>';
}

function kpi(rot, val, un){
  return '<div class="kpi"><span class="kpi-rot">'+esc(rot)+'</span>'+
         '<span class="kpi-val">'+esc(String(val))+(un?' <i>'+esc(un)+'</i>':'')+'</span></div>';
}

  const f = acharFazenda(App.fazendaId); if(!f) return;

function modalTalhao(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const t = id ? talhoesDe(f.id).find(x=>x.id===id) : null;
  document.getElementById("modal-root").innerHTML =
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>'+(t?"Editar talhão":"Novo talhão")+'</h2>'+
    '<p class="sub">A área é usada para calcular produtividade, custo por hectare e dose de aplicação.</p>'+
    '<div class="frm">'+
      '<div><label for="t-nome">Nome do talhão</label>'+
        '<input id="t-nome" value="'+esc(t?t.nome:"")+'" placeholder="Talhão 01, Pivô 03, Luiz 05…"></div>'+
      '<div style="display:flex;gap:10px">'+
        '<div style="flex:1"><label for="t-ha">Área (ha)</label>'+
          '<input id="t-ha" type="number" step="0.01" inputmode="decimal" value="'+(t?t.hectares:"")+'" placeholder="0,00"></div>'+
        '<div style="flex:1"><label for="t-ab">Área nova (ha)</label>'+
          '<input id="t-ab" type="number" step="0.01" inputmode="decimal" value="'+(t&&t.abertura?t.abertura:"")+'" placeholder="0,00"></div>'+
      '</div>'+
      '<p style="font-size:12.5px;color:var(--muted);margin-top:-4px">'+
        'Área nova é a parte aberta nesta safra. Deixe vazio se o talhão já estava em produção.</p>'+
    '</div>'+
    '<div class="modal-acts">'+
      '<button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="salvarTalhao('+(t?"'"+t.id+"'":"null")+')">Salvar</button>'+
    '</div></div></div>';
  setTimeout(()=>{const e=document.getElementById("t-nome"); if(e) e.focus();},60);
}

function salvarTalhao(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const nome = document.getElementById("t-nome").value.trim();
  const ha   = parseFloat(String(document.getElementById("t-ha").value).replace(",","."))||0;
  const ab   = parseFloat(String(document.getElementById("t-ab").value).replace(",","."))||0;
  if(!nome){ toast("Informe o nome do talhão"); return; }
  if(ha<=0){ toast("Informe a área em hectares"); return; }
  if(ab>ha){ toast("A área nova não pode ser maior que a área do talhão"); return; }

  const jaExiste = talhoesDe(f.id).some(t =>
    t.id!==id && t.nome.toLowerCase()===nome.toLowerCase());
  if(jaExiste){ toast("Já existe um talhão com esse nome"); return; }

  if(id) editarTalhao(f.id,id,{nome,hectares:ha,abertura:ab});
  else   novoTalhao(f.id,{nome,hectares:ha,abertura:ab});
  fecharModal(); toast(id?"Talhão atualizado":"Talhão cadastrado"); render();
}

function removerTalhao(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const t = talhoesDe(f.id).find(x=>x.id===id); if(!t) return;
  if(!confirm('Remover o talhão "'+t.nome+'"?')) return;
  apagarTalhao(f.id,id); toast("Talhão removido"); render();
}

function exportarTalhoes(){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const l = talhoesDe(f.id).slice()
    .sort((a,z)=>a.nome.localeCompare(z.nome,"pt-BR",{numeric:true}));
  const linhas = [["Talhao","Area_ha","Area_nova_ha"]]
    .concat(l.map(t=>[t.nome, String(t.hectares).replace(".",","), String(t.abertura||0).replace(".",",")]));
  const csv = "\ufeff"+linhas.map(r=>r.map(v=>{
    const s=String(v); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download = "talhoes-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Planilha baixada");
}

let _abaColh = "cargas";
let _fCarga  = { destino:"", talhao:"", busca:"" };

const nf = (v,d=2)=>Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const n0 = v=>Number(v||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const dataBR = s=>{ if(!s) return "—"; const p=String(s).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : s; };

function telaColheita(){

  if(!f){ App.tela="fazendas"; return telaFazendas(); }

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
       '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
       '<div class="farm-head-mid"><h1>Colheita</h1>'+
       '<p>Cargas, produtividade e silo bolsa · safra '+esc(f.safra)+'</p></div></div>';

  const emTransito = cargas.filter(x=>!cargaBaixada(x)).length;
  h += '<div class="kpis kpis-4">'+
    kpi("Cargas", n0(cargas.length), emTransito ? emTransito+" a baixar" : "todas baixadas") +
    kpi("Sacas confirmadas", nf(p.totalSacas,0), "sc") +
    kpi("Área colhida", nf(p.haColhida,1), "ha") +
    kpi("Produtividade", nf(p.prodColhida,2), "sc/ha") +
  '</div>';

  h += '<div class="abas">'+
    aba("cargas","Cargas", cargas.length)+
    aba("prod","Produtividade", p.colhidos.length)+
    aba("desc","Descontos", cargas.filter(cargaBaixada).length)+
    aba("cad","Armazéns e caminhões", armazensDe(f.id).length+caminhoesDe(f.id).length)+
  '</div>';

  if(_abaColh==="cargas")    h += abaCargas(f, cargas);
  else if(_abaColh==="prod") h += abaProdutividade(f, p);
  else if(_abaColh==="desc") h += abaDescontos(f);
  else                       h += abaCadastros(f);

  return h+'</div>';
}

function aba(id, rot, n){
  return '<button class="ab'+(_abaColh===id?' on':'')+'" onclick="_abaColh=\''+id+'\';render()">'+
         esc(rot)+(n?'<b>'+n+'</b>':'')+'</button>';
}

/* ── Aba: cargas ─────────────────────────── */
/* Umidade da fazenda ao lado da do armazém — o comparativo que interessa */
function umidCompara(c){
  const uf = Number(c.umidade)||0;
  if(!cargaBaixada(c)) return uf ? nf(uf,1)+"%" : "—";
  const ua = Number(c.baixa.umidade)||0;
  const d  = ua - uf;
  const cor = Math.abs(d) >= 1.5 ? " alerta" : "";
  return (uf?nf(uf,1):"—")+" <u class="+JSON.stringify("cmp"+cor)+">"+
         (d>0?"+":"")+nf(d,1)+"</u> "+nf(ua,1)+"%";
}

function abaCargas(f, cargas){
  const tals = talhoesDe(f.id);
  if(!armazensDe(f.id).length)
    return '<div class="empty"><strong>Cadastre um destino primeiro</strong>'+
      'A carga precisa saber para qual armazém ou silo foi entregue.'+
      '<div style="margin-top:16px"><button class="btn-act primary" '+
      'onclick="_abaColh=\'cad\';render();setTimeout(modalArmazem,80)">Cadastrar destino</button></div></div>';
  if(!tals.length)
    return '<div class="empty"><strong>Cadastre os talhões primeiro</strong>'+
      'A carga precisa saber de qual talhão veio o grão.'+
      '<div style="margin-top:16px"><button class="btn-act primary" '+
      'onclick="irPara(\'modulo\',{moduloId:\'talhoes\'})">Ir para Dados da fazenda</button></div></div>';

  let l = cargas.slice();
  if(_fCarga.destino) l = l.filter(c=>c.destino===_fCarga.destino);
  if(_fCarga.talhao)  l = l.filter(c=>(c.talhoes||[]).some(i=>i.talhao_id===_fCarga.talhao));
  if(_fCarga.busca){
    const b=_fCarga.busca.toLowerCase();
    l = l.filter(c=>(c.romaneio||"").toLowerCase().includes(b) ||
                    (c.motorista||"").toLowerCase().includes(b) ||
                    (c.placa||"").toLowerCase().includes(b) ||
                    (c.codigo||"").toLowerCase().includes(b));
  }
  l.sort((a,b)=>(b.data||"").localeCompare(a.data||"") || (b.codigo||"").localeCompare(a.codigo||""));

  let h = '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalCarga()">+ Lançar carga</button>'+
    (cargas.length?'<button class="btn-act" onclick="exportarCargas()">Baixar planilha</button>':'')+
    (cargas.length?'<select class="sel-f" onchange="_fCarga.destino=this.value;render()">'+
      '<option value="">Todos os destinos</option>'+
      armazensDe(f.id).map(a=>'<option '+(_fCarga.destino===a?'selected':'')+'>'+esc(a)+'</option>').join("")+
      '</select>':'')+
    (cargas.length?'<input class="busca" placeholder="Romaneio, motorista ou placa…" value="'+esc(_fCarga.busca)+'" '+
      'oninput="clearTimeout(window._bc);window._bc=setTimeout(()=>{_fCarga.busca=this.value;render();},250)">':'')+
  '</div>';

  if(!cargas.length)
    return h+'<div class="empty"><strong>Nenhuma carga lançada</strong>'+
      'Cada caminhão que sai da lavoura vira uma carga. O sistema calcula o desconto de umidade e as sacas.</div>';
  if(!l.length)
    return h+'<div class="empty"><strong>Nada encontrado</strong>Ajuste os filtros para ver as cargas.</div>';

  h += '<div class="tbl"><table><thead><tr>'+
    '<th>Data</th><th>Romaneio</th><th>Destino</th><th class="hide-sm">Motorista</th>'+
    '<th class="num">Líquido</th><th class="num">Sacas</th>'+
    '<th class="num hide-sm">Umid.</th><th>Situação</th>'+
    '<th class="hide-sm">Talhão</th><th></th></tr></thead><tbody>';
  l.forEach(c=>{
    const nomes = (c.talhoes||[]).map(i=>{
      const t = talhoesDe(f.id).find(x=>x.id===i.talhao_id);
      return t?t.nome:"—";
    });
    const ok = cargaBaixada(c);
    const sc = ok ? c.baixa.sacas_final : c.sacas;
    h += '<tr'+(ok?'':' class="transito"')+'>'+
      '<td class="mono">'+dataBR(c.data)+'</td>'+
      '<td class="mono">'+esc(c.romaneio||c.codigo||"")+'</td>'+
      '<td><span class="tagdest">'+esc(c.destino||"—")+'</span></td>'+
      '<td class="hide-sm">'+esc(c.motorista||"—")+'</td>'+
      '<td class="num mono">'+n0(c.liquido)+'</td>'+
      '<td class="num mono forte">'+nf(sc,1)+(ok?"":'<i class="est">est.</i>')+'</td>'+
      '<td class="num mono hide-sm">'+umidCompara(c)+'</td>'+
      '<td>'+(ok
        ? '<span class="sit ok" title="Baixada em '+dataBR(c.baixa.data)+'">Baixada</span>'
        : '<span class="sit tr">A caminho</span>')+'</td>'+
      '<td class="tal-col hide-sm" title="'+esc(nomes.join(" + "))+'">'+esc(nomes.join(" + ")||"—")+'</td>'+
      '<td class="acoes">'+
        (ok ? '<button onclick="modalBaixa(\''+c.id+'\')">Ver baixa</button>'
            : '<button class="bx" onclick="modalBaixa(\''+c.id+'\')">Baixar</button>')+
        '<button onclick="modalCarga(\''+c.id+'\')">Editar</button>'+
        '<button class="rm" onclick="removerCarga(\''+c.id+'\')">✕</button></td>'+
    '</tr>';
  });
  h += '</tbody></table></div>';
  if(l.length!==cargas.length) h+='<p class="ver">'+l.length+' de '+cargas.length+' cargas</p>';
  return h;
}

/* ── Aba: produtividade ──────────────────── */
function abaProdutividade(f, p){
  if(!p.linhas.length)
    return '<div class="empty"><strong>Sem talhões cadastrados</strong>'+
      'Cadastre os talhões em Dados da fazenda para acompanhar a produtividade.</div>';

  const cap = siloCap(f.id);
  let h = '<div class="acts">'+
    '<button class="btn-act" onclick="modalSiloCap()">Saca por silo: '+n0(cap)+'</button>'+
    '<button class="btn-act" onclick="exportarProdutividade()">Baixar planilha</button></div>';

  h += '<div class="tbl"><table><thead><tr>'+
    '<th>Talhão</th><th class="num">Área</th><th class="num">Sacas armazém</th>'+
    '<th class="num">Silos</th><th class="num">Sacas silo</th>'+
    '<th class="num">Total</th><th class="num">sc/ha</th></tr></thead><tbody>';
  p.linhas.forEach(t=>{
    const media = p.prodColhida;
    const cor = !t.colhido ? "" : (t.sc_ha>=media ? " bom" : " baixo");
    h += '<tr'+(t.colhido?"":' class="pendente"')+'>'+
      '<td class="forte">'+esc(t.nome)+'</td>'+
      '<td class="num mono">'+nf(t.hectares,2)+'</td>'+
      '<td class="num mono">'+(t.sacas>0?nf(t.sacas,1):"—")+'</td>'+
      '<td class="num"><input class="silo" type="number" min="0" step="0.5" value="'+(t.silos||"")+'" '+
        'placeholder="0" oninput="clearTimeout(window._bs);window._bs=setTimeout(()=>{aplicarSilo(\''+t.id+'\',this.value);},400)"></td>'+
      '<td class="num mono">'+(t.sc_silo>0?nf(t.sc_silo,0):"—")+'</td>'+
      '<td class="num mono forte">'+(t.total_sc>0?nf(t.total_sc,1):"—")+'</td>'+
      '<td class="num mono sc-ha'+cor+'">'+(t.colhido?nf(t.sc_ha,2):"—")+'</td>'+
    '</tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="resumo">'+
    '<div class="resumo-t">Resumo da safra</div><div class="resumo-g">'+
    linhaResumo("Sacas no armazém", nf(p.sacasArmazem,2)+" sc")+
    linhaResumo("Sacas em silo bolsa", nf(p.sacasSilo,0)+" sc")+
    linhaResumo("Total colhido", nf(p.totalSacas,2)+" sc")+
    linhaResumo("Área colhida", nf(p.haColhida,2)+" ha")+
    linhaResumo("Produtividade da área colhida", nf(p.prodColhida,2)+" sc/ha", true)+
    linhaResumo("Produtividade da fazenda toda", nf(p.prodFazenda,2)+" sc/ha")+
    '</div><p class="resumo-obs">A produtividade da área colhida considera só os '+
    p.colhidos.length+' talhões com carga ou silo lançado. A da fazenda divide pelos '+
    nf(p.haTotal,2)+' ha totais.</p></div>';
  return h;
}
function linhaResumo(rot,val,forte){
  return '<div class="rl'+(forte?" forte":"")+'"><span>'+esc(rot)+'</span><b>'+esc(val)+'</b></div>';
}

/* ── Aba: cadastros ──────────────────────── */

/* ═══════════════════════════════════════════════════
   TELA — Pluviometria
   ═══════════════════════════════════════════════════ */
let _mesIdx = null;      // posição dentro da safra
let _modoChuva = "dia";  // dia | planilha

function telaChuva(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const meses = mesesDaSafra(f.safra);
  if(_mesIdx==null){
    const hoje=new Date(), i=meses.findIndex(m=>m.ano===hoje.getFullYear()&&m.mes===hoje.getMonth());
    _mesIdx = i>=0 ? i : 0;
  }
  _mesIdx = Math.max(0, Math.min(meses.length-1, _mesIdx));
  const {ano,mes} = meses[_mesIdx];
  const pts = pontosDe(f.id);
  const r = resumoMes(f.id,ano,mes);
  const ac = acumuladoSafra(f.id,f.safra);

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
       '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
       '<div class="farm-head-mid"><h1>Pluviometria</h1>'+
       '<p>Chuva por dia e ponto de medição · safra '+esc(f.safra)+'</p></div></div>';

  if(!pts.length)
    return h+'<div class="empty"><strong>Cadastre os talhões primeiro</strong>'+
      'A chuva é lançada por talhão, usando o cadastro da fazenda.'+
      '<div style="margin-top:16px"><button class="btn-act primary" '+
      'onclick="irPara(\'modulo\',{moduloId:\'talhoes\'})">Ir para Dados da fazenda</button></div></div></div>';

  h += '<div class="kpis kpis-4">'+
    kpi("No mês", nf(r.mediaPontos,0), "mm (média)")+
    kpi("Dias com chuva", r.diasComChuva, "de "+r.nd)+
    kpi("Acumulado da safra", nf(ac.media,0), "mm (média)")+
    kpi("Talhões", pts.length, "com medição")+
  '</div>';

  // Navegação de mês
  h += '<div class="mesnav">'+
    (_modoChuva==="dia" ?
      '<button class="mn-b" onclick="_mesIdx--;render()" '+(_mesIdx===0?'disabled':'')+'>‹</button>'+
      '<select class="mn-s" onchange="_mesIdx=+this.value;render()">'+
        meses.map((m,i)=>'<option value="'+i+'" '+(i===_mesIdx?'selected':'')+'>'+
          MESES[m.mes]+' '+m.ano+'</option>').join("")+
      '</select>'+
      '<button class="mn-b" onclick="_mesIdx++;render()" '+(_mesIdx===meses.length-1?'disabled':'')+'>›</button>'
      : '')+
    '<div class="mn-modo">'+
      '<button class="'+(_modoChuva==="dia"?"on":"")+'" onclick="_modoChuva=\'dia\';render()">Por dia</button>'+
      '<button class="'+(_modoChuva==="planilha"?"on":"")+'" onclick="_modoChuva=\'planilha\';render()">Planilha</button>'+
    '</div>'+
    '<button class="btn-act" onclick="exportarChuva()">Baixar planilha</button>'+
  '</div>';

  h += _modoChuva==="dia" ? chuvaPorDia(f,ano,mes,pts,r) : chuvaPlanilha(f,ano,mes,pts,r);

  // Acumulado por ponto
  h += '<div class="resumo"><div class="resumo-t">Acumulado da safra por talhão</div>'+
    '<div class="acum">'+ pts.map(p=>
      '<div class="ac"><span>'+esc(p.nome)+'</span><b>'+nf(ac.porPonto[p.id]||0,0)+' <i>mm</i></b></div>'
    ).join("")+'</div>'+
    '<p class="resumo-obs">Total lançado na safra: '+nf(ac.total,0)+' mm somando todos os pontos. '+
    'A média entre os '+pts.length+' pontos é '+nf(ac.media,0)+' mm.</p></div>';

  return h+'</div>';
}

/* Modo celular: escolhe o dia, digita ponto a ponto */
function chuvaPorDia(f,ano,mes,pts,r){
  const nd = diasNoMes(ano,mes);
  const hoje = new Date();
  let dia = (hoje.getFullYear()===ano && hoje.getMonth()===mes) ? hoje.getDate() : 1;
  if(window._diaSel && window._diaSel.ano===ano && window._diaSel.mes===mes) dia = window._diaSel.dia;

  let h = '<div class="dias">';
  for(let d=1; d<=nd; d++){
    const info = r.porDia[d];
    const cls = d===dia ? " sel" : (info.n ? " tem" : "");
    h += '<button class="dq'+cls+'" onclick="selDia('+ano+','+mes+','+d+')">'+
         '<i>'+d+'</i>'+(info.n?'<u>'+nf(info.media,0)+'</u>':'')+'</button>';
  }
  h += '</div>';

  const k = chaveDia(ano,mes,dia);
  const lanc = pts.filter(p=>lerChuva(f.id,k,p.id)!=null).length;
  h += '<div class="lanc"><div class="lanc-h">'+
    '<h3>'+dia+' de '+MESES[mes]+'</h3>'+
    '<span>'+(r.porDia[dia].n ? nf(r.porDia[dia].media,1)+' mm de média em '+lanc+' talhões'
                              : "sem registro")+'</span></div>';

  h += '<div class="lanc-tudo">'+
    '<input id="mm-tudo" type="number" inputmode="decimal" step="0.5" min="0" placeholder="mm">'+
    '<button class="btn-act" onclick="chuvaEmTodos(\''+k+'\')">Aplicar em todos</button>'+
    (lanc?'<button class="btn-act" onclick="limparDia(\''+k+'\')">Limpar o dia</button>':'')+
    '<span class="dica">Choveu parelho na fazenda? Preencha uma vez só e ajuste as exceções.</span>'+
  '</div>';

  pts.forEach(p=>{
    const v = lerChuva(f.id,k,p.id);
    h += '<div class="lp"><label for="mm-'+p.id+'">'+esc(p.nome)+'</label>'+
      '<div class="lp-in"><input id="mm-'+p.id+'" type="number" inputmode="decimal" step="0.5" min="0" '+
      'value="'+(v==null?"":v)+'" placeholder="0" data-mm="1" '+
      'onkeydown="proxCampoMM(event,this)" '+
      'onchange="gravarChuva(\''+f.id+'\',\''+k+'\',\''+p.id+'\',this.value);render()"><span>mm</span></div></div>';
  });
  return h+'</div>';
}

/* Modo planilha: a safra inteira, só os dias que choveram —
   igual ao controle da fazenda. */
function chuvaPlanilha(f,ano,mes,pts,r){
  const dias = diasDeChuva(f.id, f.safra);
  if(!dias.length)
    return '<div class="empty"><strong>Nenhuma chuva lançada nesta safra</strong>'+
      'Use o modo <b>Por dia</b> para registrar. Aqui aparecem só os dias que choveram.</div>';

  const tot = {}; pts.forEach(p=>tot[p.id]=0);
  let geral = 0;

  let h = '<div class="tbl grade"><table><thead><tr>'+
    '<th class="fix">'+esc(String(f.safra).replace("/","/"))+'</th>'+
    pts.map(p=>'<th class="num">'+esc(p.nome)+'</th>').join("")+
    '<th class="num tot">Total</th></tr></thead><tbody>';

  dias.forEach(k=>{
    let soma=0, n=0;
    const cels = pts.map(p=>{
      const v = lerChuva(f.id,k,p.id);
      if(v!=null){ soma+=v; n++; tot[p.id]+=v; }
      return '<td class="num"><input class="gr" type="number" inputmode="decimal" step="0.5" min="0" '+
        'value="'+(v==null?"":v)+'" '+
        'onchange="gravarChuva(\''+f.id+'\',\''+k+'\',\''+p.id+'\',this.value);render()"></td>';
    }).join("");
    geral += soma;
    h += '<tr class="molhado"><td class="fix mono dia">'+diaCurto(k)+'</td>'+cels+
         '<td class="num mono tot">'+nf(soma,1)+'</td></tr>';
  });

  h += '</tbody><tfoot><tr><td class="fix">Total</td>'+
    pts.map(p=>'<td class="num mono">'+nf(tot[p.id],1)+'</td>').join("")+
    '<td class="num mono tot">'+nf(geral,1)+'</td></tr>'+
    '<tr class="med"><td class="fix">Média</td>'+
    pts.map(()=>'<td class="num mono">'+nf(geral/pts.length,1)+'</td>').join("")+
    '<td class="num mono tot">'+nf(geral/pts.length,1)+'</td></tr></tfoot></table></div>'+
    '<p class="ver">'+dias.length+' dias com chuva na safra</p>';
  return h;
}

/* Chuva uniforme: um valor para a fazenda inteira */
function chuvaEmTodos(dia){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const el=document.getElementById("mm-tudo");
  const v=String(el&&el.value||"").trim();
  if(v===""){ toast("Digite o valor antes de aplicar"); return; }
  pontosDe(f.id).forEach(p=>gravarChuva(f.id,dia,p.id,v));
  toast(v+" mm em todos os talhões");
  render();
}
function limparDia(dia){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  if(!confirm("Apagar a chuva lançada neste dia?")) return;
  pontosDe(f.id).forEach(p=>gravarChuva(f.id,dia,p.id,""));
  toast("Dia limpo"); render();
}

/* Enter salva e pula para o talhão seguinte — lançar 36 talhões
   sem tirar a mão do teclado. Shift+Enter volta. */
function proxCampoMM(ev, el){
  if(ev.key !== "Enter") return;
  ev.preventDefault();
  const campos = [...document.querySelectorAll('input[data-mm]')];
  const i = campos.indexOf(el);
  const alvo = campos[i + (ev.shiftKey ? -1 : 1)];
  el.dispatchEvent(new Event("change"));
  window._focoMM = alvo ? alvo.id : null;
}
/* Depois do render, devolve o cursor para onde estava */
function restaurarFocoMM(){
  if(!window._focoMM) return;
  const el = document.getElementById(window._focoMM);
  window._focoMM = null;
  if(el){ el.focus(); el.select && el.select(); }
}

function selDia(ano,mes,dia){ window._diaSel={ano,mes,dia}; render(); }

/* ── Pontos de medição ───────────────────── */

function exportarChuva(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const pts=pontosDe(f.id), dias=diasDeChuva(f.id,f.safra);
  if(!dias.length){ toast("Nenhuma chuva lançada ainda"); return; }
  const tot={}; pts.forEach(p=>tot[p.id]=0);
  const linhas=[["CONTROLE DE CHUVA - SAFRA "+f.safra+" - "+f.nome.toUpperCase()]];
  linhas.push(["Dia"].concat(pts.map(p=>p.nome)).concat(["Total"]));
  let geral=0;
  dias.forEach(k=>{
    let soma=0;
    const cel=pts.map(p=>{
      const v=lerChuva(f.id,k,p.id);
      if(v!=null){ soma+=v; tot[p.id]+=v; }
      return v==null?"":vBR(v);
    });
    geral+=soma;
    linhas.push([diaCurto(k)].concat(cel).concat([vBR(soma)]));
  });
  linhas.push(["Total"].concat(pts.map(p=>vBR(tot[p.id]))).concat([vBR(geral)]));
  linhas.push(["Média"].concat(pts.map(()=>vBR((geral/pts.length).toFixed(1))))
                       .concat([vBR((geral/pts.length).toFixed(1))]));
  baixarCSV(linhas,"chuvas-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

/* ═══════════════════════════════════════════════════
   TELA — Operações no talhão
   ═══════════════════════════════════════════════════ */
let _abaOp = "relatorio";
let _fTipo = "";
let _itensApl = [];

function telaOperacoes(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const R = resumoOperacoes(f.id, _fTipo);
  const todas = aplicacoesDe(f.id);

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
    '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
    '<div class="farm-head-mid"><h1>Operações no talhão</h1>'+
    '<p>Pulverização, semeadura e adubação · safra '+esc(f.safra)+'</p></div></div>';

  h += '<div class="kpis kpis-4">'+
    kpi("Aplicações", todas.length, _fTipo?R.aplicacoes.length+" no filtro":"")+
    kpi("Custo total", moeda(R.total).replace("R$ ",""), "R$")+
    kpi("Área aplicada", nf(R.haAplicada,0), "ha acumulados")+
    kpi("Custo por hectare", nf(R.custoHa,2), "R$/ha aplicado")+
  '</div>';

  h += '<div class="abas">'+
    abaOp("relatorio","Relatório", R.aplicacoes.length)+
    abaOp("produtos","Produtos", produtosDe(f.id).length)+
    abaOp("resumo","Por produto", R.porProduto.length)+
  '</div>';

  if(_abaOp==="produtos")     h += abaProdutos(f);
  else if(_abaOp==="resumo")  h += abaResumoProd(f,R);
  else                        h += abaRelatorio(f,R);
  return h+'</div>';
}
function abaOp(id,rot,n){
  return '<button class="ab'+(_abaOp===id?' on':'')+'" onclick="_abaOp=\''+id+'\';render()">'+
         esc(rot)+(n?'<b>'+n+'</b>':'')+'</button>';
}

/* ── Relatório: igual ao da fazenda ──────── */
function abaRelatorio(f,R){
  const tals = talhoesDe(f.id);
  const nomeT = a => (a.talhoes||[]).map(id=>{
    const t=tals.find(x=>x.id===id); return t?t.nome:"—"; }).join(", ") || "—";

  let h = '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalAplicacao()">+ Nova aplicação</button>'+
    (R.aplicacoes.length?'<button class="btn-act" onclick="exportarOperacoes()">Baixar planilha</button>':'')+
    '<select class="sel-f" onchange="_fTipo=this.value;render()">'+
      '<option value="">Todos os tipos</option>'+
      TIPOS_OP.map(t=>'<option '+(_fTipo===t?'selected':'')+'>'+esc(t)+'</option>').join("")+
    '</select></div>';

  if(!produtosDe(f.id).length)
    return h+'<div class="empty"><strong>Cadastre os produtos primeiro</strong>'+
      'Defesivos, adubos e sementes com o preço por litro ou quilo.'+
      '<div style="margin-top:16px"><button class="btn-act primary" '+
      'onclick="_abaOp=\'produtos\';render();setTimeout(modalProduto,80)">Cadastrar produto</button></div></div>';

  if(!R.aplicacoes.length)
    return h+'<div class="empty"><strong>Nenhuma aplicação lançada</strong>'+
      'Cada passada de pulverizador vira uma aplicação, com a calda de produtos e a área tratada.</div>';

  const aps = R.aplicacoes.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  let h2 = '<div class="tbl"><table><thead><tr>'+
    '<th>Data</th><th>Talhão</th><th>Produto</th><th class="num">Dose</th>'+
    '<th class="num">Hectares</th><th class="num">Qtd</th>'+
    '<th class="num hide-sm">Valor un.</th><th class="num">Valor total</th><th></th>'+
    '</tr></thead><tbody>';
  let total = 0;
  aps.forEach(a=>{
    const ls = linhasAplicacao(f.id,a);
    const custo = ls.reduce((s,l)=>s+l.valor,0);
    total += custo;
    if(!ls.length){
      h2 += '<tr class="ap-ini"><td class="mono">'+dataBR(a.data)+'</td>'+
        '<td class="forte">'+esc(nomeT(a))+'</td><td colspan="6" class="vaz">sem produto na calda</td>'+
        '<td class="acoes"><button onclick="modalAplicacao(\''+a.id+'\')">Editar</button>'+
        '<button class="rm" onclick="removerAplicacao(\''+a.id+'\')">✕</button></td></tr>';
      return;
    }
    ls.forEach((l,i)=>{
      h2 += '<tr'+(i===0?' class="ap-ini"':'')+'>'+
        (i===0 ? '<td class="mono" rowspan="'+ls.length+'">'+dataBR(a.data)+
                 '<u class="tp">'+esc(a.tipo||"").replace("Pulverização ","")+'</u></td>'+
                 '<td class="forte" rowspan="'+ls.length+'">'+esc(nomeT(a))+
                 (a.obs?'<u class="ob">'+esc(a.obs)+'</u>':'')+'</td>' : '')+
        '<td>'+esc(l.produto)+'</td>'+
        '<td class="num mono">'+nf(l.dose,l.dose<1?3:2)+'</td>'+
        '<td class="num mono">'+nf(l.hectares,0)+'</td>'+
        '<td class="num mono">'+nf(l.qtd,1)+' <i class="un">'+esc(l.unidade)+'</i></td>'+
        '<td class="num mono hide-sm">'+(l.semPreco?'<i class="sp">sem preço</i>':moeda(l.preco))+'</td>'+
        '<td class="num mono forte">'+(l.semPreco?"—":moeda(l.valor))+'</td>'+
        (i===0 ? '<td class="acoes" rowspan="'+ls.length+'">'+
                 '<button onclick="modalAplicacao(\''+a.id+'\')">Editar</button>'+
                 '<button class="rm" onclick="removerAplicacao(\''+a.id+'\')">✕</button></td>' : '')+
      '</tr>';
    });
  });
  h2 += '</tbody><tfoot><tr><td class="fix" colspan="7">Total geral'+
    (_fTipo?' · '+esc(_fTipo):'')+'</td>'+
    '<td class="num mono tot">'+moeda(total)+'</td><td></td></tr></tfoot></table></div>';

  if(R.semPreco) h2 += '<p class="resumo-obs">'+R.semPreco+
    ' lançamento(s) sem preço cadastrado — o valor deles não entra no total.</p>';
  return h+h2;
}

/* ── Produtos ────────────────────────────── */
function abaProdutos(f){
  const l = produtosDe(f.id).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  let h = '<div class="acts"><button class="btn-act primary" onclick="modalProduto()">+ Novo produto</button></div>';
  if(!l.length)
    return h+'<div class="empty"><strong>Nenhum produto cadastrado</strong>'+
      'Cadastre defensivos, adubos e sementes com o preço por litro ou quilo. '+
      'O custo das aplicações sai daqui.</div>';
  h += '<div class="tbl"><table><thead><tr><th>Produto</th><th class="num">Unidade</th>'+
    '<th class="num">Preço</th><th class="num hide-sm">Aplicações</th><th></th></tr></thead><tbody>';
  const R = resumoOperacoes(f.id);
  l.forEach(p=>{
    const u = R.porProduto.find(x=>x.nome===p.nome);
    h += '<tr><td class="forte">'+esc(p.nome)+'</td>'+
      '<td class="num mono">'+esc(p.unidade)+'</td>'+
      '<td class="num mono'+(p.preco>0?'':' vaz')+'">'+(p.preco>0?moeda(p.preco):"sem preço")+'</td>'+
      '<td class="num mono hide-sm">'+(u?u.aplic:0)+'</td>'+
      '<td class="acoes"><button onclick="modalProduto(\''+p.id+'\')">Editar</button>'+
      '<button class="rm" onclick="removerProduto(\''+p.id+'\')">✕</button></td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* ── Consumo por produto ─────────────────── */
function abaResumoProd(f,R){
  if(!R.porProduto.length)
    return '<div class="empty"><strong>Nada aplicado ainda</strong>'+
      'Este resumo mostra quanto de cada produto foi gasto na safra.</div>';
  let h = '<div class="tbl"><table><thead><tr><th>Produto</th>'+
    '<th class="num">Aplicações</th><th class="num">Quantidade</th>'+
    '<th class="num">Valor</th><th class="num hide-sm">% do custo</th></tr></thead><tbody>';
  R.porProduto.forEach(p=>{
    const pct = R.total>0 ? p.valor/R.total*100 : 0;
    h += '<tr><td class="forte">'+esc(p.nome)+'</td>'+
      '<td class="num mono">'+p.aplic+'</td>'+
      '<td class="num mono">'+nf(p.qtd,1)+' <i class="un">'+esc(p.unidade)+'</i></td>'+
      '<td class="num mono forte">'+moeda(p.valor)+'</td>'+
      '<td class="num hide-sm"><div class="barra"><i style="width:'+Math.min(100,pct).toFixed(1)+'%"></i></div>'+
      '<u class="pc">'+nf(pct,1)+'%</u></td></tr>';
  });
  h += '</tbody><tfoot><tr><td class="fix">Total</td><td></td><td></td>'+
    '<td class="num mono tot">'+moeda(R.total)+'</td><td class="hide-sm"></td></tr></tfoot></table></div>';
  return h;
}

function telaLavoura(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const R = resumoLavoura(f.id);

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
    '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
    '<div class="farm-head-mid"><h1>Dados da lavoura</h1>'+
    '<p>Variedade, semente e janela de plantio · safra '+esc(f.safra)+'</p></div></div>';

  if(!R.linhas.length)
    return h+'<div class="empty"><strong>Cadastre os talhões primeiro</strong>'+
      'A lavoura é lançada em cima dos talhões da fazenda.'+
      '<div style="margin-top:16px"><button class="btn-act primary" '+
      'onclick="irPara(\'modulo\',{moduloId:\'talhoes\'})">Ir para Dados da fazenda</button></div></div></div>';

  h += '<div class="kpis kpis-4">'+
    kpi("Talhões plantados", R.plantadas.length, "de "+R.linhas.length)+
    kpi("Área plantada", nf(R.areaPlantada,2), "ha")+
    kpi("Variedades", R.variedades.length, R.variedades.length?R.variedades[0].nome:"")+
    kpi("Janela de plantio", R.inicio?dataBR(R.inicio):"—", R.fim?"até "+dataBR(R.fim):"")+
  '</div>';

  h += '<div class="acts">'+
    '<button class="btn-act" onclick="exportarLavoura()">Baixar planilha</button>'+
    (R.variedades.length?'<button class="btn-act" onclick="modalVariedades()">Ver por variedade</button>':'')+
  '</div>';

  h += '<div class="tbl lav"><table><thead><tr>'+
    '<th>Área</th><th>Variedade</th><th class="num">Área-ha</th>'+
    '<th class="num">Sementes/m</th><th>Início</th><th>Fim</th>'+
    '<th class="num hide-sm">Dias</th></tr></thead><tbody>';
  R.linhas.forEach(l=>{
    h += '<tr'+(l.plantado?'':' class="pendente"')+'>'+
      '<td class="forte">'+esc(l.nome)+'</td>'+
      '<td><input class="lv lv-v" value="'+esc(l.variedade)+'" placeholder="Olimpo, Neo 790…" '+
        'onchange="gravarLav(\''+l.id+'\',\'variedade\',this.value)"></td>'+
      '<td class="num"><input class="lv lv-n" type="number" step="0.01" inputmode="decimal" '+
        'value="'+nf(l.area,2).replace(/\./g,"").replace(",",".")+'" '+
        'onchange="gravarLav(\''+l.id+'\',\'area\',this.value)"></td>'+
      '<td class="num"><input class="lv lv-s" value="'+esc(l.sementes)+'" placeholder="14" '+
        'onchange="gravarLav(\''+l.id+'\',\'sementes\',this.value)"></td>'+
      '<td><input class="lv lv-d" type="date" value="'+esc(l.inicio)+'" '+
        'onchange="gravarLav(\''+l.id+'\',\'inicio\',this.value)"></td>'+
      '<td><input class="lv lv-d" type="date" value="'+esc(l.fim)+'" '+
        'onchange="gravarLav(\''+l.id+'\',\'fim\',this.value)"></td>'+
      '<td class="num mono hide-sm">'+(l.dias!=null?l.dias:"—")+'</td>'+
    '</tr>';
  });
  h += '</tbody><tfoot><tr><td class="fix">Total plantado</td><td></td>'+
    '<td class="num mono tot">'+nf(R.areaPlantada,2)+'</td>'+
    '<td></td><td></td><td></td><td class="hide-sm"></td></tr></tfoot></table></div>';

  if(R.variedades.length){
    h += '<div class="resumo"><div class="resumo-t">Área por variedade</div><div class="acum">'+
      R.variedades.map(v=>'<div class="ac"><span>'+esc(v.nome)+'</span><b>'+
        nf(v.area,2)+' <i>ha</i></b></div>').join("")+'</div></div>';
  }
  return h+'</div>';
}

function gravarLav(id, campo, valor){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  let v = valor;
  if(campo==="area"){ v = String(valor).trim()===""? null : (parseFloat(String(valor).replace(",","."))||0); }
  salvarPlantio(f.id,id,campo,v);
  render();
}

function modalVariedades(){
  const f=acharFazenda(App.fazendaId);
  const R=resumoLavoura(f.id);
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Área por variedade</h2>'+
    '<p class="sub">Total plantado: '+nf(R.areaPlantada,2)+' ha em '+R.plantadas.length+' talhões.</p>'+
    '<div class="lista-cam">'+R.variedades.map(v=>{
      const pct = R.areaPlantada>0 ? v.area/R.areaPlantada*100 : 0;
      return '<div class="cam"><span class="mono">'+esc(v.nome)+'</span>'+
        '<span><div class="barra"><i style="width:'+pct.toFixed(1)+'%"></i></div></span>'+

function exportarLavoura(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const R=resumoLavoura(f.id);
  const linhas=[["RELATÓRIO DE PLANTIO · "+f.nome.toUpperCase()+" · SAFRA "+f.safra]];
  linhas.push(["Área","Variedade","Área-ha","Sementes/m","Início","Fim","Dias"]);
  R.linhas.forEach(l=>linhas.push([l.nome, l.variedade, vBR(l.area.toFixed(2)),
    l.sementes, l.inicio?dataBR(l.inicio):"", l.fim?dataBR(l.fim):"", l.dias!=null?l.dias:""]));
  linhas.push([]);
  linhas.push(["Total plantado","",vBR(R.areaPlantada.toFixed(2))]);
  R.variedades.forEach(v=>linhas.push([v.nome,"",vBR(v.area.toFixed(2))]));
  baixarCSV(linhas,"plantio-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

let _abaEst = "saldo";

function telaEstoque(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const E = estoqueDe(f.id);

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
    '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
    '<div class="farm-head-mid"><h1>Estoque</h1>'+
    '<p>Entra pela nota, sai pela aplicação no talhão · safra '+esc(f.safra)+'</p></div></div>';

  if(!produtosDe(f.id).length)
    return h+'<div class="empty"><strong>Cadastre os produtos primeiro</strong>'+
      'O estoque é montado em cima dos produtos de Operações no talhão.'+

  h += '<div class="kpis kpis-4">'+
    kpi("Comprado", moeda(E.totalComprado).replace("R$ ",""), "R$")+
    kpi("Aplicado", moeda(E.totalAplicado).replace("R$ ",""), "R$")+
    kpi("Em estoque", moeda(E.valorEstoque).replace("R$ ",""), "R$")+
    kpi("Alertas", E.alertas, E.alertas?"saldo negativo":"tudo certo")+

  h += '<div class="abas">'+
    abaEst("saldo","Saldo", E.linhas.filter(l=>l.entrou>0||l.saiu>0).length)+

function abaEst(id,rot,n){
  return '<button class="ab'+(_abaEst===id?' on':'')+'" onclick="_abaEst=\''+id+'\';render()">'+
         esc(rot)+(n?'<b>'+n+'</b>':'')+'</button>';
}

function abaSaldo(f,E){
  const ls = E.linhas.filter(l=>l.entrou>0||l.saiu>0);
  let h = '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalEntrada()">+ Receber produto</button>'+
    '<button class="btn-act" onclick="modalXml()">Importar XML da nota</button>'+
    (ls.length?'<button class="btn-act" onclick="exportarEstoque()">Baixar planilha</button>':'')+'</div>';
  if(!ls.length)
    return h+'<div class="empty"><strong>Estoque vazio</strong>'+
      'Lance o recebimento de um produto ou importe o XML da nota. O que for aplicado no talhão sai daqui sozinho.</div>';

  h += '<div class="tbl"><table><thead><tr><th>Produto</th>'+
    '<th class="num">Entrou</th><th class="num">Aplicado</th><th class="num">Saldo</th>'+
    '<th class="num hide-sm">Custo médio</th><th class="num">Valor em estoque</th></tr></thead><tbody>';
  ls.forEach(l=>{
    const cor = l.negativo ? " alerta" : "";
    h += '<tr'+(l.negativo?' class="neg-row"':'')+'>'+
      '<td class="forte">'+esc(l.nome)+
        (l.semEntrada?'<u class="ob">aplicado sem recebimento lançado</u>':'')+
        (l.negativo&&!l.semEntrada?'<u class="ob">aplicou mais do que entrou</u>':'')+'</td>'+
      '<td class="num mono">'+nf(l.entrou,1)+' <i class="un">'+esc(l.unidade)+'</i></td>'+
      '<td class="num mono">'+nf(l.saiu,1)+'</td>'+
      '<td class="num mono forte'+cor+'">'+nf(l.saldo,1)+'</td>'+
      '<td class="num mono hide-sm">'+(l.medio>0?moeda(l.medio):"—")+'</td>'+
      '<td class="num mono">'+(l.valorSaldo>0?moeda(l.valorSaldo):"—")+'</td></tr>';
  });
  h += '</tbody><tfoot><tr><td class="fix">Total</td><td></td><td></td><td></td>'+
    '<td class="hide-sm"></td><td class="num mono tot">'+moeda(E.valorEstoque)+'</td></tr></tfoot></table></div>';
  if(E.alertas) h += '<p class="resumo-obs">Saldo negativo quer dizer que a aplicação foi lançada '+

function abaEntradas(f){
  const l = entradasDe(f.id).slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  let h = '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalEntrada()">+ Receber produto</button>'+
    '<button class="btn-act" onclick="modalXml()">Importar XML da nota</button></div>';
  if(!l.length)
    return h+'<div class="empty"><strong>Nenhum recebimento lançado</strong>'+
      'Cada nota de compra que chega na fazenda vira um recebimento.</div>';
  h += '<div class="tbl"><table><thead><tr><th>Data</th><th>Produto</th>'+
    '<th class="num">Quantidade</th><th class="num">Preço un.</th><th class="num">Total</th>'+
    '<th class="hide-sm">Nota</th><th class="hide-sm">Fornecedor</th><th></th></tr></thead><tbody>';
  l.forEach(e=>{
    const p=acharProduto(f.id,e.produto_id);
    h += '<tr><td class="mono">'+dataBR(e.data)+'</td>'+
      '<td class="forte">'+esc(p?p.nome:"(removido)")+
        (e.obs?'<u class="ob">'+esc(e.obs)+'</u>':'')+'</td>'+
      '<td class="num mono">'+nf(e.qtd,1)+' <i class="un">'+esc(p?p.unidade:"")+'</i></td>'+
      '<td class="num mono">'+moeda(e.preco)+'</td>'+
      '<td class="num mono forte">'+moeda(e.qtd*e.preco)+'</td>'+
      '<td class="hide-sm mono">'+esc(e.nota||"—")+'</td>'+
      '<td class="hide-sm">'+esc(e.fornecedor||"—")+'</td>'+
      '<td class="acoes"><button onclick="modalEntrada(\''+e.id+'\')">Editar</button>'+
      '<button class="rm" onclick="removerEntrada(\''+e.id+'\')">✕</button></td></tr>';
  });
  const tot=l.reduce((s,e)=>s+e.qtd*e.preco,0);
  return h+'</tbody><tfoot><tr><td class="fix" colspan="4">Total comprado</td>'+
    '<td class="num mono tot">'+moeda(tot)+'</td><td class="hide-sm"></td>'+
    '<td class="hide-sm"></td><td></td></tr></tfoot></table></div>';
}

/* ── Modal de recebimento ────────────────── */

  const e = id ? entradasDe(f.id).find(x=>x.id===id) : null;
  const prods = produtosDe(f.id).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  const hoje = new Date().toISOString().slice(0,10);
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal modal-lg">'+
    '<h2>'+(e?"Editar recebimento":"Receber produto")+'</h2>'+
    '<p class="sub">O que entrou pela nota de compra. O preço daqui vira o custo médio do estoque.</p>'+
    '<div class="frm">'+
      '<div class="g3">'+
        '<div><label for="en-data">Data</label><input type="date" id="en-data" value="'+(e?e.data:hoje)+'"></div>'+
        '<div><label for="en-nota">Nota fiscal</label><input id="en-nota" value="'+esc(e?e.nota:"")+'" placeholder="opcional"></div>'+
        '<div><label for="en-forn">Fornecedor</label><input id="en-forn" value="'+esc(e?e.fornecedor:"")+'" placeholder="opcional"></div>'+
      '</div>'+
      '<div><label for="en-prod">Produto</label><select id="en-prod" onchange="recalcEntrada()">'+
        '<option value="">— escolha —</option>'+
        prods.map(p=>'<option value="'+p.id+'" '+(e&&e.produto_id===p.id?"selected":"")+'>'+
          esc(p.nome)+' · '+esc(p.unidade)+'</option>').join("")+
      '</select></div>'+
      '<div class="g2">'+
        '<div><label for="en-qtd">Quantidade</label>'+
          '<input id="en-qtd" type="number" step="0.01" inputmode="decimal" value="'+(e?e.qtd:"")+'" oninput="recalcEntrada()"></div>'+
        '<div><label for="en-preco">Preço por unidade (R$)</label>'+
          '<input id="en-preco" type="number" step="0.01" inputmode="decimal" value="'+(e?e.preco:"")+'" oninput="recalcEntrada()"></div>'+
      '</div>'+
      '<div id="en-calc" class="calc"></div>'+
      '<div><label for="en-obs">Observação</label><input id="en-obs" value="'+esc(e?e.obs:"")+'" placeholder="opcional"></div>'+
    '</div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="gravarEntrada('+(e?"'"+e.id+"'":"null")+')">Salvar</button>'+
    '</div></div></div>';
  recalcEntrada();
}
function recalcEntrada(){
  const f=acharFazenda(App.fazendaId);
  const g=i=>parseFloat(String((document.getElementById(i)||{}).value||"").replace(",","."))||0;
  const pid=(document.getElementById("en-prod")||{}).value;
  const p=pid?acharProduto(f.id,pid):null;
  const qtd=g("en-qtd"), preco=g("en-preco");
  const box=document.getElementById("en-calc"); if(!box) return;
  const E=estoqueDe(f.id);
  const atual=p?E.linhas.find(l=>l.id===p.id):null;
  box.innerHTML =
    '<span><i>Total da nota</i><b class="ok">'+moeda(qtd*preco)+'</b></span>'+
    (atual?'<span><i>Saldo atual</i><b>'+nf(atual.saldo,1)+' '+esc(p.unidade)+'</b></span>':'')+
    (atual?'<span><i>Fica com</i><b>'+nf(atual.saldo+qtd,1)+' '+esc(p.unidade)+'</b></span>':'')+
    (p&&p.preco>0&&preco>0&&Math.abs(preco-p.preco)/p.preco>0.15
      ? '<span class="nota">O preço cadastrado do produto é '+moeda(p.preco)+
        ' — diferença de '+nf(Math.abs(preco-p.preco)/p.preco*100,0)+'%.</span>' : '');
}
function gravarEntrada(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const n=i=>parseFloat(g(i).replace(",","."))||0;
  const pid=g("en-prod");
  if(!pid){ toast("Escolha o produto"); return; }
  if(n("en-qtd")<=0){ toast("Informe a quantidade recebida"); return; }
  salvarEntrada(f.id,{ data:g("en-data")||new Date().toISOString().slice(0,10),
    produto_id:pid, qtd:n("en-qtd"), preco:n("en-preco"),
    nota:g("en-nota"), fornecedor:g("en-forn"), obs:g("en-obs") }, id);
  fecharModal(); toast(id?"Recebimento atualizado":"Produto recebido"); render();
}
function removerEntrada(id){
  const f=acharFazenda(App.fazendaId);
  if(!confirm("Remover este recebimento?")) return;
  apagarEntrada(f.id,id); toast("Recebimento removido"); render();
}

/* ── Importar XML da nota ────────────────── */
let _nfe = null;

function modalXml(){
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal modal-lg">'+
    '<h2>Importar XML da nota</h2>'+
    '<p class="sub">Escolha o arquivo XML da NF-e. Os itens entram como recebimento no estoque.</p>'+
    '<div class="frm">'+
      '<label class="drop" for="xml-file">'+
        '<b>Escolher arquivo XML</b>'+
        '<span>O XML fica no e-mail do fornecedor ou no portal da NF-e</span>'+
        '<input id="xml-file" type="file" accept=".xml,text/xml,application/xml" onchange="lerArquivoXml(this)">'+
      '</label>'+
      '<div id="xml-res"></div>'+
    '</div>'+
    '<div class="modal-acts" id="xml-acts">'+
      '<button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
    '</div></div></div>';
}

function lerArquivoXml(input){
  const arq = input.files && input.files[0];
  if(!arq) return;
  const box = document.getElementById("xml-res");
  box.innerHTML = '<p class="vazio">Lendo o arquivo…</p>';
  const fr = new FileReader();
  fr.onerror = ()=>{ box.innerHTML='<p class="vazio">Não consegui ler o arquivo.</p>'; };
  fr.onload = ()=>{
    try{
      _nfe = lerXmlNfe(String(fr.result));
      if(!_nfe.itens.length){ box.innerHTML='<p class="vazio">A nota não tem itens com quantidade.</p>'; return; }
      desenharNfe();
    }catch(e){
      box.innerHTML='<p class="vazio">'+esc(e.message||"Arquivo inválido")+
        '. Confira se é o XML da NF-e, não o DANFE em PDF.</p>';
    }
  };
  fr.readAsText(arq, "UTF-8");
}

function desenharNfe(){
  const f = acharFazenda(App.fazendaId);
  const n = _nfe;
  n.itens.forEach(i=>{ if(i.match===undefined){ const p=acharSemelhante(f.id,i.nome); i.match = p?p.id:""; } });

  const prods = produtosDe(f.id).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  const total = n.itens.filter(i=>i.usar).reduce((s,i)=>s+i.total,0);

  document.getElementById("xml-res").innerHTML =
    '<div class="nfe-cab">'+
      '<div><i>Fornecedor</i><b>'+esc(n.fornecedor||"—")+'</b></div>'+
      '<div><i>Nota</i><b>'+esc(n.nota||"—")+'</b></div>'+
      '<div><i>Emissão</i><b>'+(n.data?dataBR(n.data):"—")+'</b></div>'+
    '</div>'+
    '<div class="nfe-itens">'+ n.itens.map((i,k)=>
      '<div class="nfe-it'+(i.usar?"":" fora")+'">'+
        '<label class="nfe-ck"><input type="checkbox" '+(i.usar?"checked":"")+' '+
          'onchange="_nfe.itens['+k+'].usar=this.checked;desenharNfe()"></label>'+
        '<div class="nfe-nome"><b>'+esc(i.nome)+'</b>'+
          '<span>'+nf(i.qtd,2)+' '+esc(i.unidade)+' × '+moeda(i.preco)+' = '+moeda(i.total)+'</span></div>'+
        '<select class="nfe-sel" onchange="_nfe.itens['+k+'].match=this.value">'+
          '<option value="">+ criar produto novo</option>'+
          prods.map(p=>'<option value="'+p.id+'" '+(i.match===p.id?"selected":"")+'>'+
            esc(p.nome)+'</option>').join("")+
        '</select>'+
      '</div>').join("")+'</div>'+
    '<div class="nfe-tot">'+n.itens.filter(i=>i.usar).length+' item(ns) · '+moeda(total)+'</div>'+

function importarNfe(){
  const f = acharFazenda(App.fazendaId); if(!f || !_nfe) return;
  const usar = _nfe.itens.filter(i=>i.usar);
  if(!usar.length){ toast("Escolha ao menos um item"); return; }
  const data = _nfe.data || new Date().toISOString().slice(0,10);
  let criados = 0;

  usar.forEach(i=>{
    let pid = i.match;
    if(!pid){
      const novo = salvarProduto(f.id,{ nome:i.nome, unidade:i.unidade, preco:i.preco });
      pid = novo.id; criados++;
    }
    salvarEntrada(f.id,{ data, produto_id:pid, qtd:i.qtd, preco:i.preco,
      nota:_nfe.nota, fornecedor:_nfe.fornecedor, obs:i.codigo?"cód. "+i.codigo:"" });
  });

  _nfe = null; fecharModal();
  toast(usar.length+" item(ns) lançado(s)"+(criados?" · "+criados+" produto(s) novo(s)":""));
  _abaEst = "entradas"; render();
}

function exportarEstoque(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const E=estoqueDe(f.id);
  const linhas=[["ESTOQUE · "+f.nome.toUpperCase()+" · SAFRA "+f.safra]];
  linhas.push(["Produto","Unidade","Entrou","Aplicado","Saldo","Custo médio","Valor em estoque","Compras"]);
  E.linhas.filter(l=>l.entrou>0||l.saiu>0).forEach(l=>linhas.push([l.nome,l.unidade,
    vBR(l.entrou.toFixed(2)), vBR(l.saiu.toFixed(2)), vBR(l.saldo.toFixed(2)),
    vBR(l.medio.toFixed(2)), vBR(l.valorSaldo.toFixed(2)), l.compras]));
  linhas.push([]);
  linhas.push(["Total comprado","","","","","",vBR(E.totalComprado.toFixed(2))]);
  linhas.push(["Total aplicado","","","","","",vBR(E.totalAplicado.toFixed(2))]);
  linhas.push(["Valor em estoque","","","","","",vBR(E.valorEstoque.toFixed(2))]);
  baixarCSV(linhas,"estoque-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

function telaTempo(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
    '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
    '<div class="farm-head-mid"><h1>Previsão do tempo</h1>'+
    '<p>'+(f.municipio?esc(f.municipio)+(f.uf?"/"+esc(f.uf):""):"Localização da fazenda")+'</p></div></div>';

  if(f.lat==null || f.lon==null)
    return h+'<div class="empty"><strong>Informe onde fica a fazenda</strong>'+
      'A previsão usa a coordenada da sede. Busque pelo nome do município.'+
      '<div style="margin-top:16px"><button class="btn-act primary" onclick="modalLocal()">'+
      'Definir localização</button></div></div></div>';

  const cache = tempoCache(f.id);
  h += '<div class="acts">'+
    '<button class="btn-act primary" onclick="atualizarTempo()">Atualizar</button>'+
    '<button class="btn-act" onclick="modalLocal()">Trocar localização</button>'+
    (cache?'<span class="dica">Consultado em '+esc(quando(cache.buscado_em))+'</span>':'')+
  '</div>';

  if(!cache)
    return h+'<div class="empty"><strong>Sem dados ainda</strong>'+
      'Toque em Atualizar com internet. Depois a última previsão fica disponível offline.</div></div>';

  const a = cache.atual, D = cache.dias;
  const [dsc,ico] = descTempo(a.weather_code);
  h += '<div class="tempo-agora">'+
    '<div class="ta-ico">'+ico+'</div>'+
    '<div class="ta-mid"><b>'+nf(a.temperature_2m,0)+'°</b><span>'+esc(dsc)+'</span></div>'+
    '<div class="ta-det">'+
      '<span><i>Umidade</i>'+nf(a.relative_humidity_2m,0)+'%</span>'+
      '<span><i>Vento</i>'+nf(a.wind_speed_10m,0)+' km/h</span>'+
      '<span><i>Chuva agora</i>'+nf(a.precipitation,1)+' mm</span>'+
    '</div></div>';

  h += '<div class="sec-head"><span>PRÓXIMOS 7 DIAS</span><i></i></div><div class="dias7">';
  (D.time||[]).forEach((dia,i)=>{
    const [d2,i2] = descTempo(D.weather_code[i]);
    const mm = D.precipitation_sum[i]||0;
    const pb = D.precipitation_probability_max[i]||0;
    h += '<div class="d7'+(mm>=5?" molha":"")+'">'+
      '<span class="d7-dia">'+diaSemana(dia)+'<u>'+diaCurto(dia)+'</u></span>'+
      '<span class="d7-ico">'+i2+'</span>'+
      '<span class="d7-t"><b>'+nf(D.temperature_2m_max[i],0)+'°</b>'+
        '<i>'+nf(D.temperature_2m_min[i],0)+'°</i></span>'+
      '<span class="d7-ch'+(mm>0?" tem":"")+'">'+(mm>0?nf(mm,1)+' mm':'—')+
        '<u>'+nf(pb,0)+'%</u></span>'+
      '<span class="d7-d">'+esc(d2)+'</span>'+
    '</div>';
  });
  h += '</div>';

  const somaMM = (D.precipitation_sum||[]).reduce((s,v)=>s+(v||0),0);
  h += '<p class="resumo-obs">Previsão de '+nf(somaMM,1)+' mm na semana. '+
    'Dados do Open-Meteo para a coordenada '+nf(f.lat,4)+', '+nf(f.lon,4)+'. '+
    'A última consulta fica guardada e abre sem internet.</p>';
  return h+'</div>';
}

function diaSemana(iso){
  const d = new Date(iso+"T12:00:00");
  return ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()];
}
function quando(iso){
  const d = new Date(iso), ag = new Date();
  const min = Math.round((ag-d)/60000);
  if(min < 2) return "agora";
  if(min < 60) return min+" min";
  if(min < 1440) return Math.round(min/60)+" h";
  return dataBR(iso.slice(0,10));
}

async function procurarCidade(){
  const box=document.getElementById("lc-res");
  const nome=document.getElementById("lc-busca").value.trim();
  if(!nome){ toast("Digite o município"); return; }
  if(!navigator.onLine){ box.innerHTML='<p class="vazio">Sem internet. Informe a coordenada à mão.</p>'; return; }
  box.innerHTML='<p class="vazio">Procurando…</p>';
  try{
    const l = await buscarCidade(nome);
    const br = l.filter(x=>x.country_code==="BR");
    const lista = (br.length?br:l).slice(0,6);
    if(!lista.length){ box.innerHTML='<p class="vazio">Nada encontrado. Informe a coordenada à mão.</p>'; return; }
    box.innerHTML = '<div class="lc-lista">'+lista.map(x=>
      '<button type="button" class="lc-op" onclick="usarCidade('+x.latitude+','+x.longitude+',\''+
        esc(x.name).replace(/'/g,"\\'")+'\',\''+esc(x.admin1||"").replace(/'/g,"\\'")+'\')">'+
        '<b>'+esc(x.name)+'</b><span>'+esc(x.admin1||"")+' · '+nf(x.latitude,3)+', '+nf(x.longitude,3)+'</span>'+
      '</button>').join("")+'</div>';
  }catch(e){ box.innerHTML='<p class="vazio">Não consegui buscar. Informe a coordenada à mão.</p>'; }
}

function usarCidade(lat,lon,nome,uf){
  document.getElementById("lc-lat").value = lat;
  document.getElementById("lc-lon").value = lon;
  document.getElementById("lc-busca").value = nome;
  const r=document.getElementById("lc-res");
  if(r) r.innerHTML='<p class="vazio">Selecionado: '+esc(nome)+(uf?" · "+esc(uf):"")+'</p>';
}

function gravarLocal(){
  const l=fazendas(), f=l.find(x=>x.id===App.fazendaId); if(!f) return;
  const lat=parseFloat(String(document.getElementById("lc-lat").value).replace(",","."));
  const lon=parseFloat(String(document.getElementById("lc-lon").value).replace(",","."));
  if(isNaN(lat)||isNaN(lon)){ toast("Informe latitude e longitude"); return; }
  if(lat<-90||lat>90||lon<-180||lon>180){ toast("Coordenada fora do intervalo"); return; }
  f.lat=lat; f.lon=lon;
  const mun=document.getElementById("lc-busca").value.trim();
  if(mun && !f.municipio) f.municipio=mun;
  salvarFazendas(l); Sync.push("fazendas","upsert",f);
  Store.del(kTempo(f.id));
  fecharModal(); toast("Localização salva"); render();
  atualizarTempo();
}

let _fTipoDoc = "";

function telaDocumentos(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const todos = docsDe(f.id);
  let l = _fTipoDoc ? todos.filter(d=>d.tipo===_fTipoDoc) : todos.slice();
  l.sort((a,b)=>(b.data||"").localeCompare(a.data||""));

  const comArq = todos.filter(d=>d.arquivo).length;
  const bytes  = todos.reduce((s,d)=>s+(d.tamanho||0),0);
  const vencendo = todos.filter(d=>{ const n=diasAte(d.vencimento); return n!=null && n>=0 && n<=30; }).length;
  const vencidos = todos.filter(d=>{ const n=diasAte(d.vencimento); return n!=null && n<0; }).length;

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
    '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
    '<div class="farm-head-mid"><h1>Documentos</h1>'+
    '<p>Contratos, notas e laudos guardados no aparelho</p></div></div>';

  h += '<div class="kpis kpis-4">'+
    kpi("Documentos", todos.length, comArq+" com arquivo")+
    kpi("Espaço usado", tamanhoLegivel(bytes).split(" ")[0], tamanhoLegivel(bytes).split(" ")[1]||"")+
    kpi("Vencem em 30 dias", vencendo, vencendo?"confira os prazos":"nada próximo")+
    kpi("Vencidos", vencidos, vencidos?"revisar":"em dia")+
  '</div>';

  h += '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalDoc()">+ Novo documento</button>'+
    (todos.length?'<select class="sel-f" onchange="_fTipoDoc=this.value;render()">'+
      '<option value="">Todos os tipos</option>'+
      TIPOS_DOC.map(t=>'<option '+(_fTipoDoc===t?'selected':'')+'>'+esc(t)+'</option>').join("")+
      '</select>':'')+'</div>';

  if(!todos.length)
    return h+'<div class="empty"><strong>Nenhum documento guardado</strong>'+
      'Contratos de venda, compra de maquinário e prestação de serviço. '+
      'O arquivo fica no aparelho e abre sem internet.</div></div>';
  if(!l.length)
    return h+'<div class="empty"><strong>Nada neste tipo</strong>Troque o filtro para ver os outros.</div></div>';

  h += '<div class="docs">';
  l.forEach(d=>{
    const n = diasAte(d.vencimento);
    const estado = n==null ? "" : n<0 ? "venc" : n<=30 ? "perto" : "";
    h += '<div class="doc'+(estado?" "+estado:"")+'">'+
      '<div class="doc-top">'+

        (d.vencimento?'<span class="'+estado+'"><i>Vencimento</i>'+dataBR(d.vencimento)+
          (n!=null?' <u>'+(n<0?Math.abs(n)+" dias atrás":n===0?"hoje":"em "+n+" dias")+'</u>':'')+'</span>':'')+
        (d.valor>0?'<span><i>Valor</i>'+moeda(d.valor)+'</span>':'')+
        (d.arquivo?'<span><i>Arquivo</i>'+esc(d.arquivo)+' · '+tamanhoLegivel(d.tamanho)+'</span>'

function escolherArquivo(input){
  const a = input.files && input.files[0];
  const lbl = document.getElementById("dc-lbl");
  if(!a){ window._docArq=null; return; }
  if(a.size > 8*1024*1024){
    toast("Arquivo acima de 8 MB — reduza antes de anexar");
    input.value=""; window._docArq=null; return;
  }
  window._docArq = a;
  if(lbl) lbl.textContent = a.name+" · "+tamanhoLegivel(a.size);
  const nome=document.getElementById("dc-nome");
  if(nome && !nome.value) nome.value = a.name.replace(/\.[^.]+$/,"");
}

async function gravarDoc(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const nome=g("dc-nome");
  if(!nome){ toast("Informe o nome do documento"); return; }
  const venc=g("dc-venc"), data=g("dc-data");
  if(venc && data && venc < data){ toast("O vencimento é anterior à data do documento"); return; }

  const antigo = id ? docsDe(f.id).find(x=>x.id===id) : null;
  const arq = window._docArq;
  const dados = { nome, tipo:g("dc-tipo"), data, vencimento:venc,
    contraparte:g("dc-parte"),
    valor:parseFloat(g("dc-valor").replace(",","."))||0, obs:g("dc-obs"),
    arquivo: arq ? arq.name : (antigo?antigo.arquivo:null),
    tamanho: arq ? arq.size : (antigo?antigo.tamanho:0) };

  const salvo = salvarDoc(f.id, dados, id);
  if(arq && salvo){
    try{ await guardarArquivo(salvo.id, arq); }
    catch(e){
      salvarDoc(f.id, Object.assign({},dados,{arquivo:null,tamanho:0}), salvo.id);
      toast("Cadastro salvo, mas não consegui guardar o arquivo");
      fecharModal(); render(); return;
    }
  }
  window._docArq=null; fecharModal();
  toast(id?"Documento atualizado":"Documento guardado"); render();
}

async function baixarDoc(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const d=docsDe(f.id).find(x=>x.id===id); if(!d) return;
  try{
    const blob = await pegarArquivo(id);
    if(!blob){ toast("Arquivo não encontrado neste aparelho"); return; }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=d.arquivo||d.nome;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }catch(e){ toast("Não consegui abrir o arquivo"); }
}

function excluirDoc(id){
  const f=acharFazenda(App.fazendaId);
  const d=docsDe(f.id).find(x=>x.id===id); if(!d) return;
  if(!confirm('Remover "'+d.nome+'"?'+(d.arquivo?"\nO arquivo também sai do aparelho.":""))) return;
  apagarDoc(f.id,id); toast("Documento removido"); render();
}

let _itensCarga = [];

function modalCarga(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;

  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal modal-lg">'+

    '<div class="frm">'+
      '<div class="g3">'+
        '<div><label for="k-data">Data</label><input type="date" id="k-data" value="'+(c?c.data:hoje)+'"></div>'+

        '<div><label for="k-dest">Destino</label><select id="k-dest">'+
          (arm.length?"":'<option value="">— cadastre —</option>')+

      '</div>'+
      '<div class="g2">'+
        '<div><label for="k-cam">Caminhão</label><select id="k-cam" onchange="preencherPlaca()">'+
          '<option value="">Avulso</option>'+
          cam.map(x=>'<option value="'+x.id+'" '+(c&&c.placa===x.placa?"selected":"")+'>'+
            esc(x.placa)+(x.motorista?" · "+esc(x.motorista):"")+'</option>').join("")+
        '</select></div>'+
        '<div><label for="k-mot">Motorista</label><input id="k-mot" value="'+esc(c?c.motorista:"")+'" placeholder="Nome"></div>'+
      '</div>'+
      '<div class="g3">'+
        '<div><label for="k-bruto">Peso bruto (kg)</label><input id="k-bruto" type="number" inputmode="decimal" value="'+(c?c.peso_bruto:"")+'" oninput="recalcCarga()"></div>'+
        '<div><label for="k-tara">Tara (kg)</label><input id="k-tara" type="number" inputmode="decimal" value="'+(c?c.tara:"")+'" oninput="recalcCarga()"></div>'+
        '<div><label for="k-umid">Umidade na fazenda (%)</label><input id="k-umid" type="number" step="0.1" inputmode="decimal" value="'+(c?c.umidade:"")+'" oninput="recalcCarga()">'+
          '<span class="pad">só referência — não desconta</span></div>'+
      '</div>'+
      '<div id="calc-box" class="calc"></div>'+
      '<div><label>Talhões de origem</label><div id="itens"></div>'+
        '<button type="button" class="btn-mini" onclick="addItemCarga()">+ outro talhão</button></div>'+
      '<div><label for="k-obs">Observação</label>'+
        '<input id="k-obs" value="'+esc(c?c.obs:"")+'" placeholder="opcional"></div>'+
    '</div>'+
    '<div class="modal-acts">'+
      '<button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="gravarCarga('+(c?"'"+c.id+"'":"null")+')">Salvar carga</button>'+
    '</div></div></div>';
  desenharItens(); recalcCarga();
  setTimeout(()=>{const e=document.getElementById("k-rom"); if(e&&!id) e.focus();},60);

function desenharItens(){
  const f = acharFazenda(App.fazendaId);
  const tals = talhoesDe(f.id).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
  const ult = _itensCarga.length - 1;
  document.getElementById("itens").innerHTML = _itensCarga.map((it,i)=>{
    const auto = i === ult;
    return '<div class="item">'+
      '<select onchange="_itensCarga['+i+'].talhao_id=this.value">'+
        tals.map(t=>'<option value="'+t.id+'" '+(it.talhao_id===t.id?"selected":"")+'>'+esc(t.nome)+'</option>').join("")+
      '</select>'+
      (auto
        ? '<input id="it-resto" class="auto" type="text" readonly tabindex="-1" '+
          'title="Calculado: o que sobra da carga" value="">'
        : '<input type="number" inputmode="decimal" placeholder="kg" value="'+(it.kg||"")+'" '+
          'oninput="_itensCarga['+i+'].kg=this.value;atualizarRateio()">')+
      (_itensCarga.length>1?'<button type="button" onclick="remItemCarga('+i+')">✕</button>':'<span></span>')+
    '</div>';
  }).join("") +
    '<p class="dica" id="dica-rateio"></p>';
  atualizarRateio();
}

/* O último talhão recebe o que sobrou da carga — nunca dá para
   somar mais ou menos que o peso líquido. */
function restanteCarga(){
  const g=id=>parseFloat(String((document.getElementById(id)||{}).value||"").replace(",","."))||0;
  const liq = Math.max(0, g("k-bruto") - g("k-tara"));
  const usado = _itensCarga.slice(0,-1)
    .reduce((s,i)=>s+(parseFloat(String(i.kg).replace(",","."))||0), 0);
  return { liq, usado, resto: liq - usado };
}

function atualizarRateio(){
  const r = restanteCarga();
  const el = document.getElementById("it-resto");
  const dica = document.getElementById("dica-rateio");
  if(el){
    el.value = r.liq > 0 ? n0(r.resto) + " kg" : "—";
    el.classList.toggle("estouro", r.resto < 0);
  }
  if(_itensCarga.length) _itensCarga[_itensCarga.length-1].kg = r.resto > 0 ? r.resto : 0;
  if(dica){
    if(r.liq <= 0)
      dica.innerHTML = 'Informe o peso bruto e a tara para dividir a carga.';
    else if(r.resto < 0)
      dica.innerHTML = '<b class="erro">Passou '+n0(-r.resto)+' kg do peso da carga.</b> '+
        'Ajuste os valores acima — a soma não pode ultrapassar '+n0(r.liq)+' kg.';
    else if(_itensCarga.length === 1)
      dica.innerHTML = 'A carga inteira ('+n0(r.liq)+' kg) fica neste talhão.';
    else
      dica.innerHTML = 'O último talhão recebe o que sobrou: '+n0(r.resto)+' de '+n0(r.liq)+' kg.';
  }
}

function addItemCarga(){
  const f=acharFazenda(App.fazendaId), t=talhoesDe(f.id);
  const usados = _itensCarga.map(x=>x.talhao_id);
  const livre = t.find(x=>!usados.includes(x.id)) || t[0];
  _itensCarga.push({talhao_id:livre?livre.id:"", kg:""});
  desenharItens();
}
function remItemCarga(i){ _itensCarga.splice(i,1); desenharItens(); }

function preencherPlaca(){
  const f=acharFazenda(App.fazendaId);
  const sel=document.getElementById("k-cam").value;
  const cm=caminhoesDe(f.id).find(x=>x.id===sel);
  if(cm && cm.motorista){ const m=document.getElementById("k-mot"); if(m && !m.value) m.value=cm.motorista; }
}

function recalcCarga(){
  const g=id=>parseFloat(String((document.getElementById(id)||{}).value||"").replace(",","."))||0;
  const r = calcCarga({ peso_bruto:g("k-bruto"), tara:g("k-tara") });
  const box=document.getElementById("calc-box"); if(!box) return;
  const u=g("k-umid");
  box.innerHTML =
    '<span><i>Líquido</i><b>'+n0(r.liquido)+' kg</b></span>'+
    '<span><i>Sacas estimadas</i><b class="ok">'+nf(r.sacas,1)+' sc</b></span>'+
    (u>0?'<span><i>Umidade fazenda</i><b>'+nf(u,1)+'%</b></span>':'')+
    '<span class="nota">Valor de saída. As sacas confirmadas saem na baixa, com os descontos do armazém.</span>';
  atualizarRateio();
}


function gravarCarga(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const n=i=>parseFloat(g(i).replace(",","."))||0;

  const bruto=n("k-bruto"), tara=n("k-tara");
  if(bruto<=0){ toast("Informe o peso bruto"); return; }
  if(tara>=bruto){ toast("A tara precisa ser menor que o peso bruto"); return; }
  const itens=_itensCarga.filter(i=>i.talhao_id);
  if(!itens.length){ toast("Escolha o talhão de origem"); return; }
  const r=restanteCarga();
  if(r.resto < 0){ toast("A divisão passa "+n0(-r.resto)+" kg do peso da carga"); return; }
  const dup=itens.map(i=>i.talhao_id);
  if(new Set(dup).size !== dup.length){ toast("O mesmo talhão está repetido"); return; }
  const dest=g("k-dest");
  if(!dest){ toast("Escolha o destino da carga"); return; }

  const cm=caminhoesDe(f.id).find(x=>x.id===g("k-cam"));
  salvarCarga(f.id,{

/* Cada desconto tem dois campos: o grau e o kg. O kg é o que
   conta — vem pronto no romaneio. O grau fica de registro. */
function campoDesc(k, rot, pct, kg, padrao, extra){
  return '<div class="dsc">'+
    '<label>'+esc(rot)+'</label>'+
    '<div class="dsc-in">'+
      '<span class="dsc-c"><input id="b-'+k+'-p" type="number" step="0.01" inputmode="decimal" '+
        'value="'+(pct!=null?pct:"")+'" placeholder="0" oninput="sugerirKg(\''+k+'\');recalcBaixa()">'+
        '<i>%</i></span>'+
      '<span class="dsc-c"><input id="b-'+k+'-k" type="number" step="1" inputmode="decimal" '+
        'value="'+(kg!=null?kg:"")+'" placeholder="0" oninput="_kgManual.'+k+'=true;recalcBaixa()">'+
        '<i>kg</i></span>'+
    '</div>'+
    '<span class="pad">padrão '+padrao+(extra?" · "+esc(extra):"")+'</span>'+
  '</div>';
}
let _kgManual = {};

/* Preenche o kg a partir do grau — só enquanto o campo não
   for tocado à mão. Armazém que calcula diferente, digita direto. */
function sugerirKg(k){
  if(_kgManual[k]) return;
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>parseFloat(String((document.getElementById(i)||{}).value||"").replace(",","."))||0;
  const tipo = k==="umid" ? "umidade" : k==="imp" ? "impureza" : "avariados";
  const liq = g("b-liq");
  const el = document.getElementById("b-"+k+"-k");
  if(el) el.value = sugerirDesc(tipo, liq, g("b-"+k+"-p"), basesDe(f.id)) || "";
}

        campoDesc("imp","Impureza", j.impureza, j.desc_impureza, nf(b.impureza,0)+"%","")+

  window._cargaBaixa = c;

  recalcBaixa();

function recalcBaixa(){
  const f=acharFazenda(App.fazendaId), c=window._cargaBaixa;
  if(!f||!c) return;
  const g=i=>parseFloat(String((document.getElementById(i)||{}).value||"").replace(",","."))||0;
  const liq=g("b-liq");
  const r = calcBaixa({ liquido:liq,
    desc_umidade:g("b-umid-k"), desc_impureza:g("b-imp-k"), desc_avariados:g("b-avar-k") });

  const box=document.getElementById("baixa-calc");
  if(box) box.innerHTML =
    '<span><i>Bruto armazém</i><b>'+n0(liq)+' kg</b></span>'+
    '<span><i>Descontos</i><b class="'+(r.desc_total?"neg":"")+'">'+
      (r.desc_total?"−"+n0(r.desc_total):"0")+' kg</b></span>'+
    '<span><i>Líquido final</i><b>'+n0(r.peso_final)+' kg</b></span>'+
    '<span><i>Sacas</i><b class="ok">'+nf(r.sacas_final,1)+' sc</b></span>'+
    (liq>0 && r.desc_total ? '<span class="nota">'+
      nf(r.desc_total/liq*100,2)+'% do bruto descontado.'+
      ((c.umidade && g("b-umid-p")) ? ' A fazenda mediu '+nf(c.umidade,1)+'% de umidade e o armazém '+
        nf(g("b-umid-p"),1)+'%.' : '')+'</span>' : '');

  const tals=talhoesDe(f.id);
  const itens=(c.talhoes||[]).filter(i=>tals.some(t=>t.id===i.talhao_id));
  const soma=itens.reduce((s,i)=>s+(Number(i.kg)||0),0);
  const rt=document.getElementById("baixa-rateio");
  if(rt) rt.innerHTML = itens.map(i=>{
    const frac = soma>0 ? (Number(i.kg)||0)/soma : 1/itens.length;
    const t = tals.find(x=>x.id===i.talhao_id);
    return '<div class="rt"><span>'+esc(t?t.nome:"—")+
      (itens.length>1?' <u>'+nf(frac*100,0)+'%</u>':'')+'</span>'+
      '<b>'+nf(r.sacas_final*frac,1)+' sc</b></div>';
  }).join("") || '<p class="vazio">Carga sem talhão vinculado.</p>';
}
