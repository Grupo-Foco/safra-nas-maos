        (cargaBaixada(c)?"Salvar alterações":"Confirmar baixa")+'</button>'+
    '</div></div></div>';
  window._cargaBaixa = c;
  _kgManual = {};
  recalcBaixa();
}

function recalcBaixa(){
  const f=acharFazenda(App.fazendaId), c=window._cargaBaixa;
  if(!f||!c) return;
  const g=i=>parseFloat(String((document.getElementById(i)||{}).value||"").replace(",","."))||0;
  const liq=g("b-liq");
  const r = calcBaixa({ liquido:liq,
    desc_umidade:g("b-umid-k"), desc_impureza:g("b-imp-k"), desc_avariados:g("b-avar-k") });

  const box=document.getElementById("baixa-calc");
  if(box) box.innerHTML =
    '<span><i>Bruto armazém</i><b>'+n0(liq)+' kg</b></span>'+
    '<span><i>Descontos</i><b class="'+(r.desc_total?"neg":"")+'">'+
      (r.desc_total?"−"+n0(r.desc_total):"0")+' kg</b></span>'+
    '<span><i>Líquido final</i><b>'+n0(r.peso_final)+' kg</b></span>'+
    '<span><i>Sacas</i><b class="ok">'+nf(r.sacas_final,1)+' sc</b></span>'+
    (liq>0 && r.desc_total ? '<span class="nota">'+
      nf(r.desc_total/liq*100,2)+'% do bruto descontado.'+
      ((c.umidade && g("b-umid-p")) ? ' A fazenda mediu '+nf(c.umidade,1)+'% de umidade e o armazém '+
        nf(g("b-umid-p"),1)+'%.' : '')+'</span>' : '');

  const tals=talhoesDe(f.id);
  const itens=(c.talhoes||[]).filter(i=>tals.some(t=>t.id===i.talhao_id));
  const soma=itens.reduce((s,i)=>s+(Number(i.kg)||0),0);
  const rt=document.getElementById("baixa-rateio");
  if(rt) rt.innerHTML = itens.map(i=>{
    const frac = soma>0 ? (Number(i.kg)||0)/soma : 1/itens.length;
    const t = tals.find(x=>x.id===i.talhao_id);
    return '<div class="rt"><span>'+esc(t?t.nome:"—")+
      (itens.length>1?' <u>'+nf(frac*100,0)+'%</u>':'')+'</span>'+
      '<b>'+nf(r.sacas_final*frac,1)+' sc</b></div>';
  }).join("") || '<p class="vazio">Carga sem talhão vinculado.</p>';
}

function gravarBaixa(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const n=i=>parseFloat(g(i).replace(",","."))||0;
  const liq=n("b-liq");
  if(liq<=0){ toast("Informe o peso líquido do armazém"); return; }
  const dTot = n("b-umid-k")+n("b-imp-k")+n("b-avar-k");
  if(dTot > liq){ toast("Os descontos passam do peso líquido"); return; }
  darBaixa(f.id,id,{ data:g("b-data")||new Date().toISOString().slice(0,10),
    romaneio_arm:g("b-rom"), liquido:liq,
    umidade:n("b-umid-p"),   desc_umidade:n("b-umid-k"),
    impureza:n("b-imp-p"),   desc_impureza:n("b-imp-k"),
    avariados:n("b-avar-p"), desc_avariados:n("b-avar-k"),
    obs:g("b-obs") });
  fecharModal(); toast("Carga baixada · entrou na produtividade"); render();
}

function reabrirCarga(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;

function exportarDescontos(fmt){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const l=cargasDe(f.id).filter(cargaBaixada);
  if(!l.length){ toast("Nenhuma carga baixada"); return; }
  const linhas=[["Codigo","Data carga","Data baixa","Romaneio fazenda","Romaneio armazem",
    "Destino","Bruto_armazem_kg","Umidade_pc","Desc_umidade_kg","Impureza_pc","Desc_impureza_kg",
    "Avariados_pc","Desc_avariados_kg","Desc_total_kg","Liquido_final_kg","Sacas"]];
  l.sort((a,b)=>(a.baixa.data||"").localeCompare(b.baixa.data||"")).forEach(c=>{
    const b=c.baixa;
    linhas.push([c.codigo, dataBR(c.data), dataBR(b.data), c.romaneio, b.romaneio_arm,
      c.destino, vBR(b.liquido), vBR(b.umidade), vBR(b.desc_umidade),
      vBR(b.impureza), vBR(b.desc_impureza), vBR(b.avariados), vBR(b.desc_avariados),
      vBR(b.desc_total), vBR(b.peso_final), vBR(b.sacas_final.toFixed(2))]);
  });
  const R=resumoDescontos(f.id).tot;
  linhas.push([]);
  linhas.push(["Total", "", "", "", "", "", vBR(R.bruto), "", vBR(R.umidade), "",
    vBR(R.impureza), "", vBR(R.avariados), vBR(R.total), vBR(R.final), vBR((R.final/SACA_KG).toFixed(2))]);
  exportarTabela(fmt, "Descontos · "+f.nome, linhas,
    "descontos-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

/* ── Modal: aplicação ────────────────────── */
function modalAplicacao(id){

      '<div class="g3">'+
        '<div><label for="ap-data">Data</label><input type="date" id="ap-data" value="'+(a?a.data:hoje)+'"></div>'+
        '<div><label for="ap-tipo">Tipo</label><select id="ap-tipo">'+

      '</div>'+
      '<div><label>Talhões</label><div class="tsel">'+
        tals.map(t=>'<label class="tc'+(sel.has(t.id)?" on":"")+'">'+

          'onchange="this.parentNode.classList.toggle(\'on\',this.checked);sugerirArea()">'+
          esc(t.nome)+'</label>').join("")+
      '</div><p class="dica">A área tratada pode ser menor que a soma dos talhões — é o caso de borda ou reaplicação.</p></div>'+

        '<button type="button" class="btn-mini" onclick="addItemApl()">+ outro produto</button></div>'+

}

function desenharItensApl(){
  const f=acharFazenda(App.fazendaId);
  const prods = produtosDe(f.id).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  document.getElementById("ap-itens").innerHTML = _itensApl.map((it,i)=>
    '<div class="item item-p">'+
      '<select onchange="_itensApl['+i+'].produto_id=this.value;recalcApl()">'+
        '<option value="">— produto —</option>'+
        prods.map(p=>'<option value="'+p.id+'" '+(it.produto_id===p.id?"selected":"")+'>'+
          esc(p.nome)+(p.preco>0?" · "+moeda(p.preco)+"/"+esc(p.unidade):" · sem preço")+'</option>').join("")+
      '</select>'+
      '<input type="number" step="0.001" inputmode="decimal" placeholder="dose" value="'+(it.dose||"")+'" '+
        'oninput="_itensApl['+i+'].dose=this.value;recalcApl()">'+
      (_itensApl.length>1?'<button type="button" onclick="remItemApl('+i+')">✕</button>':'<span></span>')+
    '</div>').join("");
}
function addItemApl(){ _itensApl.push({produto_id:"",dose:""}); desenharItensApl(); recalcApl(); }
function remItemApl(i){ _itensApl.splice(i,1); desenharItensApl(); recalcApl(); }

function sugerirArea(){
  const f=acharFazenda(App.fazendaId);
  const el=document.getElementById("ap-ha"); if(!el||el.value) return;
  const ids=[...document.querySelectorAll('.tsel input:checked')].map(x=>x.value);
  const soma=talhoesDe(f.id).filter(t=>ids.includes(t.id)).reduce((s,t)=>s+t.hectares,0);
  if(soma>0){ el.value=soma.toFixed(2); recalcApl(); }
}

function recalcApl(){
  const f=acharFazenda(App.fazendaId);
  const ha=parseFloat(String((document.getElementById("ap-ha")||{}).value||"").replace(",","."))||0;
  let total=0, n=0, sem=0;
  _itensApl.forEach(it=>{
    const p=acharProduto(f.id,it.produto_id); if(!p) return;
    const dose=parseFloat(String(it.dose).replace(",","."))||0;
    if(dose<=0) return;
    n++;
    if((Number(p.preco)||0)<=0){ sem++; return; }
    total += dose*ha*Number(p.preco);
  });
  const box=document.getElementById("ap-calc"); if(!box) return;
  box.innerHTML =
    '<span><i>Produtos</i><b>'+n+'</b></span>'+
    '<span><i>Área</i><b>'+nf(ha,2)+' ha</b></span>'+
    '<span><i>Custo por hectare</i><b>'+(ha>0?moeda(total/ha):"—")+'</b></span>'+
    '<span><i>Custo da aplicação</i><b class="ok">'+moeda(total)+'</b></span>'+
    (sem?'<span class="nota">'+sem+' produto(s) sem preço — não entram no custo.</span>':'');
}

function gravarAplicacao(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const ha=parseFloat(String(document.getElementById("ap-ha").value).replace(",","."))||0;
  if(ha<=0){ toast("Informe a área tratada"); return; }
  const ids=[...document.querySelectorAll('.tsel input:checked')].map(x=>x.value);
  if(!ids.length){ toast("Escolha ao menos um talhão"); return; }
  const itens=_itensApl.filter(i=>i.produto_id && parseFloat(String(i.dose).replace(",","."))>0)
    .map(i=>({produto_id:i.produto_id, dose:parseFloat(String(i.dose).replace(",","."))}));
  if(!itens.length){ toast("Informe ao menos um produto com dose"); return; }
  salvarAplicacao(f.id,{ data:document.getElementById("ap-data").value||new Date().toISOString().slice(0,10),
    tipo:document.getElementById("ap-tipo").value, talhoes:ids, hectares:ha,
    obs:document.getElementById("ap-obs").value, itens }, id);
  fecharModal(); toast(id?"Aplicação atualizada":"Aplicação lançada"); render();
}

function removerAplicacao(id){
  const f=acharFazenda(App.fazendaId);
  const a=aplicacoesDe(f.id).find(x=>x.id===id); if(!a) return;
  if(!confirm("Remover a aplicação de "+dataBR(a.data)+"?")) return;
  apagarAplicacao(f.id,id); toast("Aplicação removida"); render();
}

function gravarProduto(id){

function removerProduto(id){
  const f=acharFazenda(App.fazendaId);

  const uso=aplicacoesDe(f.id).filter(a=>(a.itens||[]).some(i=>i.produto_id===id)).length;

/* ── Planilhas ───────────────────────────── */
function baixarCSV(linhas, nome){
  const csv="\ufeff"+linhas.map(r=>r.map(v=>{
    const s=String(v==null?"":v);
    return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download=nome+".csv"; a.click(); URL.revokeObjectURL(a.href);
  toast("Planilha baixada");
}

/* Ponte genérica: uma tabela (array de arrays) vira um spec do REL
   para imagem/PDF. Linhas antes do cabeçalho (título) viram subtítulo;
   linhas em branco são puladas; linhas que começam com "Total/Média"
   viram linha de total. */
function aoaParaRel(titulo, aoa){
  aoa = (aoa||[]).filter(Boolean);
  let hi = aoa.findIndex(r => r.filter(c=>String(c==null?"":c).trim()!=="").length >= 2);
  if(hi < 0) hi = 0;
  const sub = aoa.slice(0,hi).map(r=>r.join(" ")).filter(s=>s.trim()).join(" · ");
  const header = (aoa[hi]||[]).map(c=>String(c==null?"":c));
  const body = aoa.slice(hi+1);
  const linhas = [{t:'cab', cs:header}];
  body.forEach(r=>{
    const cells = header.map((_,i)=>String(r[i]==null?"":r[i]));
    if(cells.every(c=>c.trim()==="")) return;
    const ehTotal = /^(total|m[ée]dia|valor em estoque)/i.test((cells[0]||"").trim());
    linhas.push({t: ehTotal?'total':'dado', cs:cells});
  });
  const aligns = header.map((_,i)=>{
    if(i===0) return 'left';
    const vals = body.map(r=>String(r[i]==null?"":r[i]).trim()).filter(v=>v!=="");
    if(!vals.length) return 'left';
    const num = vals.filter(v=>/^[\d.,\-%]+$/.test(v)).length;
    return num >= vals.length*0.6 ? 'right' : 'left';
  });
  const larguras = header.map((h,i)=>{
    let m = String(h).length;
    body.forEach(r=>{ const s=String(r[i]==null?"":r[i]); if(s.length>m) m=s.length; });
    return Math.min(300, Math.max(60, 16 + m*8));
  });
  return { titulo, sub, larguras, aligns, linhas };
}

/* Ponte genérica: um spec do REL vira planilha (CSV). */
function relParaCSV(spec, nome){
  const linhas = (spec.linhas||[]).map(l => l.cs ? l.cs : [l.texto||""]);
  baixarCSV(linhas, nome);
}

/* Exporta uma tabela (AOA) no formato pedido, reusando as pontes acima. */
function exportarTabela(fmt, titulo, aoa, nome){
  if(!fmt || fmt==="csv"){ baixarCSV(aoa, nome); return; }
  const spec = aoaParaRel(titulo, aoa);
  fmt==="pdf" ? REL.pdf(spec, nome) : REL.png(spec, nome);
}
const vBR = v => String(v==null?"":v).replace(".",",");

/* Cargas na ordem e com os filtros da tela (destino, situação, busca). */
function cargasFiltradas(fid){
  let l = cargasDe(fid).slice();
  if(_fCarga.destino) l=l.filter(c=>c.destino===_fCarga.destino);
  if(_fCarga.talhao)  l=l.filter(c=>(c.talhoes||[]).some(i=>i.talhao_id===_fCarga.talhao));
  if(_fCarga.situacao==="baixada") l=l.filter(cargaBaixada);
  else if(_fCarga.situacao==="transito") l=l.filter(c=>!cargaBaixada(c));
  if(_fCarga.de)  l=l.filter(c=>(c.data||"")>=_fCarga.de);
  if(_fCarga.ate) l=l.filter(c=>(c.data||"")<=_fCarga.ate);
  if(_fCarga.busca){ const b=_fCarga.busca.toLowerCase();
    l=l.filter(c=>(c.romaneio||"").toLowerCase().includes(b)||(c.motorista||"").toLowerCase().includes(b)||
      (c.placa||"").toLowerCase().includes(b)||(c.codigo||"").toLowerCase().includes(b)); }
  return l.sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.codigo||"").localeCompare(a.codigo||""));
}

/* ── Relatórios formatados (PNG/PDF) ─────── */
function relCaminhoes(f){
  const tals=talhoesDe(f.id);
  const nome=id=>{const t=tals.find(x=>x.id===id); return t?t.nome:"";};
  const larguras=[72,66,116,92,300,116,96,84,74];
  const aligns=['center','center','left','center','left','center','right','right','right'];
  const filtro=[]; // legenda dos filtros ativos, para o subtítulo
  if(_fCarga.destino) filtro.push("destino "+_fCarga.destino);
  if(_fCarga.situacao==="baixada") filtro.push("só baixadas");
  else if(_fCarga.situacao==="transito") filtro.push("só a caminho");
  if(_fCarga.busca) filtro.push('"'+_fCarga.busca+'"');
  if(_fCarga.de||_fCarga.ate) filtro.push("período "+(_fCarga.de?dataBR(_fCarga.de):"…")+"–"+(_fCarga.ate?dataBR(_fCarga.ate):"…"));
  const linhas=[{t:'cab',cs:['Controle','Data','Motorista','Placa','Talhão','Destino','Balança Faz.','Sc','Umidade']}];
  let totLiq=0, totSc=0;
  cargasFiltradas(f.id).forEach(c=>{
    const ok=cargaBaixada(c); const sc= ok?c.baixa.sacas_final:(c.sacas||0);
    const rateio=(c.talhoes||[]).map(i=>{
      const kg=Number(i.kg)||0; return (kg>0?n0(kg)+"kg ":"")+nome(i.talhao_id);
    }).join(" + ");
    linhas.push({t:'dado',cs:[c.codigo||c.romaneio||"", dataBR(c.data), c.motorista||"", c.placa||"",
      rateio||"—", c.destino||"", n0(c.liquido), nf(sc,2),
      nf(ok?c.baixa.umidade:c.umidade,1)+"%"]});
    totLiq+=Number(c.liquido)||0; totSc+=sc;
  });
  linhas.push({t:'total',cs:['','','','','','TOTAL', n0(totLiq), nf(totSc,2), '']});
  return {titulo:"Controle de Caminhões · "+f.nome,
    sub:"Safra "+f.safra+(filtro.length?"  ·  filtro: "+filtro.join(", "):""), larguras, aligns, linhas};
}

function relProdutividade(f){
  const p=produtividade(f.id);
  const bc=baselineComp(f.id, f.safra);
  const base=bc.mapa;
  const lav=lavouraDe(f.id);
  const temSilo = _mostrarSilos && p.linhas.some(t=>(t.silos>0)||(t.sc_silo>0));
  const cols=[{n:'Talhão',a:'left',w:200, v:t=>t.nome},
              {n:'Área/ha',a:'right',w:84, v:t=>nf(t.hectares,2)},
              {n:'Sacas armazém',a:'right',w:118, v:t=>t.sacas>0?nf(t.sacas,2):"—"}];
  if(temSilo){
    cols.push({n:'Silos',a:'right',w:64, v:t=>t.silos||"—"});
    cols.push({n:'Sacas silo',a:'right',w:104, v:t=>t.sc_silo>0?nf(t.sc_silo,0):"—"});
    cols.push({n:'Total sc',a:'right',w:112, v:t=>t.total_sc>0?nf(t.total_sc,2):"—"});
  }
  cols.push({n:'Sc/ha',a:'right',w:84, v:t=>t.colhido?nf(t.sc_ha,2):"—"});
  cols.push({n:'Variedade',a:'left',w:200, v:t=>{const lv=lav[t.id]; return (lv&&lv.variedade)?lv.variedade:"—";}});

  const larguras=cols.map(c=>c.w), aligns=cols.map(c=>c.a);
  const idxSc=cols.findIndex(c=>c.n==='Sc/ha');
  const linhas=[{t:'cab',cs:cols.map(c=>c.n)}];
  p.linhas.forEach(t=>{
    const b=hVal(base[t.nome]), cor=[];
    if(b!=null && t.colhido && t.sc_ha>b) cor[idxSc]=REL.ouro;
    linhas.push({t:'dado', cor, cs:cols.map(c=>c.v(t))});
  });
  const colhido=cols.map(c=>{
    if(c.n==='Talhão') return 'COLHIDO ATÉ AGORA';
    if(c.n==='Área/ha') return nf(p.haColhida,2);
    if(c.n==='Sacas armazém') return nf(p.sacasArmazem,2);
    if(c.n==='Sacas silo') return nf(p.sacasSilo,0);
    if(c.n==='Total sc') return nf(p.totalSacas,2);
    if(c.n==='Sc/ha') return nf(p.prodColhida,2);
    return '';
  });
  linhas.push({t:'total', cs:colhido});
  const tot=cols.map(c=>{
    if(c.n==='Talhão') return 'TOTAL / MÉDIA';
    if(c.n==='Área/ha') return nf(p.haTotal,2);
    if(c.n==='Sacas armazém') return nf(p.sacasArmazem,2);
    if(c.n==='Sacas silo') return nf(p.sacasSilo,0);
    if(c.n==='Total sc') return nf(p.totalSacas,2);
    if(c.n==='Sc/ha') return '';   // produtividade momentânea fica na linha "colhido até agora"
    return '';
  });
  linhas.push({t:'total', cs:tot});
  return {titulo:"Produtividade · "+f.nome,
    sub:"Safra "+f.safra+(bc.safra?"  ·  comparativo com "+safraCurta(bc.safra):"  ·  sem safra anterior registrada"),
    larguras, aligns, linhas};
}
/* Tabela da safra anterior (do Histórico): talhão, área, produção, sc/ha, cultivar.
   Área vem do histórico se houver; senão do talhão atual. Produção = área × sc/ha. */
function relHistComparativo(f, safra){
  const mapa = histDe(f.id)[safra]||{};
  const tals = talhoesDe(f.id);
  const areaDe = nome => { const t=tals.find(t=>t.nome===nome); return t?(Number(t.hectares)||null):null; };
  const chaves = Object.keys(mapa).filter(k=>hVal(mapa[k])!=null)
    .sort((a,b)=>a.localeCompare(b,"pt-BR",{numeric:true}));
  const larguras=[190,80,112,80,190], aligns=['left','right','right','right','left'];
  const linhas=[{t:'cab',cs:['Talhão','Área/ha','Produção sc','Sc/ha','Cultivar']}];
  let totA=0, totSc=0;
  chaves.forEach(k=>{ const x=mapa[k], v=hVal(x);
    const a=hArea(x)!=null?hArea(x):areaDe(k);
    const sc=(a!=null&&v!=null)?a*v:null;
    if(a) totA+=a; if(sc) totSc+=sc;
    linhas.push({t:'dado',cs:[k, a!=null?nf(a,2):"—", sc!=null?nf(sc,2):"—", v!=null?nf(v,2):"—", hCult(x)||"—"]});
  });
  const prod = totA>0? totSc/totA : 0;
  linhas.push({t:'total',cs:['TOTAL / MÉDIA', nf(totA,2), nf(totSc,2), nf(prod,2), '']});
  return {titulo:"Produtividade "+safraCurta(safra)+" · "+f.nome, sub:"Safra anterior · do histórico",
    larguras, aligns, linhas};
}
function exportarProdutividadeImg(fmt){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  if(!produtividade(f.id).linhas.length){ toast("Cadastre talhões primeiro"); return; }
  const spec=relProdutividade(f), nm="produtividade-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-");
  const bc=baselineComp(f.id, f.safra);
  const temAnterior = bc.safra && Object.keys(bc.mapa).some(k=>hVal(bc.mapa[k])!=null);
  if(temAnterior){
    const cv=REL.desenharLado([spec, relHistComparativo(f, bc.safra)]);
    fmt==="pdf"?REL.pdfCv(cv,nm):REL.pngCv(cv,nm);

    fmt==="pdf"?REL.pdf(spec,nm):REL.png(spec,nm);
  }
}

function relChuva(f){
  const pts=pontosDe(f.id), dias=diasDeChuva(f.id,f.safra);
  const larg=[100].concat(pts.map(()=>66)).concat([80]);
  const aligns=['center'].concat(pts.map(()=>'right')).concat(['right']);
  const linhas=[{t:'cab',cs:['Dia'].concat(pts.map(p=>p.nome)).concat(['Total'])}];
  const tot={}; pts.forEach(p=>tot[p.id]=0); let geral=0;
  dias.forEach(k=>{ let soma=0;
    const cs=[diaCurto(k)].concat(pts.map(p=>{ const v=lerChuva(f.id,k,p.id); if(v!=null){soma+=v;tot[p.id]+=v;} return v==null?"—":nf(v,1); }));
    cs.push(nf(soma,1)); geral+=soma; linhas.push({t:'dado',cs});
  });
  linhas.push({t:'total',cs:['Total'].concat(pts.map(p=>nf(tot[p.id],1))).concat([nf(geral,1)])});
  linhas.push({t:'total',cs:['Média'].concat(pts.map(()=>nf(geral/(pts.length||1),1))).concat([nf(geral/(pts.length||1),1)])});
  return {titulo:"Pluviometria · "+f.nome, sub:"Safra "+f.safra, larguras:larg, aligns, linhas};
}

/* Atualização automática: o navegador nunca serve o sw.js do
   cache, procura versão nova ao abrir e a cada minuto, e recarrega
   sozinho quando a nova assume. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let _recarregando = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(_recarregando) return;
    _recarregando = true;
    location.reload();
  });
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg=>{
    reg.update();
    setInterval(()=>reg.update(), 60000);
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "visible") reg.update();
    });
    reg.addEventListener("updatefound", ()=>{
      const nova = reg.installing;
      if(!nova) return;
      nova.addEventListener("statechange", ()=>{
        if(nova.state === "installed" && navigator.serviceWorker.controller)
          toast("Atualizando para a versão nova…");
      });
    });
  }).catch(()=>{});
}
