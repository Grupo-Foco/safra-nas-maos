function escolherArquivoPedido(input){
  const a=input.files && input.files[0];
  const lbl=document.getElementById("pd-arq-lbl");
  if(!a){ window._pedArq=null; return; }
  if(a.size > 20*1024*1024){ toast("Arquivo acima de 20 MB — reduza antes de anexar"); input.value=""; window._pedArq=null; return; }
  window._pedArq=a;
  if(lbl) lbl.textContent = a.name+" · "+tamanhoLegivel(a.size);
}
async function gravarPedido(id){
  const f=acharFazenda(App.fazendaId);
  const prod=(document.getElementById("pd-prod").value||"").trim();
  const qtd=Number((document.getElementById("pd-qtd").value||"").replace(",","."));
  if(!prod){ toast("Informe o produto"); return; }
  if(!qtd||qtd<=0){ toast("Informe a quantidade"); return; }
  const un=(document.getElementById("pd-un").value||"").trim();
  const resp=(document.getElementById("pd-resp").value||"").trim();
  const valor=Number((document.getElementById("pd-val").value||"").replace(",","."))||0;
  const l=pedidosDe(f.id);
  let pid=id;
  if(id){ const p=l.find(x=>x.id===id); if(!p){fecharModal();return;}
    p.produto=prod; p.responsavel=resp; p.qtd=qtd; p.unidade=un; p.valor=valor;
  } else {
    pid="pd_"+Date.now().toString(36);
    l.push({id:pid, produto:prod, responsavel:resp, unidade:un, qtd:qtd, valor:valor,
      entregue:0, criado_em:new Date().toISOString()});
  }
  salvarPedidos(f.id,l);
  const arq=window._pedArq;
  if(arq){
    const atual=pedidosDe(f.id).find(x=>x.id===pid);
    const ext=(arq.name.match(/\.[a-z0-9]+$/i)||[""])[0].toLowerCase();
    const caminho=f.id+"/pedido-"+pid+ext;
    if(atual && atual.anexo_path && atual.anexo_path!==caminho){ stApagar(atual.anexo_path); removerArquivo(atual.anexo_path); }
    try{
      await enviarArquivo(caminho, arq);
      const l2=pedidosDe(f.id), p2=l2.find(x=>x.id===pid);
      if(p2){ p2.anexo=arq.name; p2.anexo_path=caminho; salvarPedidos(f.id,l2); }
    }catch(e){ toast("Pedido salvo, mas não consegui guardar o anexo"); }
  }
  window._pedArq=null; fecharModal(); toast(id?"Pedido atualizado":"Pedido adicionado"); render();
}
async function abrirArquivoPath(path){
  if(!path){ toast("Sem anexo"); return; }
  try{
    let blob=await pegarArquivo(path);
    if(!blob && navigator.onLine){ blob=await stBaixar(path); if(blob) guardarArquivo(path,blob); }
    if(!blob){ toast(navigator.onLine?"Arquivo não encontrado":"Sem internet e sem cópia no aparelho"); return; }
    window.open(URL.createObjectURL(blob),"_blank","noopener");
  }catch(e){ toast("Não consegui abrir o arquivo"); }
}
async function verAnexoPedido(id){
  const f=acharFazenda(App.fazendaId);
  const p=pedidosDe(f.id).find(x=>x.id===id); if(!p){ toast("Sem anexo"); return; }
  abrirArquivoPath(p.anexo_path);
}
function modalEntregaPedido(id){
  const f=acharFazenda(App.fazendaId);
  const p=pedidosDe(f.id).find(x=>x.id===id); if(!p) return;
  const falta=p.qtd-(p.entregue||0);
  window._entArq={};
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Registrar entrega</h2><p class="sub">'+esc(p.produto)+' · faltam '+nf(falta,0)+(p.unidade?' '+esc(p.unidade):'')+'</p>'+
    '<div class="frm">'+
      '<div style="display:flex;gap:10px"><div style="flex:1"><label for="pe-data">Dia da entrega</label>'+
        '<input id="pe-data" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
        '<div style="flex:1"><label for="pe-qtd">Quantidade que chegou</label>'+
        '<input id="pe-qtd" type="number" inputmode="decimal" placeholder="'+nf(falta,0)+'"></div></div>'+
      '<div><label for="pe-f1">Nota 1 (opcional)</label>'+
        '<input id="pe-f1" type="file" accept="image/*,application/pdf" onchange="escolherArquivoEntrega(this,1)">'+
        '<span class="nota-pad" id="pe-f1-lbl"></span></div>'+
      '<div><label for="pe-f2">Nota 2 (opcional)</label>'+
        '<input id="pe-f2" type="file" accept="image/*,application/pdf" onchange="escolherArquivoEntrega(this,2)">'+
        '<span class="nota-pad" id="pe-f2-lbl"></span></div>'+
    '</div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="gravarEntregaPedido(\''+id+'\')">Registrar</button></div></div></div>';
  setTimeout(()=>{const e=document.getElementById("pe-qtd"); if(e) e.focus();},60);
}
function escolherArquivoEntrega(input, slot){
  const a=input.files && input.files[0];
  const lbl=document.getElementById("pe-f"+slot+"-lbl");
  window._entArq=window._entArq||{};
  if(!a){ delete window._entArq[slot]; if(lbl) lbl.textContent=""; return; }
  if(a.size>20*1024*1024){ toast("Arquivo acima de 20 MB — reduza antes de anexar"); input.value=""; delete window._entArq[slot]; return; }
  window._entArq[slot]=a;
  if(lbl) lbl.textContent=a.name+" · "+tamanhoLegivel(a.size);
}
async function gravarEntregaPedido(id){
  const f=acharFazenda(App.fazendaId);
  const p=pedidosDe(f.id).find(x=>x.id===id); if(!p){ fecharModal(); return; }
  const q=Number((document.getElementById("pe-qtd").value||"").replace(",","."));
  if(!q||q<=0){ toast("Informe a quantidade"); return; }
  const data=document.getElementById("pe-data").value||new Date().toISOString().slice(0,10);
  const entId="en_"+Date.now().toString(36);
  const anexos=[], arqs=window._entArq||{};
  for(const slot of [1,2]){
    const arq=arqs[slot]; if(!arq) continue;
    const ext=(arq.name.match(/\.[a-z0-9]+$/i)||[""])[0].toLowerCase();
    const caminho=f.id+"/entrega-"+entId+"-"+slot+ext;
    try{ await enviarArquivo(caminho, arq); anexos.push({nome:arq.name, path:caminho}); }
    catch(e){ toast("Entrega salva, mas não consegui guardar a nota "+slot); }
  }
  const l2=pedidosDe(f.id), p2=l2.find(x=>x.id===id); if(!p2){ fecharModal(); return; }
  p2.entregas=p2.entregas||[];
  p2.entregas.push({id:entId, qtd:q, data:data, anexos:anexos});
  p2.entregue=(p2.entregue||0)+q;
  salvarPedidos(f.id,l2);
  window._entArq={}; fecharModal(); toast("Entrega registrada"); render();
}

      '<button class="mini" onclick="modalEditarEntrega(\''+id+'\',\''+e.id+'\')">Editar</button>'+
      '<button class="mini" onclick="removerEntrega(\''+id+'\',\''+e.id+'\')">✕</button></div>').join("")+'</div>'

    '<h2>Entregas · '+esc(p.produto)+'</h2>'+
    '<p class="sub">Total entregue: '+nf(p.entregue||0,0)+(p.unidade?' '+esc(p.unidade):'')+' · faltam '+nf(p.qtd-(p.entregue||0),0)+'</p>'+

function modalEditarEntrega(pid, eid){
  const f=acharFazenda(App.fazendaId);
  const p=pedidosDe(f.id).find(x=>x.id===pid); if(!p) return;
  const e=(p.entregas||[]).find(x=>x.id===eid); if(!e) return;
  window._entArq={};
  const an=e.anexos||[];
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Editar entrega</h2><p class="sub">'+esc(p.produto)+'</p>'+
    '<div class="frm">'+
      '<div style="display:flex;gap:10px"><div style="flex:1"><label for="pe-data">Dia da entrega</label>'+
        '<input id="pe-data" type="date" value="'+esc(e.data||"")+'"></div>'+
        '<div style="flex:1"><label for="pe-qtd">Quantidade</label>'+
        '<input id="pe-qtd" type="number" inputmode="decimal" value="'+(e.qtd!=null?e.qtd:"")+'"></div></div>'+
      '<div><label for="pe-f1">Nota 1'+(an[0]?" (anexada — escolha outra para trocar)":" (opcional)")+'</label>'+
        '<input id="pe-f1" type="file" accept="image/*,application/pdf" onchange="escolherArquivoEntrega(this,1)">'+
        '<span class="nota-pad" id="pe-f1-lbl">'+(an[0]?esc(an[0].nome||""):"")+'</span></div>'+
      '<div><label for="pe-f2">Nota 2'+(an[1]?" (anexada — escolha outra para trocar)":" (opcional)")+'</label>'+
        '<input id="pe-f2" type="file" accept="image/*,application/pdf" onchange="escolherArquivoEntrega(this,2)">'+
        '<span class="nota-pad" id="pe-f2-lbl">'+(an[1]?esc(an[1].nome||""):"")+'</span></div>'+
    '</div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="modalEntregas(\''+pid+'\')">Voltar</button>'+
      '<button class="btn-save" onclick="gravarEditarEntrega(\''+pid+'\',\''+eid+'\')">Salvar</button></div></div></div>';
  setTimeout(()=>{const el=document.getElementById("pe-qtd");if(el)el.focus();},60);
}
async function gravarEditarEntrega(pid, eid){
  const f=acharFazenda(App.fazendaId);
  const p0=pedidosDe(f.id).find(x=>x.id===pid); if(!p0) return;
  const e0=(p0.entregas||[]).find(x=>x.id===eid); if(!e0) return;
  const q=Number((document.getElementById("pe-qtd").value||"").replace(",","."));
  if(!q||q<=0){ toast("Informe a quantidade"); return; }
  const data=document.getElementById("pe-data").value||e0.data;
  const oldQtd=e0.qtd;
  const anexos=(e0.anexos||[]).slice();
  const arqs=window._entArq||{};
  for(const slot of [1,2]){
    const arq=arqs[slot]; if(!arq) continue;
    const idx=slot-1;
    if(anexos[idx]){ stApagar(anexos[idx].path); removerArquivo(anexos[idx].path); }
    const ext=(arq.name.match(/\.[a-z0-9]+$/i)||[""])[0].toLowerCase();
    const caminho=f.id+"/entrega-"+eid+"-"+slot+ext;
    try{ await enviarArquivo(caminho, arq); anexos[idx]={nome:arq.name, path:caminho}; }
    catch(err){ toast("Não consegui guardar a nota "+slot); }
  }
  const l2=pedidosDe(f.id), p2=l2.find(x=>x.id===pid), e2=(p2.entregas||[]).find(x=>x.id===eid); if(!e2) return;
  e2.qtd=q; e2.data=data; e2.anexos=anexos.filter(Boolean);
  p2.entregue=Math.max(0,(p2.entregue||0)+(q-oldQtd));
  salvarPedidos(f.id,l2);
  window._entArq={}; toast("Entrega atualizada"); modalEntregas(pid);
}
function removerEntrega(pid, eid){
  const f=acharFazenda(App.fazendaId);
  const l=pedidosDe(f.id), p=l.find(x=>x.id===pid); if(!p) return;
  const e=(p.entregas||[]).find(x=>x.id===eid); if(!e) return;
  if(!confirm("Remover esta entrega de "+nf(e.qtd,0)+"?"+((e.anexos&&e.anexos.length)?"\nAs notas também saem.":""))) return;
  (e.anexos||[]).forEach(a=>{ stApagar(a.path); removerArquivo(a.path); });
  p.entregas=p.entregas.filter(x=>x.id!==eid);
  p.entregue=Math.max(0,(p.entregue||0)-e.qtd);
  salvarPedidos(f.id,l);
  toast("Entrega removida"); modalEntregas(pid);
}
function removerPedido(id){
  const f=acharFazenda(App.fazendaId);
  const p=pedidosDe(f.id).find(x=>x.id===id);
  if(!confirm("Remover este pedido?"+(p&&p.anexo?"\nO anexo também sai.":""))) return;
  if(p && p.anexo_path){ stApagar(p.anexo_path); removerArquivo(p.anexo_path); }
  salvarPedidos(f.id, pedidosDe(f.id).filter(x=>x.id!==id));
  toast("Pedido removido"); render();
}

/* ── Maquinário: máquinas, horímetro e abastecimento ───────── */
function kMaquinas(f){ return "faz_"+f+"_maquinas"; }
function maquinasDe(f){ return Store.get(kMaquinas(f), []); }
function salvarMaquinas(f,l){ Store.set(kMaquinas(f), l); }
function kAbastec(f){ return "faz_"+f+"_abastec"; }
function abastecDe(f){ return Store.get(kAbastec(f), []); }
function salvarAbastec(f,l){ Store.set(kAbastec(f), l); }
function resumoMaquina(f, maq){
  const ab = abastecDe(f).filter(a=>a.maquina_id===maq.id);
  const litros = ab.reduce((s,a)=>s+(Number(a.litros)||0),0);
  const hini = Number(maq.horimetro_ini)||0;
  const hatual = Number(maq.horimetro)||hini;
  const horas = Math.max(0, hatual-hini);
  return { litros, horas, consumo: horas>0? litros/horas : 0, abast: ab.length, hatual };
}
function telaMaquinario(){
  const f=acharFazenda(App.fazendaId); if(!f){ App.tela="fazendas"; return telaFazendas(); }
  const maqs=maquinasDe(f.id), abast=abastecDe(f.id);
  let h='<div class="wrap wrap-wide">';
  h+='<div class="farm-head"><button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
     '<div class="farm-head-mid"><h1>Maquinário</h1><p>Máquinas, horímetro e abastecimento</p></div>'+
     '<div class="ch-head-acts"><button class="btn-act primary" onclick="modalMaquina()">+ Nova máquina</button>'+
     '<button class="btn-act" onclick="modalImportarMaquinas()">Importar</button>'+
     botaoExportar([{rotulo:"Planilha",fn:"exportarMaquinario('csv')"},{rotulo:"Imagem",fn:"exportarMaquinario('png')"},{rotulo:"PDF",fn:"exportarMaquinario('pdf')"}])+
     '</div></div>';
  const tl=maqs.reduce((s,m)=>s+resumoMaquina(f.id,m).litros,0);
  const th=maqs.reduce((s,m)=>s+resumoMaquina(f.id,m).horas,0);
  h+='<div class="kpis kpis-4">'+
    kpi("Máquinas", maqs.length, "cadastradas")+
    kpi("Abastecido", nf(tl,0), "litros")+
    kpi("Horas", nf(th,0), "trabalhadas")+
    kpi("Consumo médio", th>0?nf(tl/th,1):"—", "L/h")+
  '</div>';
  if(!maqs.length) return h+'<p class="vazio">Nenhuma máquina. Cadastre a primeira para controlar horímetro e combustível.</p></div>';
  h+='<table class="arm-grid mq-grid"><thead><tr><th>Máquina</th><th>Tipo</th><th>Horímetro</th><th>Horas</th><th>Litros</th><th>L/h</th><th></th></tr></thead><tbody>';
  maqs.forEach(m=>{ const R=resumoMaquina(f.id,m);
    h+='<tr><td>'+esc(m.nome)+'</td><td>'+esc(m.tipo||"—")+'</td>'+
       '<td>'+nf(R.hatual,0)+'</td><td>'+nf(R.horas,0)+'</td><td>'+nf(R.litros,0)+'</td><td>'+(R.consumo?nf(R.consumo,1):"—")+'</td>'+
       '<td style="white-space:nowrap;text-align:right"><button class="mini" onclick="modalAbastecer(\''+m.id+'\')">Abastecer</button> '+
       '<button class="mini" onclick="modalMaquina(\''+m.id+'\')">Editar</button> '+
       '<button class="mini" onclick="removerMaquina(\''+m.id+'\')">✕</button></td></tr>';
  });
  h+='</tbody></table>';
  if(abast.length){
    const nome={}; maqs.forEach(m=>nome[m.id]=m.nome);
    const recent=abast.slice().sort((a,b)=>String(b.data||"").localeCompare(String(a.data||""))).slice(0,20);
    h+='<div class="resumo"><div class="resumo-t">Abastecimentos recentes</div>'+
      '<table class="arm-grid"><thead><tr><th>Data</th><th>Máquina</th><th>Litros</th><th>Horímetro</th></tr></thead><tbody>'+
      recent.map(a=>'<tr><td>'+esc(dataBR(a.data))+'</td><td>'+esc(nome[a.maquina_id]||"—")+'</td><td>'+nf(a.litros,0)+'</td><td>'+nf(a.horimetro||0,0)+'</td></tr>').join("")+
      '</tbody></table></div>';
  }
  return h+'</div>';
}
function modalMaquina(id){
  const f=acharFazenda(App.fazendaId);
  const ed=id?maquinasDe(f.id).find(m=>m.id===id):null;
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>'+(ed?"Editar máquina":"Nova máquina")+'</h2>'+
    '<div class="frm">'+
      '<div><label for="mq-nome">Nome</label><input id="mq-nome" placeholder="Colheitadeira, Trator JD 6110…" value="'+esc(ed?ed.nome:"")+'"></div>'+
      '<div style="display:flex;gap:10px"><div style="flex:1"><label for="mq-tipo">Tipo</label><input id="mq-tipo" placeholder="Colheitadeira, trator…" value="'+esc(ed?(ed.tipo||""):"")+'"></div>'+
      '<div style="flex:1"><label for="mq-hor">Horímetro atual</label><input id="mq-hor" type="number" inputmode="decimal" placeholder="0" value="'+(ed&&ed.horimetro!=null?ed.horimetro:"")+'"></div></div>'+
    '</div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="gravarMaquina('+(ed?"'"+ed.id+"'":"")+')">'+(ed?"Salvar":"Adicionar")+'</button></div></div></div>';
  setTimeout(()=>{const e=document.getElementById("mq-nome");if(e)e.focus();},60);
}
function gravarMaquina(id){
  const f=acharFazenda(App.fazendaId);
  const nome=(document.getElementById("mq-nome").value||"").trim();
  if(!nome){ toast("Informe o nome"); return; }
  const tipo=(document.getElementById("mq-tipo").value||"").trim();
  const hor=Number((document.getElementById("mq-hor").value||"").replace(",","."))||0;
  const l=maquinasDe(f.id);
  if(id){ const m=l.find(x=>x.id===id); if(!m){fecharModal();return;}
    m.nome=nome; m.tipo=tipo; m.horimetro=hor; if(m.horimetro_ini==null) m.horimetro_ini=hor;
  } else {
    l.push({id:"mq_"+Date.now().toString(36), nome:nome, tipo:tipo, horimetro:hor, horimetro_ini:hor, criado_em:new Date().toISOString()});
  }
  salvarMaquinas(f.id,l); fecharModal(); toast(id?"Máquina atualizada":"Máquina adicionada"); render();
}
function removerMaquina(id){
  const f=acharFazenda(App.fazendaId);
  if(!confirm("Remover esta máquina? Os abastecimentos dela também saem.")) return;
  salvarMaquinas(f.id, maquinasDe(f.id).filter(m=>m.id!==id));
  salvarAbastec(f.id, abastecDe(f.id).filter(a=>a.maquina_id!==id));
  toast("Máquina removida"); render();
}
function modalAbastecer(id){
  const f=acharFazenda(App.fazendaId);
  const m=maquinasDe(f.id).find(x=>x.id===id); if(!m) return;
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Abastecer</h2><p class="sub">'+esc(m.nome)+' · horímetro atual '+nf(Number(m.horimetro)||0,0)+'</p>'+
    '<div class="frm">'+
      '<div style="display:flex;gap:10px"><div style="flex:1"><label for="ab-data">Data</label><input id="ab-data" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
      '<div style="flex:1"><label for="ab-litros">Litros</label><input id="ab-litros" type="number" inputmode="decimal" placeholder="0"></div></div>'+
      '<div><label for="ab-hor">Horímetro no abastecimento</label><input id="ab-hor" type="number" inputmode="decimal" placeholder="'+nf(Number(m.horimetro)||0,0)+'"></div>'+
    '</div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="gravarAbastecer(\''+id+'\')">Registrar</button></div></div></div>';
  setTimeout(()=>{const e=document.getElementById("ab-litros");if(e)e.focus();},60);
}
function gravarAbastecer(id){
  const f=acharFazenda(App.fazendaId);
  const l=maquinasDe(f.id), m=l.find(x=>x.id===id); if(!m){fecharModal();return;}
  const litros=Number((document.getElementById("ab-litros").value||"").replace(",","."));
  if(!litros||litros<=0){ toast("Informe os litros"); return; }
  const data=document.getElementById("ab-data").value||new Date().toISOString().slice(0,10);
  const horStr=(document.getElementById("ab-hor").value||"").replace(",",".");
  const hor= horStr!=="" ? Number(horStr) : (Number(m.horimetro)||0);
  const ab=abastecDe(f.id);
  ab.push({id:"ab_"+Date.now().toString(36), maquina_id:id, data:data, litros:litros,
    horimetro:(isNaN(hor)?null:hor), criado_em:new Date().toISOString()});
  salvarAbastec(f.id,ab);
  if(!isNaN(hor) && hor>(Number(m.horimetro)||0)){ m.horimetro=hor; salvarMaquinas(f.id,l); }
  fecharModal(); toast("Abastecimento registrado"); render();
}
function exportarMaquinario(fmt){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const maqs=maquinasDe(f.id);
  if(!maqs.length){ toast("Cadastre máquinas primeiro"); return; }
  const linhas=[["Máquina","Tipo","Horímetro","Horas","Litros","L/h"]];
  maqs.forEach(m=>{ const R=resumoMaquina(f.id,m);
    linhas.push([m.nome, m.tipo||"", vBR(R.hatual), vBR(R.horas), vBR(R.litros), R.consumo?vBR(R.consumo.toFixed(1)):"—"]); });
  exportarTabela(fmt, "Maquinário · "+f.nome, linhas,
    "maquinario-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));

/* Leitor genérico: carrega um arquivo de texto/CSV no textarea alvo. */
/* Leitor de .xlsx embutido (ZIP + deflate nativo). Devolve o conteúdo
   da primeira planilha como texto separado por ; (uma linha por linha). */
async function xlsxParaTexto(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("zip");
  const cdOff=dv.getUint32(eocd+16,true), cdCnt=dv.getUint16(eocd+10,true);
  const files={}; let p=cdOff;
  for(let n=0;n<cdCnt;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const nL=dv.getUint16(p+28,true), eL=dv.getUint16(p+30,true), cL=dv.getUint16(p+32,true);
    files[new TextDecoder().decode(u8.subarray(p+46,p+46+nL))]=dv.getUint32(p+42,true);
    p+=46+nL+eL+cL;
  }
  async function extrair(nome){
    const off=files[nome]; if(off==null) return null;
    if(dv.getUint32(off,true)!==0x04034b50) return null;
    const method=dv.getUint16(off+8,true), nL=dv.getUint16(off+26,true), eL=dv.getUint16(off+28,true);
    const size=dv.getUint32(off+18,true), start=off+30+nL+eL;
    const comp=u8.subarray(start, start+size);
    if(method===0) return new TextDecoder().decode(comp);
    if(typeof DecompressionStream==="undefined") throw new Error("sem descompressor");
    const ab=await new Response(new Blob([comp]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
    return new TextDecoder().decode(new Uint8Array(ab));
  }
  const desx=s=>String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
  const shared=[]; const ss=await extrair("xl/sharedStrings.xml");
  if(ss){ let m; const re=/<si>([\s\S]*?)<\/si>/g;
    while((m=re.exec(ss))){ const t=(m[1].match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(x=>x.replace(/<[^>]+>/g,"")).join(""); shared.push(desx(t)); } }
  let sheet=await extrair("xl/worksheets/sheet1.xml");
  if(!sheet){ const k=Object.keys(files).find(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)); if(k) sheet=await extrair(k); }
  if(!sheet) throw new Error("planilha");
  const colIdx=ref=>{ const m=String(ref).match(/^([A-Z]+)/); if(!m) return 0; let c=0; for(const ch of m[1]) c=c*26+(ch.charCodeAt(0)-64); return c-1; };
  const linhas=[]; const rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while((rm=rowRe.exec(sheet))){
    const cells=[]; let max=-1;
    const cRe=/<c\b([^>]*)>([\s\S]*?)<\/c>|<c\b([^>]*)\/>/g; let cm;
    while((cm=cRe.exec(rm[1]))){
      const attrs=(cm[1]||cm[3]||""), inner=cm[2]||"";
      const rM=attrs.match(/r="([A-Z]+\d+)"/); const idx=rM?colIdx(rM[1]):(max+1);
      const tM=attrs.match(/t="([^"]+)"/); const type=tM?tM[1]:"n";
      let val="";
      if(type==="s"){ const v=(inner.match(/<v>([\s\S]*?)<\/v>/)||[])[1]; if(v!=null) val=shared[+v]||""; }
      else if(type==="inlineStr"){ val=desx((inner.match(/<t[^>]*>([\s\S]*?)<\/t>/)||[])[1]||""); }
      else { val=desx((inner.match(/<v>([\s\S]*?)<\/v>/)||[])[1]||""); }
      cells[idx]=val; if(idx>max) max=idx;
    }
    const arr=[]; for(let i=0;i<=max;i++) arr.push(cells[i]!=null?cells[i]:"");
    linhas.push(arr);
  }
  return linhas.map(r=>r.join(";")).join("\n");
}
async function lerArquivoNoCampo(input, alvoId){
  const file=input.files && input.files[0]; if(!file) return;
  const ta=document.getElementById(alvoId);
  if(/\.xlsx$/i.test(file.name)){
    try{ const txt=await xlsxParaTexto(await file.arrayBuffer()); if(ta) ta.value=txt;
      toast("Excel lido — confira e clique Importar"); }
    catch(e){ toast("Não consegui ler o Excel — salve como CSV e tente"); input.value=""; }
    return;
  }
  if(/\.xls$/i.test(file.name)){ toast("Formato .xls antigo — salve como .xlsx ou CSV"); input.value=""; return; }
  const rd=new FileReader();
  rd.onload=()=>{ if(ta) ta.value=String(rd.result||""); toast("Arquivo carregado — confira e clique Importar"); };
  rd.onerror=()=>toast("Não consegui ler o arquivo");
  rd.readAsText(file, "utf-8");
}

function importarMaquinas(){
  const f=acharFazenda(App.fazendaId);
  const txt=(document.getElementById("mq-imp").value||"").trim();
  if(!txt){ toast("Cole a lista ou escolha um arquivo"); return; }
  const l=maquinasDe(f.id);
  const existentes=new Set(l.map(m=>_normNome(m.nome)));
  let add=0, dup=0, i=0;
  txt.split(/\r?\n/).forEach(linha=>{
    const c=linha.split(/\t|;/).map(x=>String(x).trim());
    const nome=c[0]; if(!nome) return;
    if(/^(nome|m[aá]quina)$/i.test(nome)) return;
    if(existentes.has(_normNome(nome))){ dup++; return; }
    existentes.add(_normNome(nome));
    const hor=Number(String(c[2]||"").replace(/\./g,"").replace(",","."))||0;
    l.push({id:"mq_"+Date.now().toString(36)+"_"+(i++), nome:nome, tipo:c[1]||"",
      horimetro:hor, horimetro_ini:hor, criado_em:new Date().toISOString()});
    add++;
  });
  if(!add){ toast(dup?"Todas já estavam cadastradas":"Nada reconhecido na lista"); return; }
  salvarMaquinas(f.id,l);
  fecharModal(); toast(add+" máquina(s) importada(s)"+(dup?" · "+dup+" já existiam":"")); render();
}

function importarNfe(){
  const f = acharFazenda(App.fazendaId); if(!f || !_nfe) return;
  const usar = _nfe.itens.filter(i=>i.usar);
  if(!usar.length){ toast("Escolha ao menos um item"); return; }
  const data = _nfe.data || new Date().toISOString().slice(0,10);
  let criados = 0;

  usar.forEach(i=>{
    let pid = i.match;
    if(!pid){
      const novo = salvarProduto(f.id,{ nome:i.nome, unidade:i.unidade, preco:i.preco });
      pid = novo.id; criados++;
    }
    salvarEntrada(f.id,{ data, produto_id:pid, qtd:i.qtd, preco:i.preco,
      nota:_nfe.nota, fornecedor:_nfe.fornecedor, obs:i.codigo?"cód. "+i.codigo:"" });
  });

  _nfe = null; fecharModal();
  toast(usar.length+" item(ns) lançado(s)"+(criados?" · "+criados+" produto(s) novo(s)":""));
  _abaEst = "entradas"; render();
}

function exportarEstoque(fmt){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const E=estoqueDe(f.id);
  const linhas=[["ESTOQUE · "+f.nome.toUpperCase()+" · SAFRA "+f.safra]];
  linhas.push(["Produto","Unidade","Entrou","Aplicado","Saldo","Custo médio","Valor em estoque","Compras"]);
  E.linhas.filter(l=>l.entrou>0||l.saiu>0).forEach(l=>linhas.push([l.nome,l.unidade,
    vBR(l.entrou.toFixed(2)), vBR(l.saiu.toFixed(2)), vBR(l.saldo.toFixed(2)),
    vBR(l.medio.toFixed(2)), vBR(l.valorSaldo.toFixed(2)), l.compras]));
  linhas.push([]);
  linhas.push(["Total comprado","","","","","",vBR(E.totalComprado.toFixed(2))]);
  linhas.push(["Total aplicado","","","","","",vBR(E.totalAplicado.toFixed(2))]);
  linhas.push(["Valor em estoque","","","","","",vBR(E.valorEstoque.toFixed(2))]);
  exportarTabela(fmt, "Estoque · "+f.nome, linhas,
    "estoque-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-"));
}

    h += '<div class="mapa-wrap"><img id="mapa-img" alt="Mapa de talhões da '+esc(f.nome)+'"></div>';

async function abrirMapaCheia(caminho){
  try{
    let blob = await pegarArquivo(caminho);
    if(!blob && navigator.onLine){ blob = await stBaixar(caminho); if(blob) guardarArquivo(caminho, blob); }
    const url = blob ? URL.createObjectURL(blob) : (navigator.onLine ? await stUrlAssinada(caminho,3600) : null);
    if(url) window.open(url, "_blank", "noopener"); else toast("Mapa indisponível offline");
  }catch(e){ toast("Não consegui abrir o mapa"); }
}

function modalMapa(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const m=mapaDe(f.id)||{titulo:""};
  window._mapaArq = null;
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Mapa da fazenda</h2>'+
    '<p class="sub">Escolha a foto ou imagem do mapa. Ela sobe para a nuvem e vale para toda a equipe.</p>'+
    '<div class="frm">'+
      '<label class="drop" for="mp-file">'+
        '<b id="mp-lbl">'+(m.arquivo?esc(m.arquivo)+" · "+tamanhoLegivel(m.tamanho):"Escolher imagem do mapa")+'</b>'+
        '<span>JPG, PNG ou imagem digitalizada · até 20 MB</span>'+
        '<input id="mp-file" type="file" accept="image/*" onchange="escolherMapa(this)">'+
      '</label>'+
      '<div><label for="mp-tit">Descrição</label>'+

function escolherMapa(input){
  const a = input.files && input.files[0];
  const lbl=document.getElementById("mp-lbl");
  if(!a){ window._mapaArq=null; return; }
  if(a.size > 20*1024*1024){ toast("Imagem acima de 20 MB — reduza antes"); input.value=""; window._mapaArq=null; return; }
  window._mapaArq=a;
  if(lbl) lbl.textContent=a.name+" · "+tamanhoLegivel(a.size);
}
async function gravarMapa(){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const tit=document.getElementById("mp-tit").value.trim();
  const arq=window._mapaArq;
  const atual=mapaDe(f.id);
  if(!arq && !atual){ toast("Escolha a imagem do mapa"); return; }
  if(!arq){                                   // só mudou a descrição
    Store.set(kMapa(f.id), Object.assign({}, atual, {titulo:tit}));
    fecharModal(); toast("Mapa atualizado"); render(); return;
  }
  const ext=(arq.name.match(/\.[a-z0-9]+$/i)||[".jpg"])[0].toLowerCase();
  const caminho=f.id+"/mapa-"+Date.now().toString(36)+ext;
  if(atual && atual.path && atual.path!==caminho){ stApagar(atual.path); removerArquivo(atual.path); }
  Store.set(kMapa(f.id), {path:caminho, titulo:tit, arquivo:arq.name, tamanho:arq.size});
  window._mapaArq=null; fecharModal(); toast("Enviando o mapa…"); render();
  try{ await enviarArquivo(caminho, arq); toast("Mapa salvo"); render(); }
  catch(e){ toast("Mapa guardado no aparelho; sobe quando houver internet"); }
}

/* ═══════════════════════════════════════════════════
   TELA — Previsão do tempo
   ═══════════════════════════════════════════════════ */
function telaTempo(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
    '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
    '<div class="farm-head-mid"><h1>Previsão do tempo</h1>'+
    '<p>'+(f.municipio?esc(f.municipio)+(f.uf?"/"+esc(f.uf):""):"Localização da fazenda")+'</p></div></div>';

  if(f.lat==null || f.lon==null)
    return h+'<div class="empty"><strong>Informe onde fica a fazenda</strong>'+
      'A previsão usa a coordenada da sede. Busque pelo nome do município.'+
      '<div style="margin-top:16px"><button class="btn-act primary" onclick="modalLocal()">'+
      'Definir localização</button></div></div></div>';

  const cache = tempoCache(f.id);
  h += '<div class="acts">'+
    '<button class="btn-act primary" onclick="atualizarTempo()">Atualizar</button>'+
    '<button class="btn-act" onclick="modalLocal()">Trocar localização</button>'+
    (cache?'<span class="dica">Consultado em '+esc(quando(cache.buscado_em))+'</span>':'')+
  '</div>';

  if(!cache)
    return h+'<div class="empty"><strong>Sem dados ainda</strong>'+
      'Toque em Atualizar com internet. Depois a última previsão fica disponível offline.</div></div>';

  const a = cache.atual, D = cache.dias;
  const [dsc,ico] = descTempo(a.weather_code);
  h += '<div class="tempo-agora">'+
    '<div class="ta-ico">'+ico+'</div>'+
    '<div class="ta-mid"><b>'+nf(a.temperature_2m,0)+'°</b><span>'+esc(dsc)+'</span></div>'+
    '<div class="ta-det">'+
      '<span><i>Umidade</i>'+nf(a.relative_humidity_2m,0)+'%</span>'+
      '<span><i>Vento</i>'+nf(a.wind_speed_10m,0)+' km/h</span>'+
      '<span><i>Chuva agora</i>'+nf(a.precipitation,1)+' mm</span>'+
    '</div></div>';

  h += '<div class="sec-head"><span>PRÓXIMOS 7 DIAS</span><i></i></div><div class="dias7">';
  (D.time||[]).forEach((dia,i)=>{
    const [d2,i2] = descTempo(D.weather_code[i]);
    const mm = D.precipitation_sum[i]||0;
    const pb = D.precipitation_probability_max[i]||0;
    h += '<div class="d7'+(mm>=5?" molha":"")+'">'+
      '<span class="d7-dia">'+diaSemana(dia)+'<u>'+diaCurto(dia)+'</u></span>'+
      '<span class="d7-ico">'+i2+'</span>'+
      '<span class="d7-t"><b>'+nf(D.temperature_2m_max[i],0)+'°</b>'+
        '<i>'+nf(D.temperature_2m_min[i],0)+'°</i></span>'+
      '<span class="d7-ch'+(mm>0?" tem":"")+'">'+(mm>0?nf(mm,1)+' mm':'—')+
        '<u>'+nf(pb,0)+'%</u></span>'+
      '<span class="d7-d">'+esc(d2)+'</span>'+
    '</div>';
  });
  h += '</div>';

  const somaMM = (D.precipitation_sum||[]).reduce((s,v)=>s+(v||0),0);
  h += '<p class="resumo-obs">Previsão de '+nf(somaMM,1)+' mm na semana. '+
    'Dados do Open-Meteo para a coordenada '+nf(f.lat,4)+', '+nf(f.lon,4)+'. '+
    'A última consulta fica guardada e abre sem internet.</p>';
  return h+'</div>';
}

function diaSemana(iso){
  const d = new Date(iso+"T12:00:00");
  return ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()];
}
function quando(iso){
  const d = new Date(iso), ag = new Date();
  const min = Math.round((ag-d)/60000);
  if(min < 2) return "agora";
  if(min < 60) return min+" min";
  if(min < 1440) return Math.round(min/60)+" h";
  return dataBR(iso.slice(0,10));
}

async function atualizarTempo(){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  if(!navigator.onLine){ toast("Sem internet — mostrando a última consulta"); return; }
  toast("Buscando previsão…");
  try{ await buscarTempo(f.id); toast("Previsão atualizada"); render(); }
  catch(e){ toast("Não consegui buscar agora. Tente de novo."); }
}

async function procurarCidade(){
  const box=document.getElementById("lc-res");
  const nome=document.getElementById("lc-busca").value.trim();
  if(!nome){ toast("Digite o município"); return; }
  if(!navigator.onLine){ box.innerHTML='<p class="vazio">Sem internet. Informe a coordenada à mão.</p>'; return; }
  box.innerHTML='<p class="vazio">Procurando…</p>';
  try{
    const l = await buscarCidade(nome);
    const br = l.filter(x=>x.country_code==="BR");
    const lista = (br.length?br:l).slice(0,6);
    if(!lista.length){ box.innerHTML='<p class="vazio">Nada encontrado. Informe a coordenada à mão.</p>'; return; }
    box.innerHTML = '<div class="lc-lista">'+lista.map(x=>
      '<button type="button" class="lc-op" onclick="usarCidade('+x.latitude+','+x.longitude+',\''+
        esc(x.name).replace(/'/g,"\\'")+'\',\''+esc(x.admin1||"").replace(/'/g,"\\'")+'\')">'+
        '<b>'+esc(x.name)+'</b><span>'+esc(x.admin1||"")+' · '+nf(x.latitude,3)+', '+nf(x.longitude,3)+'</span>'+
      '</button>').join("")+'</div>';
  }catch(e){ box.innerHTML='<p class="vazio">Não consegui buscar. Informe a coordenada à mão.</p>'; }
}

function usarCidade(lat,lon,nome,uf){
  document.getElementById("lc-lat").value = lat;
  document.getElementById("lc-lon").value = lon;
  document.getElementById("lc-busca").value = nome;
  const r=document.getElementById("lc-res");
  if(r) r.innerHTML='<p class="vazio">Selecionado: '+esc(nome)+(uf?" · "+esc(uf):"")+'</p>';
}

function gravarLocal(){
  const l=fazendas(), f=l.find(x=>x.id===App.fazendaId); if(!f) return;
  const lat=parseFloat(String(document.getElementById("lc-lat").value).replace(",","."));
  const lon=parseFloat(String(document.getElementById("lc-lon").value).replace(",","."));
  if(isNaN(lat)||isNaN(lon)){ toast("Informe latitude e longitude"); return; }
  if(lat<-90||lat>90||lon<-180||lon>180){ toast("Coordenada fora do intervalo"); return; }
  f.lat=lat; f.lon=lon;
  const mun=document.getElementById("lc-busca").value.trim();
  if(mun && !f.municipio) f.municipio=mun;
  salvarFazendas(l); Sync.push("fazendas","upsert",f);
  Store.del(kTempo(f.id));
  fecharModal(); toast("Localização salva"); render();
  atualizarTempo();
}

    kpi("Espaço usado", tamanhoLegivel(bytes).split(" ")[0], tamanhoLegivel(bytes).split(" ")[1]||"")+
    kpi("Vencem em 30 dias", vencendo, vencendo?"confira os prazos":"nada próximo")+
    kpi("Vencidos", vencidos, vencidos?"revisar":"em dia")+
  '</div>';

  h += '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalDoc()">+ Novo documento</button>'+
    (todos.length?'<select class="sel-f" onchange="_fTipoDoc=this.value;render()">'+
      '<option value="">Todos os tipos</option>'+
      TIPOS_DOC.map(t=>'<option '+(_fTipoDoc===t?'selected':'')+'>'+esc(t)+'</option>').join("")+

function escolherArquivo(input){
  const a = input.files && input.files[0];
  const lbl = document.getElementById("dc-lbl");
  if(!a){ window._docArq=null; return; }
  if(a.size > 20*1024*1024){
    toast("Arquivo acima de 20 MB — reduza antes de anexar");
    input.value=""; window._docArq=null; return;
  }
  window._docArq = a;
  if(lbl) lbl.textContent = a.name+" · "+tamanhoLegivel(a.size);
  const nome=document.getElementById("dc-nome");
  if(nome && !nome.value) nome.value = a.name.replace(/\.[^.]+$/,"");
}

async function gravarDoc(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const nome=g("dc-nome");
  if(!nome){ toast("Informe o nome do documento"); return; }
  const venc=g("dc-venc"), data=g("dc-data");
  if(venc && data && venc < data){ toast("O vencimento é anterior à data do documento"); return; }

  const antigo = id ? docsDe(f.id).find(x=>x.id===id) : null;
  const arq = window._docArq;
  const dados = { nome, tipo:g("dc-tipo"), data, vencimento:venc,
    contraparte:g("dc-parte"),
    valor:parseFloat(g("dc-valor").replace(",","."))||0, obs:g("dc-obs"),
    arquivo: arq ? arq.name : (antigo?antigo.arquivo:null),
    tamanho: arq ? arq.size : (antigo?antigo.tamanho:0),
    arquivo_path: antigo?antigo.arquivo_path:null };

  const salvo = salvarDoc(f.id, dados, id);
  if(arq && salvo){
    const ext=(arq.name.match(/\.[a-z0-9]+$/i)||[""])[0].toLowerCase();
    const caminho=f.id+"/doc-"+salvo.id+ext;
    // troca de arquivo num doc já existente: limpa o anterior da nuvem
    if(antigo && antigo.arquivo_path && antigo.arquivo_path!==caminho){
      stApagar(antigo.arquivo_path); removerArquivo(antigo.arquivo_path);
    }
    try{
      await enviarArquivo(caminho, arq);                 // cache + sobe (ou fila)
      salvarDoc(f.id, Object.assign({},dados,{arquivo_path:caminho}), salvo.id);
    }catch(e){
      salvarDoc(f.id, Object.assign({},dados,{arquivo:null,tamanho:0,arquivo_path:null}), salvo.id);
      toast("Cadastro salvo, mas não consegui guardar o arquivo");
      fecharModal(); render(); return;
    }
  }
  window._docArq=null; fecharModal();
  toast(id?"Documento atualizado":"Documento guardado"); render();
}

async function verDoc(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const d=docsDe(f.id).find(x=>x.id===id); if(!d) return;
  try{
    let blob = d.arquivo_path ? await pegarArquivo(d.arquivo_path) : null;
    if(!blob) blob = await pegarArquivo(id);
    if(!blob && d.arquivo_path && navigator.onLine){ blob=await stBaixar(d.arquivo_path); if(blob) guardarArquivo(d.arquivo_path,blob); }
    if(!blob){ toast(navigator.onLine?"Arquivo não encontrado":"Sem internet e sem cópia no aparelho"); return; }
    window.open(URL.createObjectURL(blob), "_blank", "noopener");
  }catch(e){ toast("Não consegui abrir o arquivo"); }
}

async function baixarDoc(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const d=docsDe(f.id).find(x=>x.id===id); if(!d) return;
  try{
    let blob = d.arquivo_path ? await pegarArquivo(d.arquivo_path) : null;
    if(!blob) blob = await pegarArquivo(id);                       // documentos antigos (chave = id)
    if(!blob && d.arquivo_path && navigator.onLine){
      blob = await stBaixar(d.arquivo_path);
      if(blob) guardarArquivo(d.arquivo_path, blob);               // guarda para abrir offline depois
    }
    if(!blob){ toast(navigator.onLine?"Arquivo não encontrado":"Sem internet e sem cópia no aparelho"); return; }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=d.arquivo||d.nome;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }catch(e){ toast("Não consegui abrir o arquivo"); }
}

function excluirDoc(id){
  const f=acharFazenda(App.fazendaId);
  const d=docsDe(f.id).find(x=>x.id===id); if(!d) return;
  if(!confirm('Remover "'+d.nome+'"?'+(d.arquivo?"\nO arquivo também sai do aparelho.":""))) return;
  apagarDoc(f.id,id); toast("Documento removido"); render();
}

   VISITAS TÉCNICAS — diário de bordo da cultura
   Estágio, clima, recomendação e foto por talhão.
   A foto sobe para a nuvem (Storage) e fica em cache offline.
   ═══════════════════════════════════════════════════ */
const ESTAGIOS = ["Pré-plantio","Emergência","Vegetativo (V)","Início de floração (R1–R2)",
  "Formação de vagens (R3–R4)","Enchimento de grãos (R5)","Maturação (R6–R8)","Colhido"];

function kVisitas(f){ return "faz_"+f+"_visitas"; }
function visitasDe(f){ return Store.get(kVisitas(f), []); }

function salvarVisita(f, v, id){
  const l = visitasDe(f);
  const dados = { talhao_id:v.talhao_id||"", talhao_nome:v.talhao_nome||"",
    data:v.data||"", estagio:v.estagio||"", clima:(v.clima||"").trim(),
    texto:(v.texto||"").trim(), fotos: Array.isArray(v.fotos)?v.fotos:[] };
  if(id){ const i=l.findIndex(x=>x.id===id); if(i<0) return null;
    l[i]=Object.assign({},l[i],dados); Store.set(kVisitas(f),l); return l[i]; }
  const novo=Object.assign({id:"vs_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, criado_em:new Date().toISOString()}, dados);
  l.push(novo); Store.set(kVisitas(f),l); return novo;
}
/* Fotos de uma visita, tolerando o formato antigo (foto única). */
function fotosDaVisita(v){
  if(Array.isArray(v.fotos) && v.fotos.length) return v.fotos;
  if(v.foto_path) return [{path:v.foto_path, nome:v.foto, tamanho:v.tamanho}];
  return [];
}
function apagarVisita(f,id){
  const v=visitasDe(f).find(x=>x.id===id);
  if(v) fotosDaVisita(v).forEach(ft=>{ if(ft.path){ removerArquivo(ft.path); stApagar(ft.path); } });
  Store.set(kVisitas(f), visitasDe(f).filter(x=>x.id!==id));
}

function escolherFotoVisita(input, jaTem){
  const arqs=[...(input.files||[])];
  const lbl=document.getElementById("vs-lbl");
  const rest=Math.max(0, 5-(jaTem||0));
  const bons=arqs.filter(a=>a.size<=20*1024*1024).slice(0, rest);
  if(arqs.some(a=>a.size>20*1024*1024)) toast("Alguma foto acima de 20 MB foi ignorada");
  if(arqs.length>rest) toast("Máximo de 5 fotos por visita");
  window._visitaFotos=bons;
  if(lbl) lbl.textContent = bons.length ? (bons.length+" nova(s) foto(s) selecionada(s)") : "Nenhuma foto";
}

async function gravarVisita(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const talId=g("vs-tal");
  const tal = talhoesDe(f.id).find(x=>x.id===talId);
  const antiga = id ? visitasDe(f.id).find(x=>x.id===id) : null;
  const novas = window._visitaFotos||[];
  const fotosAntigas = antiga ? fotosDaVisita(antiga) : [];
  const dados = { talhao_id:talId, talhao_nome:tal?tal.nome:"",
    data:g("vs-data"), estagio:g("vs-est"), clima:g("vs-clima"), texto:g("vs-txt"),
    fotos: fotosAntigas.slice() };
  if(!dados.data && !dados.texto && !dados.estagio && !novas.length && !fotosAntigas.length){
    toast("Preencha ao menos data ou observação"); return; }

  const salvo = salvarVisita(f.id, dados, id);
  if(novas.length && salvo){
    const fotos = fotosAntigas.slice();
    for(let k=0;k<novas.length;k++){
      const a=novas[k]; const ext=(a.name.match(/\.[a-z0-9]+$/i)||[".jpg"])[0].toLowerCase();
      const caminho=f.id+"/visita-"+salvo.id+"-"+Date.now().toString(36)+k+ext;
      try{ await enviarArquivo(caminho, a); fotos.push({path:caminho, nome:a.name, tamanho:a.size}); }
      catch(e){ /* fica na fila; segue */ }
    }
    salvarVisita(f.id, Object.assign({},dados,{fotos}), salvo.id);
  }
  window._visitaFotos=[]; fecharModal();
  toast(id?"Visita atualizada":"Visita registrada"); render();
}

function excluirVisita(id){
  const f=acharFazenda(App.fazendaId);
  const v=visitasDe(f.id).find(x=>x.id===id); if(!v) return;
  if(!confirm("Remover esta visita?"+(v.foto_path?"\nA foto também sai da nuvem.":""))) return;
  apagarVisita(f.id,id); toast("Visita removida"); render();
}

/* ═══════════════════════════════════════════════════
   CONTRATOS — venda de soja e arrendamentos a cumprir
   O contrato é ligado a um armazém (destino). Ao baixar a
   carga naquele destino, as sacas vão abatendo os contratos
   dali, na ordem de vencimento. Sobra vira "soja a fixar".
   ═══════════════════════════════════════════════════ */
function kContratos(f){ return "faz_"+f+"_contratos"; }
function contratosDe(f){ return Store.get(kContratos(f), []); }

function salvarContrato(f, c, id){
  const l = contratosDe(f);
  const dados = { tipo:c.tipo||"venda", categoria:c.categoria||"Venda",
    numero:(c.numero||"").trim(), parte:(c.parte||"").trim(), produtor:(c.produtor||"").trim(),
    destino:c.destino||"", sacas:Number(c.sacas)||0, entregue:(c.entregue===""||c.entregue==null)?null:Number(c.entregue),
    preco:Number(c.preco)||0, banco:(c.banco||"").trim(), status:c.status||"", vencimento:c.vencimento||"", obs:(c.obs||"").trim() };
  if(id){ const i=l.findIndex(x=>x.id===id); if(i<0) return null;
    l[i]=Object.assign({},l[i],dados); Store.set(kContratos(f),l); return l[i]; }
  const novo=Object.assign({id:"ct_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    fazenda_id:f, criado_em:new Date().toISOString()}, dados);
  l.push(novo); Store.set(kContratos(f),l); return novo;
}
const CT_CATEGORIAS = ["Venda","A fixar","Depósito","Arrendamento"];
const CT_STATUS = ["Entregue","Entregando","Transferido","Cessão de Crédito","A comercializar"];
function apagarContrato(f,id){ Store.set(kContratos(f), contratosDe(f).filter(x=>x.id!==id)); }

/* Abate as cargas baixadas contra os contratos, por destino. */
function conferenciaContratos(f){
  const contratos = contratosDe(f);
  const p = produtividade(f);
  const entregue = {};                       // sacas entregues por armazém (só baixadas)
  cargasDe(f).filter(cargaBaixada).forEach(c=>{
    const d = c.destino || "—";
    entregue[d] = (entregue[d]||0) + (c.baixa.sacas_final||0);
  });
  const grupos = {};
  contratos.forEach(ct=>{ (grupos[ct.destino] = grupos[ct.destino]||[]).push(ct); });

  const destinos = {};
  const chaves = new Set([...Object.keys(entregue), ...Object.keys(grupos)]);
  chaves.forEach(d=>{
    const linha = { destino:d, entregue:entregue[d]||0, alocado:0, aFixar:0, itens:[] };
    let disp = linha.entregue;
    const ord = (grupos[d]||[]).slice().sort((a,b)=>
      (a.vencimento||"9999-99-99").localeCompare(b.vencimento||"9999-99-99") ||
      (a.criado_em||"").localeCompare(b.criado_em||""));
    ord.forEach(ct=>{
      const cumprido = Math.min(disp, ct.sacas);
      disp -= cumprido; linha.alocado += cumprido;
      linha.itens.push({ ct, cumprido, restante:Math.max(0,ct.sacas-cumprido),
        pct: ct.sacas>0 ? cumprido/ct.sacas*100 : 0 });
    });
    linha.aFixar = Math.max(0, disp);
    destinos[d] = linha;
  });

  const totContrato = contratos.reduce((s,c)=>s+c.sacas,0);
  const totCumprido = Object.values(destinos).reduce((s,d)=>s+d.alocado,0);
  const totEntregue = Object.values(entregue).reduce((s,v)=>s+v,0);
  const totAFixar   = Object.values(destinos).reduce((s,d)=>s+d.aFixar,0);
  return { p, contratos, destinos:Object.values(destinos),
    totContrato, totCumprido, totEntregue, totAFixar,
    sacasSilo:p.sacasSilo, totalColhido:p.totalSacas, sacasArmazem:p.sacasArmazem };
}

/* ═══════════════════════════════════════════════════
   EXPORTAÇÃO DE RELATÓRIOS — PNG e PDF, sem CDN
   Desenha a tabela num <canvas> (layout da Santa Angelina:
   faixa verde, colunas, zebra, totais) e gera PNG direto ou
   embute a imagem num PDF montado à mão. Funciona offline.
   ═══════════════════════════════════════════════════ */
const REL = {
  verde:"#22392B", creme:"#F4F0E9", ouro:"#C3A95A", linha:"#C9C6BE",
  txt:"#2B2B2B", branco:"#FFFFFF", vermelho:"#B23B2E",

  /* spec = { titulo, sub, larguras:[px...], aligns:[l|r|c...],
             linhas:[ {t:'cab'|'dado'|'total'|'secao', cs:[...], texto?, cor?} ] } */
  desenhar(spec){
    const S = 2;                          // retina
    const padX = 10, rh = 30, thT = 46, margem = 18;
    const larg = spec.larguras;
    const Wtab = larg.reduce((a,b)=>a+b,0);
    const W = Wtab + margem*2;
    const H = margem*2 + thT + spec.linhas.length*rh + 10;

    const cv = document.createElement("canvas");
    cv.width = W*S; cv.height = H*S;
    const c = cv.getContext("2d"); c.scale(S,S);
    c.textBaseline = "middle";
    c.fillStyle = this.branco; c.fillRect(0,0,W,H);

    // Título (faixa verde)
    c.fillStyle = this.verde; c.fillRect(margem, margem, Wtab, thT);
    c.fillStyle = this.branco; c.font = "bold 15px -apple-system,Segoe UI,Arial";
    c.textAlign = "center";
    c.fillText(spec.titulo, margem + Wtab/2, margem + (spec.sub?16:thT/2));
    if(spec.sub){ c.font = "12px -apple-system,Segoe UI,Arial";
      c.fillText(spec.sub, margem + Wtab/2, margem + 32); }

    let y = margem + thT;
    spec.linhas.forEach((ln, idx)=>{
      const x0 = margem;
      if(ln.t==="secao"){
        c.fillStyle = this.verde; c.fillRect(x0, y, Wtab, rh);
        c.fillStyle = this.branco; c.font = "bold 12.5px -apple-system,Segoe UI,Arial";
        c.textAlign = "left"; c.fillText(ln.texto||"", x0+padX, y+rh/2);
        y += rh; return;
      }
      // fundo
      if(ln.t==="cab"){ c.fillStyle = this.verde; }
      else if(ln.t==="total"){ c.fillStyle = "#EBE7DD"; }
      else { c.fillStyle = (idx%2===0) ? this.branco : this.creme; }
      c.fillRect(x0, y, Wtab, rh);

      // texto das células
      let x = x0;
      (ln.cs||[]).forEach((cel,i)=>{
        const w = larg[i]||80, al = (spec.aligns&&spec.aligns[i])||"left";
        c.font = (ln.t==="cab"||ln.t==="total") ? "bold 12px -apple-system,Segoe UI,Arial"
                                                 : "12px -apple-system,Segoe UI,Arial";
        c.fillStyle = ln.t==="cab" ? this.branco
                    : (ln.cor && ln.cor[i]) ? ln.cor[i] : this.txt;
        const texto = String(cel==null?"":cel);
        c.save(); c.beginPath(); c.rect(x, y, w, rh); c.clip();
        if(al==="right"){ c.textAlign="right"; c.fillText(texto, x+w-padX, y+rh/2); }
        else if(al==="center"){ c.textAlign="center"; c.fillText(texto, x+w/2, y+rh/2); }
        else { c.textAlign="left"; c.fillText(texto, x+padX, y+rh/2); }
        c.restore();
        x += w;
      });
      y += rh;
    });

    // grade
    c.strokeStyle = this.linha; c.lineWidth = 0.6;
    let gy = margem + thT;
    for(let i=0;i<=spec.linhas.length;i++){ c.beginPath(); c.moveTo(margem,gy); c.lineTo(margem+Wtab,gy); c.stroke(); gy+=rh; }
    let gx = margem;
    for(let i=0;i<=larg.length;i++){ c.beginPath(); c.moveTo(gx,margem+thT); c.lineTo(gx,margem+thT+spec.linhas.length*rh); c.stroke(); gx += (larg[i]||0); }

    return cv;
  },

  desenharLado(specs){
    const cvs = specs.map(s=>this.desenhar(s));
    const gap = 48;                       // px de canvas (S=2 já embutido)
    const W = cvs.reduce((a,c)=>a+c.width,0) + gap*(cvs.length-1);
    const H = Math.max.apply(null, cvs.map(c=>c.height));
    const out = document.createElement("canvas"); out.width=W; out.height=H;
    const c = out.getContext("2d");
    c.fillStyle = this.branco; c.fillRect(0,0,W,H);
    let x=0; cvs.forEach(cv=>{ c.drawImage(cv,x,0); x += cv.width + gap; });
    return out;
  },

  png(spec, nome){ this.pngCv(this.desenhar(spec), nome); },
  pngCv(cv, nome){
    cv.toBlob(b=>{ if(!b){ toast("Falha ao gerar imagem"); return; }
      const a=document.createElement("a"); a.href=URL.createObjectURL(b);
      a.download=(nome||"relatorio")+".png"; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    }, "image/png");
  },

  pdf(spec, nome){ this.pdfCv(this.desenhar(spec), nome); },
  pdfCv(cv, nome){
    const jpeg = atob(cv.toDataURL("image/jpeg",0.94).split(",")[1]);
    const w = cv.width, h = cv.height;
    const objs = {};
    objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
    objs[2] = "<< /Type /Pages /Kids [3 0 R] /Count 1 >>";
    objs[3] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+w+" "+h+"] "+
              "/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>";
    objs[4] = "<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+
              " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpeg.length+" >>\nstream\n"+jpeg+"\nendstream";
    const cont = "q "+w+" 0 0 "+h+" 0 0 cm /Im0 Do Q";
    objs[5] = "<< /Length "+cont.length+" >>\nstream\n"+cont+"\nendstream";

    let pdf = "%PDF-1.4\n"; const off = {};
    for(let i=1;i<=5;i++){ off[i]=pdf.length; pdf += i+" 0 obj\n"+objs[i]+"\nendobj\n"; }
    const xref = pdf.length;
    pdf += "xref\n0 6\n0000000000 65535 f \n";
    for(let i=1;i<=5;i++){ pdf += String(off[i]).padStart(10,"0")+" 00000 n \n"; }
    pdf += "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";

    const bytes = new Uint8Array(pdf.length);
    for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&0xff;
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    a.download=(nome||"relatorio")+".pdf"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
};

/* Um único botão "Exportar" com menu de formatos.
   opcoes: [{rotulo, fn}] — fn é a chamada onclick, ex.: "exportarCargas()".
   Com uma opção só, vira botão direto; com várias, abre o menu. */
function botaoExportar(opcoes){
  opcoes=(opcoes||[]).filter(Boolean);
  if(!opcoes.length) return "";
  if(opcoes.length===1)
    return '<button class="btn-act" onclick="'+opcoes[0].fn+'">Exportar</button>';
  return '<details class="exp"><summary class="btn-act">Exportar ▾</summary>'+
    '<div class="exp-menu">'+
      opcoes.map(o=>'<button onclick="this.closest(\'details\').removeAttribute(\'open\');'+o.fn+'">'+esc(o.rotulo)+'</button>').join("")+
    '</div></details>';
}

function telaContratos(){
  const f = acharFazenda(App.fazendaId);

  const C = conferenciaContratos(f.id);
  const arm = armazensDe(f.id);

  // mapa contrato → cumprido/restante, para exibir na lista

  C.destinos.forEach(d=>d.itens.forEach(it=>{ info[it.ct.id]=it; }));

  let h = '<div class="wrap wrap-wide">';

    '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+

    kpi("Já cumprido", nf(C.totCumprido,0), "sc")+

    h += '<div class="empty" style="margin-bottom:16px"><strong>Cadastre um armazém primeiro</strong>'+

  if(!C.contratos.length){
    h += '<div class="empty"><strong>Nenhum contrato cadastrado</strong>'+
      'Cadastre os contratos de venda e os arrendamentos a cumprir. '+
      'Conforme a soja é baixada no armazém, eles vão sendo abatidos.</div>';

    const ord = C.contratos.slice().sort((a,b)=>
      (a.vencimento||"9999-99-99").localeCompare(b.vencimento||"9999-99-99"));
    h += '<div class="cts">';
    ord.forEach(ct=>{
      const it = info[ct.id] || {cumprido:0, restante:ct.sacas, pct:0};

      h += '<div class="ct'+(done?" ok":"")+'">'+
        '<div class="ct-cab">'+
          '<div><span class="ct-tipo '+(ct.categoria==="Arrendamento"?"arr":"ven")+'">'+
            esc(ct.categoria||(ct.tipo==="arrendamento"?"Arrendamento":"Venda"))+'</span>'+
            '<b>'+esc(ct.parte||ct.numero||"Contrato")+'</b>'+
            (ct.numero&&ct.parte?'<span class="ct-num">'+esc(ct.numero)+'</span>':'')+'</div>'+
          '<div class="ct-acts">'+
            '<button onclick="modalContrato(\''+ct.id+'\')">Editar</button>'+
            '<button class="rm" onclick="excluirContrato(\''+ct.id+'\')">✕</button>'+
          '</div></div>'+
        '<div class="ct-barra"><i style="width:'+Math.min(100,it.pct).toFixed(1)+'%"></i></div>'+
        '<div class="ct-meta">'+
          '<span><i>Destino</i>'+esc(ct.destino||"—")+'</span>'+
          '<span><i>Contratado</i>'+nf(ct.sacas,0)+' sc</span>'+
          '<span><i>Cumprido</i>'+nf(it.cumprido,0)+' sc</span>'+
          '<span class="'+(done?"ok":"")+'"><i>Restante</i>'+(done?"cumprido":nf(it.restante,0)+" sc")+'</span>'+
          (ct.vencimento?'<span class="'+(venc!=null&&venc<0&&!done?"venc":"")+'"><i>Vencimento</i>'+dataBR(ct.vencimento)+'</span>':'')+
          (ct.tipo==="venda"&&ct.preco>0?'<span><i>Preço saca</i>'+moeda(ct.preco)+'</span>':'')+
          (ct.categoria==="Venda"&&ct.preco>0?'<span><i>Valor a receber</i>'+moeda(ct.sacas*ct.preco)+'</span>':'')+
          (ct.banco?'<span><i>Banco</i>'+esc(ct.banco)+'</span>':'')+
        '</div>'+
        (ct.obs?'<p class="ct-obs">'+esc(ct.obs)+'</p>':'')+
      '</div>';
    });
    h += '</div>';
  }

  // ── Conferência: a soja tem que fechar ──
  const entregueOK = Math.abs(C.totEntregue - C.sacasArmazem) < 1;
  const somaOK = Math.abs(C.sacasArmazem - (C.totCumprido + C.totAFixar)) < 1;
  const colhidoOK = Math.abs(C.totalColhido - (C.sacasArmazem + C.sacasSilo)) < 1;
  const tudoOK = entregueOK && somaOK && colhidoOK;

  h += '<div class="confere">'+
    '<div class="confere-t">Conferência da soja '+
      '<span class="sit '+(tudoOK?"ok":"tr")+'">'+(tudoOK?"fecha":"conferir")+'</span></div>'+
    '<div class="confere-linha"><span>Total colhido (produtividade)</span><b>'+nf(C.totalColhido,0)+' sc</b></div>'+
    '<div class="confere-sub"><span>= Entregue nos armazéns</span><b>'+nf(C.sacasArmazem,0)+' sc</b></div>'+
    '<div class="confere-sub"><span>+ Em silo bolsa (ainda não entregue)</span><b>'+nf(C.sacasSilo,0)+' sc</b></div>'+
    '<div class="confere-div"></div>'+
    '<div class="confere-linha"><span>Entregue nos armazéns</span><b>'+nf(C.sacasArmazem,0)+' sc</b></div>'+
    '<div class="confere-sub"><span>= Usado em contratos</span><b>'+nf(C.totCumprido,0)+' sc</b></div>'+
    '<div class="confere-sub"><span>+ Soja a fixar (sem contrato)</span><b>'+nf(C.totAFixar,0)+' sc</b></div>'+
    (C.destinos.filter(d=>d.entregue>0).length?
     '<div class="arm-tit">Soja por armazém (sc)</div>'+
     '<table class="arm-grid"><thead><tr><th>Armazém</th><th>Entregue</th><th>Em contrato</th><th>A fixar</th></tr></thead><tbody>'+
       C.destinos.filter(d=>d.entregue>0).sort((a,b)=>b.entregue-a.entregue).map(d=>
         '<tr><td>'+esc(d.destino)+'</td><td>'+nf(d.entregue,0)+'</td><td>'+nf(d.alocado,0)+'</td><td>'+nf(d.aFixar,0)+'</td></tr>').join("")+
       '<tr class="arm-tot"><td>Total</td><td>'+nf(C.sacasArmazem,0)+'</td><td>'+nf(C.totCumprido,0)+'</td><td>'+nf(C.totAFixar,0)+'</td></tr>'+
     '</tbody></table>' : '')+
    '<p class="resumo-obs">O silo bolsa conta como colhido, mas só abate contrato quando for entregue no armazém. '+
      'A soja a fixar é o que já entrou no armazém e ainda não tem contrato.</p>'+
  '</div>';

  return h+'</div>';
}

function gravarContrato(id){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const cat=g("ct-cat");
  const sacas=parseFloat(g("ct-sacas").replace(",","."))||0;
  const entrRaw=g("ct-entr");
  if(sacas<=0 && !entrRaw){ toast("Informe a quantidade vendida ou entregue"); return; }
  if(!g("ct-dest")){ toast("Escolha o armazém de destino"); return; }
  salvarContrato(f.id,{ categoria:cat, tipo:(cat==="Arrendamento"?"arrendamento":"venda"),
    produtor:g("ct-prod"), numero:g("ct-num"), parte:g("ct-parte"), destino:g("ct-dest"),
    sacas, entregue: entrRaw===""?null:parseFloat(entrRaw.replace(",","."))||0,
    preco:parseFloat(g("ct-preco").replace(",","."))||0, banco:g("ct-banco"), status:g("ct-status"),
    vencimento:g("ct-venc"), obs:g("ct-obs") }, id);
  fecharModal(); toast(id?"Contrato atualizado":"Contrato cadastrado"); render();
}

/* Relatório de Entregas — formato da planilha usada há anos. */
function relEntregas(f){
  const C = conferenciaContratos(f.id);
  const auto = {}; C.destinos.forEach(d=>d.itens.forEach(it=>{ auto[it.ct.id]=it.cumprido; }));
  const entrDe = c => c.entregue!=null ? c.entregue : (auto[c.id]||0);
  const cs = contratosDe(f.id);
  const principais = cs.filter(c=>(c.categoria||"Venda")!=="Arrendamento");
  const arrend     = cs.filter(c=>c.categoria==="Arrendamento");

  const larguras=[110,215,150,150,120,150];
  const aligns=['left','left','right','right','right','center'];
  const linhas=[{t:'cab', cs:['Produtor','Armazém','Qtd Vendida / SC','Qtd Entregue / SC','Falta entregar','Status']}];

  let totVend=0, totEntr=0, totFalta=0;
  principais.forEach(c=>{
    const cat=c.categoria||"Venda"; const entr=entrDe(c);
    const arm = (c.parte||"") + (c.numero? " - "+c.numero : "");
    const vendCell = cat==="Venda"? nf(c.sacas,2) : cat;
    const falta = cat==="Venda"? Math.max(0,c.sacas-entr) : null;
    linhas.push({t:'dado', cs:[c.produtor||"", arm||"—", vendCell, nf(entr,2),
      falta==null?"-":nf(falta,2), c.status||""]});
    if(cat==="Venda"){ totVend+=c.sacas; totFalta+=Math.max(0,c.sacas-entr); }
    totEntr += entr;
  });
  linhas.push({t:'total', cs:['','TOTAL', totVend?nf(totVend,2):'', nf(totEntr,2), nf(totFalta,2), '']});

  if(arrend.length){
    linhas.push({t:'secao', texto:'Entregas — Arrendamentos'});
    let totArr=0;
    arrend.forEach(c=>{ const entr=entrDe(c); totArr+=entr;
      linhas.push({t:'dado', cs:[c.produtor||"Arrendamento", c.parte||"—",
        nf(c.sacas,2), nf(entr,2), "", c.status||"Transferido"]}); });
    linhas.push({t:'total', cs:['','Total arrendamentos','', nf(totArr,2), '', '']});
  }

  return { titulo:"Relatório de Entregas · "+f.nome, sub:"Safra "+f.safra,
           larguras, aligns, linhas };
}
function exportarEntregas(fmt){
  const f=acharFazenda(App.fazendaId); if(!f) return;
  if(!contratosDe(f.id).length){ toast("Cadastre contratos primeiro"); return; }
  const spec=relEntregas(f);
  const nome="entregas-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-");
  if(fmt==="csv"){ relParaCSV(spec, nome); return; }
  fmt==="pdf" ? REL.pdf(spec,nome) : REL.png(spec,nome);
}

function _histMapaEditavel(f){
  const stored=Store.get(kHist(f.id),{});
  return { stored, mapa:Object.assign({}, histDe(f.id)[_histSafra]||{}, stored[_histSafra]||{}) };
}
function _histSet(nome, patch){
  const f=acharFazenda(App.fazendaId); if(!f || !ehGestor(f.id)) return;
  const {stored,mapa}=_histMapaEditavel(f);
  let cur = (mapa[nome] && typeof mapa[nome]==="object") ? Object.assign({},mapa[nome])
           : (mapa[nome]!=null ? {v:mapa[nome]} : {});
  for(const k in patch){ if(patch[k]==null || patch[k]==="") delete cur[k]; else cur[k]=patch[k]; }
  if(cur.v==null && !cur.c && cur.a==null) delete mapa[nome]; else mapa[nome]=cur;
  stored[_histSafra]=mapa; Store.set(kHist(f.id),stored);
}
function gravarHistNome(val, nome){ const n=parseFloat(String(val).replace(",",".")); _histSet(nome,{v:(isNaN(n)||n<=0)?null:n}); }
function gravarHistCultNome(cult, nome){ _histSet(nome,{c:(cult||"").trim()}); }
function gravarHistAreaNome(val, nome){ const n=parseFloat(String(val).replace(",",".")); _histSet(nome,{a:(isNaN(n)||n<=0)?null:n}); }
function adicionarHistTalhao(nome){
  const f=acharFazenda(App.fazendaId); if(!f || !ehGestor(f.id)) return;
  const {stored,mapa}=_histMapaEditavel(f);
  if(!(nome in mapa)) mapa[nome]={v:null,c:""};
  stored[_histSafra]=mapa; Store.set(kHist(f.id),stored); render();
}
function criarHistSafra(){
  const f=acharFazenda(App.fazendaId); if(!f || !ehGestor(f.id)) return;

function removerHistSafra(){
  const f=acharFazenda(App.fazendaId); if(!f || !ehGestor(f.id)) return;

function relHist(f, safra){
  const mapa=histDe(f.id)[safra]||{};
  const chaves=Object.keys(mapa).filter(k=>hVal(mapa[k])!=null);   // só quem tem dado
  const linhas=[{t:'cab',cs:['Talhão','Área/ha','Sacas','Sc/ha '+safraCurta(safra),'Variedade']}];
  let totA=0, totSc=0;
  chaves.forEach(k=>{ const a=hArea(mapa[k]), v=hVal(mapa[k]); const sc=(a!=null&&v!=null)?a*v:null;
    if(a) totA+=a; if(sc) totSc+=sc;
    linhas.push({t:'dado',cs:[k, a!=null?nf(a,2):"—", sc!=null?nf(sc,2):"—", nf(v,2), hCult(mapa[k])||"—"]}); });
  const prodF=totA>0?totSc/totA:0;
  linhas.push({t:'total',cs:['TOTAL', nf(totA,2), nf(totSc,2), nf(prodF,2), '']});
  return {titulo:"Produtividade "+safra+" · "+f.nome, sub:"Histórico de safras",
    larguras:[260,100,120,110,200], aligns:['left','right','right','right','left'], linhas};

function exportarHist(fmt){

let _diesel = { grupo:"todos", safraSel:null, dados:null, carregando:false, erro:null, fid:null };
const DIESEL_GRUPOS = [["todos","Todos"],["diesel","Diesel/Combustível"],["pecas","Peças"],
  ["manutencao","Manutenção"],["servicos","Serviços"]];

async function carregarDiesel(f){
  _diesel.carregando=true; _diesel.erro=null;
  try{
    if(!SUPABASE.ligado() || !Auth.logado()) throw new Error("Entre na sua conta para ver os gastos do financeiro");
    if(!navigator.onLine) throw new Error("Sem internet — os gastos do financeiro precisam de conexão");
    const r = await Sync._comRetry(()=>api("rpc/safra_gastos_manut", { method:"POST",
      body:{ p_fazenda_id:f.id, p_grupo:_diesel.grupo } }), 5);
    // A safra vem direcionada no financeiro (l.safra). Ela manda; a janela por
    // data só entra quando o lançamento não foi direcionado a nenhuma safra.
    _diesel.dados = (Array.isArray(r)?r:[]).map(x=>{
      const direcionada=(x.safra||"").trim();
      const s = direcionada || safraDaData(x.data);
      return s ? Object.assign({}, x, {safra:s}) : x;
    });
  }catch(e){ _diesel.erro = explicaErro(e.message||String(e)); _diesel.dados=[]; }
  _diesel.carregando=false; render();
}
function dieselFiltro(g){ if(_diesel.grupo===g) return; _diesel.grupo=g; _diesel.dados=null; render(); }
function dieselSafraSel(v){ _diesel.safraSel=v; render(); }
function dieselFiltrados(f){
  const d=_diesel.dados||[];
  const sel=_diesel.safraSel;
  if(!sel || sel==="__todas") return d;
  return d.filter(x=>x.safra===sel);
}

function telaDiesel(){
  const f=acharFazenda(App.fazendaId); if(!f){ App.tela="fazendas"; return telaFazendas(); }
  if(_diesel.fid!==f.id){ _diesel={grupo:"todos",safraSel:null,dados:null,carregando:false,erro:null,fid:f.id}; }
  if(_diesel.dados===null && !_diesel.carregando){ setTimeout(()=>carregarDiesel(f),0); }

  const todos=_diesel.dados||[];
  const safras=[...new Set(todos.map(x=>x.safra).filter(Boolean))].sort().reverse();
  // padrão: a safra atual do app, se houver dado; senão todas
  if(_diesel.safraSel===null){
    const atual="SAFRA "+f.safra;
    _diesel.safraSel = safras.includes(atual) ? atual : "__todas";
  }
  const d=dieselFiltrados(f);
  const total=d.reduce((s,x)=>s+(Number(x.valor)||0),0);
  const selRot = _diesel.safraSel==="__todas" ? "todas as safras" : _diesel.safraSel.replace("SAFRA ","safra ");

  let h='<div class="wrap wrap-wide">';

    '<div class="farm-head-mid"><h1>Diesel e manutenção</h1>'+
    '<p>Gastos do Gestão Financeira · leitura direta, só desta fazenda</p></div></div>';

  h+='<div class="kpis kpis-3">'+
    kpi("Lançamentos", _diesel.carregando?"…":d.length, selRot)+
    kpi("Total no filtro", _diesel.carregando?"…":moeda(total).replace("R$","").trim(), "R$")+
    kpi("Categoria", (DIESEL_GRUPOS.find(g=>g[0]===_diesel.grupo)||["","Todos"])[1], "")+
  '</div>';

  h+='<div class="acts">'+ DIESEL_GRUPOS.map(g=>
      '<button class="btn-act'+(_diesel.grupo===g[0]?" primary":"")+'" onclick="dieselFiltro(\''+g[0]+'\')">'+esc(g[1])+'</button>').join("")+
    '<span style="width:10px"></span>'+
    '<select class="sel-f" onchange="dieselSafraSel(this.value)">'+
      safras.map(s=>'<option value="'+esc(s)+'" '+(_diesel.safraSel===s?"selected":"")+'>'+esc(s)+'</option>').join("")+
      '<option value="__todas" '+(_diesel.safraSel==="__todas"?"selected":"")+'>Todas as safras</option>'+
    '</select>'+
    (d.length?botaoExportar([{rotulo:"Planilha",fn:"exportarDiesel('csv')"},{rotulo:"Imagem",fn:"exportarDiesel('png')"},{rotulo:"PDF",fn:"exportarDiesel('pdf')"}]):'')+
  '</div>';

  if(_diesel.carregando)
    return h+'<div class="empty"><strong>Buscando no financeiro…</strong>Consultando os lançamentos desta fazenda.</div></div>';
  if(_diesel.erro)
    return h+'<div class="empty"><strong>Não consegui carregar</strong>'+esc(_diesel.erro)+
      '<p class="resumo-obs" style="margin-top:12px">Se acabou de instalar, confirme que o SQL da integração foi rodado no Supabase.</p></div></div>';
  if(!todos.length)
    return h+'<div class="empty"><strong>Nenhum gasto nesta categoria</strong>'+
      'Não há lançamentos dessa categoria para esta fazenda em nenhuma safra.</div></div>';
  if(!d.length)
    return h+'<div class="empty"><strong>Nada nesta safra</strong>'+
      'Há gastos em outras safras — troque o seletor de safra acima.</div></div>';

  h+='<div class="tbl"><table><thead><tr>'+
    '<th>Data</th><th>Categoria</th><th>Histórico</th><th>Fornecedor</th><th class="num">Valor</th></tr></thead><tbody>';
  d.forEach(x=>{
    h+='<tr><td class="mono">'+dataBR(x.data)+'</td>'+

      '<td>'+esc(x.fornecedor||"—")+'</td>'+
      '<td class="num mono forte" style="white-space:nowrap">'+moeda(Number(x.valor)||0)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<p class="resumo-obs">'+d.length+' lançamento(s) · total '+moeda(total)+
    '. Somente leitura — vem do Gestão Financeira, filtrado pela fazenda e categoria.</p>';
  return h+'</div>';
}

function relDiesel(f){
  const d=dieselFiltrados(f);

  let tot=0;
  d.forEach(x=>{ tot+=Number(x.valor)||0;
    linhas.push({t:'dado',cs:[dataBR(x.data), x.categoria||"", x.historico||"", x.fornecedor||"—", moeda(Number(x.valor)||0)]}); });
  linhas.push({t:'total',cs:['','','','TOTAL', moeda(tot)]});
  const gr=(DIESEL_GRUPOS.find(g=>g[0]===_diesel.grupo)||["","Todos"])[1];
  const sr=_diesel.safraSel==="__todas"?"todas as safras":(_diesel.safraSel||"").replace("SAFRA ","safra ");
  return {titulo:"Diesel e manutenção · "+f.nome, sub:gr+"  ·  "+sr,
    larguras:[90,220,430,220,120], aligns:['center','left','left','left','right'], linhas};
}

function desenharItens(){
  const f = acharFazenda(App.fazendaId);
  const tals = talhoesDe(f.id).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{numeric:true}));
  const ult = _itensCarga.length - 1;
  document.getElementById("itens").innerHTML = _itensCarga.map((it,i)=>{
    const auto = i === ult;
    return '<div class="item">'+
      '<select onchange="_itensCarga['+i+'].talhao_id=this.value">'+
        tals.map(t=>'<option value="'+t.id+'" '+(it.talhao_id===t.id?"selected":"")+'>'+esc(t.nome)+'</option>').join("")+
      '</select>'+
      (auto
        ? '<input id="it-resto" class="auto" type="text" readonly tabindex="-1" '+
          'title="Calculado: o que sobra da carga" value="">'
        : '<input type="number" inputmode="decimal" placeholder="kg" value="'+(it.kg||"")+'" '+
          'oninput="_itensCarga['+i+'].kg=this.value;atualizarRateio()">')+
      (_itensCarga.length>1?'<button type="button" onclick="remItemCarga('+i+')">✕</button>':'<span></span>')+
    '</div>';
  }).join("") +
    '<p class="dica" id="dica-rateio"></p>';
  atualizarRateio();
}

/* O último talhão recebe o que sobrou da carga — nunca dá para
   somar mais ou menos que o peso líquido. */
function restanteCarga(){
  const g=id=>parseFloat(String((document.getElementById(id)||{}).value||"").replace(",","."))||0;
  const liq = Math.max(0, g("k-bruto") - g("k-tara"));
  const usado = _itensCarga.slice(0,-1)
    .reduce((s,i)=>s+(parseFloat(String(i.kg).replace(",","."))||0), 0);
  return { liq, usado, resto: liq - usado };
}

function atualizarRateio(){
  const r = restanteCarga();
  const el = document.getElementById("it-resto");
  const dica = document.getElementById("dica-rateio");
  if(el){
    el.value = r.liq > 0 ? n0(r.resto) + " kg" : "—";
    el.classList.toggle("estouro", r.resto < 0);
  }
  if(_itensCarga.length) _itensCarga[_itensCarga.length-1].kg = r.resto > 0 ? r.resto : 0;
  if(dica){
    if(r.liq <= 0)
      dica.innerHTML = 'Informe o peso bruto e a tara para dividir a carga.';
    else if(r.resto < 0)
      dica.innerHTML = '<b class="erro">Passou '+n0(-r.resto)+' kg do peso da carga.</b> '+
        'Ajuste os valores acima — a soma não pode ultrapassar '+n0(r.liq)+' kg.';
    else if(_itensCarga.length === 1)
      dica.innerHTML = 'A carga inteira ('+n0(r.liq)+' kg) fica neste talhão.';
    else
      dica.innerHTML = 'O último talhão recebe o que sobrou: '+n0(r.resto)+' de '+n0(r.liq)+' kg.';
  }
}

function addItemCarga(){
  const f=acharFazenda(App.fazendaId), t=talhoesDe(f.id);
  const usados = _itensCarga.map(x=>x.talhao_id);

  _itensCarga.push({talhao_id:livre?livre.id:"", kg:""});
  desenharItens();
}
function remItemCarga(i){ _itensCarga.splice(i,1); desenharItens(); }

function recalcCarga(){
  const g=id=>parseFloat(String((document.getElementById(id)||{}).value||"").replace(",","."))||0;
  const r = calcCarga({ peso_bruto:g("k-bruto"), tara:g("k-tara") });
  const box=document.getElementById("calc-box"); if(!box) return;
  const u=g("k-umid");
  box.innerHTML =
    '<span><i>Líquido</i><b>'+n0(r.liquido)+' kg</b></span>'+
    '<span><i>Sacas estimadas</i><b class="ok">'+nf(r.sacas,1)+' sc</b></span>'+
    (u>0?'<span><i>Umidade fazenda</i><b>'+nf(u,1)+'%</b></span>':'')+
    '<span class="nota">Valor de saída. As sacas confirmadas saem na baixa, com os descontos do armazém.</span>';
  atualizarRateio();
}


function gravarCarga(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>String((document.getElementById(i)||{}).value||"").trim();
  const n=i=>parseFloat(g(i).replace(",","."))||0;

  const bruto=n("k-bruto"), tara=n("k-tara");
  if(bruto<=0){ toast("Informe o peso bruto"); return; }
  if(tara>=bruto){ toast("A tara precisa ser menor que o peso bruto"); return; }
  const itens=_itensCarga.filter(i=>i.talhao_id);
  if(!itens.length){ toast("Escolha o talhão de origem"); return; }
  const r=restanteCarga();
  if(r.resto < 0){ toast("A divisão passa "+n0(-r.resto)+" kg do peso da carga"); return; }
  const dup=itens.map(i=>i.talhao_id);
  if(new Set(dup).size !== dup.length){ toast("O mesmo talhão está repetido"); return; }
  const dest=g("k-dest");
  if(!dest){ toast("Escolha o destino da carga"); return; }

  const cm=caminhoesDe(f.id).find(x=>x.id===g("k-cam"));
  salvarCarga(f.id,{
    data:g("k-data")||new Date().toISOString().slice(0,10),
    romaneio:g("k-rom"), destino:dest,
    placa: cm?cm.placa:"", motorista:g("k-mot"),
    peso_bruto:bruto, tara:tara, umidade:n("k-umid"), obs:g("k-obs"),
    talhoes: itens.map((i,k)=>({ talhao_id:i.talhao_id,
      kg: k===itens.length-1 ? Math.max(0,r.resto)
                             : (parseFloat(String(i.kg).replace(",","."))||0) }))
  }, id);
  fecharModal(); toast(id?"Carga atualizada":"Carga lançada"); render();
}

function gravarCaminhoesLote(){
  const f=acharFazenda(App.fazendaId);
  const txt=(document.getElementById("cm-lote").value||"").trim();
  if(!txt){ toast("Cole a lista primeiro"); return; }
  const l=caminhoesDe(f.id);
  const existentes=new Set(l.map(c=>c.placa));
  let add=0, dup=0, i=0;
  txt.split(/\r?\n/).forEach(linha=>{
    const s=linha.trim(); if(!s) return;
    const m=s.split(/\s*[-\t,;]\s*|\s{2,}/);
    const placa=(m[0]||"").trim().toUpperCase();
    const mot=(m.slice(1).join(" ")||"").trim();
    if(!placa) return;
    if(existentes.has(placa)){ dup++; return; }
    existentes.add(placa);
    l.push({id:"cm_"+Date.now().toString(36)+"_"+(i++), fazenda_id:f.id, placa, motorista:mot});
    add++;
  });
  if(!add){ toast(dup?"Todos já estavam cadastrados":"Nada reconhecido na lista"); return; }
  Store.set(kCam(f.id),l);
  l.slice(-add).forEach(c=>Sync.push("caminhoes","upsert",c));
  fecharModal(); toast(add+" caminhão(ões) adicionados"+(dup?" · "+dup+" já existiam":"")); render();
}

function abaDescontos(f){
  const R = resumoDescontos(f.id);
  const t = R.tot;
  if(!t.cargas)
    return '<div class="empty"><strong>Nenhuma carga baixada ainda</strong>'+
      'Quando o romaneio do armazém voltar, dê baixa na carga. Os descontos aparecem aqui.</div>';

  const b = basesDe(f.id);
  let h = '<div class="acts">'+
    '<button class="btn-act" onclick="modalBases()">Padrões: umidade '+nf(b.umidade,0)+
    '% · impureza '+nf(b.impureza,0)+'% · avariados '+nf(b.avariados,0)+'%</button>'+
    botaoExportar([{rotulo:"Planilha",fn:"exportarDescontos('csv')"},{rotulo:"Imagem",fn:"exportarDescontos('png')"},{rotulo:"PDF",fn:"exportarDescontos('pdf')"}])+'</div>';

  h += '<div class="kpis kpis-4">'+
    kpi("Umidade", nf(t.umidade/SACA_KG,1), "sc · "+n0(t.umidade)+" kg")+
    kpi("Impureza", nf(t.impureza/SACA_KG,1), "sc · "+n0(t.impureza)+" kg")+
    kpi("Avariados", nf(t.avariados/SACA_KG,1), "sc · "+n0(t.avariados)+" kg")+
    kpi("Total descontado", nf(t.total/SACA_KG,1), "sc · "+nf(t.pct,2)+"% do bruto")+
  '</div>';

  h += '<div class="tbl"><table><thead><tr><th>Destino</th><th class="num">Cargas</th>'+
    '<th class="num">Bruto</th><th class="num">Umidade</th><th class="num">Impureza</th>'+
    '<th class="num">Avariados</th><th class="num">Total desc.</th>'+
    '<th class="num">%</th><th class="num">Líquido final</th></tr></thead><tbody>';
  R.porDestino.forEach(d=>{
    const pct = d.bruto>0 ? d.total/d.bruto*100 : 0;
    h += '<tr><td class="forte">'+esc(d.destino)+'</td>'+
      '<td class="num mono">'+d.cargas+'</td>'+
      '<td class="num mono">'+n0(d.bruto)+'</td>'+
      '<td class="num mono">'+n0(d.umidade)+'</td>'+
      '<td class="num mono">'+n0(d.impureza)+'</td>'+
      '<td class="num mono">'+n0(d.avariados)+'</td>'+
      '<td class="num mono forte">'+n0(d.total)+'</td>'+
      '<td class="num mono'+(pct>=8?' alerta':'')+'">'+nf(pct,2)+'%</td>'+
      '<td class="num mono">'+n0(d.final)+'</td></tr>';
  });
  h += '</tbody><tfoot><tr><td class="fix">Total</td><td class="num mono">'+t.cargas+'</td>'+
    '<td class="num mono">'+n0(t.bruto)+'</td><td class="num mono">'+n0(t.umidade)+'</td>'+
    '<td class="num mono">'+n0(t.impureza)+'</td><td class="num mono">'+n0(t.avariados)+'</td>'+
    '<td class="num mono">'+n0(t.total)+'</td><td class="num mono">'+nf(t.pct,2)+'%</td>'+
    '<td class="num mono">'+n0(t.final)+'</td></tr></tfoot></table></div>';

  h += '<p class="resumo-obs">O desconto de umidade usa a fórmula sobre o excedente do grau padrão. '+
    'Impureza e avariados incidem sobre o peso já seco, só na parte acima do padrão do contrato.</p>';
  return h;
}

/* Cada desconto tem dois campos: o grau e o kg. O kg é o que
   conta — vem pronto no romaneio. O grau fica de registro. */
function campoDesc(k, rot, pct, kg, padrao, extra){
  return '<div class="dsc">'+
    '<label>'+esc(rot)+'</label>'+
    '<div class="dsc-in">'+
      '<span class="dsc-c"><input id="b-'+k+'-p" type="number" step="0.01" inputmode="decimal" '+
        'value="'+(pct!=null?pct:"")+'" placeholder="0" oninput="sugerirKg(\''+k+'\');recalcBaixa()">'+
        '<i>%</i></span>'+
      '<span class="dsc-c"><input id="b-'+k+'-k" type="number" step="1" inputmode="decimal" '+
        'value="'+(kg!=null?kg:"")+'" placeholder="0" oninput="_kgManual.'+k+'=true;recalcBaixa()">'+
        '<i>kg</i></span>'+
    '</div>'+
    '<span class="pad">padrão '+padrao+(extra?" · "+esc(extra):"")+'</span>'+
  '</div>';
}
let _kgManual = {};

/* Preenche o kg a partir do grau — só enquanto o campo não
   for tocado à mão. Armazém que calcula diferente, digita direto. */
function sugerirKg(k){
  if(_kgManual[k]) return;
  const f=acharFazenda(App.fazendaId); if(!f) return;
  const g=i=>parseFloat(String((document.getElementById(i)||{}).value||"").replace(",","."))||0;
  const tipo = k==="umid" ? "umidade" : k==="imp" ? "impureza" : "avariados";
  const liq = g("b-liq");
  const el = document.getElementById("b-"+k+"-k");
  if(el) el.value = sugerirDesc(tipo, liq, g("b-"+k+"-p"), basesDe(f.id)) || "";
}

        campoDesc("imp","Impureza", j.impureza, j.desc_impureza, nf(b.impureza,0)+"%","")+

      '</div>'+
