<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Safra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4E4034">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<title>Safra nas Mãos · FOCO Agropecuária</title>
<style>
:root{
  /* Marca FOCO */
  --brown:#4E4034;
  --brown-deep:#3A3028;
  --brown-soft:#F0EDE7;
  --leaf:#7FA646;
  --leaf-lt:#A3C169;
  --leaf-dk:#4A7C2F;
  --leaf-soft:#EFF4E6;

  --bg:#F4F6F0;
  --card:#FFFFFF;
  --line:#E2E0D6;
  --text:#3B352E;
  --muted:#7C766C;
  --red:#B24634;
  --red-soft:#FBEDEA;
  --amber:#9A7226;
  --amber-soft:#FBF3E2;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg{display:block}

/* ── Top bar ─────────────────────────────── */
.topbar{
  background:var(--brown);color:#fff;
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:3px solid var(--leaf);
}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:30px;height:30px;flex:none}
.brand-txt{line-height:1.1}
.brand-txt b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.brand-txt span{display:block;font-size:10.5px;color:var(--leaf-lt);letter-spacing:.1em;font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.sync-chip{
  display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
  font-size:12px;font-weight:600;background:rgba(255,255,255,.13)
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--leaf-lt)}
.sync-chip.off{background:rgba(240,190,90,.2)}
.sync-chip.off .sync-dot{background:#E8B455}
.btn-ghost{
  background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;
  padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600
}
.btn-ghost:hover{background:rgba(255,255,255,.12)}

/* ── Banners ─────────────────────────────── */
.banner{padding:11px 16px;font-size:14px;text-align:center}
.banner.err{background:var(--red-soft);color:var(--red)}
.banner.warn{background:var(--amber-soft);color:var(--amber)}

/* ── Layout ──────────────────────────────── */
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
.wrap-wide{max-width:1100px}

/* ── Tela fazendas ───────────────────────── */
.lbl{display:block;color:var(--brown);font-size:13px;font-weight:700;margin-bottom:6px}
.field-lg{
  width:100%;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--r);background:#fff;font-size:16px;color:var(--text)
}
.field-lg::placeholder{color:#A9A69C}
.field-lg:focus{border-color:var(--leaf);outline:none}
.btn-primary{
  width:100%;background:var(--leaf-dk);color:#fff;border:none;
  padding:15px;border-radius:var(--r);font-size:17px;font-weight:700;margin-top:12px
}
.btn-primary:hover{background:#3E6B27}

.panorama{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-top:16px;
  background:var(--leaf-soft);border:1.5px solid var(--leaf);border-radius:var(--r);
  padding:14px 16px;color:var(--leaf-dk);font-size:14px;line-height:1.5
}
.panorama b{font-size:15px;display:block;margin-bottom:2px}
.panorama:hover{background:#E7F0D9}
.panorama svg{width:24px;height:24px;flex:none;margin-top:2px}

.farm-card{
  display:flex;align-items:center;gap:12px;width:100%;
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--leaf);
  border-radius:var(--r);padding:14px 16px;margin-top:10px
}
.farm-card:hover{border-color:var(--leaf);box-shadow:0 1px 7px rgba(78,64,52,.09)}
.farm-card h3{color:var(--brown);font-size:17px;font-weight:700;margin-bottom:2px}
.farm-card p{color:var(--muted);font-size:13px}
.farm-card .chev{margin-left:auto;color:var(--leaf-dk);font-size:23px;font-weight:700;cursor:pointer}
.farm-card .del{margin-left:8px;background:none;border:none;color:#CDC9BE;font-size:17px;padding:4px 6px}
.farm-card .del:hover{color:var(--red)}

.empty{
  text-align:center;padding:36px 20px;color:var(--muted);
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r);margin-top:16px
}
.empty strong{display:block;color:var(--brown);font-size:16px;margin-bottom:6px}
.ver{text-align:center;color:#ADA89D;font-size:12px;margin-top:28px}

/* ── Cabeçalho da fazenda ────────────────── */
.farm-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;padding:18px 0 20px}
.btn-back{
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:8px 14px;font-size:14px;font-weight:600;color:var(--brown)
}
.btn-back:hover{border-color:var(--leaf);color:var(--leaf-dk)}
.farm-head-mid h1{color:var(--brown);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.farm-head-mid p{color:var(--muted);font-size:14px;margin-top:3px}
.safra-box{margin-left:auto;text-align:right}
.safra-box label{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.safra-box select{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:6px 10px;font-size:18px;font-weight:800;color:var(--brown)
}

/* ── Cards de destaque ───────────────────── */
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.hero{text-align:left;border-radius:14px;padding:20px;border:2px solid;background:var(--card)}
.hero .ic{display:block;margin-bottom:11px}
.hero .ic svg{width:30px;height:30px}
.hero h2{font-size:19px;font-weight:800;color:var(--brown);margin-bottom:5px;letter-spacing:-.01em}
.hero p{font-size:13.5px;line-height:1.45}
.hero-leaf{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf-dk)}
.hero-leaf:hover{background:#E7F0D9}
.hero-earth{border-color:var(--brown);background:var(--brown-soft);color:#6B5B4A}
.hero-earth:hover{background:#E8E3DA}

/* ── Seções e módulos ────────────────────── */
.sec-head{display:flex;align-items:center;gap:14px;margin:26px 0 14px}
.sec-head span{color:var(--leaf-dk);font-size:12.5px;font-weight:800;letter-spacing:.07em;white-space:nowrap}
.sec-head i{flex:1;height:2px;background:var(--leaf);border-radius:2px;opacity:.55}

.mods{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mod{
  text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:17px;position:relative
}
.mod:hover{border-color:var(--leaf);box-shadow:0 2px 11px rgba(78,64,52,.08)}
.mod .ic{
  width:42px;height:42px;border-radius:10px;background:var(--leaf-soft);
  display:grid;place-items:center;margin-bottom:12px;color:var(--leaf-dk)
}
.mod .ic svg{width:23px;height:23px}
.mod h3{color:var(--brown);font-size:16.5px;font-weight:700;margin-bottom:3px}
.mod p{color:var(--muted);font-size:13px;line-height:1.4}
.mod .tag{
  position:absolute;top:14px;right:14px;font-size:10px;font-weight:800;
  padding:3px 7px;border-radius:5px;letter-spacing:.03em
}
.tag-soon{background:#F2F1EC;color:#9B958A}
.tag-ready{background:var(--leaf-soft);color:var(--leaf-dk)}

/* ── Modal ───────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(45,38,30,.55);display:flex;
  align-items:center;justify-content:center;padding:16px;z-index:200}
.modal{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:440px;
  max-height:88vh;overflow-y:auto}
.modal h2{color:var(--brown);font-size:19px;font-weight:800;margin-bottom:4px}
.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.frm{display:flex;flex-direction:column;gap:13px}
.frm label{display:block;color:var(--brown);font-size:13px;font-weight:700;margin-bottom:5px}
.frm input,.frm select{width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--text);font-size:15px}
.frm input:focus,.frm select:focus{border-color:var(--leaf);outline:none}
.modal-acts{display:flex;gap:10px;margin-top:20px}
.modal-acts button{flex:1;padding:12px;border-radius:9px;font-size:15px;font-weight:700;border:none}
.btn-cancel{background:#EFEDE7;color:var(--muted)}
.btn-cancel:hover{background:#E5E2DA}
.btn-save{background:var(--leaf-dk);color:#fff}
.btn-save:hover{background:#3E6B27}

#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom));background:var(--brown-deep);color:#fff;
  padding:11px 20px;border-radius:9px;font-size:14px;font-weight:600;z-index:300;
  display:none;max-width:90vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.22)}

.stub{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:40px 24px;text-align:center;margin-top:20px}
.stub .ic{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:16px;
  background:var(--leaf-soft);color:var(--leaf-dk);margin-bottom:16px}
.stub .ic svg{width:32px;height:32px}
.stub h2{color:var(--brown);font-size:21px;font-weight:800;margin-bottom:8px}
.stub p{color:var(--muted);font-size:14.5px;max-width:430px;margin:0 auto 20px;line-height:1.55}

/* ── Indicadores ─────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.kpi-rot{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:3px}
.kpi-val{display:block;color:var(--brown);font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi-val i{font-style:normal;font-size:13px;font-weight:600;color:var(--muted)}

/* ── Barra de ações ──────────────────────── */
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btn-act{background:var(--card);border:1px solid var(--line);color:var(--brown);
  border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700}
.btn-act:hover{border-color:var(--leaf);color:var(--leaf-dk)}
.btn-act.primary{background:var(--leaf-dk);border-color:var(--leaf-dk);color:#fff}
.btn-act.primary:hover{background:#3E6B27}
.busca{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);
  border-radius:9px;background:#fff;font-size:14px;color:var(--text)}
.busca:focus{border-color:var(--leaf);outline:none}

/* ── Lista de talhões ────────────────────── */
.tal-list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tal{display:grid;grid-template-columns:4px 1fr auto auto;align-items:center;gap:14px;
  padding:13px 16px;border-bottom:1px solid var(--line)}
.tal:last-child{border-bottom:none}
.tal:hover{background:#FAFBF7}
.tal-bar{width:4px;height:34px;background:#EDEFE7;border-radius:3px;overflow:hidden;
  display:flex;align-items:flex-end}
.tal-bar i{display:block;width:100%;background:var(--leaf);border-radius:3px;height:100%}
.tal-nome{color:var(--brown);font-size:15.5px;font-weight:700;min-width:0}
.pill{display:inline-block;margin-left:8px;background:var(--amber-soft);color:var(--amber);
  font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;vertical-align:middle}
.tal-ha{color:var(--brown);font-size:16px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.tal-ha span{color:var(--muted);font-size:12px;font-weight:600}
.tal-acts{display:flex;gap:6px}
.tal-acts button{background:none;border:1px solid var(--line);border-radius:7px;
  padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tal-acts button:hover{border-color:var(--leaf);color:var(--leaf-dk)}
.tal-acts .rm:hover{border-color:var(--red);color:var(--red)}

@media(max-width:640px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpis .kpi:last-child{grid-column:1/-1}
  .kpi-val{font-size:20px}
  .acts{gap:8px}
  .btn-act{flex:1;padding:11px 12px;font-size:13.5px}
  .busca{width:100%;flex-basis:100%}
  .tal{grid-template-columns:4px 1fr auto;gap:10px;padding:12px 13px;row-gap:8px}
  .tal-nome{font-size:14.5px}
  .tal-acts{grid-column:2/-1;justify-content:flex-start}
  .tal-acts button{padding:5px 10px}
}

@media(max-width:640px){
  body{font-size:14.5px}
  .wrap{padding:16px 12px 32px}
  .heroes,.mods{grid-template-columns:1fr;gap:12px}
  .farm-head{padding:14px 0 16px}
  .farm-head-mid h1{font-size:20px}
  .safra-box{margin-left:0;text-align:left;width:100%}
  .topbar{padding-left:12px;padding-right:12px;gap:8px}
  .topbar-right{font-size:12px;gap:7px;width:100%;margin-left:0;justify-content:space-between}
  .hero{padding:17px}
  .mod{padding:15px}
}
</style>
</head>

const _ls = _storageOk("localStorage") ? localStorage
          : _storageOk("sessionStorage") ? sessionStorage : null;

const Store = {
  get(k,d){
    try{
      if(_ls){ const v=_ls.getItem("sm_"+k); if(v!=null) return JSON.parse(v); }
      return (k in _mem) ? _mem[k] : d;
    }catch(e){ return d; }
  },
  set(k,v){ _mem[k]=v; try{ if(_ls) _ls.setItem("sm_"+k, JSON.stringify(v)); }catch(e){} },
  del(k){ delete _mem[k]; try{ if(_ls) _ls.removeItem("sm_"+k); }catch(e){} },
  persistent(){ return _ls !== null; }
};

/* ═══════════════════════════════════════════════════
   SYNC — fila de pendências
   ═══════════════════════════════════════════════════ */
const SUPABASE = { url:"", anonKey:"", enabled(){ return !!(this.url && this.anonKey); } };

const Sync = {
  queue(){ return Store.get("sync_queue", []); },
  pending(){ return this.queue().length; },
  push(table, op, payload){
    const q = this.queue();
    q.push({ id:"op_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
             ts:new Date().toISOString(), table, op, payload });
    Store.set("sync_queue", q);
    this.render();
    if(navigator.onLine) this.flush();
  },
  async flush(){
    if(!navigator.onLine) return;
    const q = this.queue();
    if(!q.length){ this.render(); return; }
    if(!SUPABASE.enabled()){ this.render(); return; }
    const restantes = [];
    for(const item of q){
      try{
        const method = item.op === "delete" ? "DELETE" : "POST";
        const r = await fetch(SUPABASE.url+"/rest/v1/"+item.table, {
          method,
          headers:{ "apikey":SUPABASE.anonKey, "Authorization":"Bearer "+SUPABASE.anonKey,
                    "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates" },
          body: method==="DELETE" ? undefined : JSON.stringify(item.payload)
        });
        if(!r.ok) restantes.push(item);
      }catch(e){ restantes.push(item); }
    }
    Store.set("sync_queue", restantes);
    this.render();
    if(!restantes.length && q.length) toast("Tudo sincronizado na nuvem");
  },
  render(){
    const el = document.getElementById("sync-chip");
    if(!el) return;
    const n = this.pending(), on = navigator.onLine;
    if(on && !n){ el.className="sync-chip";
      el.innerHTML='<span class="sync-dot"></span> Sincronizado na nuvem'; }
    else if(!on){ el.className="sync-chip off";
      el.innerHTML='<span class="sync-dot"></span> Sem sinal'+(n?" · "+n+" a enviar":""); }
    else { el.className="sync-chip off";
      el.innerHTML='<span class="sync-dot"></span> '+n+" a enviar"; }
  }
};
window.addEventListener("online",  ()=>{ Sync.flush(); render(); });
window.addEventListener("offline", ()=>{ render(); });

function safraAtual(){
  const h=new Date(), a = h.getMonth()>=6 ? h.getFullYear() : h.getFullYear()-1;
  return a+"/"+(a+1);
}
function safrasDisponiveis(){
  const b=parseInt(safraAtual().slice(0,4),10), o=[];
  for(let a=b+1;a>=b-4;a--) o.push(a+"/"+(a+1));
  return o;
}
function fazendas(){ return Store.get("fazendas", []); }
function salvarFazendas(l){ Store.set("fazendas", l); }
function acharFazenda(id){ return fazendas().find(f=>f.id===id) || null; }

function criarFazenda(d){
  const l=fazendas();
  const f={ id:"faz_"+Date.now().toString(36), nome:d.nome.trim(),
    produtor:(d.produtor||"").trim(), municipio:(d.municipio||"").trim(),
    uf:(d.uf||"").trim().toUpperCase(), safra:d.safra||safraAtual(),
    talhoes:0, hectares:0, criado_em:new Date().toISOString() };
  l.push(f); salvarFazendas(l); Sync.push("fazendas","upsert",f);
  return f;
}
function removerFazenda(id){
  salvarFazendas(fazendas().filter(f=>f.id!==id));
  Sync.push("fazendas","delete",{id});
}

   ═══════════════════════════════════════════════════ */
function chaveTal(fid){ return "faz_"+fid+"_talhoes"; }
function talhoesDe(fid){ return Store.get(chaveTal(fid), []); }
function salvarTalhoes(fid, lista){
  Store.set(chaveTal(fid), lista);
  recontarFazenda(fid);
}
function recontarFazenda(fid){
  const l = fazendas(), f = l.find(x=>x.id===fid);
  if(!f) return;
  const t = talhoesDe(fid);
  f.talhoes  = t.length;
  f.hectares = t.reduce((s,x)=>s+(x.hectares||0),0);
  salvarFazendas(l);
}
function novoTalhao(fid, d){
  const l = talhoesDe(fid);
  const t = {
    id: "tal_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    fazenda_id: fid,
    nome: (d.nome||"").trim(),
    hectares: Number(d.hectares)||0,
    abertura: Number(d.abertura)||0
  };
  l.push(t); salvarTalhoes(fid,l);
  Sync.push("talhoes","upsert",t);
  return t;
}
function editarTalhao(fid, id, d){
  const l = talhoesDe(fid), t = l.find(x=>x.id===id);
  if(!t) return;
  Object.assign(t,{ nome:(d.nome||"").trim(),
    hectares:Number(d.hectares)||0, abertura:Number(d.abertura)||0 });
  salvarTalhoes(fid,l); Sync.push("talhoes","upsert",t);
}
function apagarTalhao(fid, id){
  salvarTalhoes(fid, talhoesDe(fid).filter(x=>x.id!==id));
  Sync.push("talhoes","delete",{id});
}
function aplicarSeedSA(fid){
  const l = SEED_SANTA_ANGELINA.talhoes.map((r,i)=>({
    id:"tal_sa_"+i, fazenda_id:fid, nome:r[0], hectares:r[1], abertura:r[2]||0
  }));
  salvarTalhoes(fid,l);
  l.forEach(t=>Sync.push("talhoes","upsert",t));
}

let _buscaTal = "";

function telaTalhoes(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela="fazendas"; return telaFazendas(); }

  const todos = talhoesDe(f.id);
  const b = _buscaTal.trim().toLowerCase();
  const lista = b ? todos.filter(t=>t.nome.toLowerCase().includes(b)) : todos;
  lista.sort((a,z)=>a.nome.localeCompare(z.nome,"pt-BR",{numeric:true}));

  const totHa = todos.reduce((s,t)=>s+t.hectares,0);
  const totAb = todos.reduce((s,t)=>s+(t.abertura||0),0);
  const nAb   = todos.filter(t=>(t.abertura||0)>0).length;

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">'+
         '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f.nome)+'</button>'+
         '<div class="farm-head-mid"><h1>Dados da fazenda</h1>'+
         '<p>Talhões, áreas e tipo de área · safra '+esc(f.safra)+'</p></div></div>';

  // Indicadores
  h += '<div class="kpis">'+
    kpi("Talhões", todos.length, "") +
    kpi("Área total", totHa.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}), "ha") +
    kpi("Área nova", totAb>0 ? totAb.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "—", totAb>0?"ha · "+nAb+" talhões":"") +
  '</div>';

  // Ações
  h += '<div class="acts">'+
    '<button class="btn-act primary" onclick="modalTalhao()">+ Novo talhão</button>'+
    (todos.length ? '<button class="btn-act" onclick="exportarTalhoes()">Baixar planilha</button>' : '')+
    (todos.length ? '<input class="busca" placeholder="Buscar talhão…" value="'+esc(_buscaTal)+'" '+
       'oninput="clearTimeout(window._bt);window._bt=setTimeout(()=>{_buscaTal=this.value;render();},250)">' : '')+
  '</div>';

  if(!todos.length){
    h += '<div class="empty"><strong>Nenhum talhão cadastrado</strong>'+
         'Cadastre os talhões com nome e área. Eles são a base para colheita, operações, chuva e NDVI.'+
         (f.nome.toLowerCase().includes("santa angelina")
           ? '<div style="margin-top:16px"><button class="btn-act primary" onclick="carregarSA()">'+
             'Carregar os 36 talhões da Santa Angelina</button></div>' : '')+
         '</div>';
  }else if(!lista.length){
    h += '<div class="empty"><strong>Nada encontrado</strong>Nenhum talhão com “'+esc(_buscaTal)+'”.</div>';
  }else{
    h += '<div class="tal-list">';
    lista.forEach(t=>{
      const pct = totHa>0 ? (t.hectares/totHa*100) : 0;
      h += '<div class="tal">'+
        '<div class="tal-bar"><i style="width:'+Math.max(2,Math.min(100,pct*3)).toFixed(1)+'%"></i></div>'+
        '<div class="tal-nome">'+esc(t.nome)+
          ((t.abertura||0)>0 ? '<span class="pill">área nova '+t.abertura.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+' ha</span>' : '')+
        '</div>'+
        '<div class="tal-ha">'+t.hectares.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+' <span>ha</span></div>'+
        '<div class="tal-acts">'+
          '<button onclick="modalTalhao(\''+t.id+'\')" title="Editar">Editar</button>'+
          '<button class="rm" onclick="removerTalhao(\''+t.id+'\')" title="Remover">✕</button>'+
        '</div></div>';
    });
    h += '</div>';
    if(b) h += '<p class="ver">'+lista.length+' de '+todos.length+' talhões</p>';
  }
  return h+'</div>';
}

    '<div class="modal-acts">'+
      '<button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="salvarTalhao('+(t?"'"+t.id+"'":"null")+')">Salvar</button>'+
    '</div></div></div>';
  setTimeout(()=>{const e=document.getElementById("t-nome"); if(e) e.focus();},60);
}

function salvarTalhao(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const nome = document.getElementById("t-nome").value.trim();
  const ha   = parseFloat(String(document.getElementById("t-ha").value).replace(",","."))||0;
  const ab   = parseFloat(String(document.getElementById("t-ab").value).replace(",","."))||0;
  if(!nome){ toast("Informe o nome do talhão"); return; }
  if(ha<=0){ toast("Informe a área em hectares"); return; }
  if(ab>ha){ toast("A área nova não pode ser maior que a área do talhão"); return; }

  const jaExiste = talhoesDe(f.id).some(t =>
    t.id!==id && t.nome.toLowerCase()===nome.toLowerCase());
  if(jaExiste){ toast("Já existe um talhão com esse nome"); return; }

  if(id) editarTalhao(f.id,id,{nome,hectares:ha,abertura:ab});
  else   novoTalhao(f.id,{nome,hectares:ha,abertura:ab});
  fecharModal(); toast(id?"Talhão atualizado":"Talhão cadastrado"); render();
}

function removerTalhao(id){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const t = talhoesDe(f.id).find(x=>x.id===id); if(!t) return;
  if(!confirm('Remover o talhão "'+t.nome+'"?')) return;
  apagarTalhao(f.id,id); toast("Talhão removido"); render();
}

function exportarTalhoes(){
  const f = acharFazenda(App.fazendaId); if(!f) return;
  const l = talhoesDe(f.id).slice()
    .sort((a,z)=>a.nome.localeCompare(z.nome,"pt-BR",{numeric:true}));
  const linhas = [["Talhao","Area_ha","Area_nova_ha"]]
    .concat(l.map(t=>[t.nome, String(t.hectares).replace(".",","), String(t.abertura||0).replace(".",",")]));
  const csv = "\ufeff"+linhas.map(r=>r.map(v=>{
    const s=String(v); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download = "talhoes-"+f.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Planilha baixada");
}

function telaModulo(){
  const f=acharFazenda(App.fazendaId), m=acharModulo(App.moduloId);
  const nome = m ? m.nome
    : App.moduloId==="panorama-fazenda" ? "Panorama da fazenda"
    : App.moduloId==="resumo-fazenda"   ? "Resumo financeiro" : "Módulo";
  const ic = m ? (ICON[m.ic]||ICON.talhoes)
    : (App.moduloId==="resumo-fazenda" ? ICON.resumo : ICON.panorama);

  return '<div class="wrap wrap-wide">'+
    '<div class="farm-head">'+
      '<button class="btn-back" onclick="irPara(\'fazenda\')">← '+esc(f?f.nome:"Voltar")+'</button>'+
      '<div class="farm-head-mid"><h1>'+esc(nome)+'</h1><p>Safra '+esc(f?f.safra:"")+'</p></div>'+
    '</div>'+
    '<div class="stub"><span class="ic">'+ic+'</span><h2>'+esc(nome)+'</h2>'+
      '<p>Este módulo entra na próxima etapa. A estrutura da fazenda, o seletor de safra e a '+
      'sincronização offline já estão prontos para receber ele.</p>'+
      '<button class="btn-back" onclick="irPara(\'fazenda\')">Voltar aos módulos</button></div></div>';
}

function telaPanorama(){
  const l=fazendas();
  const ha=l.reduce((s,f)=>s+f.hectares,0), tl=l.reduce((s,f)=>s+f.talhoes,0);
  return '<div class="wrap wrap-wide">'+
    '<div class="farm-head"><button class="btn-back" onclick="irPara(\'fazendas\')">← Fazendas</button>'+
      '<div class="farm-head-mid"><h1>Panorama geral</h1><p>'+l.length+' fazendas · '+tl+
      ' talhões · '+ha.toFixed(1)+' ha</p></div></div>'+
    '<div class="stub"><span class="ic">'+ICON.panorama+'</span><h2>Visão consolidada</h2>'+
      '<p>Quando os módulos de lavoura e colheita estiverem ligados, esta tela junta cultura, '+
      'chuva, colheita e pendências de todas as fazendas.</p>'+
      '<button class="btn-back" onclick="irPara(\'fazendas\')">Voltar</button></div></div>';
}

/* ═══════════════════════════════════════════════════
   AÇÕES
   ═══════════════════════════════════════════════════ */
function cadastrarRapido(){
  const i=document.getElementById("nova-faz"), n=(i.value||"").trim();
  if(!n){ i.focus(); toast("Digite o nome da fazenda"); return; }
  abrirCadastro(n);
}
function abrirCadastro(pre){
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Nova fazenda</h2><p class="sub">Só o nome é obrigatório. O resto dá para completar depois.</p>'+
    '<div class="frm">'+
      '<div><label for="c-nome">Nome da fazenda</label><input id="c-nome" value="'+esc(pre||"")+'" placeholder="Fazenda Santa Angelina"></div>'+
      '<div><label for="c-prod">Produtor</label><input id="c-prod" placeholder="Ivan Alves da Silva"></div>'+
      '<div style="display:flex;gap:10px">'+
        '<div style="flex:1"><label for="c-mun">Município</label><input id="c-mun" placeholder="Brejinho de Nazaré"></div>'+
        '<div style="width:82px"><label for="c-uf">UF</label><input id="c-uf" maxlength="2" placeholder="TO"></div></div>'+
      '<div><label for="c-safra">Safra</label><select id="c-safra">'+
        safrasDisponiveis().map(s=>'<option '+(s===safraAtual()?"selected":"")+'>'+s+'</option>').join("")+
      '</select></div></div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="salvarCadastro()">Cadastrar fazenda</button></div>'+
  '</div></div>';
  setTimeout(()=>{const e=document.getElementById("c-nome"); if(e) e.focus();},60);
}
function salvarCadastro(){
  const n=document.getElementById("c-nome").value.trim();
  if(!n){ toast("O nome da fazenda é obrigatório"); return; }
  const f=criarFazenda({ nome:n,
    produtor:document.getElementById("c-prod").value,
    municipio:document.getElementById("c-mun").value,
    uf:document.getElementById("c-uf").value,
    safra:document.getElementById("c-safra").value });
  fecharModal(); toast("Fazenda cadastrada");
  irPara("fazenda",{fazendaId:f.id});
}
function confirmarRemover(id){
  const f=acharFazenda(id); if(!f) return;
  if(confirm('Remover "'+f.nome+'"?\n\nOs lançamentos dessa fazenda também saem da lista.')){
    removerFazenda(id); toast("Fazenda removida"); render();
  }
}
function trocarSafra(s){
  const l=fazendas(), f=l.find(x=>x.id===App.fazendaId);
  if(!f) return;
  f.safra=s; salvarFazendas(l); Sync.push("fazendas","upsert",f);
  toast("Safra "+s); render();
}
function abrirPerfil(){
  const p=Store.get("perfil",{nome:""});
  document.getElementById("modal-root").innerHTML=
  '<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal">'+
    '<h2>Seu perfil</h2><p class="sub">Usado para identificar quem lançou cada informação no campo.</p>'+
    '<div class="frm"><div><label for="p-nome">Seu nome</label>'+
      '<input id="p-nome" value="'+esc(p.nome)+'" placeholder="Ivan"></div></div>'+
    '<div class="modal-acts"><button class="btn-cancel" onclick="fecharModal()">Cancelar</button>'+
      '<button class="btn-save" onclick="salvarPerfil()">Salvar</button></div></div></div>';
  setTimeout(()=>{const e=document.getElementById("p-nome"); if(e) e.focus();},60);
}
function salvarPerfil(){
  Store.set("perfil",{nome:document.getElementById("p-nome").value.trim()||"Você"});
  fecharModal(); toast("Perfil salvo"); render();
}

/* ── Boot ───────────────────────────────── */
/* ═══════════════════════════════════════════════════
   PRIMEIRA ABERTURA — Santa Angelina já vem pronta.
   Roda só uma vez. Se o usuário apagar, não volta.
   ═══════════════════════════════════════════════════ */
function semearPrimeiraVez(){
  if(Store.get("seed_feito", false)) return;
  Store.set("seed_feito", true);
  if(fazendas().length) return;
  const d = SEED_SANTA_ANGELINA;
  const f = criarFazenda({ nome:d.nome, produtor:d.produtor,
                           municipio:d.municipio, uf:d.uf });
  aplicarSeedSA(f.id);
}

semearPrimeiraVez();
render();
Sync.flush();
setInterval(()=>{ if(navigator.onLine && Sync.pending()) Sync.flush(); }, 30000);
if("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
