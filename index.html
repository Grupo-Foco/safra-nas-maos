<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Safra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123a63">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%23123a63'/%3E%3Ctext x='96' y='130' font-size='104' text-anchor='middle'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<title>Safra nas Mãos</title>
<style>
:root{
  --navy:#123a63;
  --navy-deep:#0d2b49;
  --title:#16365c;
  --green:#4a9c3d;
  --green-dark:#3d8b35;
  --green-soft:#eef7ec;
  --bg:#f2f6f1;
  --card:#ffffff;
  --line:#dfe6dd;
  --text:#203040;
  --muted:#6b7b88;
  --red:#c0392b;
  --red-soft:#fdeced;
  --amber:#b8860b;
  --amber-soft:#fdf6e3;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Top bar ─────────────────────────────────────── */
.topbar{
  background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:3px solid var(--green);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .mark{
  width:26px;height:26px;border-radius:6px;background:var(--green);
  display:grid;place-items:center;font-size:15px
}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.sync-chip{
  display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.12)
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync-chip.off{background:rgba(255,190,60,.22)}
.sync-chip.off .sync-dot{background:#ffbe3c}
.btn-ghost{
  background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;
  padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600
}
.btn-ghost:hover{background:rgba(255,255,255,.12)}

/* ── Banners ─────────────────────────────────────── */
.banner{padding:11px 16px;font-size:14px;text-align:center}
.banner.err{background:var(--red-soft);color:var(--red)}
.banner.ok{background:var(--green-soft);color:var(--green-dark);font-weight:600}
.banner.warn{background:var(--amber-soft);color:var(--amber)}

/* ── Layout ──────────────────────────────────────── */
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
.wrap-wide{max-width:1100px}

/* ── Farm screen ─────────────────────────────────── */
.field-lg{
  width:100%;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--r);background:#fff;font-size:16px;color:var(--text)
}
.field-lg::placeholder{color:#9aa7b0}
.btn-primary{
  width:100%;background:var(--green);color:#fff;border:none;
  padding:15px;border-radius:var(--r);font-size:17px;font-weight:700;
  margin-top:12px
}
.btn-primary:hover{background:var(--green-dark)}
.btn-primary:disabled{background:#aebfa9;cursor:not-allowed}

.panorama{
  display:block;width:100%;text-align:left;margin-top:16px;
  background:var(--green-soft);border:1.5px solid var(--green);
  border-radius:var(--r);padding:14px 16px;color:var(--green-dark);
  font-size:14px;line-height:1.55
}
.panorama b{color:var(--green-dark);font-size:15px}
.panorama:hover{background:#e4f2e1}

.farm-card{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);
  border-radius:var(--r);padding:14px 16px;margin-top:10px
}
.farm-card:hover{border-color:var(--green);box-shadow:0 1px 6px rgba(18,58,99,.08)}
.farm-card h3{color:var(--title);font-size:17px;font-weight:700;margin-bottom:2px}
.farm-card p{color:var(--muted);font-size:13px}
.farm-card .chev{margin-left:auto;color:var(--green);font-size:22px;font-weight:700}
.farm-card .del{
  margin-left:8px;background:none;border:none;color:#c8d0d6;font-size:17px;padding:4px 6px
}
.farm-card .del:hover{color:var(--red)}

.empty{
  text-align:center;padding:36px 20px;color:var(--muted);
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r);margin-top:16px
}
.empty strong{display:block;color:var(--title);font-size:16px;margin-bottom:6px}

.ver{text-align:center;color:#a3b0b8;font-size:12px;margin-top:28px}

/* ── Farm header (screen 2) ──────────────────────── */
.farm-head{
  display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
  padding:18px 0 20px
}
.btn-back{
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:8px 14px;font-size:14px;font-weight:600;color:var(--title)
}
.btn-back:hover{border-color:var(--green);color:var(--green-dark)}
.farm-head-mid h1{color:var(--title);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.farm-head-mid p{color:var(--muted);font-size:14px;margin-top:3px}
.safra-box{margin-left:auto;text-align:right}
.safra-box label{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.safra-box select{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:6px 10px;font-size:18px;font-weight:800;color:var(--title)
}

/* ── Hero cards ──────────────────────────────────── */
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.hero{
  text-align:left;border-radius:14px;padding:20px;border:2px solid;background:var(--card)
}
.hero .ic{font-size:30px;display:block;margin-bottom:10px}
.hero h2{font-size:19px;font-weight:800;color:var(--title);margin-bottom:5px;letter-spacing:-.01em}
.hero p{font-size:13.5px;line-height:1.45}
.hero-green{border-color:var(--green);background:var(--green-soft)}
.hero-green p{color:var(--green-dark)}
.hero-green:hover{background:#e4f2e1}
.hero-blue{border-color:var(--navy);background:#eef2f8}
.hero-blue p{color:#3d5f85}
.hero-blue:hover{background:#e3eaf4}

/* ── Sections + module grid ──────────────────────── */
.sec-head{display:flex;align-items:center;gap:14px;margin:26px 0 14px}
.sec-head span{
  color:var(--green-dark);font-size:12.5px;font-weight:800;
  letter-spacing:.08em;white-space:nowrap
}
.sec-head i{flex:1;height:2px;background:var(--green);border-radius:2px;opacity:.7}

.mods{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mod{
  text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:18px;position:relative
}
.mod:hover{border-color:var(--green);box-shadow:0 2px 10px rgba(18,58,99,.07)}
.mod .ic{font-size:26px;display:block;margin-bottom:10px}
.mod h3{color:var(--title);font-size:16.5px;font-weight:700;margin-bottom:3px}
.mod p{color:var(--muted);font-size:13px;line-height:1.4}
.mod .tag{
  position:absolute;top:14px;right:14px;font-size:10px;font-weight:800;
  padding:3px 7px;border-radius:5px;letter-spacing:.03em
}
.tag-soon{background:#f0f3f5;color:#8b98a3}
.tag-ready{background:var(--green-soft);color:var(--green-dark)}

/* ── Modal ───────────────────────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(15,35,55,.55);
  display:flex;align-items:center;justify-content:center;padding:16px;z-index:200
}
.modal{
  background:var(--card);border-radius:14px;padding:22px;
  width:100%;max-width:440px;max-height:88vh;overflow-y:auto
}
.modal h2{color:var(--title);font-size:19px;font-weight:800;margin-bottom:4px}
.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.frm{display:flex;flex-direction:column;gap:13px}
.frm label{display:block;color:var(--title);font-size:13px;font-weight:700;margin-bottom:5px}
.frm input,.frm select{
  width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--text);font-size:15px
}
.frm input:focus,.frm select:focus{border-color:var(--green);outline:none}
.modal-acts{display:flex;gap:10px;margin-top:20px}
.modal-acts button{flex:1;padding:12px;border-radius:9px;font-size:15px;font-weight:700;border:none}
.btn-cancel{background:#eef1f3;color:var(--muted)}
.btn-cancel:hover{background:#e3e8eb}
.btn-save{background:var(--green);color:#fff}
.btn-save:hover{background:var(--green-dark)}

/* ── Toast ───────────────────────────────────────── */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom));
  background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:9px;
  font-size:14px;font-weight:600;z-index:300;display:none;max-width:90vw;text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,.25)
}

/* ── Stub screen ─────────────────────────────────── */
.stub{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:40px 24px;text-align:center;margin-top:20px
}
.stub .ic{font-size:44px;display:block;margin-bottom:14px}
.stub h2{color:var(--title);font-size:21px;font-weight:800;margin-bottom:8px}
.stub p{color:var(--muted);font-size:14.5px;max-width:420px;margin:0 auto 20px;line-height:1.55}

/* ── Responsive ──────────────────────────────────── */
@media(max-width:640px){
  body{font-size:14.5px}
  .wrap{padding:16px 12px 32px}
  .heroes{grid-template-columns:1fr;gap:12px}
  .mods{grid-template-columns:1fr;gap:12px}
  .farm-head{padding:14px 0 16px}
  .farm-head-mid h1{font-size:20px}
  .safra-box{margin-left:0;text-align:left;width:100%}
  .topbar{padding-left:12px;padding-right:12px;gap:8px}
  .topbar-right{font-size:12px;gap:7px;width:100%;margin-left:0;justify-content:space-between}
  .brand{font-size:15px}
  .hero{padding:17px}
  .mod{padding:16px}
}
</style>
</head>
<body>

<div id="root"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
"use strict";
const APP_VERSION = "0.3.0";

/* ═══════════════════════════════════════════════════
   STORAGE — offline-first, iOS safe
   localStorage quando disponível, memória como reserva
   ═══════════════════════════════════════════════════ */
const _mem = {};
function _storageOk(kind){
  try{ const s = window[kind], k = "__t__"; s.setItem(k,"1"); s.removeItem(k); return true; }
  catch(e){ return false; }
}
const _ls = _storageOk("localStorage") ? localStorage
          : _storageOk("sessionStorage") ? sessionStorage : null;

const Store = {
  get(k, d){
    try{
      if(_ls){ const v = _ls.getItem("sm_"+k); if(v != null) return JSON.parse(v); }
      return (k in _mem) ? _mem[k] : d;
    }catch(e){ return d; }
  },
  set(k, v){
    _mem[k] = v;
    try{ if(_ls) _ls.setItem("sm_"+k, JSON.stringify(v)); }catch(e){}
  },
  del(k){
    delete _mem[k];
    try{ if(_ls) _ls.removeItem("sm_"+k); }catch(e){}
  },
  persistent(){ return _ls !== null; }
};

/* ═══════════════════════════════════════════════════
   SYNC — fila de operações pendentes
   Tudo grava local primeiro. Quando há internet,
   a fila sobe. Nada se perde no campo.
   ═══════════════════════════════════════════════════ */
const SUPABASE = {
  url: "",        // preencher ao conectar
  anonKey: "",
  enabled(){ return !!(this.url && this.anonKey); }
};

const Sync = {
  queue(){ return Store.get("sync_queue", []); },

  push(table, op, payload){
    const q = this.queue();
    q.push({
      id: "op_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
      ts: new Date().toISOString(),
      table, op, payload
    });
    Store.set("sync_queue", q);
    this.render();
    if(navigator.onLine) this.flush();
  },

  pending(){ return this.queue().length; },

  async flush(){
    if(!navigator.onLine) return;
    const q = this.queue();
    if(!q.length){ this.render(); return; }

    if(!SUPABASE.enabled()){
      // Ainda sem backend: mantém a fila intacta para subir depois.
      this.render();
      return;
    }

    const restantes = [];
    for(const item of q){
      try{
        const method = item.op === "delete" ? "DELETE" : "POST";
        const r = await fetch(SUPABASE.url + "/rest/v1/" + item.table, {
          method,
          headers: {
            "apikey": SUPABASE.anonKey,
            "Authorization": "Bearer " + SUPABASE.anonKey,
            "Content-Type": "application/json",
            "Prefer": "resolution=merge-duplicates"
          },
          body: method === "DELETE" ? undefined : JSON.stringify(item.payload)
        });
        if(!r.ok) restantes.push(item);
      }catch(e){
        restantes.push(item);
      }
    }
    Store.set("sync_queue", restantes);
    this.render();
    if(restantes.length === 0 && q.length > 0) toast("Tudo sincronizado na nuvem");
  },

  render(){
    const el = document.getElementById("sync-chip");
    if(!el) return;
    const n = this.pending();
    const online = navigator.onLine;
    if(online && n === 0){
      el.className = "sync-chip";
      el.innerHTML = '<span class="sync-dot"></span> Sincronizado na nuvem';
    }else if(!online){
      el.className = "sync-chip off";
      el.innerHTML = '<span class="sync-dot"></span> Sem sinal' + (n ? " · " + n + " a enviar" : "");
    }else{
      el.className = "sync-chip off";
      el.innerHTML = '<span class="sync-dot"></span> ' + n + " a enviar";
    }
  }
};

window.addEventListener("online",  () => { Sync.flush(); renderBanners(); });
window.addEventListener("offline", () => { Sync.render(); renderBanners(); });

/* ═══════════════════════════════════════════════════
   MODELO
   ═══════════════════════════════════════════════════ */
function safraAtual(){
  const hoje = new Date();
  const a = hoje.getMonth() >= 6 ? hoje.getFullYear() : hoje.getFullYear() - 1;
  return a + "/" + (a + 1);
}
function safrasDisponiveis(){
  const base = parseInt(safraAtual().slice(0,4), 10);
  const out = [];
  for(let a = base + 1; a >= base - 4; a--) out.push(a + "/" + (a + 1));
  return out;
}

function fazendas(){ return Store.get("fazendas", []); }
function salvarFazendas(l){ Store.set("fazendas", l); }
function acharFazenda(id){ return fazendas().find(f => f.id === id) || null; }

function criarFazenda(dados){
  const l = fazendas();
  const f = {
    id: "faz_" + Date.now().toString(36),
    nome: dados.nome.trim(),
    produtor: (dados.produtor || "").trim(),
    municipio: (dados.municipio || "").trim(),
    uf: (dados.uf || "").trim().toUpperCase(),
    safra: dados.safra || safraAtual(),
    talhoes: 0,
    hectares: 0,
    criado_em: new Date().toISOString()
  };
  l.push(f);
  salvarFazendas(l);
  Sync.push("fazendas", "upsert", f);
  return f;
}

function removerFazenda(id){
  salvarFazendas(fazendas().filter(f => f.id !== id));
  Sync.push("fazendas", "delete", { id });
}

/* ═══════════════════════════════════════════════════
   MÓDULOS — espelham as telas de referência
   ═══════════════════════════════════════════════════ */
const MODULOS = [
  { grupo: "Fazenda e lavoura", itens: [
    { id:"dados-fazenda", ic:"📋", nome:"Dados da fazenda", desc:"Talhões, áreas e mapa da propriedade", pronto:false, resumo:f => f.talhoes + " talhões · " + f.hectares.toFixed(1) + " ha" },
    { id:"lavoura",       ic:"🌿", nome:"Dados da lavoura",  desc:"Cultura, plantio e emergência", pronto:false },
    { id:"operacoes",     ic:"🚜", nome:"Operações no talhão", desc:"Pulverização, semeadura e adubação", pronto:false },
    { id:"estoque",       ic:"📦", nome:"Estoque",            desc:"Desconta automaticamente o que foi aplicado", pronto:false },
    { id:"ndvi",          ic:"🛰️", nome:"Mapa NDVI",          desc:"Acompanhamento por satélite", pronto:false },
    { id:"chuva",         ic:"🌧️", nome:"Pluviometria",       desc:"Lançar e comparar chuvas", pronto:false },
    { id:"colheita",      ic:"🌾", nome:"Colheita",           desc:"Cargas, caminhões e produtividade por talhão", pronto:true }
  ]},
  { grupo: "Dinheiro e máquinas", itens: [
    { id:"cotacoes",  ic:"📈", nome:"Cotações",  desc:"Dólar, mercado e preços da região", pronto:false },
    { id:"financeiro",ic:"💰", nome:"Financeiro", desc:"Custos, planejamento, vendas e compras", pronto:false },
    { id:"diesel",    ic:"⛽", nome:"Diesel e manutenção", desc:"Abastecimento e trocas de óleo", pronto:false }
  ]},
  { grupo: "Acompanhamento", itens: [
    { id:"visitas",   ic:"👨‍🌾", nome:"Visitas técnicas", desc:"Registro de visitas e recomendações", pronto:false, resumo:() => "0 visitas" },
    { id:"relatorios",ic:"📊", nome:"Relatórios",       desc:"Geral, por operação, chuva e mapa", pronto:false },
    { id:"documentos",ic:"📁", nome:"Documentos",       desc:"Mapas, pedidos e contratos", pronto:false },
    { id:"safras",    ic:"🗄️", nome:"Histórico de safras", desc:"Comparar safras anteriores", pronto:false, resumo:f => "atual " + f.safra },
    { id:"suporte",   ic:"🆘", nome:"Suporte",           desc:"Dúvidas, vídeos e WhatsApp da equipe", pronto:false }
  ]}
];

function acharModulo(id){
  for(const g of MODULOS){ const m = g.itens.find(i => i.id === id); if(m) return m; }
  return null;
}

/* ═══════════════════════════════════════════════════
   UI helpers
   ═══════════════════════════════════════════════════ */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
let _toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(_toastT);
  _toastT = setTimeout(() => { t.style.display = "none"; }, 2600);
}
function fecharModal(){ document.getElementById("modal-root").innerHTML = ""; }

/* ═══════════════════════════════════════════════════
   ROTEADOR
   ═══════════════════════════════════════════════════ */
const App = {
  tela: "fazendas",   // fazendas | fazenda | modulo | panorama
  fazendaId: null,
  moduloId: null
};

function irPara(tela, opts){
  Object.assign(App, { tela }, opts || {});
  window.scrollTo(0, 0);
  render();
}

/* ═══════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════ */
function render(){
  const root = document.getElementById("root");
  let html = topbar();

  if(App.tela === "fazendas")      html += telaFazendas();
  else if(App.tela === "fazenda")  html += telaFazenda();
  else if(App.tela === "modulo")   html += telaModulo();
  else if(App.tela === "panorama") html += telaPanorama();

  root.innerHTML = html;
  Sync.render();
}

function renderBanners(){ render(); }

function topbar(){
  const perfil = Store.get("perfil", { nome: "Você" });
  return '' +
  '<div class="topbar">' +
    '<div class="brand"><span class="mark">🌱</span> Safra nas Mãos</div>' +
    '<div class="topbar-right">' +
      '<span id="sync-chip" class="sync-chip"><span class="sync-dot"></span> —</span>' +
      '<span>👤 ' + esc(perfil.nome) + '</span>' +
      '<button class="btn-ghost" onclick="abrirPerfil()">Trocar perfil</button>' +
    '</div>' +
  '</div>' + bannersHTML();
}

function bannersHTML(){
  let h = "";
  if(!navigator.onLine){
    h += '<div class="banner err">Sem internet agora. Pode continuar lançando — tudo sobe sozinho quando o sinal voltar.</div>';
  }else if(Sync.pending() > 0){
    h += '<div class="banner warn">' + Sync.pending() + ' lançamento(s) aguardando envio para a nuvem.</div>';
  }
  if(!Store.persistent()){
    h += '<div class="banner err">Este navegador não está guardando dados. Abra pelo site (https) ou adicione à tela de início.</div>';
  }
  return h;
}

/* ── Tela 1: fazendas ────────────────────────────── */
function telaFazendas(){
  const lista = fazendas();
  let h = '<div class="wrap">';

  h += '<label for="nova-faz" style="display:block;color:var(--title);font-size:13px;font-weight:700;margin-bottom:6px">Nome da fazenda</label>';
  h += '<input id="nova-faz" class="field-lg" placeholder="Ex: Fazenda Santa Angelina" ' +
       'onkeydown="if(event.key===\'Enter\')cadastrarRapido()">';
  h += '<button class="btn-primary" onclick="cadastrarRapido()">Cadastrar nova fazenda</button>';

  if(lista.length > 1){
    h += '<button class="panorama" onclick="irPara(\'panorama\')">' +
           '<b>🌱 Panorama geral</b><br>' +
           'A situação técnica de todas as fazendas numa tela só: culturas, chuva, colheita e pendências.' +
         '</button>';
  }

  if(!lista.length){
    h += '<div class="empty"><strong>Nenhuma fazenda cadastrada</strong>' +
         'Digite o nome acima para criar a primeira. Depois você completa produtor, município e talhões.</div>';
  }else{
    lista.forEach(f => {
      const loc = [f.produtor, f.municipio && (f.municipio + (f.uf ? "/" + f.uf : ""))]
                    .filter(Boolean).join(" · ");
      h += '<div class="farm-card">' +
             '<div style="flex:1;cursor:pointer" onclick="irPara(\'fazenda\',{fazendaId:\'' + f.id + '\'})">' +
               '<h3>' + esc(f.nome) + '</h3>' +
               '<p>' + (loc ? esc(loc) + " · " : "") +
                 f.talhoes + ' talhões · ' + f.hectares.toFixed(1) + ' ha · safra ' + esc(f.safra) +
               '</p>' +
             '</div>' +
             '<button class="del" title="Remover" onclick="confirmarRemover(\'' + f.id + '\')">✕</button>' +
             '<span class="chev" onclick="irPara(\'fazenda\',{fazendaId:\'' + f.id + '\'})">›</span>' +
           '</div>';
    });
  }

  h += '<p class="ver">versão ' + APP_VERSION + (Store.persistent() ? "" : " · modo temporário") + '</p>';
  h += '</div>';
  return h;
}

/* ── Tela 2: funcionalidades da fazenda ──────────── */
function telaFazenda(){
  const f = acharFazenda(App.fazendaId);
  if(!f){ App.tela = "fazendas"; return telaFazendas(); }

  const loc = [f.produtor, f.municipio && (f.municipio + (f.uf ? "/" + f.uf : ""))]
                .filter(Boolean).join(" · ") || "Complete os dados da fazenda";

  let h = '<div class="wrap wrap-wide">';

  h += '<div class="farm-head">' +
         '<button class="btn-back" onclick="irPara(\'fazendas\')">← Fazendas</button>' +
         '<div class="farm-head-mid">' +
           '<h1>' + esc(f.nome) + '</h1><p>' + esc(loc) + '</p>' +
         '</div>' +
         '<div class="safra-box">' +
           '<label for="sel-safra">SAFRA</label>' +
           '<select id="sel-safra" onchange="trocarSafra(this.value)">' +
             safrasDisponiveis().map(s =>
               '<option ' + (s === f.safra ? "selected" : "") + '>' + s + '</option>').join("") +
           '</select>' +
         '</div>' +
       '</div>';

  h += '<div class="heroes">' +
         '<button class="hero hero-green" onclick="abrirModulo(\'panorama-fazenda\')">' +
           '<span class="ic">🌱</span>' +
           '<h2>Panorama da fazenda</h2>' +
           '<p>Lavoura, colheita, chuva e pendências num olhar</p>' +
         '</button>' +
         '<button class="hero hero-blue" onclick="abrirModulo(\'resumo-fazenda\')">' +
           '<span class="ic">💰</span>' +
           '<h2>Resumo financeiro</h2>' +
           '<p>Custo por hectare, estoque, colheita e diesel</p>' +
         '</button>' +
       '</div>';

  MODULOS.forEach(g => {
    h += '<div class="sec-head"><span>' + esc(g.grupo.toUpperCase()) + '</span><i></i></div>';
    h += '<div class="mods">';
    g.itens.forEach(m => {
      const extra = m.resumo ? m.resumo(f) : m.desc;
      h += '<button class="mod" onclick="abrirModulo(\'' + m.id + '\')">' +
             '<span class="tag ' + (m.pronto ? "tag-ready" : "tag-soon") + '">' +
               (m.pronto ? "PRONTO" : "EM BREVE") + '</span>' +
             '<span class="ic">' + m.ic + '</span>' +
             '<h3>' + esc(m.nome) + '</h3>' +
             '<p>' + esc(extra) + '</p>' +
           '</button>';
    });
    h += '</div>';
  });

  h += '</div>';
  return h;
}

/* ── Tela de módulo (provisória) ─────────────────── */
function telaModulo(){
  const f = acharFazenda(App.fazendaId);
  const m = acharModulo(App.moduloId);
  const nome = m ? m.nome
             : App.moduloId === "panorama-fazenda" ? "Panorama da fazenda"
             : App.moduloId === "resumo-fazenda"   ? "Resumo financeiro"
             : "Módulo";
  const ic = m ? m.ic : (App.moduloId === "resumo-fazenda" ? "💰" : "🌱");

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">' +
         '<button class="btn-back" onclick="irPara(\'fazenda\')">← ' + esc(f ? f.nome : "Voltar") + '</button>' +
         '<div class="farm-head-mid"><h1>' + esc(nome) + '</h1>' +
         '<p>Safra ' + esc(f ? f.safra : "") + '</p></div>' +
       '</div>';

  h += '<div class="stub">' +
         '<span class="ic">' + ic + '</span>' +
         '<h2>' + esc(nome) + '</h2>' +
         '<p>Este módulo entra na próxima etapa. A estrutura da fazenda, o seletor de safra e a ' +
         'sincronização offline já estão prontos para receber ele.</p>' +
         '<button class="btn-back" onclick="irPara(\'fazenda\')">Voltar aos módulos</button>' +
       '</div>';
  h += '</div>';
  return h;
}

/* ── Panorama de todas as fazendas ───────────────── */
function telaPanorama(){
  const lista = fazendas();
  const totalHa = lista.reduce((s,f) => s + f.hectares, 0);
  const totalTal = lista.reduce((s,f) => s + f.talhoes, 0);

  let h = '<div class="wrap wrap-wide">';
  h += '<div class="farm-head">' +
         '<button class="btn-back" onclick="irPara(\'fazendas\')">← Fazendas</button>' +
         '<div class="farm-head-mid"><h1>Panorama geral</h1>' +
         '<p>' + lista.length + ' fazendas · ' + totalTal + ' talhões · ' + totalHa.toFixed(1) + ' ha</p></div>' +
       '</div>';
  h += '<div class="stub"><span class="ic">🌱</span><h2>Visão consolidada</h2>' +
       '<p>Quando os módulos de lavoura e colheita estiverem ligados, esta tela junta ' +
       'cultura, chuva, colheita e pendências de todas as fazendas.</p>' +
       '<button class="btn-back" onclick="irPara(\'fazendas\')">Voltar</button></div>';
  h += '</div>';
  return h;
}

/* ═══════════════════════════════════════════════════
   AÇÕES
   ═══════════════════════════════════════════════════ */
function cadastrarRapido(){
  const inp = document.getElementById("nova-faz");
  const nome = (inp.value || "").trim();
  if(!nome){ inp.focus(); toast("Digite o nome da fazenda"); return; }
  abrirCadastro(nome);
}

function abrirCadastro(nomePre){
  document.getElementById("modal-root").innerHTML =
  '<div class="overlay" onclick="if(event.target===this)fecharModal()">' +
    '<div class="modal">' +
      '<h2>Nova fazenda</h2>' +
      '<p class="sub">Só o nome é obrigatório. O resto dá para completar depois.</p>' +
      '<div class="frm">' +
        '<div><label for="c-nome">Nome da fazenda</label>' +
          '<input id="c-nome" value="' + esc(nomePre || "") + '" placeholder="Fazenda Santa Angelina"></div>' +
        '<div><label for="c-prod">Produtor</label>' +
          '<input id="c-prod" placeholder="Ivan Alves da Silva"></div>' +
        '<div style="display:flex;gap:10px">' +
          '<div style="flex:1"><label for="c-mun">Município</label>' +
            '<input id="c-mun" placeholder="Brejinho de Nazaré"></div>' +
          '<div style="width:80px"><label for="c-uf">UF</label>' +
            '<input id="c-uf" maxlength="2" placeholder="TO"></div>' +
        '</div>' +
        '<div><label for="c-safra">Safra</label><select id="c-safra">' +
          safrasDisponiveis().map(s =>
            '<option ' + (s === safraAtual() ? "selected" : "") + '>' + s + '</option>').join("") +
        '</select></div>' +
      '</div>' +
      '<div class="modal-acts">' +
        '<button class="btn-cancel" onclick="fecharModal()">Cancelar</button>' +
        '<button class="btn-save" onclick="salvarCadastro()">Cadastrar fazenda</button>' +
      '</div>' +
    '</div>' +
  '</div>';
  setTimeout(() => { const e = document.getElementById("c-nome"); if(e) e.focus(); }, 60);
}

function salvarCadastro(){
  const nome = document.getElementById("c-nome").value.trim();
  if(!nome){ toast("O nome da fazenda é obrigatório"); return; }
  const f = criarFazenda({
    nome,
    produtor:  document.getElementById("c-prod").value,
    municipio: document.getElementById("c-mun").value,
    uf:        document.getElementById("c-uf").value,
    safra:     document.getElementById("c-safra").value
  });
  fecharModal();
  toast("Fazenda cadastrada");
  irPara("fazenda", { fazendaId: f.id });
}

function confirmarRemover(id){
  const f = acharFazenda(id);
  if(!f) return;
  if(confirm('Remover "' + f.nome + '"?\n\nOs lançamentos dessa fazenda também saem da lista.')){
    removerFazenda(id);
    toast("Fazenda removida");
    render();
  }
}

function trocarSafra(s){
  const l = fazendas();
  const f = l.find(x => x.id === App.fazendaId);
  if(!f) return;
  f.safra = s;
  salvarFazendas(l);
  Sync.push("fazendas", "upsert", f);
  toast("Safra " + s);
  render();
}

function abrirModulo(id){
  const m = acharModulo(id);
  if(m && m.pronto && id === "colheita"){
    // O módulo de colheita já existe e será acoplado aqui.
    irPara("modulo", { moduloId: id });
    return;
  }
  irPara("modulo", { moduloId: id });
}

function abrirPerfil(){
  const p = Store.get("perfil", { nome: "" });
  document.getElementById("modal-root").innerHTML =
  '<div class="overlay" onclick="if(event.target===this)fecharModal()">' +
    '<div class="modal">' +
      '<h2>Seu perfil</h2>' +
      '<p class="sub">Usado para identificar quem lançou cada informação no campo.</p>' +
      '<div class="frm"><div><label for="p-nome">Seu nome</label>' +
        '<input id="p-nome" value="' + esc(p.nome) + '" placeholder="Ivan"></div></div>' +
      '<div class="modal-acts">' +
        '<button class="btn-cancel" onclick="fecharModal()">Cancelar</button>' +
        '<button class="btn-save" onclick="salvarPerfil()">Salvar</button>' +
      '</div>' +
    '</div>' +
  '</div>';
  setTimeout(() => { const e = document.getElementById("p-nome"); if(e) e.focus(); }, 60);
}

function salvarPerfil(){
  const nome = document.getElementById("p-nome").value.trim() || "Você";
  Store.set("perfil", { nome });
  fecharModal();
  toast("Perfil salvo");
  render();
}

/* ═══════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════ */
render();
Sync.flush();
setInterval(() => { if(navigator.onLine && Sync.pending()) Sync.flush(); }, 30000);

/* Service worker: mantém o app aberto sem internet */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
